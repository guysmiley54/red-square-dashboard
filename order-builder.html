/* Unit price history: the movement over time, not just the latest figure. */
function renderPriceHistory(key){
  const m=weekModel();
  const sup=(LINES.find(l=>l.key===key)||{}).supplier;
  const p=sup?deriveCatalogue(LINES,sup,new Date(),{venue:null}).find(x=>x.key===key):null;
  if(!p){ document.getElementById("app").innerHTML=`<a class="back" onclick="go('reports')">Reports</a>
    <div class="card"><div class="note">That product isn't in the last ${CAT_DAYS} days of buying.</div></div>`; return; }
  const buys=p.buys.slice().reverse();
  const prices=p.buys.map(b=>b.price), lo=Math.min(...prices), hi=Math.max(...prices);
  const first=p.buys[0], move=first.price?((p.price-first.price)/first.price*100):0;
  /* The last 90 days, which is the window the ordering suggestions use, so the chart and
     the "usual" quantity are talking about the same period. */
  const from90=Date.now()-90*864e5;
  const b90=p.buys.filter(b=>+b.date>=from90);
  const qty90=b90.reduce((t,b)=>t+b.qty,0);
  const spend90=b90.reduce((t,b)=>t+b.total,0);
  const wkspan=Math.max(1,(Date.now()-Math.max(from90,+p.buys[0].date))/864e5/7);
  /* Both series on one axis pair: price as a line against the left scale, quantity as bars
     against its own. Plotted on TIME, not on buy number — evenly spaced points would hide
     the gaps, and the gaps are the ordering pattern. */
  const w=560,h=110,pad=8,base=h-16;
  const t0=Math.max(from90,+p.buys[0].date), t1=Date.now();
  const xs=d=>pad+((+d-t0)/Math.max(1,t1-t0))*(w-2*pad);
  const ys=v=>hi===lo?base/2:pad+(1-(v-lo)/(hi-lo))*(base-2*pad);
  const qmax=Math.max(...b90.map(b=>b.qty),1);
  const path=b90.map((b,i)=>(i?"L":"M")+xs(b.date).toFixed(1)+" "+ys(b.price).toFixed(1)).join(" ");
  document.getElementById("app").innerHTML=`${summaryBar(m)}
    <a class="back" onclick="go('rsup::'+encodeURIComponent('${esc(p.supplier)}'))">${esc(p.supplier)} products</a>
    <div class="card">
      <div class="label">Unit price history</div>
      <div style="font-size:16px;font-weight:700">${esc(p.desc)}</div>
      <div style="font-size:12px;color:var(--dim);margin-bottom:10px">${esc(p.supplier)} · ${esc(p.cat)} ·
        ${esc(p.unit||"")} ${p.code?"· "+esc(p.code):""}</div>
      <div style="font-size:13px;margin-bottom:8px">Now <b>${money(p.price)}</b> · range ${money(lo)}–${money(hi)} ·
        <span class="${move>0?"up":move<0?"down":""}">${move>0?"+":""}${Math.round(move*10)/10}% since ${fmtD(first.date)}</span>
        · bought ${p.buys.length}×
        ${p.variants.length>1?`<br><span style="color:var(--dim)">Merged names: ${esc(p.variants.join(" / "))}</span>`:""}</div>
      <div class="grid2" style="gap:8px;margin-bottom:8px">
        <div class="tile" style="padding:9px 12px">
          <div class="k">Bought — last 90 days</div>
          <div class="v" style="font-size:20px">${Math.round(qty90*100)/100} ${esc(p.unit||"")}</div>
          <div class="sub">${b90.length} delivery(s) · ${Math.round(qty90/wkspan*100)/100} ${esc(p.unit||"")} a week</div>
        </div>
        <div class="tile" style="padding:9px 12px">
          <div class="k">Spent — last 90 days</div>
          <div class="v" style="font-size:20px">${money0(spend90)}</div>
          <div class="sub">${qty90?money(spend90/qty90):"—"} average per ${esc(p.unit||"unit")}</div>
        </div>
      </div>
      ${b90.length?`<svg class="spark" style="height:110px" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        ${b90.map(b=>{const bh=(b.qty/qmax)*(base-pad*2);
          return `<rect x="${(xs(b.date)-3).toFixed(1)}" y="${(base-bh).toFixed(1)}" width="6" height="${bh.toFixed(1)}" fill="#dcdcd8"/>`;}).join("")}
        <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2"/>
        ${b90.map(b=>`<circle cx="${xs(b.date).toFixed(1)}" cy="${ys(b.price).toFixed(1)}" r="2.5" fill="var(--red)"/>`).join("")}
        <line x1="${pad}" y1="${base}" x2="${w-pad}" y2="${base}" stroke="var(--line)"/>
      </svg>
      <div class="legend" style="margin-bottom:10px">
        <span style="color:var(--dim)"><span style="display:inline-block;width:9px;height:9px;background:#dcdcd8;border-radius:2px;margin-right:4px"></span>quantity per delivery</span>
        <span style="color:var(--dim)"><span style="display:inline-block;width:9px;height:9px;background:var(--ink);border-radius:2px;margin-right:4px"></span>unit price</span>
        <span style="color:var(--dim)">${fmtD(new Date(t0))} → today, spaced by date</span>
      </div>`:`<div class="note">Nothing bought in the last 90 days.</div>`}
      <table><thead><tr><th>Date</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Change</th><th class="num">Line</th><th class="hide-sm">Invoice</th></tr></thead>
      <tbody>${buys.map((b,i)=>{
        const prev=buys[i+1];
        const ch=prev&&prev.price!==b.price?((b.price-prev.price)/prev.price*100):null;
        return `<tr><td>${fmtD(b.date)}</td><td class="num">${b.qty}</td><td class="num">${money(b.price)}</td>
          <td class="num">${ch!=null?`<span class="${ch>0?"up":"down"}">${ch>0?"+":""}${Math.round(ch*10)/10}%</span>`:"—"}</td>
          <td class="num">${money(b.total)}</td>
          <td class="hide-sm" style="font-family:var(--mono);font-size:11px">${esc(b.number)}</td></tr>`;}).join("")}</tbody></table>
    </div>`;
}

/* ================= SALES DETAIL =================
   The item-level feed is 108,000 rows and 12 MB. Pulling it on every page load would make
   ordering — the thing this app is for — wait on a report nobody had asked for. So it is
   fetched only when the Sales tab is opened, only for the week on screen, and cached per
   week. gviz does the date filtering: `where B >= date '...'`, with the DATE LITERAL form,
   because column B types as a date and a plain string comparison silently matches nothing
   (verified against the live sheet — the bare-string version returns a header and no rows).

   Two small lookup tabs come with it. Overrides carries the group each item really belongs
   to, because roughly one POS assignment in three is wrong and nobody is going to fix them
   on site; ItemMap folds POS spellings together. Both are optional — without them the page
   still works, it just reports what ImPOS said. */
const SALES_SHEET=SALES_SHEET_ID;
let SD={}, SD_OVER=null, SD_ITEM=null, SD_BUSY=false, SD_ERR="";
const LANE_KITCHEN="Kitchen requests", LANE_MODIFIER="Modifiers";
const PERISHABLE=["Sandwiches","Cakes & Sweets","Hot Takeaway","Grab & Go"];
const LOYALTY_GROUP="Coffee & Tea";
const CAT_MAP={
  "beverage":{type:"Beverage"},"beverage d/h":{type:"Beverage"},"beverage t/a":{type:"Beverage"},
  "food d/h":{type:"Food"},"dine in":{type:"Food"},"food t/a":{type:"Food"},
  "takeway food":{type:"Food"},"takeaway food":{type:"Food"},
  "luma food d/h":{type:"Food"},"luma beverage dine in":{type:"Beverage"},
  "sundries":{type:"Sundries"},"impos":{type:"Uncategorised"}
};
async function sdTab(name){
  const u=`https://docs.google.com/spreadsheets/d/${SALES_SHEET}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
  try{
    const t=await (await fetch(u)).text();
    if(!t||t.trim()[0]==="<"||/"status"\s*:\s*"error"/.test(t)) return null;
    return parseCsv(t);
  }catch(e){ return null; }
}
async function sdLookups(){
  if(SD_OVER&&SD_ITEM) return;
  SD_OVER={dept:{},item:{}}; SD_ITEM={};
  const og=await sdTab("Overrides");
  if(og&&og.length>1){
    const h=og[0].map(x=>String(x).trim().toLowerCase());
    const ki=h.indexOf("kind"), fi=h.indexOf("from"), gi=h.indexOf("group");
    og.slice(1).forEach(r=>{
      const from=String(r[fi]||"").trim(), grp=gi>-1?String(r[gi]||"").trim():"";
      if(!from||!grp) return;
      const kind=ki>-1?String(r[ki]||"").trim().toLowerCase():"";
      if(kind.indexOf("dep")===0) SD_OVER.dept[from.toLowerCase()]=grp;
      else if(kind.indexOf("item")===0) SD_OVER.item[from.toLowerCase()]=grp;
      else { SD_OVER.dept[from.toLowerCase()]=grp; SD_OVER.item[from.toLowerCase()]=grp; }
    });
  }
  const ig=await sdTab("ItemMap");
  if(ig&&ig.length>1){
    const h=ig[0].map(x=>String(x).trim().toLowerCase());
    let fi=h.indexOf("item_from"); if(fi<0) fi=0;
    let ti=h.indexOf("maps_to");   if(ti<0) ti=1;
    ig.slice(1).forEach(r=>{
      const a=String(r[fi]||"").trim(), b=String(r[ti]||"").trim();
      if(a&&b&&a!==b) SD_ITEM[a.toLowerCase()]=b;
    });
  }
}
const sdKey=wk=>fmtISO(wk.start);
async function loadSalesWeek(wk){
  const k=sdKey(wk);
  if(SD[k]||SD_BUSY) return;
  SD_BUSY=true; SD_ERR="";
  try{
    await sdLookups();
    const q=`select A,C,D,E,F,G,H where B >= date '${fmtISO(wk.start)}' and B <= date '${fmtISO(wk.end)}'`;
    const u=`https://docs.google.com/spreadsheets/d/${SALES_SHEET}/gviz/tq?tqx=out:csv&headers=1&sheet=SalesFeed&tq=${encodeURIComponent(q)}&_=${Date.now()}`;
    const txt=await (await fetch(u)).text();
    if(!txt||txt.trim()[0]==="<"||/"status"\s*:\s*"error"/.test(txt)) throw new Error("the sales feed refused that query");
    const g=parseCsv(txt);
    /* select A,C,D,E,F,G,H  ->  timestamp, venue, category, department, item, qty, sales */
    const rows=g.slice(1).map(r=>{
      const ts=gvizDateTime(r[0]);
      const dept=String(r[3]||"").trim(), rawItem=String(r[4]||"").trim();
      const item=SD_ITEM[rawItem.toLowerCase()]||rawItem;
      /* Department sets the broad group, the item row corrects it: the item-level fixes
         exist precisely to override departments staff filed wrong. */
      const grp=SD_OVER.item[item.toLowerCase()]||SD_OVER.dept[dept.toLowerCase()]||"";
      const cat=String(r[2]||"").trim();
      return { ts, venue:String(r[1]||"").trim(), category:cat, department:dept, item,
               group:grp||(CAT_MAP[cat.toLowerCase()]||{}).type||cat||"Uncategorised",
               qty:num_(r[5]), sales:num_(r[6]) };
    }).filter(r=>r.ts&&r.item&&LEDGER_VENUES.indexOf(r.venue)>=0);
    SD[k]=rows;
  }catch(e){ SD_ERR=e.message; SD[k]=[]; }
  SD_BUSY=false;
  route();
}

/* ================= SALES VIEW =================
   Combined across both kitchens throughout, by instruction. Kitchen requests are stripped
   first: staff ring those up to fire a docket to the kitchen printer, so they are not sales
   and counting them would inflate everything below. Modifiers stay — an extra shot is real
   revenue. */
let SALES_TAB="hour", SALES_SORT={col:"sales",dir:-1};
const sdSales=rows=>rows.filter(r=>r.group!==LANE_KITCHEN);
function renderSales(){
  const m=weekModel(), wk=m.wk, k=sdKey(wk);
  if(!SD[k]){
    loadSalesWeek(wk);
    document.getElementById("app").innerHTML=`${summaryBar(m)}
      <div class="card"><div class="label">Sales — ${esc(weekLabel(wk))}</div>
      <div id="status">Loading the item-level feed for this week…</div>
      <div class="note">Only this week is fetched, and only when you open this tab — the full
        feed is 108,000 rows.</div></div>`;
    return;
  }
  const all=SD[k], rows=sdSales(all);
  const revenue=rows.reduce((t,r)=>t+r.sales,0);
  const units=rows.reduce((t,r)=>t+r.qty,0);
  const kitchen=all.length-rows.length;
  const days=[...new Set(rows.map(r=>fmtISO(r.ts)))].length||1;
  const byVenue={};
  rows.forEach(r=>byVenue[r.venue]=(byVenue[r.venue]||0)+r.sales);

  const tabs=[["hour","Time of day"],["cat","Category"],["prod","Products"],["waste","Wastage"]];
  document.getElementById("app").innerHTML=`${warnBar()}${summaryBar(m)}
    ${SD_ERR?`<div class="err">Couldn't read the feed: ${esc(SD_ERR)}</div>`:""}
    <div class="card" style="text-align:center;padding:18px 14px">
      <div class="k" style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em">Combined sales — both kitchens · ${esc(weekLabel(wk))}</div>
      <div style="font-size:40px;font-weight:700;font-family:var(--mono);line-height:1.1;margin:4px 0">${money0(revenue)}</div>
      <div class="sub" style="font-size:12px;color:var(--dim)">
        ${Math.round(units).toLocaleString()} items over ${days} trading day(s) · ${money0(revenue/days)} a day ·
        ${LEDGER_VENUES.map(v=>`${esc(vShort(v))} ${money0(byVenue[v]||0)}`).join(" · ")}
        ${kitchen?` · ${kitchen} kitchen request(s) excluded`:""}</div>
    </div>
    <div class="card">
      <div class="tabs">${tabs.map(([k2,l])=>`<a class="${SALES_TAB===k2?"on":""}" onclick="setSalesTab('${k2}')">${esc(l)}</a>`).join("")}</div>
      ${SALES_TAB==="hour"?sdHour(rows,days)
       :SALES_TAB==="cat"?sdCat(rows,revenue)
       :SALES_TAB==="prod"?sdProd(rows)
       :sdWaste(rows)}
    </div>`;
}
function setSalesTab(t){ SALES_TAB=t; SALES_SORT={col:"sales",dir:-1}; route(); }
function setSalesSort(c){
  if(SALES_SORT.col===c) SALES_SORT.dir*=-1;
  else SALES_SORT={col:c,dir:(c==="name")?1:-1};
  route();
}
function sHead(col,label,cls){
  const on=SALES_SORT.col===col;
  return `<th class="s ${cls||""} ${on?"act":""}" onclick="setSalesSort('${col}')">${label}${on?(SALES_SORT.dir>0?" ▲":" ▼"):""}</th>`;
}
function sdSort(list){
  const d=SALES_SORT.dir;
  const by={ name:(a,b)=>a.name.localeCompare(b.name), sales:(a,b)=>a.sales-b.sales,
             qty:(a,b)=>a.qty-b.qty, price:(a,b)=>(a.qty?a.sales/a.qty:0)-(b.qty?b.sales/b.qty:0) };
  return list.slice().sort((a,b)=>d*(by[SALES_SORT.col]||by.sales)(a,b));
}

/* Hourly, both kitchens together. Per-hour figures divide by the number of DAYS that hour
   actually traded, not by seven — an hour the shop was shut on three of them would
   otherwise read as a third of its real rate. */
function sdHour(rows,days){
  const hrs=Array.from({length:24},()=>({sales:0,qty:0,days:{}}));
  rows.forEach(r=>{
    const h=r.ts.getHours();
    hrs[h].sales+=r.sales; hrs[h].qty+=r.qty; hrs[h].days[fmtISO(r.ts)]=1;
  });
  const live=hrs.map((h,i)=>({h,i,n:Object.keys(h.days).length})).filter(x=>x.h.sales>0);
  if(!live.length) return `<div class="note">No sales rows with a time on them this week.</div>`;
  const peak=live.slice().sort((a,b)=>b.h.sales-a.h.sales)[0];
  const max=peak.h.sales;
  const hh=i=>String(i).padStart(2,"0")+":00";
  return `<div style="font-size:13px;margin-bottom:10px">Busiest hour <b>${hh(peak.i)}–${hh(peak.i+1)}</b>
      at ${money0(peak.h.sales)} for the week, ${money0(peak.h.sales/peak.n)} on an average day.</div>
    <table><thead><tr><th>Hour</th><th class="num">Revenue</th><th class="num hide-sm">Items</th>
      <th class="num">Per day</th><th class="num hide-sm">Avg item</th><th></th></tr></thead>
    <tbody>${live.map(x=>`<tr>
      <td><b>${hh(x.i)}</b></td>
      <td class="num">${money(x.h.sales)}</td>
      <td class="num hide-sm">${Math.round(x.h.qty)}</td>
      <td class="num">${money0(x.h.sales/x.n)}<br><span style="color:var(--dim);font-size:11px">${x.n} day(s)</span></td>
      <td class="num hide-sm">${x.h.qty?money(x.h.sales/x.h.qty):""}</td>
      <td style="width:38%"><div style="background:#eee;border-radius:3px;height:10px">
        <div style="background:var(--ink);height:10px;border-radius:3px;width:${(x.h.sales/max*100).toFixed(1)}%"></div></div></td>
    </tr>`).join("")}</tbody></table>
    <div class="note">Both kitchens together. Hours with no sales are left out rather than drawn as empty rows.</div>`;
}

function sdCat(rows,revenue){
  const m={};
  rows.forEach(r=>{
    const g=r.group||"Uncategorised";
    const o=m[g]||(m[g]={name:g,sales:0,qty:0});
    o.sales+=r.sales; o.qty+=r.qty;
  });
  const list=sdSort(Object.values(m));
  return `<table><thead><tr>${sHead("name","Category")}${sHead("sales","Revenue","num")}
      ${sHead("qty","Items","num hide-sm")}${sHead("price","Avg item","num hide-sm")}<th class="num">% of sales</th></tr></thead>
    <tbody>${list.map(o=>`<tr>
      <td><b>${esc(o.name)}</b></td><td class="num">${money(o.sales)}</td>
      <td class="num hide-sm">${Math.round(o.qty)}</td>
      <td class="num hide-sm">${o.qty?money(o.sales/o.qty):""}</td>
      <td class="num">${revenue?pct1(o.sales/revenue*100):""}</td></tr>`).join("")}</tbody></table>
    <div class="note">Category is the group set in the Overrides tab where there is one, falling back to what the
      POS sent. Roughly one POS assignment in three is wrong, which is what that tab exists to correct.</div>`;
}

function sdProd(rows){
  const m={};
  rows.forEach(r=>{
    const o=m[r.item]||(m[r.item]={name:r.item,sales:0,qty:0,group:r.group||""});
    o.sales+=r.sales; o.qty+=r.qty;
  });
  const list=sdSort(Object.values(m)).slice(0,120);
  return `<table><thead><tr>${sHead("name","Product")}<th class="hide-sm">Category</th>
      ${sHead("qty","Sold","num")}${sHead("sales","Revenue","num")}${sHead("price","Avg price","num hide-sm")}</tr></thead>
    <tbody>${list.map(o=>`<tr>
      <td><b>${esc(o.name)}</b></td>
      <td class="hide-sm">${o.group?`<span class="pill">${esc(o.group)}</span>`:""}</td>
      <td class="num">${Math.round(o.qty*100)/100}</td>
      <td class="num">${money(o.sales)}</td>
      <td class="num hide-sm">${o.qty?money(o.sales/o.qty):""}</td></tr>`).join("")}</tbody></table>
    <div class="note">Top 120 by the sorted column. Names are rolled up through the ItemMap tab, so the same
      product spelled two ways in the POS counts once.</div>`;
}

/* Wastage: a $0 line in a perishable group is food in the bin. Elsewhere a $0 line usually
   is not — Coffee & Tea is dominated by the loyalty give-away, which costs margin but went
   to a paying regular. And a $0 line only counts as waste if the SAME item also sells for
   money this week: something never charged for is a modifier, not a give-away. */
function sdWaste(rows){
  const paid={};
  rows.forEach(r=>{ if(r.sales>0) paid[r.item.toLowerCase()]=1; });
  const m={};
  rows.forEach(r=>{
    if(PERISHABLE.indexOf(r.group)===-1) return;
    const o=m[r.item]||(m[r.item]={name:r.item,group:r.group,sold:0,free:0,rev:0});
    if(r.sales>0){ o.sold+=r.qty; o.rev+=r.sales; } else o.free+=r.qty;
  });
  let list=Object.values(m).filter(o=>o.free>0&&o.sold>0&&paid[o.name.toLowerCase()]);
  list.forEach(o=>{ o.price=o.sold?o.rev/o.sold:0; o.value=o.free*o.price;
                    o.pct=(o.sold+o.free)?o.free/(o.sold+o.free)*100:0; });
  list.sort((a,b)=>b.value-a.value);
  const units=list.reduce((t,o)=>t+o.free,0), value=list.reduce((t,o)=>t+o.value,0);
  if(!list.length) return `<div class="note">No wastage found in ${PERISHABLE.join(", ")} this week — either none
    was rung up, or the Overrides tab has not put these items into a perishable group yet.</div>`;
  return `<div style="font-size:13px;margin-bottom:10px"><b>${Math.round(units)}</b> items binned,
      worth <b>${money(value)}</b> at what they were selling for.</div>
    <table><thead><tr><th>Product</th><th class="hide-sm">Group</th><th class="num">Binned</th>
      <th class="num hide-sm">Sold</th><th class="num">% wasted</th><th class="num">Value</th></tr></thead>
    <tbody>${list.map(o=>`<tr>
      <td><b>${esc(o.name)}</b></td><td class="hide-sm"><span class="pill">${esc(o.group)}</span></td>
      <td class="num">${Math.round(o.free*100)/100}</td>
      <td class="num hide-sm">${Math.round(o.sold*100)/100}</td>
      <td class="num ${o.pct>=25?"up":""}">${pct1(o.pct)}</td>
      <td class="num">${money(o.value)}</td></tr>`).join("")}</tbody></table>
    <div class="note">Perishable groups only: ${PERISHABLE.join(", ")}. Valued at that item's own average selling
      price this week. An item that never sold for money is left out — it is a modifier, not waste.</div>`;
}

/* ================= INVOICES PANEL =================
   Supplier Explorer's invoice list, reusable: the builder shows this store's invoices under
   the catalogue, the reports drilldown shows both stores'. Clicking an invoice opens its
   own lines, which is the only place in this app you see what an invoice actually contained
   rather than a product rolled up across many of them. */
let OPEN_INV=null;
function toggleInv(k){ OPEN_INV = OPEN_INV===k ? null : k; route(); }
function invoicePanel(supplier,venue,limit){
  return `<div class="card">
    <div class="label">Invoices — ${esc(supplier)}${venue?" · "+esc(venue):" · both stores"}</div>
    ${invoiceTable(supplier,venue,limit)}</div>`;
}
function invoiceTable(supplier,venue,limit){
  const rows=INV.filter(r=>r.supplier===supplier&&(!venue||r.venue===venue)&&r.date)
                .sort((a,b)=>b.date-a.date).slice(0,limit||40);
  if(!rows.length) return `<div class="note">No invoices for this supplier${venue?" at "+esc(venue):""} in the data.</div>`;
  const tot=rows.reduce((s,r)=>s+r.total,0);
  return `<div style="font-size:13px;color:var(--dim);margin:6px 0 8px">${rows.length} invoice(s), ${money(tot)}</div>
    <table><thead><tr><th>Date</th><th class="hide-sm">Invoice</th><th class="hide-sm">Venue</th>
      <th class="num">Subtotal</th><th class="num hide-sm">GST</th><th class="num">Total</th></tr></thead>
    <tbody>${rows.map(r=>{
      const k=norm(r.supplier)+"|"+norm(r.number)+"|"+fmtISO(r.date);
      const open=OPEN_INV===k;
      const lines=open?LINES.filter(l=>l.supplier===r.supplier&&norm(l.number)===norm(r.number)
                                       &&(!venue||l.venue===venue)):[];
      return `<tr class="click ${open?"picked":""}" onclick="toggleInv('${esc(k)}')">
          <td>${open?"▾ ":"▸ "}${fmtD(r.date)}</td>
          <td class="hide-sm" style="font-family:var(--mono);font-size:11px">${esc(r.number)||"—"}</td>
          <td class="hide-sm">${esc(vShort(r.venue))}</td>
          <td class="num">${money(r.subtotal)}</td><td class="num hide-sm">${money(r.gst)}</td>
          <td class="num"><b>${money(r.total)}</b></td></tr>`
        + (open?`<tr><td colspan="6" style="background:#faf9f6;padding:0 8px 10px">
            ${lines.length?`<table style="margin-top:4px"><thead><tr><th>Line</th><th class="num">Qty</th>
              <th class="num">Unit price</th><th class="num">Line total</th></tr></thead>
              <tbody>${lines.map(l=>`<tr><td>${esc(l.desc)}${l.code?` <span style="color:var(--dim);font-family:var(--mono);font-size:11px">${esc(l.code)}</span>`:""}</td>
                <td class="num">${l.qty} ${esc(l.unit||"")}</td><td class="num">${money(l.price)}</td>
                <td class="num">${money(l.total)}</td></tr>`).join("")}</tbody></table>`
              :`<div class="note">No itemised lines captured for this invoice — it arrived as a total only.</div>`}
          </td></tr>`:"");
    }).join("")}</tbody></table>
    <div class="note">Most recent first, capped at ${limit||40}. Click any invoice for its lines.</div>`;
}

/* ================= PLACED ORDERS ================= */
/* Per store, like everything else about ordering. */
let OPEN_ORDER=null, CANCELLED=0;
function toggleOrder(id){ OPEN_ORDER = OPEN_ORDER===id ? null : id; route(); }
function renderPlaced(){
  const m=weekModel();
  const rec=reconcile(ORDERS.concat(LOCAL_ORDERS),INV,{start:addD(m.wk.start,-28),end:m.wk.end},new Date());
  const status={};
  rec.open.forEach(o=>status[o.id]={state:"open",nearest:o.nearest});
  rec.closed.forEach(c=>status[c.o.id]={state:"closed",inv:c.inv,how:c.how});
  const rows=ORDERS.concat(LOCAL_ORDERS).filter(o=>o.venue===TAG.name&&o.date>=addD(m.wk.start,-28))
                   .sort((a,b)=>b.date-a.date);
  document.getElementById("app").innerHTML=`${warnBar()}${summaryBar(m)}
    <a class="back" onclick="go('')">All suppliers</a>
    <div class="card"><div class="label">Orders placed — last 4 weeks · ${esc(TAG.name)}</div>
      <table><thead><tr><th>Placed</th><th>Supplier</th><th class="hide-sm">Deliver</th><th class="num hide-sm">Items</th>
        <th class="num">Total</th><th>Reconciliation</th><th class="num"></th></tr></thead>
      <tbody>${rows.map(o=>{
        const st=status[o.id]||{state:"closed",how:"outside this window"};
        const open=OPEN_ORDER===o.id;
        let pill;
        if(st.state==="open") pill=`<span class="pill">awaiting invoice</span>`+(st.nearest?`<br><span style="font-size:11px;color:var(--dim)">nearest: ${money(st.nearest.total)} on ${fmtD(st.nearest.date)}</span>`:"");
        else if(st.inv) pill=`<span class="pill ok">invoiced</span><br><span style="font-size:11px;color:var(--dim)">#${esc(st.inv.number)} · ${money(st.inv.total)} · ${fmtD(st.inv.date)} · ${esc(st.how)}</span>`;
        else pill=`<span class="pill ok">${esc(st.how||"closed")}</span>`;
        return `<tr class="click ${open?"picked":""}" onclick="toggleOrder('${esc(o.id)}')">
          <td>${open?"▾ ":"▸ "}${fmtD(o.date)}</td>
          <td><b>${esc(o.supplier)}</b>${o.by?`<br><span style="color:var(--dim);font-size:11px">${esc(o.by)}</span>`:""}</td>
          <td class="hide-sm">${o.delivery?fmtD(o.delivery):'<span style="color:var(--dim)">—</span>'}</td>
          <td class="num hide-sm">${(o.lines||[]).length||'<span style="color:var(--dim)">—</span>'}</td>
          <td class="num">${money(o.total)}</td>
          <td>${pill}</td>
          <td class="num">${(o.lines||[]).length?`<a class="chip sm" onclick="event.stopPropagation();reorder('${esc(o.id)}')">Order again</a>`:""}</td></tr>`
        + (open?`<tr><td colspan="7" style="background:#faf9f6;padding:0 8px 12px">
            ${(o.lines||[]).length?`<table style="margin-top:6px"><thead><tr><th>Line</th><th class="num">Qty</th><th class="num">Unit price then</th><th class="num">Line</th></tr></thead>
              <tbody>${o.lines.map(l=>`<tr><td>${esc(l.desc)}${l.code?` <span style="color:var(--dim);font-family:var(--mono);font-size:11px">${esc(l.code)}</span>`:""}</td>
                <td class="num">${l.qty} ${esc(l.unit||"")}</td><td class="num">${money(l.price)}</td><td class="num">${money(l.qty*l.price)}</td></tr>`).join("")}</tbody></table>`
              :`<div class="note">No line detail was stored for this order.</div>`}
            ${st.state==="open"?`
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center">
                <span style="font-size:12px;color:var(--dim)">Still counting against the week.</span>
                <a class="chip sm" onclick="event.stopPropagation();matchPicker('${esc(o.id)}')">Match to an invoice…</a>
                <a class="chip sm" onclick="event.stopPropagation();markReceived('${esc(o.id)}')">Mark received</a>
              </div>`:""}
            <div style="margin-top:10px">
              <a class="chip sm" onclick="event.stopPropagation();deleteOrder('${esc(o.id)}')"
                 style="border-color:var(--red);color:var(--red)">Delete this order</a>
            </div>
          </td></tr>`:"");
      }).join("")}</tbody></table>
      ${rows.length?"":'<div class="note">No orders logged for this store yet.</div>'}
      ${CANCELLED?`<div class="note">${CANCELLED} deleted order(s) are hidden. They stay in the Orders tab with a
        cancel row against them, so nothing is lost from the record.</div>`:""}
      <div class="note">
        <b>Awaiting invoice</b> — the order is holding its slot in the week's budget. When its invoice arrives the
        order stops counting and the invoice counts instead, so a delivery is never charged twice.<br>
        <b>Invoiced</b> — the tool found that invoice: the same supplier, captured after the order was placed,
        dated on or around the delivery day, and the closest in value, within a third. If nothing fits, the order
        stays open and shows its nearest candidate so you can match it by hand.<br>
        Orders placed outside this tool have no row here. Their invoices simply count as spend, which is right.
      </div>
    </div>`;
}
/* Pick the invoice by hand. Offered: that supplier's invoices from a week before the order
   to today, unmatched, nearest in value first. */
function matchPicker(id){
  const o=ORDERS.concat(LOCAL_ORDERS).find(x=>x.id===id); if(!o) return;
  const used=new Set();
  reconcile(ORDERS.concat(LOCAL_ORDERS),INV,{start:addD(o.date,-60),end:addD(new Date(),1)},new Date())
    .closed.forEach(c=>{ if(c.inv) used.add(norm(c.inv.number)); });
  const cands=INV.filter(r=>r.supplier===o.supplier&&r.type!=="manual"&&r.number&&r.date>=addD(o.date,-7)&&!used.has(norm(r.number)))
                 .sort((a,b)=>Math.abs(a.total-o.total)-Math.abs(b.total-o.total)).slice(0,12);
  modal(`<div class="label">Match this order to an invoice</div>
    <div style="font-size:13px;margin-bottom:8px">${esc(o.supplier)} · ordered ${fmtD(o.date)} · ${money(o.total)}</div>
    ${cands.length?`<table><thead><tr><th>Date</th><th class="hide-sm">Invoice</th><th class="num">Total</th><th class="num">Diff</th><th></th></tr></thead>
      <tbody>${cands.map(r=>`<tr><td>${fmtD(r.date)}</td><td class="hide-sm" style="font-family:var(--mono);font-size:11px">${esc(r.number)}</td>
        <td class="num">${money(r.total)}</td><td class="num ${Math.abs(r.total-o.total)>o.total*MATCH_TOL?"up":""}">${money(r.total-o.total)}</td>
        <td class="num"><a class="chip sm" onclick="matchTo('${esc(o.id)}','${esc(r.number)}')">This one</a></td></tr>`).join("")}</tbody></table>`
      :`<div class="note">No unmatched invoices from ${esc(o.supplier)} since ${fmtD(addD(o.date,-7))}. It may not have arrived yet.</div>`}
    <div style="margin-top:12px"><a class="btn outline" onclick="closeModal()">Cancel</a></div>`);
}
async function matchTo(id,invoiceNumber){
  closeModal();
  const o=ORDERS.concat(LOCAL_ORDERS).find(x=>x.id===id); if(!o) return;
  try{ await post({action:"match",order_id:id,supplier:o.supplier,venue:o.venue,order_date:fmtISO(o.date),
                   note:invoiceNumber}); }
  catch(e){ if(e.message!=="no-webapp"){ alert(e.message); return; } }
  o.matchedTo=invoiceNumber;
  toast("Matched to invoice "+invoiceNumber+".");
  route();
}
/* Delete = a cancel row, not a removed row. The order leaves the budget, the lists and the
   reconciliation immediately; the sheet keeps the whole history, which matters when the
   thing being deleted is a real order somebody placed. */
async function deleteOrder(id){
  const o=ORDERS.concat(LOCAL_ORDERS).find(x=>x.id===id); if(!o) return;
  if(!confirm(`Delete the ${fmtD(o.date)} order to ${o.supplier} for ${money(o.total)}?\n\n`
             +`It stops counting against the week straight away. The record stays in the sheet.`)) return;
  try{ await post({action:"cancel",order_id:id,supplier:o.supplier,venue:o.venue,
                   order_date:fmtISO(o.date),subtotal:o.subtotal,gst:o.gst,total:o.total}); }
  catch(e){
    if(e.message!=="no-webapp"){ alert(e.message); return; }
    toast("Deleted in this browser only — WEBAPP_URL isn't set.");
  }
  ORDERS=ORDERS.filter(x=>x.id!==id);
  LOCAL_ORDERS=LOCAL_ORDERS.filter(x=>x.id!==id);
  CANCELLED++;
  OPEN_ORDER=null;
  toast("Order deleted.");
  route();
}
async function markReceived(id){
  const o=ORDERS.concat(LOCAL_ORDERS).find(x=>x.id===id); if(!o) return;
  try{ await post({action:"receive",order_id:id,supplier:o.supplier,venue:o.venue,order_date:fmtISO(o.date),
                   subtotal:o.subtotal,gst:o.gst,total:o.total}); }
  catch(e){ if(e.message!=="no-webapp"){ alert(e.message); return; } }
  o.action="receive";
  route();
}

/* Load a past order back into the cart. Prices come from the CURRENT catalogue, never from
   what was paid at the time — reordering at last quarter's price would quietly understate
   the cart against this week's budget. Items that have since left the catalogue are skipped
   and counted rather than invented. */
function reorder(id){
  const o=ORDERS.concat(LOCAL_ORDERS).find(x=>x.id===id);
  if(!o||!(o.lines||[]).length) return;
  const known={};
  deriveCatalogue(LINES,o.supplier,new Date(),{venue:o.venue}).forEach(p=>known[p.key]=p);
  let loaded=0, miss=0;
  o.lines.forEach(l=>{
    const key=prodKey(o.supplier,l.code,l.desc,l.unit);
    if(known[key]){ setQty(o.supplier,key,l.qty,o.venue); loaded++; } else miss++;
  });
  TAG=tagByName(o.venue); SUPPLIER=o.supplier;
  renderTagPicker(); renderFilters();
  location.hash="s::"+encodeURIComponent(o.supplier);
  route();
  toast(miss?`Loaded ${loaded} item(s) from ${fmtD(o.date)} — ${miss} no longer in the catalogue.`
            :`Loaded all ${loaded} item(s) from the ${fmtD(o.date)} order.`);
}

/* ================= FAVOURITES ================= */
function saveFavPrompt(){
  const t=orderTotals(SUPPLIER);
  if(!t.lines.length){ alert("Nothing in this order yet."); return; }
  modal(`<div class="label">Save as favourite</div>
    <div style="font-size:13px;margin-bottom:8px">${t.lines.length} item(s) · ${esc(SUPPLIER)}</div>
    <input type="text" id="favname" placeholder="e.g. Monday Kitchen Run" style="width:100%">
    <div style="display:flex;gap:8px;margin-top:12px">
      <a class="btn" id="favok">Save</a><a class="btn outline" onclick="closeModal()">Cancel</a></div>
    <div class="note">Saved to the sheet, so anyone opening this link sees it.</div>`);
  document.getElementById("favok").onclick=()=>saveFav(document.getElementById("favname").value.trim(),t.lines,SUPPLIER);
}
/* Takes its lines explicitly: the prompt after a placed order runs once the draft has been
   cleared, so reading the draft here would save an empty favourite. */
async function saveFav(name,lines,supplier){
  if(!name||!lines||!lines.length) return;
  const fav={fav_id:"f"+Date.now().toString(36),fav_name:name,venue:TAG.name,supplier,
    lines:lines.map((l,i)=>({line_no:i+1,item_key:l.key,description:l.desc,unit:l.unit,qty:l.qty,supplier}))};
  closeModal();
  try{
    await post(Object.assign({action:"favourite"},fav));
    FAVS.push({id:fav.fav_id,name,venue:TAG.name,supplier,by:identity().user||"",
      lines:fav.lines.map(l=>({key:l.item_key,desc:l.description,unit:l.unit,qty:l.qty,supplier}))});
    toast("Favourite saved.");
  }catch(e){
    if(e.message==="no-webapp") toast("Can't save favourites until WEBAPP_URL is set.");
    else alert(e.message);
  }
  route();
}
function recallFav(id){
  const f=FAVS.find(x=>x.id===id); if(!f) return;
  const sup=f.supplier||SUPPLIER;
  const known={}; deriveCatalogue(LINES,sup,new Date(),{venue:f.venue}).forEach(p=>known[p.key]=p);
  let miss=0;
  f.lines.forEach(l=>{ if(known[l.key]) setQty(sup,l.key,l.qty,f.venue); else miss++; });
  SUPPLIER=sup; location.hash="s::"+encodeURIComponent(sup);
  route();
  toast(miss?`Loaded "${f.name}" — ${miss} item(s) no longer in the catalogue were skipped.`:`Loaded "${f.name}".`);
}
function renderFavs(){
  const m=weekModel();
  document.getElementById("app").innerHTML=`${warnBar()}${summaryBar(m)}
    <a class="back" onclick="go('')">All suppliers</a>
    <div class="card"><div class="label">Saved favourites — ${esc(TAG.name)}</div>
      <table><thead><tr><th>Name</th><th class="hide-sm">Supplier</th><th class="num">Items</th><th class="num"></th></tr></thead>
      <tbody>${FAVS.filter(f=>f.venue===TAG.name).map(f=>`<tr><td><b>${esc(f.name)}</b>${f.by?`<br><span style="color:var(--dim);font-size:11px">${esc(f.by)}</span>`:""}</td>
        <td class="hide-sm">${esc(f.supplier||"—")}</td><td class="num">${f.lines.length}</td>
        <td class="num"><a class="chip sm" onclick="recallFav('${esc(f.id)}')">Load</a>
          <a class="chip sm" onclick="deleteFav('${esc(f.id)}')">Delete</a></td></tr>`).join("")}</tbody></table>
      ${FAVS.filter(f=>f.venue===TAG.name).length?"":'<div class="note">No favourites for this store yet. Build an order and choose <b>Save as favourite</b>.</div>'}
    </div>`;
}
async function deleteFav(id){
  const f=FAVS.find(x=>x.id===id); if(!f) return;
  if(!confirm(`Delete favourite "${f.name}"?`)) return;
  try{ await post({action:"favourite_delete",fav_id:id}); }
  catch(e){ if(e.message!=="no-webapp"){ alert(e.message); return; } }
  FAVS=FAVS.filter(x=>x.id!==id); route();
}

/* ================= ADMIN ================= */
function renderAdmin(){
  const list=supplierList(), overrides=Object.keys(COVER);
  document.getElementById("app").innerHTML=`
    <a class="back" onclick="go('')">All suppliers</a>
    <div class="card"><div class="label">Supplier settings — global, one setting everywhere</div>
      <table><thead><tr><th>Supplier</th><th>Sales rep email</th><th class="num">Visible</th><th class="num">Portal only</th></tr></thead>
      <tbody>${list.map(s=>{const c=sset(s.name);return `<tr>
        <td><b>${esc(s.name)}</b>${s.lines?"":' <span class="pill">no line items</span>'}</td>
        <td><input type="email" value="${esc(c.rep_email)}" placeholder="${esc(supplierEmail(s.name)||"none known")}"
             style="width:100%;font-size:12px;padding:6px 8px" onchange="saveSupplier('${esc(s.name)}','rep_email',this.value)"></td>
        <td class="num"><input type="checkbox" ${c.visible?"checked":""} onchange="saveSupplier('${esc(s.name)}','visible',this.checked?'yes':'no')"></td>
        <td class="num"><input type="checkbox" ${c.portal_only?"checked":""} onchange="saveSupplier('${esc(s.name)}','portal_only',this.checked?'yes':'no')"></td>
      </tr>`;}).join("")}</tbody></table>
      <div class="note">
        <b>Sales rep email</b> is who you order from, deliberately separate from the address invoices arrive from —
        the greyed placeholder is what the invoices suggest, and it's usually a no-reply robot.<br>
        <b>Portal only</b> keeps a supplier off the ordering list while their invoices still count toward spend and
        COGS. <b>Visible</b> hides them from ordering entirely. Both apply to every view, for everyone.
      </div>
    </div>
    <div class="card"><div class="label">Category overrides — ${overrides.length} set by hand</div>
      ${overrides.length?`<table><thead><tr><th>Product</th><th>Category</th></tr></thead>
        <tbody>${overrides.map(k=>{
          const l=LINES.find(x=>x.key===k);
          return `<tr><td>${esc(l?l.desc:k)}<br><span style="color:var(--dim);font-family:var(--mono);font-size:10px">${esc(k)}</span></td>
            <td><span class="pill">${esc(COVER[k])}</span></td></tr>`;}).join("")}</tbody></table>`
        :'<div class="note">None yet. Use the ✎ beside any category in a supplier catalogue to reassign a product for everyone.</div>'}
    </div>`;
}
async function saveSupplier(name,field,value){
  const cur=sset(name);
  SSET[norm(name)]=Object.assign({},cur,{[field]: field==="visible"?value!=="no":field==="portal_only"?value==="yes":value});
  try{ await post({action:"supplier_setting",supplier:name,field,value}); toast("Saved for everyone."); }
  catch(e){ if(e.message==="no-webapp") toast("Not saved — WEBAPP_URL isn't set."); else alert(e.message); }
}

/* ================= DISPATCH ================= */
function orderText(supplier,opts){
  opts=opts||{};
  const t=orderTotals(supplier), d=draft(supplier), tag=tagByName(d.tag||TAG.name);
  const lines=t.lines.map(l=>`- ${l.qty} x ${l.unit||"ea"}  ${l.desc}${l.code?" ["+l.code+"]":""}`+(opts.prices?`   ${money(l.price)} ea`:""));
  const head=[`Order — ${tag.name}`,`Date: ${fmtD(new Date())}`,
              d.delivery?`Deliver on: ${fmtD(gvizDate(d.delivery))}`:"", `Deliver to: ${tag.addr}`].filter(Boolean);
  const tail=opts.prices?["",`Estimated ${money(t.sub)} + ${money(t.gst)} GST = ${money(t.total)}`]:[];
  return head.join("\n")+"\n\n"+lines.join("\n")+tail.join("\n");
}
function orderEmailBody(supplier){
  const d=draft(supplier);
  return `Hi,\n\nCould we please order the following for ${d.tag||TAG.name}:\n\n`
    + orderText(supplier,{prices:false}).split("\n\n").slice(1).join("\n\n")
    + `\n\nPlease confirm availability and delivery day.\n\nThanks,\n${identity().user||"Red Square"}\n`
    + COMPANY_BLOCK.join("\n");
}
function dispatch(how){
  const t=orderTotals(SUPPLIER);
  if(!t.lines.length){ alert("Nothing in this order yet."); return; }
  if(how==="copy") return copyText(orderText(SUPPLIER,{prices:false}));
  const to=(document.getElementById("repmail")||{}).value||supplierEmail(SUPPLIER);
  if(!to){ alert("No sales rep email for this supplier. Add one in Admin, or use Copy."); return; }
  const ccOn=(document.getElementById("cckitchen")||{}).checked;
  const cc=ccOn?(sset(SUPPLIER).cc||ACCOUNTS_EMAIL):"";
  const d=draft(SUPPLIER);
  const q=`subject=${encodeURIComponent(`Order — ${d.tag||TAG.name} — ${fmtD(new Date())}`)}&body=${encodeURIComponent(orderEmailBody(SUPPLIER))}`;
  location.href=`mailto:${encodeURIComponent(to)}?${cc?`cc=${encodeURIComponent(cc)}&`:""}${q}`;
}
function copyText(txt){
  const done=()=>toast("Copied — paste it into the portal or message.");
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>showCopyBox(txt));
  else showCopyBox(txt);
}
function showCopyBox(txt){
  modal(`<div class="label">Copy this order</div><textarea id="cpbox">${esc(txt)}</textarea>
    <div style="margin-top:10px"><a class="btn" onclick="closeModal()">Done</a></div>`);
  const el=document.getElementById("cpbox"); if(el){el.focus();el.select();}
}
function toast(msg){
  const el=document.createElement("div"); el.textContent=msg;
  el.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;z-index:50";
  document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
}
function modal(html){
  closeModal();
  const w=document.createElement("div"); w.className="modal"; w.id="obmodal";
  w.innerHTML=`<div class="box">${html}</div>`;
  w.addEventListener("click",e=>{if(e.target===w) closeModal();});
  document.body.appendChild(w);
}
function closeModal(){ const m=document.getElementById("obmodal"); if(m) m.remove(); }

/* ================= WRITE PATH ================= */
function identity(){ try{return JSON.parse(localStorage.getItem("ob_identity")||"{}")||{};}catch(e){return {};} }
function askIdentity(){
  const id=identity();
  if(id.user&&id.pin) return Promise.resolve(id);
  return new Promise(res=>{
    modal(`<div class="label">Who's using this?</div>
      <div style="display:grid;gap:8px">
        <input type="text" id="obname" placeholder="Your name" value="${esc(id.user||"")}">
        <input type="text" id="obpin" placeholder="Shared PIN" value="${esc(id.pin||"")}">
        <a class="btn" id="obok">Save</a></div>
      <div class="note">Your name goes on the order record. The PIN is shared and is a working record, not
        security — this page is public.</div>`);
    document.getElementById("obok").onclick=()=>{
      const user=document.getElementById("obname").value.trim(), pin=document.getElementById("obpin").value.trim();
      if(!user||!pin) return;
      try{localStorage.setItem("ob_identity",JSON.stringify({user,pin}));}catch(e){}
      closeModal(); res({user,pin});
    };
  });
}
async function post(payload){
  if(!WEBAPP_URL) throw new Error("no-webapp");
  const id=await askIdentity();
  let res;
  /* A string body sends as text/plain: a simple request with no CORS preflight, which an
     Apps Script web app cannot answer. */
  try{ res=await fetch(WEBAPP_URL,{method:"POST",body:JSON.stringify(Object.assign({pin:id.pin,user:id.user},payload)),redirect:"follow"}); }
  catch(e){ throw new Error("Couldn't reach the save endpoint. In Apps Script check Deploy → Manage deployments: access must be Anyone, and the /exec URL current. Nothing was saved."); }
  const txt=await res.text();
  let j; try{ j=JSON.parse(txt); }catch(e){ throw new Error("Unexpected reply from the web app (not JSON). Is the deployment set to 'Anyone'?"); }
  if(!j.ok) throw new Error(j.error||"save failed");
  return j;
}
function buildPayload(action){
  const t=orderTotals(SUPPLIER), d=draft(SUPPLIER);
  return {order_id:"o"+Date.now().toString(36),action,supplier:SUPPLIER,venue:d.tag||TAG.name,
    order_date:fmtISO(new Date()),delivery_date:d.delivery||"",subtotal:t.sub,gst:t.gst,total:t.total,
    channel:sset(SUPPLIER).portal_only?"portal":"email",
    lines:t.lines.map((l,i)=>({line_no:i+1,item_code:l.code,description:l.desc,unit:l.unit,
                               qty:l.qty,unit_price:l.price,line_total:l.total}))};
}
const localRecord=o=>({id:o.order_id,action:"place",supplier:o.supplier,venue:o.venue,date:mid(new Date()),loggedAt:new Date(),
  delivery:gvizDate(o.delivery_date)||null,lines:(o.lines||[]).map(l=>({code:l.item_code,desc:l.description,unit:l.unit,qty:l.qty,price:l.unit_price})),
  total:o.total,subtotal:o.subtotal,gst:o.gst,channel:o.channel,by:identity().user||"",logged:new Date()});
async function markPlaced(){
  const t=orderTotals(SUPPLIER);
  if(!t.lines.length){ alert("Nothing in this order yet."); return; }
  const order=buildPayload("place"), local=localRecord(order);
  const placedLines=t.lines, placedSupplier=SUPPLIER;
  /* Same stale key: this left the placed draft in place AND created a second entry under a
     bare supplier name, so a placed order counted against the budget twice. */
  const finish=msg=>{ LOCAL_ORDERS.push(local); DRAFTS[draftId(SUPPLIER,order.venue)]={supplier:SUPPLIER,tag:order.venue,qty:{},note:""};
                      saveDrafts(); toast(msg); offerFav(placedLines,placedSupplier); };
  try{ await post(order); finish("Order logged."); }
  catch(e){ if(e.message==="no-webapp") finish("Logged in this browser only — WEBAPP_URL isn't set.");
            else alert(e.message); }
}
/* Asked after the order is safely logged, never before — a prompt that blocks the order is
   a prompt people learn to dismiss. */
function offerFav(lines,supplier){
  modal(`<div class="label">Save this as a favourite?</div>
    <div style="font-size:13px;margin-bottom:8px">Give it a name and it can be reloaded as an editable order.</div>
    <input type="text" id="favname" placeholder="e.g. Monday Kitchen Run" style="width:100%">
    <div style="display:flex;gap:8px;margin-top:12px">
      <a class="btn" id="favok">Save favourite</a><a class="btn outline" onclick="closeModal();go('')">No thanks</a></div>`);
  document.getElementById("favok").onclick=()=>{
    const n=document.getElementById("favname").value.trim(); if(!n) return;
    saveFav(n,lines,supplier);
  };
}
window.addEventListener("hashchange",route);
if(!window.__OB_NO_AUTOLOAD) loadAll();
</script>
