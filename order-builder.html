<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Builder</title>
<style>
  :root{--ink:#111;--paper:#f7f6f3;--line:#ddd;--red:#c8102e;--dim:#777;--green:#1a7f37;--amber:#b45309;
        --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink)}
  header{background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
  header .sq{width:13px;height:13px;background:var(--red)}
  header h1{font-size:16px;font-weight:700;white-space:nowrap}
  header .spacer{margin-left:auto}
  header button,header a.hbtn{background:none;border:1px solid #555;color:#fff;border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer;text-decoration:none}
  header .on{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
  .store{display:flex;border:1px solid #555;border-radius:7px;overflow:hidden}
  .store button{border:none;border-radius:0;padding:7px 13px;font-size:12px;font-weight:600}
  .store button.sel{background:#fff;color:var(--ink)}
  #filters{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;position:sticky;top:47px;z-index:19}
  main{max-width:1280px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .label{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .note{font-size:11px;color:var(--dim);line-height:1.5;margin-top:8px}
  .chip{border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;cursor:pointer;background:#fff;font-weight:600}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.sm{padding:4px 10px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
  th.s{cursor:pointer;user-select:none} th.s:hover{color:var(--ink)}
  th.act{color:var(--ink)}
  td{padding:8px;border-bottom:1px solid #f0efec;vertical-align:middle}
  tr.click{cursor:pointer} tr.click:hover{background:#faf9f6}
  tr.picked{background:#fffbe9}
  .num{text-align:right;font-family:var(--mono);white-space:nowrap}

  .pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;background:#eee;color:#555}
  .pill.warn{background:var(--red);color:#fff} .pill.ok{background:var(--green);color:#fff}
  input[type=search],input[type=text],input[type=email],input[type=number],select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:15px;background:#fff;font-family:inherit}
  input[type=search]{width:100%}
  .btn{display:inline-block;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
  .btn.outline{background:#fff;color:var(--ink);border:2px solid var(--ink);padding:9px 14px}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .back{display:inline-block;margin-bottom:10px;font-size:14px;font-weight:600;cursor:pointer}
  .back:before{content:"← "}
  .err{border:1px solid var(--red);color:var(--red);border-radius:10px;padding:12px;font-size:14px;background:#fff;margin-bottom:12px}
  #status{padding:40px 0;text-align:center;color:var(--dim);font-size:14px}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .tile .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .tile .v{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1.15;margin-top:2px}
  .tile .sub{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.45}
  .tile.over .v{color:var(--red)} .tile.good .v{color:var(--green)}
  .bar{height:12px;border-radius:99px;background:#eee;overflow:hidden;display:flex;margin-top:8px}
  .bar i{display:block;height:100%}
  .bar .b1{background:var(--ink)} .bar .b2{background:#8a8a8a} .bar .b3{background:var(--red)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:6px}
  .legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
  .legend .l1:before{background:var(--ink)} .legend .l2:before{background:#8a8a8a} .legend .l3:before{background:var(--red)}
  .panels{display:grid;grid-template-columns:1fr 370px;gap:12px;align-items:start}
  .draft{position:sticky;top:104px}
  @media (max-width:900px){.panels{grid-template-columns:1fr}.draft{position:static}.summary{grid-template-columns:1fr}}
  @media (max-width:600px){.hide-sm{display:none}td,th{padding:7px 5px}#filters{position:static}}
  .qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .qty button{width:38px;height:38px;border:none;background:#fff;font-size:19px;font-weight:700;cursor:pointer;line-height:1}
  .qty button:active{background:#eee}
  .qty input{width:50px;height:38px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-family:var(--mono);font-size:15px;padding:0;border-radius:0}
  .qty.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .dline{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f0efec;font-size:13px}
  .dline .g{flex:1;min-width:0} .dline .g b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .tot{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
  .tot.big{font-size:17px;font-weight:700;font-family:var(--mono);border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;line-height:1.5}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal .box{background:#fff;border-radius:12px;padding:18px;max-width:680px;width:100%;max-height:88vh;overflow:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:760px){.grid2{grid-template-columns:1fr}}
  .sw{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="sq"></div><h1>Order Builder</h1>
  <span id="buildtag" style="font-size:9px;color:#666"></span>
  <div class="store" id="storepick"></div>
  <span class="spacer"></span>
  <a class="hbtn" onclick="go('')">Order</a>
  <a class="hbtn" onclick="go('favs')">Favourites</a>
  <a class="hbtn" onclick="go('reports')">Reports</a>
  <a class="hbtn" onclick="go('admin')">Admin</a>
  <button onclick="loadAll()">↻</button>
</header>
<div id="filters"></div>
<main id="app"><div id="status">Loading data…</div></main>

<script>
/* =====================================================================================
   ORDER BUILDER v2 — Red Square Cambridge + Luma Kitchen.

   Reads BG Ops Data and BG Sales Data over gviz; writes orders, favourites and global
   settings back through the Orders.gs web app so every user of the link sees the same
   configuration.

   The page is PUBLIC. No credential belongs in it.
   ===================================================================================== */
const BUILD_ID="build-v2-1735"; console.log("Order Builder "+BUILD_ID);
{const e=document.getElementById("buildtag"); if(e) e.textContent=BUILD_ID;}

const SHEET_ID       = "1bICxitr-CyU7VF8TLKIZgw7gV2WTKur9AptfmskQNK4"; // BG Ops Data
const SALES_SHEET_ID = "1QEUnzY43v3wVc6dP0oGPqgL_mvLRVGHnMYwtO3QMJY4"; // BG Sales Data
const SALES_CUTOVER  = "2026-08-03";
const WEBAPP_URL     = "";   // Orders.gs /exec — set after deployment

/* Cambridge and Luma only. Glenorchy is excluded at the point every read is filtered, not
   by hiding it in the UI, so no total, report or catalogue can pick it up by accident. */
const STORES = [
  { key:"cambridge", name:"Red Square Cambridge", short:"Cambridge",
    addr:"66 Kennedy Drive, Cambridge TAS 7170" },
  { key:"luma",      name:"Luma Kitchen",         short:"Luma",
    addr:"66 Kennedy Drive, Cambridge TAS 7170" }
];
const STORE_NAMES = STORES.map(s=>s.name);

const TARGET_COGS_PCT = 30;   // fixed, by instruction

const COMPANY_BLOCK = ["B & G Fitness Pty Ltd","Red Square Cafe | Luma Kitchen","accounts@redsquarecafe.com.au"];
const ACCOUNTS_EMAIL = "accounts@redsquarecafe.com.au";

const CAT_DAYS=180, RATE_DAYS=90, DOW_WEEKS=6, MATCH_DAYS=14;

/* ================= STATE ================= */
let INV=[],LINES=[],CFG={},PMERGE={},ORDERS=[],SSET={},FAVS=[],SALES=[],LOAD_WARN=[];
let SALES_OK=false;
let STORE=STORES[0], WEEK_OFF=0, SUPPLIER="", CATFILT="", SEARCH="", HIDE_PORTAL=true;
let SORT={col:"name",dir:1};
let DRAFTS={}, LOCAL_ORDERS=[];

/* ================= HELPERS ================= */
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const money=v=>(v==null||v==="")?"":"$"+Number(v).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=v=>"$"+Math.round(Number(v)||0).toLocaleString("en-AU");
const pct1=v=>(Math.round(v*10)/10)+"%";
const fmtD=d=>d?d.toLocaleDateString("en-AU"):"";
const fmtISO=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const mid=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const weekStart=d=>{const x=mid(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num_=v=>+String(v||"").replace(/[^0-9.\-]/g,"")||0;
const storeByName=n=>STORES.find(s=>s.name===n)||STORES[0];

function gvizDate(v){
  if(v instanceof Date) return v;
  const s=String(v||"").trim();
  let m=/Date\((\d+),(\d+),(\d+)/.exec(s); if(m) return new Date(+m[1],+m[2],+m[3]);
  m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  return null;
}

const UNIT_ALIAS={each:"ea",ea:"ea",unit:"ea",units:"ea",pack:"ea",carton:"ctn",cartons:"ctn",ctn:"ctn",ct:"ctn",cs:"ctn",case:"ctn",box:"box",bx:"box",pkt:"pkt",packet:"pkt",pk:"pkt",sleeve:"slv",slv:"slv",bottle:"btl",btl:"btl",kg:"kg",g:"g",l:"l",ltr:"l",litre:"l",tray:"tray",bag:"bag",tub:"tub",doz:"doz",dozen:"doz"};
const unitNorm=u=>{const n=norm(u);return UNIT_ALIAS[n]||n;};

/* ================= ITEM NAME NORMALISATION =================
   Suppliers spell the same product a dozen ways across a year of invoices: word order
   flips ("Sliced cheese" / "Cheese, Sliced"), plurals wander, and typos stick ("cherry
   tomatos"). Left alone, each variant becomes its own catalogue line with its own price
   history, which is how a product ends up looking like it has never been bought before.

   Three passes, each deliberately conservative, because a WRONG merge is worse than a
   missed one — it silently averages two different products' prices:
     1. strip punctuation and case, drop pure noise words;
     2. singularise tokens, guarding the endings that aren't plurals (-ss, -us, -is);
     3. sort the tokens, so word order stops mattering.
   Sizes and pack counts are KEPT as tokens: "Milk 2L" and "Milk 1L" must never merge.
   A near-miss pass then folds single-character typos together, but only within one
   supplier, one unit, and only for long tokens. */
const NOISE=new Set(["the","and","a","of","w","with","approx","abt","per","x"]);
function singular(t){
  if(t.length<=3) return t;
  /* -ss, -us and -is are endings, not plurals: "glass", "citrus", "basis". -as is NOT on
     that list — "bananas", "pizzas", "peas" and "sultanas" are ordinary plurals, and
     guarding -as kept every one of them out of its category. The short words that guard
     was really protecting ("gas") are already covered by the length check above. */
  if(/(ss|us|is)$/.test(t)) return t;
  if(/ies$/.test(t)) return t.slice(0,-3)+"y";
  if(/(oes|ches|shes|sses|xes)$/.test(t)) return t.slice(0,-2);
  if(/s$/.test(t) && t.length>3) return t.slice(0,-1);   // "cups"->"cup", "oats"->"oat"
  return t;
}
function nameKey(desc){
  const toks=String(desc||"").toLowerCase()
    .replace(/[^a-z0-9. ]+/g," ")
    .split(/\s+/).filter(Boolean)
    .filter(t=>!NOISE.has(t))
    .map(singular)
    .filter(Boolean);
  if(!toks.length) return norm(desc);
  return toks.sort().join(" ");
}
/* Levenshtein, capped: anything past the cap is "too different" and we stop counting. */
function lev(a,b,cap){
  if(Math.abs(a.length-b.length)>cap) return cap+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i]; let best=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<best) best=cur[j];
    }
    if(best>cap) return cap+1;
    prev=cur;
  }
  return prev[b.length];
}
/* Folds near-identical keys together inside one supplier+unit bucket. The longest-standing
   spelling wins (most invoice lines), so the name on screen is the one staff recognise. */
function fuzzyFold(keys){
  const map={}, sorted=keys.slice().sort((a,b)=>b.n-a.n||a.key.localeCompare(b.key));
  const canon=[];
  sorted.forEach(k=>{
    const hit=canon.find(c=>c.bucket===k.bucket && k.key.length>=6 && c.key.length>=6
                            && lev(c.key,k.key,1)<=1);
    map[k.key]= hit ? hit.key : k.key;
    if(!hit) canon.push(k);
  });
  return map;
}

/* ================= CATEGORISATION =================
   Invoice rows carry a category the extractor guessed at invoice level ("Food"), which is
   too coarse to order from — a chef wants Produce separate from Dairy. These rules tag the
   LINE, from its description, first match wins. Order matters: the specific beats the
   general, so "coffee beans" is Coffee before "bean" could make it Produce.
   Anything unmatched keeps the invoice's own category rather than being forced somewhere
   wrong, and shows as Uncategorised so the gap is visible instead of silently misfiled. */
const CATEGORY_RULES=[
  /* A coffee cup is packaging, not coffee. Onepac sells thousands of them and the Coffee
     rule would otherwise claim every one. Vessels are checked before the drink. */
  ["Packaging",/\b(coffee cup|takeaway cup|cup lid|coffee lid|cup carrier)\b/],
  ["Coffee",   /\b(coffee|espresso|arabica|robusta|chai latte|coffee bean)\b/],
  ["Dairy",    /\b(milk|cream|cheese|butter|yogh?urt|mozzarella|parmesan|feta|haloumi|ricotta|mascarpone|creme fraiche|custard)\b/],
  ["Seafood",  /\b(salmon|prawn|fish|squid|calamari|octopus|mussel|oyster|scallop|barramundi|tuna|anchov\w*)\b/],
  ["Meat",     /\b(beef|chicken|pork|lamb|bacon|rasher|ham|salami\w*|prosciutto|chorizo|sausage|mince|steak|rump|brisket|turkey|duck|pancetta|wing ding|nugget|schnitzel|kransky|meatball)\b/],
  ["Bakery",   /\b(bread|bun|roll|sourdough|baguette|ciabatta|brioche|croissant|muffin|pastry|focaccia|bagel|wrap|tortilla|pita)\b/],
  /* Vocabulary widened from the live catalogue on 14 Sep 2026 — everything here was
     sitting in Uncategorised on a real Cambridge order list. */
  ["Produce",  /\b(tomato|lettuce|cos|mesclun|roquette|rocket|onion|shallot|leek|potato|carrot|spinach|cucumber|capsicum|mushroom|avocado|lemon|lime|orange|apple|pear|banana|berry|grape|melon|honeydew|rockmelon|watermelon|peach|nectarine|plum|mango|pineapple|kiwi|herb|basil|parsley|coriander|mint|thyme|rosemary|dill|chive|garlic|ginger|chilli|broccoli|cauliflower|zucchini|eggplant|pumpkin|cabbage|wombok|celery|kale|asparagus|bean|pea|corn|radish|beetroot|parsnip|swede|turnip|sprout|salad|slaw|fruit|veg)\b/],
  ["Beverage", /\b(juice|soft drink|cola|lemonade|water|soda|kombucha|beer|wine|cider|syrup|cordial|tea|energy drink|tonic)\b/],
  ["Packaging",/\b(cup|lid|napkin|serviette|container|box|bag|tray|straw|cutlery|film|foil|takeaway|clamshell|paper towel)\b/],
  ["Cleaning", /\b(detergent|sanitis\w*|sanitiz\w*|degreas\w*|bleach|cleaner|chemical|glove|dishwash\w*|rinse aid|soap|scourer|bin liner)\b/],
  ["Dry Goods",/\b(flour|sugar|rice|pasta|oil|vinegar|salt|pepper|spice|sauce|stock|tin|canned|chickpea|lentil|noodle|honey|jam|mayonnaise|mustard|oat|cereal|nut|seed|olive|chip|fry|fries|wedge|hash brown|crouton|polenta|couscous|quinoa|syrup)\b/]
];
/* Matched against the SINGULARISED description, not the raw one. "Cherry Tomatoes" has to
   hit the same rule as "cherry tomato", and a rule list that spelled out every plural
   would rot the first time a supplier wrote "Tomatos". Word order is preserved here (it is
   not in nameKey) so multi-word rules like "rinse aid" and "paper towel" still match. */
function catText(desc){
  return " "+String(desc||"").toLowerCase().replace(/[^a-z0-9]+/g," ").split(/\s+/)
           .filter(Boolean).map(singular).join(" ")+" ";
}
function categorise(desc, fallback){
  const s=catText(desc);
  for(const [cat,re] of CATEGORY_RULES) if(re.test(s)) return cat;
  const f=String(fallback||"").trim();
  return f && f.toLowerCase()!=="food" ? f : "Uncategorised";
}

/* Product identity. An item code is authoritative when the supplier gives one; otherwise
   the normalised name plus the unit. ProductMerge rows from the sheet still win over
   everything, so a merge somebody made by hand is never undone by these rules. */
function prodKey(supplier,code,desc,unit){
  const hasCode=!!norm(code);
  const sk=norm(supplier);
  let id=hasCode?norm(code):nameKey(desc);
  const g=PMERGE[sk+"|"+norm(code)]||PMERGE[sk+"|"+norm(desc)]||PMERGE[sk+"|"+nameKey(desc)]||PMERGE[sk+"|"+id];
  const merged=!!g;
  if(merged) id="grp:"+norm(g);
  const unitPart=(hasCode||merged)?"":unitNorm(unit||"");
  return sk+"|"+id+"|"+unitPart;
}

/* COGS is an exclusion list: an unexpected category lands IN cost of goods and shows up,
   rather than vanishing from the number. */
const NON_COGS=new Set(["cleaning","equipment","repairs","maintenance","repairs & maintenance",
  "utilities","energy","overheads","admin","insurance","rent","subscriptions","freight",
  "waste","waste management","misc","other"]);
const supGroup=n=>{const c=CFG[norm(n)];return (c&&c.group)||"Ungrouped";};
const supActive=n=>{const c=CFG[norm(n)];return c?c.active:true;};
const rowGroup=r=>{const g=supGroup(r.supplier);return g!=="Ungrouped"?g:(r.category||"Ungrouped");};
const isCogs=r=>!NON_COGS.has(String(rowGroup(r)||"").trim().toLowerCase());

/* Per-supplier global settings, defaulted so the app works before anything is configured. */
function sset(name){
  const s=SSET[norm(name)]||{};
  return { rep_email:s.rep_email||"", visible:s.visible!==false, portal_only:!!s.portal_only,
           stores:(s.stores&&s.stores.length)?s.stores:STORE_NAMES.slice(),
           cc:s.cc||"", note:s.note||"" };
}
const canOrder=(name,storeName)=>sset(name).stores.indexOf(storeName)>=0;

/* ================= FETCH ================= */
/* gviz answers a missing tab with the FIRST sheet's data, HTTP 200, no error. The header
   signature is the only guard, and a tab with no signature declared gets none — so an
   undeclared name throws rather than quietly returning invoices. */
const TAB_COLUMNS={
  "Invoices":["invoice_number","invoice_date","total"],
  "InvoiceLines":["invoice_number","description","line_total"],
  "SupplierConfig":["supplier","merge_into"],
  "ProductMerge":["supplier","match","into"],
  "ManualPurchases":["date","shop","venue","amount"],
  "Orders":["order_id","supplier","venue","order_date"],
  "SupplierSettings":["supplier","rep_email"],
  "Favourites":["fav_id","fav_name","venue"],
  "FavouriteLines":["fav_id","item_key","qty"]
};
async function fetchTab(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const res=await fetch(url), txt=await res.text();
  if(!res.ok||/^\s*</.test(txt)||/"status"\s*:\s*"error"/.test(txt)) throw new Error("tab '"+name+"' not found or not shared");
  const rows=parseCsv(txt);
  if(!rows.length) return [];
  const cols=rows[0].map(c=>String(c||"").toLowerCase().trim());
  const need=TAB_COLUMNS[name];
  if(!need) throw new Error("fetchTab('"+name+"'): no column signature declared in TAB_COLUMNS");
  const missing=need.filter(c=>cols.indexOf(c)===-1);
  if(missing.length) throw new Error("tab '"+name+"' did not answer with its own columns (missing: "+missing.join(", ")+")");
  return rows.slice(1).map(r=>{const o={};cols.forEach((c,i)=>{o[c]=r[i]!==undefined?r[i]:null;});return o;});
}
async function fetchSalesDaily(){
  const q="select B, C, sum(H) group by B, C label B 'date', C 'venue', sum(H) 'sales'";
  const url=`https://docs.google.com/spreadsheets/d/${SALES_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=SalesFeed&tq=${encodeURIComponent(q)}`;
  const res=await fetch(url), txt=await res.text();
  if(!res.ok||/^\s*</.test(txt)||/"status"\s*:\s*"error"/.test(txt)) throw new Error("sales feed not readable");
  const rows=parseCsv(txt);
  if(rows.length<2) return [];
  return rows.slice(1).map(r=>({date:gvizDate(r[0]),venue:String(r[1]||"").trim(),sales:num_(r[2])}))
                      .filter(r=>r.date&&STORE_NAMES.indexOf(r.venue)>=0);
}
function parseCsv(text){
  const rows=[];let row=[],field="",inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=ch; }
    else{
      if(ch==='"') inQ=true;
      else if(ch===","){row.push(field);field="";}
      else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n")i++; row.push(field);field="";
        if(row.length>1||row[0]!=="") rows.push(row); row=[]; }
      else field+=ch;
    }
  }
  if(field!==""||row.length){row.push(field); if(row.length>1||row[0]!=="") rows.push(row);}
  return rows;
}

/* Buckets are per supplier and unit, so a fold can never reach across either. */
function applyFuzzyFold(){
  const buckets={};
  LINES.forEach(l=>{
    if(norm(l.code)) return;                        // coded items need no name matching
    const b=norm(l.supplier)+"|"+unitNorm(l.unit||"");
    const k=nameKey(l.desc);
    const m=(buckets[b]=buckets[b]||{});
    (m[k]=m[k]||{key:k,bucket:b,n:0,desc:l.desc}).n++;
  });
  const fold={};
  Object.values(buckets).forEach(m=>{
    const map=fuzzyFold(Object.values(m));
    Object.entries(map).forEach(([from,to])=>{ if(from!==to) fold[Object.values(m)[0].bucket+"|"+from]=to; });
  });
  LINES.forEach(l=>{
    if(norm(l.code)) return;
    const b=norm(l.supplier)+"|"+unitNorm(l.unit||"");
    const to=fold[b+"|"+nameKey(l.desc)];
    if(to) l.foldTo=to;
  });
}
function parseOrders(rows){
  const byId={};
  rows.forEach(r=>{
    const id=String(r.order_id||"").trim(); if(!id) return;
    const venue=String(r.venue||"").trim();
    if(STORE_NAMES.indexOf(venue)===-1) return;
    const d=gvizDate(r.order_date), logged=gvizDate(r.logged_at)||d;
    const prev=byId[id];
    const rec={id,action:String(r.action||"place").trim().toLowerCase(),supplier:String(r.supplier||"").trim(),
      venue,date:d,total:num_(r.total),subtotal:num_(r.subtotal),gst:num_(r.gst),
      channel:String(r.channel||"").trim(),by:String(r.placed_by||"").trim(),logged};
    if(!prev||(logged&&prev.logged&&logged>=prev.logged)||!prev.logged) byId[id]=Object.assign({},prev||{},rec);
  });
  return Object.values(byId).filter(o=>o.date&&o.supplier&&o.action!=="cancel");
}

/* ================= WEEK / REVENUE / COGS ================= */
const currentWeek=today=>{const s=addD(weekStart(today||new Date()),WEEK_OFF*7);
  const e=addD(s,6);e.setHours(23,59,59,999);return {start:s,end:e};};
const weekLabel=wk=>fmtD(wk.start)+" – "+fmtD(wk.end)+(WEEK_OFF===0?" (this week)":WEEK_OFF===-1?" (last week)":"");
function dailySales(rows,venue){
  const m={};
  (rows||[]).forEach(r=>{ if(!r.date||r.venue!==venue) return;
    const k=fmtISO(r.date); m[k]=(m[k]||0)+(r.sales||0); });
  return m;
}
/* A day with no feed rows is no data, not zero takings — a closed day would otherwise drag
   its weekday average down every week. */
function dowProfile(map,wkStart,weeks){
  const acc=Array.from({length:7},()=>({s:0,n:0}));
  for(let w=1;w<=weeks;w++) for(let d=0;d<7;d++){
    const v=map[fmtISO(addD(wkStart,-7*w+d))];
    if(v===undefined) continue;
    acc[d].s+=v; acc[d].n++;
  }
  return acc.map(a=>a.n?a.s/a.n:0);
}
function forecastWeek(map,wk,today,profile){
  const t=mid(today||new Date()); let actual=0,forecast=0; const days=[];
  for(let d=0;d<7;d++){
    const dt=addD(wk.start,d),iso=fmtISO(dt),a=map[iso]||0;
    const isToday=+dt===+t,past=+dt<+t;
    const used=past?a:(isToday?Math.max(a,profile[d]||0):(profile[d]||0));
    actual+=a; forecast+=used;
    days.push({iso,dow:d,actual:a,used,past,isToday,est:!past&&!(isToday&&a>=(profile[d]||0))});
  }
  return {actual,forecast,days};
}
/* Every supplier's invoices count toward spend, portal-only ones included — hiding a
   supplier from the ordering screen must never hide their money. */
function capturedSpend(inv,venue,wk){
  let cogs=0,all=0,n=0;
  (inv||[]).forEach(r=>{
    if(!r.date||r.date<wk.start||r.date>wk.end||r.venue!==venue) return;
    if(!supActive(r.supplier)) return;
    all+=r.total; n++;
    if(isCogs(r)) cogs+=r.total;
  });
  return {cogs,all,n};
}
/* A placed order holds a slot in the week's budget until its invoice lands. Same-day needs
   the amounts to agree, because dates carry no time and an order placed this afternoon
   must not be closed by a delivery that arrived this morning. One invoice settles one
   order, oldest first. */
function openOrders(orders,inv,venue,wk,today){
  const now=mid(today||new Date());
  const cands=(orders||[]).filter(o=>o.date&&o.date>=wk.start&&o.date<=wk.end&&o.venue===venue
    &&o.action!=="receive"&&(+now-+mid(o.date))/864e5<=MATCH_DAYS).sort((a,b)=>a.date-b.date);
  const pool=(inv||[]).filter(r=>r.date&&r.venue===venue).map(r=>({r,used:false}));
  const out=[];
  cands.forEach(o=>{
    const od=+mid(o.date),tol=Math.max(o.total*0.25,20);
    const hit=pool.find(p=>{
      if(p.used) return false;
      if(norm(p.r.supplier)!==norm(o.supplier)) return false;
      const gap=(+mid(p.r.date)-od)/864e5;
      if(gap<0||gap>MATCH_DAYS) return false;
      return gap>0||Math.abs(p.r.total-o.total)<=tol;
    });
    if(hit){hit.used=true;return;}
    out.push(o);
  });
  return out;
}
function gstRate(supplier){
  let sub=0,gst=0; const since=Date.now()-CAT_DAYS*864e5;
  INV.forEach(r=>{ if(norm(r.supplier)!==norm(supplier)||r.type==="manual") return;
    if(!r.date||+r.date<since||!(r.subtotal>0)) return; sub+=r.subtotal; gst+=r.gst; });
  if(!(sub>0)) return 0.1;
  const r=gst/sub;
  return r<0.005?0:Math.min(0.1,Math.round(r*1000)/1000);
}
function weekModel(today){
  const venue=STORE.name, wk=currentWeek(today), now=today||new Date();
  const map=dailySales(SALES,venue);
  const profile=dowProfile(map,wk.start,DOW_WEEKS);
  const sales=forecastWeek(map,wk,now,profile);
  const cap=capturedSpend(INV,venue,wk);
  const open=openOrders(ORDERS.concat(LOCAL_ORDERS),INV,venue,wk,now);
  const committed=open.reduce((s,o)=>s+o.total,0);
  const drafted=allDraftTotal();
  const budget=sales.forecast*TARGET_COGS_PCT/100;
  const used=cap.cogs+committed+drafted;
  return {wk,venue,sales,cap,open,committed,drafted,used,budget,remaining:budget-used,
    cogsActual: sales.actual>0?cap.cogs/sales.actual*100:0,
    cogsProjected: sales.forecast>0?used/sales.forecast*100:0};
}

/* ================= CATALOGUE ================= */
/* There is no master product list in the platform. What you buy is the catalogue, derived
   from the invoice lines, so it needs no upkeep and prices follow the invoices. Charges
   are not stock and are stripped. */
function deriveCatalogue(lines,supplier,venue,now,opts){
  opts=opts||{};
  const listDays=opts.listDays||CAT_DAYS, rateDays=opts.rateDays||RATE_DAYS;
  const FEE=/deliver|freight|fuel|levy|surcharge|cdl|container\s*deposit|rounding|admin\s*fee/i;
  const t=+(now||new Date()),listFrom=t-listDays*864e5,rateFrom=t-rateDays*864e5;
  const map={};
  (lines||[]).forEach(l=>{
    if(supplier&&l.supplier!==supplier) return;
    if(venue&&l.venue!==venue) return;
    if(!(l.price>0)||!(l.qty>0)||!l.date) return;
    if(FEE.test(l.desc)) return;
    if(+l.date<listFrom) return;
    const k=l.key||prodKey(l.supplier,l.code,l.desc,l.unit);
    const p=map[k]||(map[k]={key:k,supplier:l.supplier,code:l.code,desc:l.desc,unit:l.unit,
                             cat:l.cat||categorise(l.desc,l.invCategory),buys:[]});
    p.desc=l.desc; p.unit=l.unit; p.buys.push(l);
  });
  return Object.values(map).map(p=>{
    p.buys.sort((a,b)=>a.date-b.date);
    const recent=p.buys.filter(b=>+b.date>=rateFrom), base=recent.length?recent:p.buys;
    const qty=base.reduce((s,b)=>s+b.qty,0);
    const orders=new Set(base.map(b=>norm(b.number))).size||1;
    const span=Math.max(7,(+base[base.length-1].date-+base[0].date)/864e5+1);
    p.last=p.buys[p.buys.length-1];
    p.price=p.last.price; p.lastQty=p.last.qty; p.lastDate=p.last.date;
    p.avgPerOrder=qty/orders; p.avgQtyWk=qty/(span/7); p.ordersPerWk=orders/(span/7);
    p.daysSince=Math.round((t-+p.last.date)/864e5);
    p.stale=+p.last.date<rateFrom;
    p.suggested=Math.max(1,Math.round(p.avgPerOrder));
    p.prevPrice=null;
    for(let i=p.buys.length-2;i>=0;i--){ if(p.buys[i].price!==p.price){p.prevPrice=p.buys[i].price;break;} }
    p.change=p.prevPrice?(p.price-p.prevPrice)/p.prevPrice*100:null;
    p.variants=[...new Set(p.buys.map(b=>b.desc))];
    return p;
  });
}
/* Suppliers for the ordering screen: stock only, visible, allowed for this store, and —
   unless the toggle says otherwise — not portal-only. */
function supplierList(venue,now){
  const t=+(now||new Date()),from=t-CAT_DAYS*864e5,m={};
  INV.forEach(r=>{
    if(r.type==="manual"||!r.date||+r.date<from||r.venue!==venue) return;
    if(!supActive(r.supplier)) return;
    const s=m[r.supplier]||(m[r.supplier]={name:r.supplier,spend:0,cogs:0,n:0,last:null});
    s.spend+=r.total; s.n++; if(isCogs(r)) s.cogs+=r.total;
    if(!s.last||r.date>s.last) s.last=r.date;
  });
  const wks=CAT_DAYS/7;
  return Object.values(m).map(s=>{
    const cfg=sset(s.name);
    s.group=supGroup(s.name); s.avgWk=s.spend/wks;
    s.daysSince=Math.round((t-+s.last)/864e5);
    s.lines=LINES.some(l=>l.supplier===s.name&&l.venue===venue);
    s.stock=s.cogs>s.spend*0.5;
    s.visible=cfg.visible; s.portal=cfg.portal_only; s.rep=cfg.rep_email;
    s.allowed=canOrder(s.name,venue);
    s.orderable=s.stock&&s.visible&&s.allowed;
    return s;
  }).sort((a,b)=>b.avgWk-a.avgWk);
}
function orderableSuppliers(venue){
  return supplierList(venue).filter(s=>s.orderable&&(!HIDE_PORTAL||!s.portal));
}
/* A configured rep address wins. Otherwise the address seen most on that supplier's own
   invoice emails, with no-reply relays heavily discounted — invoices arrive through Xero
   and NetSuite robots that nobody reads. */
function supplierEmail(name){
  const cfg=sset(name);
  if(cfg.rep_email) return cfg.rep_email;
  const tally={};
  INV.filter(r=>r.supplier===name).forEach(r=>{
    (String(r.src||"").match(/[\w.+-]+@[\w.-]+\.\w+/g)||[]).forEach(e=>{
      e=e.toLowerCase();
      if(/redsquarecafe|beckitt|bgfitness|lumakitchen/.test(e)) return;
      const w=/sent-via|noreply|no-reply|donotreply|notifications?@|mailer|bounce/.test(e)?1:10;
      tally[e]=(tally[e]||0)+w;
    });
  });
  const best=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  return best?best[0]:"";
}

/* ================= DRAFTS ================= */
const DRAFT_KEY="ob2_drafts";
function loadDrafts(){ try{DRAFTS=JSON.parse(localStorage.getItem(DRAFT_KEY)||"{}")||{};}catch(e){DRAFTS={};} }
function saveDrafts(){ try{localStorage.setItem(DRAFT_KEY,JSON.stringify(DRAFTS));}catch(e){} }
const draftId=(supplier,venue)=>venue+"::"+supplier;
function draft(supplier,venue){
  const id=draftId(supplier,venue||STORE.name);
  return DRAFTS[id]||(DRAFTS[id]={supplier,venue:venue||STORE.name,qty:{},note:""});
}
function setQty(supplier,key,n,venue){
  const d=draft(supplier,venue);
  n=Math.max(0,Math.round(Number(n)||0));
  if(n) d.qty[key]=n; else delete d.qty[key];
  saveDrafts();
}
function draftLines(supplier,venue){
  venue=venue||STORE.name;
  const d=DRAFTS[draftId(supplier,venue)]; if(!d) return [];
  const by={}; deriveCatalogue(LINES,supplier,venue,new Date()).forEach(p=>by[p.key]=p);
  return Object.keys(d.qty).map(k=>{
    const p=by[k]; if(!p) return null;
    const qty=d.qty[k];
    return {key:k,code:p.code,desc:p.desc,unit:p.unit,qty,price:p.price,total:qty*p.price,cat:p.cat};
  }).filter(Boolean);
}
function orderTotals(supplier,venue){
  const lines=draftLines(supplier,venue),rate=gstRate(supplier);
  const sub=lines.reduce((s,l)=>s+l.total,0);
  return {lines,sub,gst:sub*rate,total:sub+sub*rate,rate};
}
/* Every open draft for the active store counts against the countdown, not just the one on
   screen — otherwise the number lies the moment a second order is started. */
function allDraftTotal(){
  let t=0;
  Object.values(DRAFTS).forEach(d=>{ if(!d||d.venue!==STORE.name) return;
    t+=orderTotals(d.supplier,d.venue).total; });
  return t;
}

function summaryBar(m){

/* ================= ROUTER ================= */
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==="admin") return renderAdmin();
  if(h==="favs") return renderFavs();
  if(h==="reports") return renderReports();
  if(h.startsWith("rep::")) return renderSupplierDrill(h.slice(5));
  if(h.startsWith("grp::")) return renderGroupDrill(h.slice(5));
  if(h.startsWith("s::")){ SUPPLIER=h.slice(3); return renderBuilder(); }
  SUPPLIER=""; renderHome();
}

function sortCat(rows){
  const dir=SORT.dir;
  const by={ name:(a,b)=>a.desc.localeCompare(b.desc),
             price:(a,b)=>a.price-b.price,
             last:(a,b)=>(+a.lastDate)-(+b.lastDate),
             qty:(a,b)=>a.lastQty-b.lastQty,
             cat:(a,b)=>a.cat.localeCompare(b.cat)||a.desc.localeCompare(b.desc),
             freq:(a,b)=>a.ordersPerWk-b.ordersPerWk };
  return rows.slice().sort((a,b)=>dir*(by[SORT.col]||by.name)(a,b));
}
function sortHead(col,label,cls){
  const on=SORT.col===col;
  return `<th class="s ${cls||""} ${on?"act":""}" onclick="setSort('${col}')">${label}${on?(SORT.dir>0?" ▲":" ▼"):""}</th>`;
}

/* ================= ORDER HISTORY MODAL ================= */
function history_(key){
  const p=deriveCatalogue(LINES,SUPPLIER,STORE.name,new Date()).find(x=>x.key===key);
  if(!p) return;
  const buys=p.buys.slice().reverse();
  const prices=p.buys.map(b=>b.price);
  const lo=Math.min(...prices), hi=Math.max(...prices), first=p.buys[0];
  const move=first.price?((p.price-first.price)/first.price*100):0;
  modal(`<div class="label">${esc(p.desc)}</div>
    <div style="font-size:13px;margin-bottom:10px">
      ${esc(p.cat)} · ${esc(p.unit||"")} ${p.code?"· "+esc(p.code):""}<br>
      Now ${money(p.price)} · range ${money(lo)}–${money(hi)} ·
      <span class="${move>0?"up":move<0?"down":""}">${move>0?"+":""}${Math.round(move*10)/10}% since ${fmtD(first.date)}</span><br>
      Bought ${p.buys.length} time(s), about ${Math.round(p.ordersPerWk*10)/10}× a week, ${Math.round(p.avgPerOrder*10)/10} per order.
      ${p.variants.length>1?`<br><span style="color:var(--dim)">Merged names: ${esc(p.variants.join(" / "))}</span>`:""}
    </div>
    <table><thead><tr><th>Date</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Line</th><th class="hide-sm">Invoice</th></tr></thead>
    <tbody>${buys.map((b,i)=>{
      const prev=buys[i+1];
      const ch=prev&&prev.price!==b.price?((b.price-prev.price)/prev.price*100):null;
      return `<tr><td>${fmtD(b.date)}</td><td class="num">${b.qty}</td>
        <td class="num">${money(b.price)}${ch!=null?` <span class="${ch>0?"up":"down"}" style="font-size:11px">${ch>0?"+":""}${Math.round(ch*10)/10}%</span>`:""}</td>
        <td class="num">${money(b.total)}</td><td class="hide-sm" style="font-family:var(--mono);font-size:11px">${esc(b.number)}</td></tr>`;
    }).join("")}</tbody></table>
    <div style="margin-top:12px"><a class="btn" onclick="closeModal()">Close</a></div>`);
}

/* Takes the lines explicitly: the prompt after a placed order runs once the draft has
   already been cleared, so reading the draft here would save an empty favourite. */
async function saveFav(name,lines,supplier,venue){
  if(!name||!lines||!lines.length) return;
  const fav={fav_id:"f"+Date.now().toString(36),fav_name:name,venue,supplier,
    lines:lines.map((l,i)=>({line_no:i+1,item_key:l.key,description:l.desc,unit:l.unit,qty:l.qty,supplier}))};
  closeModal();
  try{
    await post(Object.assign({action:"favourite"},fav));
    FAVS.push({id:fav.fav_id,name,venue,supplier,by:identity().user||"",
      lines:fav.lines.map(l=>({key:l.item_key,desc:l.description,unit:l.unit,qty:l.qty,supplier}))});
    toast("Favourite saved.");
  }catch(e){
    if(e.message==="no-webapp") toast("Can't save favourites until WEBAPP_URL is set.");
    else alert(e.message);
  }
  route();
}
/* Recalling fills the cart as an ordinary editable draft — a template, never a placed order. */
function recallFav(id){
  const f=FAVS.find(x=>x.id===id); if(!f) return;
  const sup=f.supplier||SUPPLIER;
  const known={}; deriveCatalogue(LINES,sup,f.venue,new Date()).forEach(p=>known[p.key]=p);
  let miss=0;
  f.lines.forEach(l=>{ if(known[l.key]) setQty(sup,l.key,l.qty,f.venue); else miss++; });
  SUPPLIER=sup; location.hash="s::"+encodeURIComponent(sup);
  route();
  toast(miss?`Loaded "${f.name}" — ${miss} item(s) no longer in the catalogue were skipped.`:`Loaded "${f.name}".`);
}

        <td class="num"><a class="chip sm" onclick="recallFav('${esc(f.id)}')">Load</a>
          <a class="chip sm" onclick="deleteFav('${esc(f.id)}')">Delete</a></td></tr>`).join("")}</tbody></table>
      ${mine.length?"":'<div class="note">No favourites saved for this store yet. Build an order and choose <b>Save as favourite</b>.</div>'}

async function deleteFav(id){
  const f=FAVS.find(x=>x.id===id); if(!f) return;
  if(!confirm(`Delete favourite "${f.name}"?`)) return;
  try{ await post({action:"favourite_delete",fav_id:id}); }

  FAVS=FAVS.filter(x=>x.id!==id); route();

/* ================= REPORTS ================= */
function reportRange(){ const wk=currentWeek(); return {start:addD(wk.start,-7*7),end:wk.end,label:"8 weeks to "+fmtD(wk.end)}; }
function spendRows(venue,range){
  const bySup={},byGrp={};
  INV.forEach(r=>{
    if(r.venue!==venue||!r.date||r.date<range.start||r.date>range.end) return;
    if(!supActive(r.supplier)) return;
    const g=rowGroup(r);
    (bySup[r.supplier]=bySup[r.supplier]||{name:r.supplier,spend:0,n:0,cogs:isCogs(r),group:g}).spend+=r.total;
    bySup[r.supplier].n++;
    (byGrp[g]=byGrp[g]||{name:g,spend:0,n:0,cogs:isCogs(r)}).spend+=r.total; byGrp[g].n++;
  });
  return {sup:Object.values(bySup).sort((a,b)=>b.spend-a.spend),
          grp:Object.values(byGrp).sort((a,b)=>b.spend-a.spend)};
}

          <td class="num">${money(s.spend)}</td><td class="num hide-sm">${s.n}</td>
          <td class="num">${totalAll?pct1(s.spend/totalAll*100):""}</td></tr>`).join("")}</tbody></table>
        <div class="note">Every supplier counts here, portal-only ones included. Click through for the invoices.</div>
      </div>
      <div class="card"><div class="label">Spend by group — ${esc(range.label)}</div>
        <table><thead><tr><th>Group</th><th class="num">Spend</th><th class="num hide-sm">Invoices</th><th class="num">%</th></tr></thead>
        <tbody>${d.grp.map(g=>`<tr class="click" onclick="go('grp::${encodeURIComponent(g.name)}')">
          <td><b>${esc(g.name)}</b>${g.cogs?"":' <span class="pill">not COGS</span>'}</td>

        <div class="note">COGS total ${money(totalCogs)} of ${money(totalAll)} all spend.</div>
      </div>
    </div>`;

  document.getElementById("app").innerHTML=`${summaryBar(m)}
    <a class="back" onclick="go('reports')">Reports</a>
    <div class="card"><div class="label">${esc(name)} — ${esc(range.label)} · ${esc(STORE.short)}</div>
      <div style="font-size:20px;font-weight:700;font-family:var(--mono);margin-bottom:10px">${money(tot)}</div>
      <table><thead><tr><th>Date</th><th class="hide-sm">Invoice</th><th>Group</th><th class="num">Total</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${fmtD(r.date)}</td>
        <td class="hide-sm" style="font-family:var(--mono);font-size:11px">${esc(r.number)}</td>
        <td><span class="pill">${esc(rowGroup(r))}</span></td><td class="num">${money(r.total)}</td></tr>`).join("")}</tbody></table>
    </div>`;
}
function renderGroupDrill(group){
  const m=weekModel(), range=reportRange();
  const bySup={};
  INV.forEach(r=>{ if(r.venue!==STORE.name||rowGroup(r)!==group||r.date<range.start||r.date>range.end) return;
    (bySup[r.supplier]=bySup[r.supplier]||{name:r.supplier,spend:0,n:0}).spend+=r.total; bySup[r.supplier].n++; });
  const rows=Object.values(bySup).sort((a,b)=>b.spend-a.spend);
  const tot=rows.reduce((s,r)=>s+r.spend,0);
  document.getElementById("app").innerHTML=`${summaryBar(m)}
    <a class="back" onclick="go('reports')">Reports</a>
    <div class="card"><div class="label">${esc(group)} — ${esc(range.label)} · ${esc(STORE.short)}</div>
      <div style="font-size:20px;font-weight:700;font-family:var(--mono);margin-bottom:10px">${money(tot)}</div>
      <table><thead><tr><th>Supplier</th><th class="num">Spend</th><th class="num">Invoices</th></tr></thead>
      <tbody>${rows.map(s=>`<tr class="click" onclick="go('rep::${encodeURIComponent(s.name)}')">
        <td><b>${esc(s.name)}</b></td><td class="num">${money(s.spend)}</td><td class="num">${s.n}</td></tr>`).join("")}</tbody></table>
    </div>`;
}

/* ================= ADMIN ================= */
function renderAdmin(){
  const all=supplierList(STORE.name).concat(
    supplierList(STORES.find(s=>s.key!==STORE.key).name).filter(s=>!supplierList(STORE.name).some(x=>x.name===s.name)));
  const seen={}, list=all.filter(s=>seen[s.name]?false:(seen[s.name]=true));
  document.getElementById("app").innerHTML=`
    <a class="back" onclick="go('')">All suppliers</a>
    <div class="card"><div class="label">Supplier settings — saved for everyone</div>
      <table><thead><tr><th>Supplier</th><th>Rep email</th><th class="num">Cambridge</th><th class="num">Luma</th>
        <th class="num">Visible</th><th class="num">Portal only</th></tr></thead>
      <tbody>${list.map(s=>{const c=sset(s.name);return `<tr>
        <td><b>${esc(s.name)}</b>${s.stock?"":' <span class="pill">not stock</span>'}</td>
        <td><input type="email" value="${esc(c.rep_email)}" placeholder="${esc(supplierEmail(s.name)||"none known")}"
             style="width:100%;font-size:12px;padding:6px 8px" onchange="saveSupplier('${esc(s.name)}','rep_email',this.value)"></td>
        <td class="num"><input type="checkbox" ${c.stores.indexOf("Red Square Cambridge")>=0?"checked":""} onchange="toggleStore('${esc(s.name)}','Red Square Cambridge',this.checked)"></td>
        <td class="num"><input type="checkbox" ${c.stores.indexOf("Luma Kitchen")>=0?"checked":""} onchange="toggleStore('${esc(s.name)}','Luma Kitchen',this.checked)"></td>
        <td class="num"><input type="checkbox" ${c.visible?"checked":""} onchange="saveSupplier('${esc(s.name)}','visible',this.checked?'yes':'no')"></td>
        <td class="num"><input type="checkbox" ${c.portal_only?"checked":""} onchange="saveSupplier('${esc(s.name)}','portal_only',this.checked?'yes':'no')"></td>
      </tr>`;}).join("")}</tbody></table>
      <div class="note">
        <b>Rep email</b> is the person you order from, which is rarely the address invoices arrive from — the
        greyed-out placeholder shows what the invoices suggest, and it is often a no-reply robot. Set it before
        anyone emails an order.<br>
        <b>Portal only</b> keeps a supplier off the ordering list while their invoices still count toward spend
        and COGS.<br>
        <b>Visible</b> hides a supplier from ordering entirely.<br>
        ${WEBAPP_URL?"Changes save to the sheet immediately and apply to everyone.":"<b>WEBAPP_URL isn't set</b>, so changes here can't be saved yet."}
      </div>
    </div>`;
}
async function saveSupplier(name,field,value){
  const cur=sset(name), k=norm(name);
  SSET[k]=Object.assign({},cur,{[field]: field==="visible"?value!=="no":field==="portal_only"?value==="yes":value});
  try{ await post({action:"supplier_setting",supplier:name,field,value}); toast("Saved."); }
  catch(e){ if(e.message==="no-webapp") toast("Not saved — WEBAPP_URL isn't set."); else alert(e.message); }
}
async function toggleStore(name,store,on){
  const cur=sset(name);
  const stores=on?[...new Set(cur.stores.concat(store))]:cur.stores.filter(s=>s!==store);
  SSET[norm(name)]=Object.assign({},cur,{stores});
  try{ await post({action:"supplier_setting",supplier:name,field:"stores",value:stores.join(", ")}); toast("Saved."); }
  catch(e){ if(e.message==="no-webapp") toast("Not saved — WEBAPP_URL isn't set."); else alert(e.message); }
}

/* ================= DISPATCH ================= */
function orderText(supplier,venue,opts){
  opts=opts||{};
  const t=orderTotals(supplier,venue), st=storeByName(venue);
  const lines=t.lines.map(l=>`- ${l.qty} x ${l.unit||"ea"}  ${l.desc}${l.code?" ["+l.code+"]":""}`+(opts.prices?`   ${money(l.price)} ea`:""));
  const head=[`Order — ${venue}`,`Date: ${fmtD(new Date())}`,`Deliver to: ${st.addr}`];
  const tail=opts.prices?["",`Estimated ${money(t.sub)} + ${money(t.gst)} GST = ${money(t.total)}`]:[];
  return head.join("\n")+"\n\n"+lines.join("\n")+tail.join("\n");
}
function orderEmailBody(supplier,venue){
  return `Hi,\n\nCould we please order the following for ${venue}:\n\n`
    + orderText(supplier,venue,{prices:false}).split("\n\n").slice(1).join("\n\n")
    + `\n\nPlease confirm availability and delivery day.\n\nThanks,\n${identity().user||"Red Square"}\n`
    + COMPANY_BLOCK.join("\n");
}
function dispatch(how){
  const venue=STORE.name, t=orderTotals(SUPPLIER,venue);
  if(!t.lines.length){ alert("Nothing in this order yet."); return; }
  if(how==="copy") return copyText(orderText(SUPPLIER,venue,{prices:false}));
  const to=(document.getElementById("repmail")||{}).value||supplierEmail(SUPPLIER);
  if(!to){ alert("No rep email for this supplier. Add one in Admin, or use Copy."); return; }
  const ccOn=(document.getElementById("cckitchen")||{}).checked;
  const cc=ccOn?(sset(SUPPLIER).cc||ACCOUNTS_EMAIL):"";
  const q=`subject=${encodeURIComponent(`Order — ${venue} — ${fmtD(new Date())}`)}&body=${encodeURIComponent(orderEmailBody(SUPPLIER,venue))}`;
  location.href=`mailto:${encodeURIComponent(to)}?${cc?`cc=${encodeURIComponent(cc)}&`:""}${q}`;
}
function copyText(txt){
  const done=()=>toast("Copied — paste it into the portal or message.");
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>showCopyBox(txt));
  else showCopyBox(txt);
}
function showCopyBox(txt){
  modal(`<div class="label">Copy this order</div><textarea id="cpbox">${esc(txt)}</textarea>
    <div style="margin-top:10px"><a class="btn" onclick="closeModal()">Done</a></div>`);
  const el=document.getElementById("cpbox"); if(el){el.focus();el.select();}
}
function toast(msg){
  const el=document.createElement("div"); el.textContent=msg;
  el.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;z-index:50";
  document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
}
function modal(html){
  closeModal();
  const w=document.createElement("div"); w.className="modal"; w.id="obmodal";
  w.innerHTML=`<div class="box">${html}</div>`;
  w.addEventListener("click",e=>{if(e.target===w) closeModal();});
  document.body.appendChild(w);
}
function closeModal(){ const m=document.getElementById("obmodal"); if(m) m.remove(); }

/* ================= WRITE PATH ================= */
function identity(){ try{return JSON.parse(localStorage.getItem("ob_identity")||"{}")||{};}catch(e){return {};} }
function askIdentity(){
  const id=identity();
  if(id.user&&id.pin) return Promise.resolve(id);
  return new Promise(res=>{
    modal(`<div class="label">Who's using this?</div>
      <div style="display:grid;gap:8px">
        <input type="text" id="obname" placeholder="Your name" value="${esc(id.user||"")}">
        <input type="text" id="obpin" placeholder="Shared PIN" value="${esc(id.pin||"")}">
        <a class="btn" id="obok">Save</a></div>
      <div class="note">Your name goes on the order record. The PIN is shared and is a working record, not
        security — this page is public.</div>`);
    document.getElementById("obok").onclick=()=>{
      const user=document.getElementById("obname").value.trim(), pin=document.getElementById("obpin").value.trim();
      if(!user||!pin) return;
      try{localStorage.setItem("ob_identity",JSON.stringify({user,pin}));}catch(e){}
      closeModal(); res({user,pin});
    };
  });
}
async function post(payload){
  if(!WEBAPP_URL) throw new Error("no-webapp");
  const id=await askIdentity();
  let res;
  /* A string body sends as text/plain: a simple request with no CORS preflight, which an
     Apps Script web app cannot answer. */
  try{ res=await fetch(WEBAPP_URL,{method:"POST",body:JSON.stringify(Object.assign({pin:id.pin,user:id.user},payload)),redirect:"follow"}); }
  catch(e){ throw new Error("Couldn't reach the save endpoint. In Apps Script check Deploy → Manage deployments: access must be Anyone, and the /exec URL current. Nothing was saved."); }
  const txt=await res.text();
  let j; try{ j=JSON.parse(txt); }catch(e){ throw new Error("Unexpected reply from the web app (not JSON). Is the deployment set to 'Anyone'?"); }
  if(!j.ok) throw new Error(j.error||"save failed");
  return j;
}
function buildPayload(action){
  const venue=STORE.name, t=orderTotals(SUPPLIER,venue);
  return {order_id:"o"+Date.now().toString(36),action,supplier:SUPPLIER,venue,
    order_date:fmtISO(new Date()),subtotal:t.sub,gst:t.gst,total:t.total,
    channel:sset(SUPPLIER).portal_only?"portal":"email",
    lines:t.lines.map((l,i)=>({line_no:i+1,item_code:l.code,description:l.desc,unit:l.unit,
                               qty:l.qty,unit_price:l.price,line_total:l.total}))};
}
const localRecord=o=>({id:o.order_id,action:"place",supplier:o.supplier,venue:o.venue,date:mid(new Date()),
  total:o.total,subtotal:o.subtotal,gst:o.gst,channel:o.channel,by:identity().user||"",logged:new Date()});
async function markPlaced(){
  const venue=STORE.name, t=orderTotals(SUPPLIER,venue);
  if(!t.lines.length){ alert("Nothing in this order yet."); return; }
  const order=buildPayload("place"), local=localRecord(order);
  const placedLines=t.lines, placedSupplier=SUPPLIER;
  const finish=msg=>{ LOCAL_ORDERS.push(local); DRAFTS[draftId(SUPPLIER,venue)]={supplier:SUPPLIER,venue,qty:{},note:""};
                      saveDrafts(); toast(msg); offerFav(placedLines,placedSupplier,venue); };
  try{ await post(order); finish("Order logged."); }
  catch(e){ if(e.message==="no-webapp") finish("Logged in this browser only — WEBAPP_URL isn't set.");
            else alert(e.message); }
}
/* Asked after the order is safely logged, never before — a prompt that blocks the order is
   a prompt people learn to dismiss. */
function offerFav(lines,supplier,venue){
  modal(`<div class="label">Save this as a favourite?</div>
    <div style="font-size:13px;margin-bottom:8px">Give it a name and it can be reloaded as an editable order.</div>
    <input type="text" id="favname" placeholder="e.g. Monday Produce Run" style="width:100%">
    <div style="display:flex;gap:8px;margin-top:12px">
      <a class="btn" id="favok">Save favourite</a><a class="btn outline" onclick="closeModal();go('')">No thanks</a></div>`);
  document.getElementById("favok").onclick=()=>{
    const n=document.getElementById("favname").value.trim(); if(!n) return;
    saveFav(n,lines,supplier,venue);
  };
}
window.addEventListener("hashchange",route);
if(!window.__OB_NO_AUTOLOAD) loadAll();
</script>
