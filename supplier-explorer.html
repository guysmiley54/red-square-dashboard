<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier Explorer</title>
<style>
  :root {
    --ink:#111; --paper:#f7f6f3; --line:#ddd; --red:#c8102e; --dim:#777;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink)}
  header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  header .sq{width:13px;height:13px;background:var(--red)}
  header h1{font-size:16px;font-weight:700;white-space:nowrap}
  header .crumb{font-size:12px;color:#aaa;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header button, header a.hbtn{margin-left:auto;background:none;border:1px solid #555;color:#fff;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;text-decoration:none}
  header a.hbtn{margin-left:0}
  #filters{background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:49px;z-index:4}
  .chip{border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px;cursor:pointer;background:#fff;font-weight:600}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  #filters input[type=date]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;font-family:var(--mono)}
  #filters .clear{font-size:12px;color:var(--red);cursor:pointer;text-decoration:underline}
  main{max-width:860px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .label{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:7px 8px;border-bottom:1px solid #f0efec;vertical-align:top}
  tr.click{cursor:pointer}
  tr.click:hover{background:#faf9f6}
  .num{text-align:right;font-family:var(--mono);white-space:nowrap}
  .up{color:var(--red);font-weight:600}
  .down{color:#1a7f37;font-weight:600}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
  .pill.credit{background:var(--ink);color:#fff}
  .pill.check{background:var(--red);color:#fff}
  .pill.vol{background:#eee;color:#555}
  input[type=search]{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;background:#fff}
  .back{display:inline-block;margin-bottom:10px;font-size:14px;color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer}
  .back:before{content:"← "}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat .v{font-size:20px;font-weight:700;font-family:var(--mono)}
  .stat .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  #status{padding:40px 0;text-align:center;color:var(--dim);font-size:14px}
  .err{border:1px solid var(--red);color:var(--red);border-radius:10px;padding:12px;font-size:14px;background:#fff}
  .btn{display:inline-block;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
  .btn.outline{background:#fff;color:var(--ink);border:2px solid var(--ink)}
  svg text{font-family:var(--mono);font-size:10px;fill:var(--dim)}
  @media (max-width:600px){ .hide-sm{display:none} td,th{padding:6px 5px} #filters{top:auto;position:static} }
  @media print { header,#filters,.back,.btn{display:none!important} body{background:#fff} .card{border:none;padding:0} }
</style>

<body>
<header>
  <a onclick="go('')" style="display:flex;align-items:center;gap:10px;cursor:pointer;color:#fff;text-decoration:none"><div class="sq"></div><h1>Supplier Explorer</h1><span style="font-size:9px;color:#666;margin-left:6px">build-053328</span></a>

  <a class="hbtn" id="aibtn" onclick="analyseScreen()" style="cursor:pointer">✨ Analyse</a>
</header>
<div id="filters"></div>
<main id="app"><div id="status">Loading data…</div></main>

<script>
/* ================= CONFIG ================= */
const BUILD_ID = "build-053328"; console.log("Supplier Explorer " + BUILD_ID);
const SHEET_ID = "1bICxitr-CyU7VF8TLKIZgw7gV2WTKur9AptfmskQNK4"; // BG Ops Data
const SIGNOFF = "Cheers,\nAdrian";

/* ================= DATA & FILTER STATE ================= */
let INV = [], LINES = [], byNumber = {}, CFG = {}, VENUE_LIST = [], SALES = [], INV_MIN_DATE = null, STAFF = [], SMAP = {};
// Staff-entry supplier names -> canonical pipeline names. Editable via a StaffSupplierMap tab.
const STAFF_MAP_DEFAULT = {
  "pfd":"PFD Food Services Pty Ltd","one pac":"Onepac | Tas-Isle Trading","onepac":"Onepac | Tas-Isle Trading",
  "doppio":"Doppio Foods Pty Ltd","southern foodservice":"Southern Foodservice Pty Ltd","southern cookies":"Southern Cookies",
  "manna bakehouse":"Manna Bakehouse","manna":"Manna Bakehouse","cripps":"Cripps Nubake Pty Ltd","nichols poultry":"Nichols Poultry P/L",
  "scottsdale pork":"Scottsdale Pork","freshline":"Freshline Tasmania","bidfood":"Bidfood Hobart","savour foods":"Savour Foods",
  "juicy isle":"Juicy Isle Pty Ltd","schweppes":"Asahi Beverages Pty Ltd","bega dairy":"Bega Dairy","alm":"ALM",
  "bdd":"BDD Australia Pty Ltd","fresh cut":"Fresh Cut (TAS) Pty Ltd"
};
let FILTER = { venues: [], from: "", to: "", presetKind: "", presetOffset: 0 };
let SELECTED = {}, SEL_SUPPLIER = "", CURR_PRODS = [];

const UNIT_ALIAS={each:"ea",ea:"ea",unit:"ea",units:"ea",pack:"ea",pk:"ea","6pack":"ea",carton:"ctn",cartons:"ctn",ctn:"ctn",ct:"ctn",cs:"ctn",case:"ctn",box:"box",bx:"box",pkt:"pkt",packet:"pkt",pk:"pkt",sleeve:"slv",slv:"slv",bottle:"btl",btl:"btl",kg:"kg",g:"g",l:"l",ltr:"l",litre:"l",tray:"tray",bag:"bag",tub:"tub",doz:"doz",dozen:"doz"};
function unitNorm(u){ const n=norm(u); return UNIT_ALIAS[n]||n; }
let PMERGE={}, VDIFF={};
// Codeless identity is the description, so cosmetic tails must not split a product.
// Strip trailing pack-count / unit noise that hand-keyed lines pick up, e.g.
//   "... 5KG EACH (2)"  "... X2"  "... (2)"  "... PACK OF 6"  → same base as "... 5KG".
// Only touches the codeless path; coded lines already key on the SKU alone.
function descNorm(desc){
  let s=String(desc||"").toLowerCase().trim();
  // Only strip a tail that is UNAMBIGUOUSLY a keying artefact, never a real size/pack.
  // 1) a trailing "each"/"ea" optionally followed by a bracketed or x-prefixed count:
  //      "... 5kg each (2)"  "... 5kg each"  "... 5kg ea x2"  -> "... 5kg"
  //    (a bare trailing number like "widget 500" or a size like "375ml x24" is untouched,
  //     because the "each"/"ea" word must be present for the strip to fire.)
  s=s.replace(/\s+(?:each|ea)\b\s*(?:x\s*\d+|\(?\s*\d+\s*\)?)?\s*$/,"");
  // 2) a trailing "(N)" that sits directly after the word we just may have removed, or
  //    after a run that already ended in a unit — a lone bracketed count, never a size:
  s=s.replace(/\s*\(\s*\d+\s*\)\s*$/,"");
  return norm(s)||norm(desc); // never return empty — fall back to the full description
}
function prodKey(supplier,code,desc,unit){
  // Base identity: item code if present, else the (noise-stripped) description.
  const hasCode=!!norm(code);
  let id=hasCode?norm(code):descNorm(desc);
  // Merge map (ProductMerge tab) folds variant identities into a single group id.
  const sk=norm(supplier);
  const g = PMERGE[sk+"|"+norm(code)] || PMERGE[sk+"|"+norm(desc)] || PMERGE[sk+"|"+descNorm(desc)] || PMERGE[sk+"|"+id];
  const merged=!!g;
  if(merged) id="grp:"+norm(g);
  // Unit is kept in the key ONLY for un-merged, code-less items, so that genuinely
  // different sell units stay apart automatically (e.g. "Tomatoes kg" vs "Tomatoes ea").
  // It is dropped when:
  //   - the line has an item code (the SKU already identifies the product), OR
  //   - a ProductMerge row explicitly groups these lines. A manual merge is you saying
  //     "these ARE the same product" - so it must override a unit difference too, which
  //     is the whole point of merging e.g. LEEKS "Each" / "kg" / "Kilogram" into one.
  const unitPart = (hasCode||merged) ? "" : unitNorm(unit||"");
  return sk+"|"+id+"|"+unitPart;
}

function supGroup(name){ const c=CFG[norm(name)]; return (c&&c.group)||"Ungrouped"; }
// Group for a spend row: the supplier's configured group, but for rows whose supplier
// isn't in SupplierConfig (notably manual purchases, whose "supplier" is a shop name),
// fall back to the row's own category so they still count toward COGS rather than
// dropping into "Ungrouped". Manual purchases are stamped category:"COGS" on load.
function rowGroup(r){ const g=supGroup(r.supplier); return g!=="Ungrouped"?g:(r.category||"Ungrouped"); }
function supActive(name){ const c=CFG[norm(name)]; return c?c.active:true; }

const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const money = v => (v==null||v==="")?"":"$"+Number(v).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = v => (v>0?"+":"")+ (Math.round(v*10)/10) + "%";
const monthKey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const monthName = k => { const [y,m]=k.split("-"); return new Date(y,m-1,1).toLocaleDateString("en-AU",{month:"short",year:"2-digit"}); };
const fmtD = d => d ? d.toLocaleDateString("en-AU") : "";

function gvizDate(v){
  if (v instanceof Date) return v;
  const s=String(v||"").trim();
  let m=/Date\((\d+),(\d+),(\d+)/.exec(s);
  if (m) return new Date(+m[1],+m[2],+m[3]);
  m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);   // dd/mm/yyyy from CSV (AU locale)
  if (m) return new Date(+m[3],+m[2]-1,+m[1]);
  return null;
}

function fromDate(){ return FILTER.from ? new Date(FILTER.from+"T00:00:00") : null; }
function toDate(){ return FILTER.to ? new Date(FILTER.to+"T23:59:59") : null; }
function venueLabel(){ return FILTER.venues.length ? FILTER.venues.join(" + ") : ""; }
function inScope(venue,date){
  if(FILTER.venues.length && FILTER.venues.indexOf(venue)===-1) return false;
  if(!date) return !FILTER.from && !FILTER.to;
  const f=fromDate(), t=toDate();
  if(f && date<f) return false;
  if(t && date>t) return false;
  return true;
}
function scopedInv(){ return INV.filter(r=>supActive(r.supplier)&&inScope(r.venue,r.date)); }

// In-page item search: filters an already-rendered table by typed text, hiding rows that
// don't match. Used on the supplier and invoice views so you can find a line without
// scrolling a long list. Matches against the whole row, so a product code, description or
// unit all work. Call after the table's innerHTML has been set.
function wireRowSearch(inputId,tbodyId,countId,noun){
  const input=document.getElementById(inputId), tb=document.getElementById(tbodyId);
  if(!input||!tb) return;
  const total=tb.rows.length;
  input.addEventListener("input",()=>{
    const q=input.value.trim().toLowerCase();
    let shown=0;
    Array.prototype.forEach.call(tb.rows,tr=>{
      const hit=!q||tr.textContent.toLowerCase().indexOf(q)!==-1;
      tr.style.display=hit?"":"none";
      if(hit)shown++;
    });
    const c=countId&&document.getElementById(countId);
    if(c) c.textContent=q?`${shown} of ${total} ${noun}`:`${total} ${noun}`;
  });
}

// Days to divide by when turning a quantity into a per-week rate.
//
// The old code divided by the span between the first and last purchase and floored it
// at 28 days. That made the rate climb as the range widened: a week's buying (217 units
// over 7 days) was spread across the 28-day floor and reported as ~54/wk, while the same
// product over all time read ~420/wk. A weekly rate must not depend on how wide a window
// you view it through.
//
// Correct denominator is the SELECTED window, with both ends clamped to real data:
//   - end clamped to the last purchase, so a range running into the future (today is
//     mid-week, or "Month" with data only to the 22nd) isn't padded with days that were
//     never going to have deliveries and can't yet be known to be zero;
//   - start clamped to the first purchase, so selecting a range that begins before this
//     product existed doesn't dilute it with pre-history.
// With no range set ("All time") there is no window, so first-to-last span is the honest
// measure. Floor of 7 days keeps a single purchase from dividing by zero.
function rateDays(buys){
  if(!buys||!buys.length) return 7;
  const firstBuy=buys[0].date, lastBuy=buys[buys.length-1].date;
  const f=fromDate(), t=toDate();
  let a = f ? Math.max(+f,+firstBuy) : +firstBuy;
  let b = t ? Math.min(+t,+lastBuy)  : +lastBuy;
  if(!(b>a)) b=a; // single purchase, or window collapsed by clamping
  return Math.max(7,(b-a)/864e5+1); // +1: a buy on day one is a day of consumption
}
function scopedSales(){
  const floor = FILTER.from ? null : INV_MIN_DATE; // explicit From overrides the auto-floor
  return SALES.filter(s=>{
    if(!inScope(s.venue,s.date)) return false;
    if(floor && s.date && s.date<floor) return false;
    return true;
  });
}
function periodLabel(){
  if(FILTER.from||FILTER.to) return (FILTER.from?fmtD(fromDate()):"start")+" – "+(FILTER.to?fmtD(toDate()):"now");
  return "all captured data";
}

/* ================= SUPPLIER EMAIL ================= */
function parseEmails(src){
  return (String(src||"").match(/[\w.+-]+@[\w.-]+\.\w+/g)||[]);
}
function supplierEmail(name){
  const tally={};
  INV.filter(r=>r.supplier===name).forEach(r=>{
    parseEmails(r.src).forEach(e=>{
      e=e.toLowerCase();
      if(/redsquarecafe|beckitt/.test(e)) return;                 // our own addresses
      const w=/sent-via|noreply|no-reply|donotreply/.test(e)?1:10; // prefer real mailboxes
      tally[e]=(tally[e]||0)+w;
    });
  });
  const best=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  return best?best[0]:"";
}
function mailto(to,subject,body){
  return `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

/* ================= FETCH ================= */
async function fetchTab(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
  const res=await fetch(url);
  const txt=await res.text();
  if(!res.ok||/^\s*</.test(txt)||/"status"\s*:\s*"error"/.test(txt)) throw new Error("tab '"+name+"' not found or not shared");
  const rows=parseCsv(txt);
  if(!rows.length) return [];
  const cols=rows[0].map(c=>String(c||"").toLowerCase().trim());
  return rows.slice(1).map(r=>{
    const o={};
    cols.forEach((c,i)=>{ o[c]= r[i]!==undefined ? r[i] : null; });
    return o;
  });
}

function parseCsv(text){
  const rows=[]; let row=[], field="", inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
      else field+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===","){ row.push(field); field=""; }
      else if(ch==="\n"||ch==="\r"){
        if(ch==="\r"&&text[i+1]==="\n") i++;
        row.push(field); field="";
        if(row.length>1||row[0]!=="") rows.push(row);
        row=[];
      }
      else field+=ch;
    }
  }
  if(field!==""||row.length){ row.push(field); if(row.length>1||row[0]!=="") rows.push(row); }
  return rows;
}

async function loadAll(){
  const app=document.getElementById("app");
  app.innerHTML='<div id="status">Loading data…</div>';
  try{
    const [inv,lines,cfgRows,salesRows,pmRows,staffRows,staffMapRows,manualRows]=await Promise.all([
      fetchTab("Invoices"),
      fetchTab("InvoiceLines"),
      fetchTab("SupplierConfig").catch(()=>[]),
      fetchTab("Sales").catch(()=>[]),
      fetchTab("ProductMerge").catch(()=>[]),
      fetchTab("StaffInvoices").catch(()=>[]),
      fetchTab("StaffSupplierMap").catch(()=>[]),
      fetchTab("ManualPurchases").catch(()=>[])
    ]);
    SALES=salesRows.map(r=>({
      date:gvizDate(r.date), venue:r.venue||"",
      sales:+String(r.sales||"").replace(/[^0-9.\-]/g,"")||0,
      wages:+String(r.wages||"").replace(/[^0-9.\-]/g,"")||0
    })).filter(r=>r.date);
    SMAP=Object.assign({}, STAFF_MAP_DEFAULT);
    staffMapRows.forEach(r=>{ const f=norm(r.staff_name||r.staff||r.from), t=(r.pipeline_name||r.into||r.to||""); if(f&&t) SMAP[String(r.staff_name||r.staff||r.from).trim().toLowerCase()]=String(t).trim(); });
    const mapName=n=>{ const k=String(n||"").trim().toLowerCase(); return SMAP[k]||n||""; };
    STAFF=staffRows.map(r=>({
      date:gvizDate(r.date), venue:r.venue||"", rawSupplier:r.supplier||"",
      supplier:mapName(r.supplier), amount:+String(r.amount||"").replace(/[^0-9.\-]/g,"")||0
    })).filter(r=>r.date&&r.amount);
    INV=inv.map(r=>({
      venue:r.venue||"", supplier:r.supplier||"", number:String(r.invoice_number||""),
      date:gvizDate(r.invoice_date)||gvizDate(r.scanned), subtotal:+r.subtotal||0, gst:+r.gst||0,
      freight:+r.freight||0, cdl:+r.cdl||0, total:+r.total||0, category:r.category||"", type:r.type||"invoice",
      status:r.status||"", pdf:r.pdf_url||"", src:r.source||""
    })).filter(r=>r.supplier&&r.date);

    // Manual purchases (ad-hoc supermarket/market runs logged via the entry app) fold into
    // the SAME spend/supplier/venue totals as invoices, so headline spend and COGS include
    // them. They carry a single amount and NO line items, so they never touch the
    // product-level views (which read the separate LINES array). type:"manual" lets the UI
    // tell them apart; the shop becomes the "supplier"; category defaults to COGS.
    const MANUAL=manualRows.map(r=>{
      const amt=+String(r.amount||"").replace(/[^0-9.\-]/g,"")||0;
      return {
        venue:r.venue||"", supplier:(r.shop||"").trim(), number:"",
        date:gvizDate(r.date), subtotal:amt, gst:0, freight:0, cdl:0, total:amt,
        category:"COGS", type:"manual", status:"", pdf:"", src:"manual: "+(r.entered_by||"").trim()
      };
    }).filter(r=>r.supplier&&r.date&&r.total);
    INV=INV.concat(MANUAL);

    const variants={};
    INV.forEach(r=>{const k=norm(r.supplier);(variants[k]=variants[k]||{})[r.supplier]=(variants[k][r.supplier]||0)+1;});
    const canon={};
    Object.entries(variants).forEach(([k,v])=>{canon[k]=Object.entries(v).sort((a,b)=>b[1]-a[1])[0][0];});
    INV.forEach(r=>{r.supplier=canon[norm(r.supplier)]||r.supplier;});

    CFG={};
    cfgRows.forEach(r=>{
      const key=norm(r.supplier);
      if(!key) return;
      CFG[key]={merge:String(r.merge_into||"").trim(), group:String(r.group||"").trim(), active:String(r.active||"").trim().toLowerCase()!=="no"};
    });
    const applyCfg=name=>{
      let n=name, seen={};
      while(true){ const c=CFG[norm(n)]; if(c&&c.merge&&!seen[norm(c.merge)]){seen[norm(n)]=true;n=c.merge;} else break; }
      return n;
    };
    INV.forEach(r=>{r.supplier=applyCfg(r.supplier);});
    byNumber={};
    INV.forEach(r=>byNumber[norm(r.supplier)+"|"+norm(r.number)]=r);

    LINES=lines.map(r=>{
      let cs=canon[norm(r.supplier)]||r.supplier||"";
      { let seen={}; while(true){ const c=CFG[norm(cs)]; if(c&&c.merge&&!seen[norm(c.merge)]){seen[norm(cs)]=true;cs=c.merge;} else break; } }
      const inv=byNumber[norm(cs)+"|"+norm(String(r.invoice_number||""))];
      return {
        number:String(r.invoice_number||""), supplier:cs, venue:r.venue||"",
        code:String(r.item_code||""), desc:r.description||"", qty:+r.qty||0, unit:r.unit||"",
        price:+r.unit_price||0, total:+r.line_total||0, date:inv?inv.date:null
      };
    }).filter(r=>r.supplier);

    // ProductMerge tab (optional): supplier | match | into  — folds spelling variants together
    PMERGE={};
    const unwrap=v=>String(v==null?"":v).replace(/^="?|"?$/g,"").trim();
    pmRows.forEach(r=>{
      const sup=unwrap(r.supplier), mat=unwrap(r.match), into=unwrap(r.into);
      if(!sup||!mat||!into) return;
      PMERGE[norm(sup)+"|"+norm(mat)]=into;
    });

    // Duplicate invoice rows (same canonical supplier + number)
    const dupCnt={};
    INV.forEach(r=>{if(r.type==="manual")return; const k=norm(r.supplier)+"|"+norm(r.number); dupCnt[k]=(dupCnt[k]||0)+1;});
    INV.forEach(r=>{r.dup=r.type!=="manual"&&dupCnt[norm(r.supplier)+"|"+norm(r.number)]>1;});

    // Cross-venue price differences — SAME-PERIOD ONLY.
    // A true venue disparity is the two venues paying different prices at about the
    // same time. A price that simply rose between one venue's order and the other's
    // is a calendar price-rise, NOT a venue issue, so we require the two purchases
    // to fall within VENUE_WINDOW days of each other before flagging.
    const VENUE_WINDOW=10;
    VDIFF={};
    const vBuys={};
    LINES.filter(l=>l.price>0&&l.qty>0&&l.date).forEach(l=>{
      const k=prodKey(l.supplier,l.code,l.desc,l.unit);
      (vBuys[k]=vBuys[k]||[]).push({venue:l.venue,date:l.date,price:l.price});
    });
    // A TRUE venue discrepancy = the two venues pay different STANDING prices at the same
    // time, NOT a price rise that one venue caught before the other. To tell them apart we
    // check each venue's OWN price stability around the compared date: if a venue's price
    // is itself changing through that window, the gap is a temporal price move, not a venue
    // difference — so we suppress it. We only flag when BOTH venues' prices are locally
    // stable yet differ from each other.
    // A venue's price is only trustworthy as a STANDING price if we've seen it at least
    // twice at that level (one purchase is a single event, not a price policy). Returns
    // the stable price, or null if we can't confirm stability (too few buys, or moving).
    const MIN_BUYS=2;
    const localStable=(buys,venue,atDate)=>{
      const near=buys.filter(b=>b.venue===venue && Math.abs(b.date-atDate)/864e5<=VENUE_WINDOW).map(b=>b.price);
      if(near.length<MIN_BUYS) return null;          // need repeat evidence, not a one-off
      const hi=Math.max(...near), lo=Math.min(...near);
      return (hi-lo)/lo<=0.01 ? (near.reduce((s,v)=>s+v,0)/near.length) : null;
    };
    Object.entries(vBuys).forEach(([k,buys])=>{
      const venues=[...new Set(buys.map(b=>b.venue))];
      if(venues.length<2) return;
      let best=null;
      for(let i=0;i<buys.length;i++)for(let j=i+1;j<buys.length;j++){
        if(buys[i].venue===buys[j].venue) continue;
        const gapDays=Math.abs(buys[i].date-buys[j].date)/864e5;
        if(gapDays>VENUE_WINDOW) continue;
        // require EACH venue's own price to be stable around its purchase — otherwise this
        // "gap" is really a price rise in progress, not a venue difference.
        const sA=localStable(buys,buys[i].venue,buys[i].date);
        const sB=localStable(buys,buys[j].venue,buys[j].date);
        if(sA==null||sB==null) continue;               // a venue's price was moving -> price rise, skip
        const hi=Math.max(sA,sB), lo=Math.min(sA,sB);
        if(hi-lo<=0.01||(hi-lo)/lo<=0.005) continue;   // stable prices basically equal -> no venue gap
        if(!best||gapDays<best.gapDays) best={gapDays:gapDays,pair:[
          {venue:buys[i].venue,price:sA,date:buys[i].date},
          {venue:buys[j].venue,price:sB,date:buys[j].date}
        ]};
      }
      if(best){
        VDIFF[k]=best.pair.slice().sort((a,b)=>b.price-a.price);
        VDIFF[k].gapDays=Math.round(best.gapDays);
      }
    });

    // Earliest invoice date — sales/wages are clamped to this so the "all data" view
    // never divides 2 months of spend by years of sales. As invoice history is
    // backfilled further, this floor moves back automatically and sales follows.
    INV_MIN_DATE = INV.reduce((m,r)=>(r.date&&(!m||r.date<m))?r.date:m, null);
    VENUE_LIST=[...new Set(INV.map(r=>r.venue).filter(Boolean))].sort();
    renderFilters();
    route();
  }catch(e){
    app.innerHTML=`<div class="err">Couldn't load the sheet: ${e.message}<br><br>Check: SHEET_ID is set, and the spreadsheet is shared as "Anyone with the link – Viewer".</div>`;
  }
}

  const steppable=hasRange||["week","month","quarter"].includes(FILTER.presetKind);
  f.innerHTML=`

    ${VENUE_LIST.map(v=>`<span class="chip ${FILTER.venues.indexOf(v)>=0?"on":""}" onclick="toggleVenue('${encodeURIComponent(v)}')">${esc(v.replace("Red Square ","RS "))}</span>`).join("")}
    <span style="color:var(--line)">|</span>
    ${steppable?`<span class="chip" onclick="shiftRange(-1)" title="Previous period">‹</span>`:""}
    <span class="chip ${FILTER.presetKind==="week"?"on":""}" onclick="setPreset('week')">Week</span>
    <span class="chip ${FILTER.presetKind==="month"?"on":""}" onclick="setPreset('month')">Month</span>
    <span class="chip ${FILTER.presetKind==="quarter"?"on":""}" onclick="setPreset('quarter')">Quarter</span>
    <span class="chip ${FILTER.presetKind==="all"?"on":""}" onclick="setPreset('all')">All time</span>
    ${steppable?`<span class="chip" onclick="shiftRange(1)" title="Next period">›</span>`:""}
    <input type="date" id="fFrom" value="${FILTER.from}" onchange="setRange()">
    <span style="color:var(--dim);font-size:12px">→</span>
    <input type="date" id="fTo" value="${FILTER.to}" onchange="setRange()">
    ${(FILTER.from||FILTER.to||FILTER.venues.length||FILTER.presetKind)?`<span class="clear" onclick="clearFilter()">clear</span>`:""}
  `;
}
function fmtISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function setPreset(kind){
  if(FILTER.presetKind===kind){ FILTER.presetKind=""; FILTER.from=""; FILTER.to=""; }
  else { FILTER.presetKind=kind; FILTER.presetOffset=0; applyPreset(); }
  renderFilters(); route();
}
function applyPreset(){
  const now=new Date(); const o=FILTER.presetOffset;
  if(FILTER.presetKind==="all"){ FILTER.from=""; FILTER.to=""; return; }
  let a,b;
  if(FILTER.presetKind==="week"){
    const dow=(now.getDay()+6)%7; // Monday=0
    a=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+o*7);
    b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);
  } else if(FILTER.presetKind==="month"){
    a=new Date(now.getFullYear(),now.getMonth()+o,1);
    b=new Date(a.getFullYear(),a.getMonth()+1,0);
  } else if(FILTER.presetKind==="quarter"){
    const q=Math.floor(now.getMonth()/3)+o;
    a=new Date(now.getFullYear(),q*3,1);
    b=new Date(a.getFullYear(),a.getMonth()+3,0);
  } else return;
  FILTER.from=fmtISO(a); FILTER.to=fmtISO(b);
}
function shiftRange(dir){
  if(FILTER.presetKind==="all") return;
  if(FILTER.presetKind){ FILTER.presetOffset+=dir; applyPreset(); }
  else if(FILTER.from&&FILTER.to){
    const f=new Date(FILTER.from+"T00:00:00"), t=new Date(FILTER.to+"T00:00:00");
    const len=Math.round((t-f)/864e5)+1;
    f.setDate(f.getDate()+dir*len); t.setDate(t.getDate()+dir*len);
    FILTER.from=fmtISO(f); FILTER.to=fmtISO(t);
  }
  renderFilters(); route();
}
function allVenues(){ FILTER.venues=[]; renderFilters(); route(); }
function toggleVenue(v){
  v=decodeURIComponent(v);
  const i=FILTER.venues.indexOf(v);
  if(i>=0) FILTER.venues.splice(i,1); else FILTER.venues.push(v);
  renderFilters(); route();
}
function setRange(){
  FILTER.presetKind="";
  FILTER.from=document.getElementById("fFrom").value;
  FILTER.to=document.getElementById("fTo").value;
  renderFilters(); route();
}
function clearFilter(){ FILTER={venues:[],from:"",to:"",presetKind:"",presetOffset:0}; renderFilters(); route(); }

/* ================= PRODUCT AGGREGATION ================= */
function productsFor(supplier){
  const map={};
  LINES.filter(l=>(!supplier||l.supplier===supplier)&&l.price>0&&l.qty>0&&l.date&&inScope(l.venue,l.date)).forEach(l=>{
    const k=prodKey(l.supplier,l.code,l.desc,l.unit);
    const p=map[k]||(map[k]={key:k,supplier:l.supplier,code:l.code,desc:l.desc,unit:l.unit,buys:[]});
    p.desc=l.desc; p.unit=l.unit;
    p.buys.push(l);
  });
  return Object.values(map).map(p=>{
    p.buys.sort((a,b)=>a.date-b.date);
    const last=p.buys[p.buys.length-1];
    let prev=null, prevBuy=null;
    for(let i=p.buys.length-2;i>=0;i--){ if(p.buys[i].price!==last.price){prev=p.buys[i].price;prevBuy=p.buys[i];break;} }
    const d90=Date.now()-90*864e5;
    const p90=p.buys.filter(b=>b.date>=d90).map(b=>b.price);
    const totalQty=p.buys.reduce((s,b)=>s+b.qty,0);
    p.lastPrice=last.price; p.lastDate=last.date; p.lastBuy=last; p.prevPrice=prev; p.prevBuy=prevBuy;
    p.change=prev?(last.price-prev)/prev*100:null;
    p.avg90=p90.length?p90.reduce((s,v)=>s+v,0)/p90.length:null;
    p.volatile=new Set(p90.map(v=>v.toFixed(2))).size>=4;
    const rd=rateDays(p.buys);
    p.avgQtyWk=totalQty/(rd/7);
    const orders=new Set(p.buys.map(b=>norm(b.number))).size;
    p.orders=orders;
    p.avgPerOrder=totalQty/Math.max(1,orders);
    p.ordersPerWk=orders/(rd/7);
    p.vdiff=VDIFF[p.key]||null;
    return p;
  });
}

/* ================= AI ANALYSIS ================= */
const AI_MODEL = "claude-haiku-4-5"; // swap to "claude-sonnet-4-6" for deeper takes (~3x cost)

function aiKey(){
  let k = localStorage.getItem("anthropic_key") || "";
  if(!k){
    k = prompt("Paste your Anthropic API key (sk-ant-...).\nIt's stored only in this browser, never in the page or repo.") || "";
    k = k.trim();
    if(k) localStorage.setItem("anthropic_key", k);
  }
  return k;
}
function aiForgetKey(){ localStorage.removeItem("anthropic_key"); alert("API key removed from this browser."); }

function screenContext(){
  const h=decodeURIComponent(location.hash.slice(1));
  const [view,a,b]=h.split("::");
  const scope=`Filters: venue=${venueLabel()||"all"}, period=${periodLabel()}. IMPORTANT: any field named crossVenuePriceComparison covers ALL venues regardless of the venue filter and reflects same-period purchases (both venues buying within ~2 weeks) — treat it as a genuine venue pricing inconsistency, not a price rise over time; frame it explicitly as a cross-venue comparison and keep everything else within the filtered scope.`;
  const lim=(arr,n)=>arr.slice(0,n);
  if(view==="s"&&a){
    const name=a;
    const inv=INV.filter(r=>r.supplier===name&&inScope(r.venue,r.date));
    const prods=productsFor(name);
    return {title:"Supplier: "+name, data:{scope,
      invoices:lim(inv.sort((x,y)=>y.date-x.date),40).map(r=>({date:fmtD(r.date),no:r.number,venue:r.venue,total:r.total,type:r.type,status:r.status})),
      products:lim(prods,40).map(p=>({desc:p.desc,unit:p.unit,code:p.code,lastPrice:p.lastPrice,prevPrice:p.prevPrice,changePct:p.change&&Math.round(p.change*10)/10,avg90:p.avg90,avgQtyWk:Math.round(p.avgQtyWk*10)/10,crossVenuePriceComparison:p.vdiff||undefined}))}};
  }
  if(view==="p"&&a){
    const [pid,unit=""]=String(b||"").split("@@");
    const prods=productsFor(a);
    const p=prods.find(x=>((x.code&&norm(x.code)===norm(pid))||norm(x.desc)===norm(pid))&&unitNorm(x.unit||"")===unitNorm(unit))||prods.find(x=>(x.code&&norm(x.code)===norm(pid))||norm(x.desc)===norm(pid));
    if(p) return {title:"Product: "+p.desc+" ("+a+")", data:{scope,
      purchases:p.buys.map(x=>({date:fmtD(x.date),venue:x.venue,qty:x.qty,unit:x.unit,price:x.price,invoice:x.number})),
      crossVenuePriceComparison:p.vdiff||undefined}};
  }
  if(view==="i"&&a&&b){
    const r=byNumber[norm(a)+"|"+norm(b)];
    const lines=LINES.filter(l=>l.supplier===a&&l.number===b);
    if(r) return {title:"Invoice "+b+" — "+a, data:{scope,
      header:{date:fmtD(r.date),venue:r.venue,subtotal:r.subtotal,gst:r.gst,freight:r.freight,cdl:r.cdl||0,total:r.total,type:r.type,status:r.status,duplicateFlag:r.dup||false},
      lines:lines.map(l=>({desc:l.desc,qty:l.qty,unit:l.unit,price:l.price,total:l.total}))}};
  }
  // home / reports: portfolio view
  const inv=scopedInv();
  const bySup={};
  inv.forEach(r=>{const s=bySup[r.supplier]=bySup[r.supplier]||{total:0,n:0};s.total+=r.total;s.n++;});
  const groups={};
  inv.forEach(r=>{const g=rowGroup(r);groups[g]=(groups[g]||0)+r.total;});
  const salesScope=SALES.filter(s=>inScope(s.venue,s.date));
  const rises=productsFor(null).filter(p=>p.change!=null&&p.change>3).sort((a,b)=>b.change-a.change).slice(0,20)
    .map(p=>({supplier:p.supplier,desc:p.desc,changePct:Math.round(p.change*10)/10,lastPrice:p.lastPrice}));
  return {title:"Purchasing overview", data:{scope,
    totalSpend:Math.round(inv.reduce((s,r)=>s+r.total,0)*100)/100,
    invoiceCount:inv.length,
    suppliers:Object.entries(bySup).sort((a,b)=>b[1].total-a[1].total).slice(0,20).map(([n,s])=>({name:n,total:Math.round(s.total),invoices:s.n,group:supGroup(n)})),
    groupSpend:groups,
    sales:salesScope.length?{total:Math.round(salesScope.reduce((s,r)=>s+r.sales,0)),wages:Math.round(salesScope.reduce((s,r)=>s+r.wages,0))}:undefined,
    biggestRecentPriceRises:rises}};
}

async function analyseScreen(){
  const key=aiKey();
  if(!key) return;
  const btn=document.getElementById("aibtn");
  btn.textContent="✨ Thinking…";
  let card=document.getElementById("aicard");
  if(!card){
    card=document.createElement("div");
    card.id="aicard";
    card.className="card";
    card.style.borderColor="var(--ink)";
    document.getElementById("app").prepend(card);
  }
  card.innerHTML='<div class="label">AI analysis</div><div style="color:var(--dim);font-size:13px">Reading the screen…</div>';
  try{
    const ctx=screenContext();
    let payload=JSON.stringify(ctx.data);
    if(payload.length>60000) payload=payload.slice(0,60000);
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key":key,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({
        model:AI_MODEL,
        max_tokens:1200,
        messages:[{role:"user",content:
`You are analysing purchasing data for a Tasmanian hospitality group (Red Square Cafe Glenorchy & Cambridge, Luma Kitchen). The user is the owner — direct, practical, no fluff.

View: ${ctx.title}
Data (JSON): ${payload}

Give a sharp analysis in Australian English: what stands out, trends, anomalies, price movements worth acting on, and 2-4 concrete suggested actions. Short paragraphs and dash bullets. No preamble, no headers, under 250 words.`}]
      })
    });
    const data=await resp.json();
    if(data.error) throw new Error(data.error.message||("API error "+resp.status));
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const htmlOut=esc(text)
      .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
      .replace(/^- (.*)$/gm,"&bull; $1")
      .replace(/\n/g,"<br>");
    card.innerHTML=`<div class="label" style="display:flex;justify-content:space-between"><span>AI analysis — ${esc(ctx.title)}</span><a style="cursor:pointer;text-transform:none;letter-spacing:0" onclick="document.getElementById('aicard').remove()">✕</a></div>

  }catch(e){

    card.innerHTML=`<div class="label">AI analysis</div><div class="err">${esc(e.message)}${bad?' — <a style="cursor:pointer;text-decoration:underline" onclick="aiForgetKey();analyseScreen()">re-enter API key</a>':""}</div>`;
  }
  btn.textContent="✨ Analyse";
}

/* ================= ROUTING ================= */
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const [view,a,b]=h.split("::");
  if(view==="s") return renderSupplier(a);
  if(view==="i") return renderInvoice(a,b);
  if(view==="p") return renderProduct(a,b);
  if(view==="cfg") return renderConfig();
  if(view==="o") return renderOrder(a);
  if(view==="r") return renderReports();
  if(view==="rec") return renderReconcile();
  renderHome();
}
window.addEventListener("hashchange",route);
function go(hash){
  const cur=location.hash.replace(/^#/,"");
  if(cur===hash) route();
  else location.hash=hash;
  if(hash===""&&cur==="") route();
}
function crumb(t){ document.getElementById("crumb").textContent=t||""; }

/* ================= HOME ================= */
function renderHome(){
  crumb("");
  const inv=scopedInv();
  const ranged=FILTER.from||FILTER.to;
  const window30=r=>ranged?true:r.date>=Date.now()-30*864e5;
  const bySupplier={};
  const scopeMax=inv.reduce((m,r)=>r.date>m?r.date:m,new Date(0));
  const wkStart=scopeMax.getTime()-7*864e5;
  inv.forEach(r=>{
    const s=bySupplier[r.supplier]||(bySupplier[r.supplier]={total:0,n:0,last:null,first:null,d30:0,wk:0});
    s.total+=r.total; s.n++;
    if(!s.last||r.date>s.last)s.last=r.date;
    if(!s.first||r.date<s.first)s.first=r.date;
    if(window30(r))s.d30+=r.total;
    if(r.date.getTime()>wkStart)s.wk+=r.total;
  });
  // Weekly spend rate. Dividing a short window's spend by that window makes the number
  // spiky and useless: a fortnightly supplier looks enormous in the week they delivered
  // and vanishes the next. So when the selected range is shorter than four weeks we widen
  // the DATA — take the real spend over the 28 days ending at the range's end and divide
  // by 4 — rather than dividing the window's own spend by a longer period, which would
  // just understate it fourfold. Ranges of a month or more keep using their own span.
  const RATE_DAYS=28;
  const f0=fromDate(), t0=toDate();
  const rangeDays=(f0&&t0)?((t0-f0)/864e5+1):(f0||t0?RATE_DAYS:Infinity);
  const useRateWindow=rangeDays<RATE_DAYS;
  const rate4={};
  if(useRateWindow){
    const refEnd=(scopeMax>new Date(0))?scopeMax.getTime():Date.now();
    const refStart=refEnd-RATE_DAYS*864e5;
    INV.forEach(r=>{
      if(!supActive(r.supplier)||!r.date) return;
      if(FILTER.venues.length&&FILTER.venues.indexOf(r.venue)===-1) return;
      const t=r.date.getTime();
      if(t<=refStart||t>refEnd) return;
      rate4[r.supplier]=(rate4[r.supplier]||0)+r.total;
    });
  }
  Object.entries(bySupplier).forEach(([name,s])=>{
    if(useRateWindow){
      s.avgWk=(rate4[name]||0)/(RATE_DAYS/7);
    }else{
      const spanWk=Math.max(1,(s.last-s.first)/864e5/7);
      s.avgWk=s.total/spanWk;
    }
    s.trend=s.avgWk>0?(s.wk-s.avgWk)/s.avgWk:0;
  });
  const suppliers=Object.entries(bySupplier).sort((a,b)=>b[1].total-a[1].total);
  const spendAll=inv.reduce((s,r)=>s+r.total,0);
  const spendW=inv.filter(window30).reduce((s,r)=>s+r.total,0);
  const groups={};
  inv.filter(window30).forEach(r=>{const g=rowGroup(r);groups[g]=(groups[g]||0)+r.total;});
  const groupCards=Object.entries(groups).sort((a,b)=>b[1]-a[1]);
  const hiddenCount=Object.keys(CFG).filter(k=>CFG[k]&&!CFG[k].active).length;
  const wLabel=ranged?"Spend in range":"Spend, last 30d";

  document.getElementById("app").innerHTML=`
    <div class="statgrid" style="margin-bottom:12px">
      <div class="stat"><div class="v">${money(spendW)}</div><div class="k">${wLabel}</div></div>
      <div class="stat"><div class="v">${suppliers.length}</div><div class="k">Suppliers</div></div>
      <div class="stat"><div class="v">${inv.length}</div><div class="k">Invoices in scope</div></div>
      <div class="stat"><div class="v">${money(spendAll)}</div><div class="k">Total in scope</div></div>
    </div>
    <div class="card" style="padding:10px">
      <input type="search" id="psearch" placeholder="Search any product across all suppliers…">
      <div id="presults"></div>
    </div>
    <div class="card">
      <div class="label">Suppliers by spend — ${esc(periodLabel())}${venueLabel()?" · "+esc(venueLabel()):""}</div>
      <table><thead><tr><th>Supplier</th><th class="num hide-sm">Invoices</th><th class="num">Avg/wk</th><th class="num">Total</th><th class="num hide-sm">Last invoice</th></tr></thead>
      <tbody>${suppliers.map(([name,s])=>`
        <tr class="click" onclick="go('s::${encodeURIComponent(name)}')">
          <td><b>${esc(name)}</b>${supGroup(name)!=="Ungrouped"?` <span class="pill vol">${esc(supGroup(name))}</span>`:""}</td><td class="num hide-sm">${s.n}</td>
          <td class="num">${money(s.avgWk)} ${s.n>2?(s.trend>0.1?'<span class="up">▲</span>':s.trend<-0.1?'<span class="down">▼</span>':'<span style="color:var(--dim)">–</span>'):""}</td><td class="num">${money(s.total)}</td>
          <td class="num hide-sm">${fmtD(s.last)}</td>
        </tr>`).join("")}</tbody></table>
      ${useRateWindow?`<div style="font-size:11px;color:var(--dim);margin-top:6px">Avg/wk is measured over the 4 weeks to ${fmtD(scopeMax>new Date(0)?scopeMax:new Date())}, not the selected range — a range this short would otherwise swing wildly.</div>`:""}
      <div style="margin-top:10px;font-size:12px"><a style="cursor:pointer;color:var(--dim);text-decoration:underline" onclick="go('cfg')">⚙ supplier settings${hiddenCount?` (${hiddenCount} hidden)`:""}</a></div>
    </div>
    ${groupCards.length>1?`<div class="card"><div class="label">Spend by group — ${ranged?"in range":"last 30d"}</div>
      <table><tbody>${groupCards.map(([g,v])=>`<tr><td>${esc(g)}</td><td class="num"><b>${money(v)}</b></td></tr>`).join("")}</tbody></table>
    </div>`:""}`;
  document.getElementById("psearch").addEventListener("input",e=>{
    const q=e.target.value.trim().toLowerCase();
    const box=document.getElementById("presults");
    if(q.length<2){box.innerHTML="";return;}
    const hits=productsFor(null).filter(p=>p.desc.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)).slice(0,15);

function renderReconcile(){
  crumb("reconcile");
  const AMT_TOL=0.5, AMT_PCT=0.005, DAY_WIN=5;
  const app=document.getElementById("app");
  if(!STAFF.length){
    app.innerHTML=`<a class="back" onclick="go('')">All suppliers</a>
      <div class="card"><div class="label">Reconcile — staff data vs pipeline</div>
      <div style="font-size:14px;line-height:1.6">No staff-entry data found. Add a <b>StaffInvoices</b> tab to the data spreadsheet
      (columns: <b>date, venue, supplier, amount</b>) — an IMPORTRANGE from your Invoice Entry forms works. Then ↻ refresh.
      <br><br>This view cross-checks what staff logged against what the pipeline captured, so invoices that never reached the inbox (paper, wrong address) show up as <b>staff-only</b>.</div></div>`;
    return;
  }
  // scope both sides to the active venue+date filter
  const pipe=INV.filter(r=>supActive(r.supplier)&&inScope(r.venue,r.date)&&r.type!=="credit_note").map(r=>({date:r.date,venue:r.venue,supplier:r.supplier,amount:r.total,number:r.number,used:false}));
  const staff=STAFF.filter(s=>inScope(s.venue,s.date)).map(s=>({...s,used:false}));

  // group by canonical supplier
  const sup={};
  staff.forEach(s=>{(sup[s.supplier]=sup[s.supplier]||{staff:[],pipe:[]}).staff.push(s);});
  pipe.forEach(p=>{(sup[p.supplier]=sup[p.supplier]||{staff:[],pipe:[]}).pipe.push(p);});

  // greedy fuzzy match within each supplier
  let matched=0;
  Object.values(sup).forEach(g=>{
    g.staff.forEach(s=>{
      let best=null,bestGap=1e9;
      g.pipe.forEach(p=>{
        if(p.used) return;
        const amtOk=Math.abs(p.amount-s.amount)<=Math.max(AMT_TOL, s.amount*AMT_PCT);
        if(!amtOk) return;
        const dayGap=s.date&&p.date?Math.abs(s.date-p.date)/864e5:999;
        if(dayGap>DAY_WIN) return;
        if(dayGap<bestGap){bestGap=dayGap;best=p;}
      });
      if(best){best.used=true;s.used=true;matched++;}
    });
  });

  const staffOnly=staff.filter(s=>!s.used).sort((a,b)=>b.amount-a.amount);
  const pipeOnly=pipe.filter(p=>!p.used).sort((a,b)=>b.amount-a.amount);
  const unmapped=[...new Set(staff.filter(s=>!SMAP[s.rawSupplier.trim().toLowerCase()] && !INV.some(r=>norm(r.supplier)===norm(s.supplier))).map(s=>s.rawSupplier))];
  const staffTot=staffOnly.reduce((s,r)=>s+r.amount,0);

  app.innerHTML=`
    <a class="back" onclick="go('')">All suppliers</a>
    <div class="card">
      <div class="label">Reconcile — ${esc(periodLabel())}${venueLabel()?" · "+esc(venueLabel()):""}</div>
      <div style="font-size:13px;color:var(--dim);line-height:1.5">Fuzzy match: amount within $${AMT_TOL.toFixed(2)} or ${(AMT_PCT*100)}%, date within ±${DAY_WIN} days, after mapping supplier names. Spotlights likely gaps — always confirm against the actual document.</div>
      <div class="statgrid" style="margin-top:10px">
        <div class="stat"><div class="v">${matched}</div><div class="k">Matched</div></div>
        <div class="stat"><div class="v" style="color:var(--red)">${staffOnly.length}</div><div class="k">Staff only (likely missing)</div></div>
        <div class="stat"><div class="v">${pipeOnly.length}</div><div class="k">Pipeline only</div></div>
        <div class="stat"><div class="v" style="color:var(--red)">${money(staffTot)}</div><div class="k">Unaccounted value</div></div>
      </div>
    </div>
    <div class="card" style="border-color:var(--red)">
      <div class="label" style="color:var(--red)">⚠ Staff logged, pipeline missing (${staffOnly.length}) — probable missing invoices</div>
      ${staffOnly.length?`<table><thead><tr><th>Date</th><th>Supplier</th><th class="hide-sm">Venue</th><th class="hide-sm">Entered as</th><th class="num">Amount</th></tr></thead>
        <tbody>${staffOnly.map(s=>`<tr><td>${fmtD(s.date)}</td><td>${esc(s.supplier)}</td><td class="hide-sm">${esc(s.venue)}</td><td class="hide-sm" style="color:var(--dim)">${esc(s.rawSupplier)}</td><td class="num"><b>${money(s.amount)}</b></td></tr>`).join("")}</tbody></table>`:'<div style="font-size:13px;color:var(--dim)">Nothing — every staff entry has a pipeline match. </div>'}
    </div>
    <div class="card">
      <div class="label">Pipeline captured, staff didn't log (${pipeOnly.length}) — missed keying or a duplicate</div>
      ${pipeOnly.length?`<table><thead><tr><th>Date</th><th>Supplier</th><th class="hide-sm">Number</th><th class="hide-sm">Venue</th><th class="num">Amount</th></tr></thead>
        <tbody>${pipeOnly.map(p=>`<tr class="click" onclick="go('i::'+encodeURIComponent(p.supplier)+'::'+encodeURIComponent(p.number))"><td>${fmtD(p.date)}</td><td>${esc(p.supplier)}</td><td class="hide-sm">${esc(p.number)}</td><td class="hide-sm">${esc(p.venue)}</td><td class="num">${money(p.amount)}</td></tr>`).join("")}</tbody></table>`:'<div style="font-size:13px;color:var(--dim)">Nothing — every captured invoice was also logged by staff.</div>'}
    </div>
    ${unmapped.length?`<div class="card"><div class="label">Unmapped staff supplier names (${unmapped.length})</div>
      <div style="font-size:13px;line-height:1.6">These staff names didn't match any pipeline supplier, so their entries may be wrongly flagged above. Add rows to a <b>StaffSupplierMap</b> tab (columns <b>staff_name</b>, <b>pipeline_name</b>) to map them:<br><br>${unmapped.map(u=>`<span class="pill vol">${esc(u)}</span>`).join(" ")}</div></div>`:""}`;
}

}

function mergeSelected(){
  const sel=Object.values(SELECTED);
  if(sel.length<2) return;
  const target=sel[0];
  const into=target.desc; // stable, human-readable group name
  // Emit a match row for every identifier each variant might be keyed by (code and/or
  // description) — including the target itself, so the whole set collapses into one group.
  // Wrap code-like match values as ="..." so Sheets stores them as text verbatim
  // (bare 0480020 would be coerced to the number 480020, losing the merge).
  const cell=v=>/^[0-9]+$/.test(String(v))?`="${v}"`:String(v);
  const rows=[];
  sel.forEach(p=>{
    if(p.code) rows.push(`${SEL_SUPPLIER}\t${cell(p.code)}\t${into}`);
    rows.push(`${SEL_SUPPLIER}\t${cell(p.desc)}\t${into}`);
  });
  const box=document.getElementById("mergebox");
  box.innerHTML=`<div style="margin-top:10px;font-size:12px">
    Merging ${sel.length} items into <b>${esc(into)}</b>. Paste these rows into a <b>ProductMerge</b> tab
    (columns: <b>supplier</b>, <b>match</b>, <b>into</b> — create the tab with those exact headers if it doesn't exist), then ↻ refresh:
    <textarea style="width:100%;height:${40+rows.length*18}px;margin-top:6px;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:8px;padding:8px" onclick="this.select()">supplier\tmatch\tinto\n${rows.join("\n")}</textarea>
    <span style="color:var(--dim)">Click the box → it selects all → copy → paste into cell <b>A1</b> of the ProductMerge tab (it splits into columns automatically). Each item contributes a row for its code and its description so the match is robust. Refresh and all ${sel.length} collapse into one product.</span>
  </div>`;
}

function clearSel(){
  SELECTED={};

  renderSelBar(SEL_SUPPLIER, supplierEmail(SEL_SUPPLIER));

function toggleSel(key){

  bar.innerHTML=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <b style="font-size:13px">${sel.length} selected</b>
    <span style="font-size:12px;color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sel.map(p=>esc(p.desc)).join(" · ")}</span>
    ${btn}
    ${sel.length>1?`<a class="btn outline" style="cursor:pointer;padding:6px 10px;font-size:12px" onclick="mergeSelected()">⇄ Merge into one</a>`:""}
    <span class="clear" style="font-size:12px;cursor:pointer;color:var(--red);text-decoration:underline" onclick="clearSel()">clear</span>
  </div><div id="mergebox"></div>`;
}

/* ================= INVOICE ================= */
function renderInvoice(supplier,number){
  crumb(supplier+" · "+number);
  const r=byNumber[norm(supplier)+"|"+norm(number)];
  if(!r) return renderSupplier(supplier);
  const lines=LINES.filter(l=>l.supplier===supplier&&l.number===number);
  const email=supplierEmail(supplier);
  const qBody=`Hi team,\n\nCould you please review invoice ${number} dated ${fmtD(r.date)} for ${r.venue} (total ${money(r.total)})? The amounts don't reconcile against the line items on our side, and we'd like to confirm the charges are correct.\n\nIf there's been an overcharge, please issue a credit note / adjustment.\n\n${SIGNOFF}`;
  document.getElementById("app").innerHTML=`
    <a class="back" onclick="go('s::${encodeURIComponent(supplier)}')">${esc(supplier)}</a>
    <div class="statgrid" style="margin-bottom:12px">
      <div class="stat"><div class="v">${money(r.total)}</div><div class="k">Total ${r.type==="credit_note"?"(credit)":""}</div></div>
      <div class="stat"><div class="v">${money(r.gst)}</div><div class="k">GST</div></div>
      <div class="stat"><div class="v">${money(r.freight)}</div><div class="k">Freight</div></div>
      <div class="stat"><div class="v" style="font-size:15px">${fmtD(r.date)}</div><div class="k">${esc(r.venue)}</div></div>
    </div>
    ${r.dup?`<div class="err" style="margin-bottom:12px">Multiple invoice rows share this number — the line items below are likely doubled. In the sheet, delete the extra Invoices row and its duplicate block of InvoiceLines.</div>`:""}
    <div class="card"><div class="label">Invoice ${esc(number)} — line items (<span id="lineCount">${lines.length}</span>)${r.pdf?` &nbsp;·&nbsp; <a href="${esc(r.pdf)}" target="_blank" style="color:var(--red)">view original PDF ↗</a>`:""}</div>
      <input type="search" id="lineSearch" placeholder="Search items on this invoice…" style="margin-bottom:10px">
      <table><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Unit $</th><th class="num">Total</th></tr></thead>
      <tbody id="lineTbody">${lines.map(l=>`
        <tr class="click" onclick="go('p::${encodeURIComponent(supplier)}::${encodeURIComponent((l.code||l.desc)+"@@"+(l.unit||""))}')">
          <td>${esc(l.desc)}</td><td class="num">${l.qty} ${esc(l.unit)}</td>
          <td class="num">${money(l.price)}</td><td class="num">${money(l.total)}</td>
        </tr>`).join("")}</tbody></table>
      ${email&&r.status==="CHECK"?`<div style="margin-top:12px"><a class="btn" href="${mailto(email,"Query on invoice "+number,qBody)}">✉ Query this invoice</a></div>`:""}
    </div>`;
  wireRowSearch("lineSearch","lineTbody","lineCount","items");
}

/* ================= PRODUCT ================= */
function venueEmailHref(email,p){
  const hi=p.vdiff[0], lo=p.vdiff[p.vdiff.length-1];
  const diff=hi.price-lo.price;
  const body=`Hi team,\n\nWe've noticed we're being charged different prices for the same product at our two venues within the same period:\n\n${p.desc}${p.code?" ["+p.code+"]":""} (per ${p.unit||"unit"}):\n${p.vdiff.map(v=>`- ${v.venue}: ${money(v.price)}${v.date?" ("+fmtD(v.date)+")":""}`).join("\n")}\n\nThat's a ${money(diff)} per-${p.unit||"unit"} difference between venues bought within ${p.vdiff.gapDays!=null?p.vdiff.gapDays:10} days of each other. Could you confirm why the pricing differs and align both venues to the lower price? If this is an error please issue a credit note / adjustment.\n\n${SIGNOFF}`;
  return mailto(email,"Venue price difference — "+p.desc,body);
}

function renderProduct(supplier,id){
  const [pid,unit=""]=id.split("@@");
  const prods=productsFor(supplier);
  const matches=prods.filter(x=>(x.code&&norm(x.code)===norm(pid))||norm(x.desc)===norm(pid));
  const p=matches.find(x=>unitNorm(x.unit||"")===unitNorm(unit))||matches[0];
  if(!p) return renderSupplier(supplier);
  crumb(supplier+" · "+p.desc);
  const buys=p.buys;
  const email=supplierEmail(supplier);
  let riseBtn="";
  if(email && p.change!=null && p.change>0 && p.prevBuy){
    const body=`Hi team,\n\nOn invoice ${p.lastBuy.number} (${fmtD(p.lastBuy.date)}) we were charged ${money(p.lastPrice)} per ${p.unit||"unit"} for ${p.desc}${p.code?" ["+p.code+"]":""}. We were previously paying ${money(p.prevPrice)} (invoice ${p.prevBuy.number}, ${fmtD(p.prevBuy.date)}) — an increase of ${pct(p.change)}.\n\nCould you confirm whether this price rise is correct? We weren't notified of an increase. If it's an error, please issue a credit note / adjustment for the difference.\n\n${SIGNOFF}`;
    riseBtn=`<a class="btn" href="${mailto(email,"Price query — "+p.desc,body)}">✉ Draft price query email</a>`;
  }
  document.getElementById("app").innerHTML=`
    <a class="back" onclick="go('s::${encodeURIComponent(supplier)}')">${esc(supplier)}</a>
    <div class="statgrid" style="margin-bottom:12px">
      <div class="stat"><div class="v">${money(p.lastPrice)}</div><div class="k">Last price</div></div>
      <div class="stat"><div class="v">${p.avg90?money(p.avg90):"—"}</div><div class="k">90-day avg</div></div>
      <div class="stat"><div class="v">${Math.round(p.avgQtyWk*10)/10} ${esc(p.unit||"")}</div><div class="k">Avg per week</div></div>
      <div class="stat"><div class="v">${money(Math.min(...buys.map(b=>b.price)))}</div><div class="k">Cheapest ever</div></div>
      <div class="stat"><div class="v">${money(Math.max(...buys.map(b=>b.price)))}</div><div class="k">Dearest ever</div></div>
    </div>
    ${p.vdiff?`<div class="card" style="border-color:var(--red)"><div class="label" style="color:var(--red)">Different prices between venues — same period</div>
      <div style="font-size:14px">${p.vdiff.map(v=>`${esc(v.venue)}: <b>${money(v.price)}</b>${v.date?` <span style="color:var(--dim)">(${fmtD(v.date)})</span>`:""}`).join(" &nbsp;·&nbsp; ")} — bought within ${p.vdiff.gapDays!=null?p.vdiff.gapDays:10} days of each other at different prices. This is a venue pricing inconsistency, not a price rise over time.
      ${email?`<div style="margin-top:10px"><a class="btn" href="${venueEmailHref(email,p)}">✉ Query venue price difference</a></div>`:""}</div>
    </div>`:""}
    <div class="card"><div class="label">${esc(p.desc)} — unit price history</div>${priceChart(buys)}
      ${riseBtn?`<div style="margin-top:12px">${riseBtn}</div>`:""}
    </div>
    <div class="card"><div class="label">Purchases (${buys.length})</div>
      <table><thead><tr><th>Date</th><th class="hide-sm">Invoice</th><th class="hide-sm">Venue</th><th class="num">Qty</th><th class="num">Unit $</th></tr></thead>
      <tbody>${buys.slice().reverse().map(b=>`
        <tr class="click" onclick="go('i::${encodeURIComponent(supplier)}::${encodeURIComponent(b.number)}')">
          <td>${fmtD(b.date)}</td><td class="hide-sm">${esc(b.number)}</td>
          <td class="hide-sm">${esc(b.venue)}</td><td class="num">${b.qty} ${esc(b.unit)}</td>
          <td class="num"><b>${money(b.price)}</b></td>
        </tr>`).join("")}</tbody></table>
    </div>`;
}

/* ================= ORDER BUILDER ================= */
let ORDER = { supplier:"", venue:"", qty:{} };

function orderProds(supplier){
  const since=Date.now()-90*864e5;
  const map={};
  const FEE=/deliver|freight|fuel|levy|surcharge|cdl|container\s*deposit|rounding|admin\s*fee/i;
  LINES.filter(l=>l.supplier===supplier&&l.price>0&&l.qty>0&&l.date&&l.date>=since&&(!FILTER.venues.length||FILTER.venues.indexOf(l.venue)>=0)&&!FEE.test(l.desc)).forEach(l=>{
    const k=prodKey(l.supplier,l.code,l.desc,l.unit);
    const p=map[k]||(map[k]={key:k,desc:l.desc,code:l.code,unit:l.unit,buys:[]});
    p.desc=l.desc; p.unit=l.unit;
    p.buys.push(l);
  });
  return Object.values(map).map(p=>{
    p.buys.sort((a,b)=>a.date-b.date);
    const totalQty=p.buys.reduce((s,b)=>s+b.qty,0);
    const rd=rateDays(p.buys);
    p.avgQtyWk=totalQty/(rd/7);
    const orders=new Set(p.buys.map(b=>norm(b.number))).size;
    p.orders=orders;
    p.avgPerOrder=totalQty/Math.max(1,orders);
    p.ordersPerWk=orders/(rd/7);
    p.last=p.buys[p.buys.length-1];
    p.suggested=Math.max(1,Math.round(p.avgPerOrder));
    return p;
  }).filter(p=>p.avgQtyWk>=0.05).sort((a,b)=>b.ordersPerWk-a.ordersPerWk);
}

function renderOrder(name){
  crumb(name+" · new order");
  const prods=orderProds(name);
  if(ORDER.supplier!==name){
    ORDER={ supplier:name, venue:(FILTER.venues.length===1?FILTER.venues[0]:VENUE_LIST[0])||"", qty:{} };
    prods.forEach(p=>{ ORDER.qty[p.key]=p.suggested; });
  }
  const email=supplierEmail(name);
  const daysAgo=d=>Math.round((Date.now()-d)/864e5);
  document.getElementById("app").innerHTML=`
    <a class="back" onclick="go('s::${encodeURIComponent(name)}')">${esc(name)}</a>
    <div class="card">
      <div class="label">New order — ${esc(name)}</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <span style="font-size:12px;color:var(--dim)">Deliver to</span>
        <select id="ordVenue" onchange="ORDER.venue=this.value" style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px">
          ${VENUE_LIST.map(v=>`<option ${ORDER.venue===v?"selected":""}>${esc(v)}</option>`).join("")}
        </select>
        <span style="font-size:11px;color:var(--dim)">Suggested quantities = your average per order (last 90 days), in the pack unit you usually buy${venueLabel()?" for "+esc(venueLabel()):""}. Edit freely — 0 leaves an item off the order.</span>
      </div>
      <table><thead><tr><th>Product</th><th class="num hide-sm">Avg per order</th><th class="num hide-sm">Orders/wk</th><th class="num hide-sm">Last bought</th><th class="num">Order qty</th></tr></thead>
      <tbody>${prods.map(p=>`
        <tr>
          <td>${esc(p.desc)}${p.unit?` <span style="color:var(--dim);font-size:11px">(${esc(p.unit)})</span>`:""}${p.code?` <span style="color:var(--dim);font-family:var(--mono);font-size:11px">${esc(p.code)}</span>`:""}</td>
          <td class="num hide-sm">${Math.round(p.avgPerOrder*10)/10} ${esc(p.unit||"")}</td>
          <td class="num hide-sm">${Math.round(p.ordersPerWk*10)/10}</td>
          <td class="num hide-sm">${fmtD(p.last.date)} <span style="color:var(--dim)">(${daysAgo(p.last.date)}d ago)</span></td>
          <td class="num" style="white-space:nowrap"><input type="number" min="0" step="1" value="${ORDER.qty[p.key]??p.suggested}" data-k="${p.key}" onchange="ORDER.qty[this.dataset.k]=Number(this.value)||0" style="width:64px;border:1px solid var(--line);border-radius:6px;padding:5px;text-align:right;font-family:var(--mono)"> <span style="font-size:11px;color:var(--dim)">${esc(p.unit||"ea")}</span></td>
        </tr>`).join("")}</tbody></table>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
        ${email?`<a class="btn" style="cursor:pointer" onclick="sendOrder('${encodeURIComponent(name)}')">✉ Email order to ${esc(email)}</a>`:`<span style="font-size:12px;color:var(--dim)">No contact email found for this supplier.</span>`}
        <a class="btn outline" style="cursor:pointer" onclick="window.print()">🖨 Print</a>
      </div>
    </div>`;
}

function sendOrder(nameEnc){
  const name=decodeURIComponent(nameEnc);
  const prods=orderProds(name);
  const lines=prods.filter(p=>(ORDER.qty[p.key]||0)>0)
    .map(p=>`- ${ORDER.qty[p.key]} x ${p.unit||"ea"} — ${p.desc}${p.code?" ["+p.code+"]":""}`);
  if(!lines.length){ alert("All quantities are zero — nothing to order."); return; }
  const body=`Hi team,\n\nCould we please place the following order for ${ORDER.venue}:\n\n${lines.join("\n")}\n\nPlease confirm availability and delivery day.\n\n${SIGNOFF}`;
  location.href=mailto(supplierEmail(name),"Order — "+ORDER.venue,body);
}

/* Simple dependency-free SVG line chart */
function priceChart(buys){
  if(buys.length<2) return '<div style="color:var(--dim);font-size:13px;padding:10px 0">Need at least two purchases to chart a trend.</div>';
  const W=760,H=220,P=42;
  const xs=buys.map(b=>b.date.getTime()), ys=buys.map(b=>b.price);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)*0.97,y1=Math.max(...ys)*1.03;
  const X=t=>P+(t-x0)/((x1-x0)||1)*(W-P-14);
  const Y=v=>H-24-(v-y0)/((y1-y0)||1)*(H-24-14);
  const pts=buys.map(b=>X(b.date.getTime())+","+Y(b.price)).join(" ");
  const ticks=[y0,(y0+y1)/2,y1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${ticks.map(t=>`<line x1="${P}" y1="${Y(t)}" x2="${W-14}" y2="${Y(t)}" stroke="#eee"/><text x="4" y="${Y(t)+3}">$${t.toFixed(2)}</text>`).join("")}
    <polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round"/>
    ${buys.map(b=>`<circle cx="${X(b.date.getTime())}" cy="${Y(b.price)}" r="3.5" fill="var(--red)"><title>${fmtD(b.date)} — $${b.price.toFixed(2)}</title></circle>`).join("")}
    <text x="${P}" y="${H-6}">${fmtD(buys[0].date)}</text>
    <text x="${W-14}" y="${H-6}" text-anchor="end">${fmtD(buys[buys.length-1].date)}</text>
  </svg>`;
}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

loadAll();
