<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier Explorer</title>
<style>
  :root {
    --ink:#111; --paper:#f7f6f3; --line:#ddd; --red:#c8102e; --dim:#777;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink)}
  header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  header .sq{width:13px;height:13px;background:var(--red)}
  header h1{font-size:16px;font-weight:700}
  header .crumb{font-size:12px;color:#aaa;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header button{margin-left:auto;background:none;border:1px solid #555;color:#fff;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
  main{max-width:860px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .label{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:7px 8px;border-bottom:1px solid #f0efec;vertical-align:top}
  tr.click{cursor:pointer}
  tr.click:hover{background:#faf9f6}
  .num{text-align:right;font-family:var(--mono);white-space:nowrap}
  .up{color:var(--red);font-weight:600}
  .down{color:#1a7f37;font-weight:600}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
  .pill.credit{background:var(--ink);color:#fff}
  .pill.check{background:var(--red);color:#fff}
  .pill.vol{background:#eee;color:#555}
  input[type=search]{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;background:#fff}
  .back{display:inline-block;margin-bottom:10px;font-size:14px;color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer}
  .back:before{content:"← "}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat .v{font-size:20px;font-weight:700;font-family:var(--mono)}
  .stat .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  #status{padding:40px 0;text-align:center;color:var(--dim);font-size:14px}
  .err{border:1px solid var(--red);color:var(--red);border-radius:10px;padding:12px;font-size:14px;background:#fff}
  svg text{font-family:var(--mono);font-size:10px;fill:var(--dim)}
  @media (max-width:600px){ .hide-sm{display:none} td,th{padding:6px 5px} }
</style>
</head>
<body>
<header>
  <div class="sq"></div><h1>Supplier Explorer</h1>
  <div class="crumb" id="crumb"></div>
  <button onclick="loadAll()">↻ refresh</button>
</header>
<main id="app"><div id="status">Loading data…</div></main>

<script>
/* ================= CONFIG ================= */
const SHEET_ID = "1bICxitr-CyU7VF8TLKIZgw7gV2WTKur9AptfmskQNK4"; // BG Ops Data
/* Sheet must be shared as "Anyone with the link – Viewer" (same as the KPI dashboard source). */

/* ================= DATA ================= */
let INV = [], LINES = [], byNumber = {}, CFG = {};

function supGroup(name){ const c=CFG[norm(name)]; return (c&&c.group)||"Ungrouped"; }
function supActive(name){ const c=CFG[norm(name)]; return c?c.active:true; }

const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const money = v => (v==null||v==="")?"":"$"+Number(v).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = v => (v>0?"+":"")+ (Math.round(v*10)/10) + "%";
const monthKey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const monthName = k => { const [y,m]=k.split("-"); return new Date(y,m-1,1).toLocaleDateString("en-AU",{month:"short",year:"2-digit"}); };

function gvizDate(v){
  if (v instanceof Date) return v;
  const m=/Date\((\d+),(\d+),(\d+)/.exec(String(v||""));
  if (m) return new Date(+m[1],+m[2],+m[3]);
  const m2=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v||""));
  if (m2) return new Date(+m2[1],+m2[2]-1,+m2[3]);
  return null;
}

async function fetchTab(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(name)}`;
  const txt=await (await fetch(url)).text();
  const json=JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}")+1));
  if (json.status==="error") throw new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||"sheet error");
  const cols=json.table.cols.map(c=>(c.label||c.id||"").toLowerCase().trim());
  return json.table.rows.map(r=>{
    const o={};
    r.c.forEach((cell,i)=>{ o[cols[i]] = cell ? (cell.v!==undefined?cell.v:null) : null; });
    return o;
  });
}

async function loadAll(){
  const app=document.getElementById("app");
  app.innerHTML='<div id="status">Loading data…</div>';
  try{
    if (SHEET_ID.startsWith("PASTE")) throw new Error("Open this file in a text editor and paste your spreadsheet ID into SHEET_ID at the top of the script.");
    const [inv,lines,cfgRows]=await Promise.all([
      fetchTab("Invoices"),
      fetchTab("InvoiceLines"),
      fetchTab("SupplierConfig").catch(()=>[])
    ]);
    INV=inv.map(r=>({
      venue:r.venue||"", supplier:r.supplier||"", number:String(r.invoice_number||""),
      date:gvizDate(r.invoice_date)||gvizDate(r.scanned), subtotal:+r.subtotal||0, gst:+r.gst||0,
      freight:+r.freight||0, total:+r.total||0, category:r.category||"", type:r.type||"invoice", status:r.status||"", pdf:r.pdf_url||""
    })).filter(r=>r.supplier&&r.date);
    // Canonicalise supplier-name variants ("Tas-Isle" vs "TasIsle" etc):
    // group by punctuation-stripped name, display the most common spelling.
    const variants={};
    INV.forEach(r=>{const k=norm(r.supplier);(variants[k]=variants[k]||{})[r.supplier]=(variants[k][r.supplier]||0)+1;});
    const canon={};
    Object.entries(variants).forEach(([k,v])=>{canon[k]=Object.entries(v).sort((a,b)=>b[1]-a[1])[0][0];});
    INV.forEach(r=>{r.supplier=canon[norm(r.supplier)]||r.supplier;});
    // SupplierConfig tab (optional): supplier | merge_into | group | active
    CFG={};
    cfgRows.forEach(r=>{
      const key=norm(r.supplier);
      if(!key) return;
      CFG[key]={merge:String(r.merge_into||"").trim(), group:String(r.group||"").trim(), active:String(r.active||"").trim().toLowerCase()!=="no"};
    });
    const applyCfg=name=>{
      let n=name, seen={};
      while(true){ const c=CFG[norm(n)]; if(c&&c.merge&&!seen[norm(c.merge)]){seen[norm(n)]=true;n=c.merge;} else break; }
      return n;
    };
    INV.forEach(r=>{r.supplier=applyCfg(r.supplier);});
    byNumber={};
    INV.forEach(r=>byNumber[norm(r.supplier)+"|"+norm(r.number)]=r);
    LINES=lines.map(r=>{
      let cs=canon[norm(r.supplier)]||r.supplier||"";
      { let seen={}; while(true){ const c=CFG[norm(cs)]; if(c&&c.merge&&!seen[norm(c.merge)]){seen[norm(cs)]=true;cs=c.merge;} else break; } }
      r.supplier=cs;
      const inv=byNumber[norm(cs)+"|"+norm(String(r.invoice_number||""))];
      return {
        number:String(r.invoice_number||""), supplier:r.supplier||"", venue:r.venue||"",
        code:String(r.item_code||""), desc:r.description||"", qty:+r.qty||0, unit:r.unit||"",
        price:+r.unit_price||0, total:+r.line_total||0, date:inv?inv.date:null
      };
    }).filter(r=>r.supplier);
    route();
  }catch(e){
    app.innerHTML=`<div class="err">Couldn't load the sheet: ${e.message}<br><br>Check: SHEET_ID is set, and the spreadsheet is shared as "Anyone with the link – Viewer".</div>`;
  }
}

/* ================= PRODUCT AGGREGATION ================= */
function productsFor(supplier){
  const map={};
  LINES.filter(l=>(!supplier||l.supplier===supplier)&&l.price>0&&l.qty>0&&l.date).forEach(l=>{
    const k=norm(l.supplier)+"|"+(l.code?norm(l.code):norm(l.desc))+"|"+norm(l.unit||"");
    const p=map[k]||(map[k]={key:k,supplier:l.supplier,code:l.code,desc:l.desc,unit:l.unit,buys:[],prices:new Set()});
    p.desc=l.desc; p.unit=l.unit;
    p.buys.push(l); p.prices.add(l.price.toFixed(2));
  });
  return Object.values(map).map(p=>{
    p.buys.sort((a,b)=>a.date-b.date);
    const last=p.buys[p.buys.length-1];
    let prev=null;
    for(let i=p.buys.length-2;i>=0;i--){ if(p.buys[i].price!==last.price){prev=p.buys[i].price;break;} }
    const d90=Date.now()-90*864e5;
    const p90=p.buys.filter(b=>b.date>=d90).map(b=>b.price);
    p.lastPrice=last.price; p.lastDate=last.date; p.prevPrice=prev;
    p.change=prev?(last.price-prev)/prev*100:null;
    p.avg90=p90.length?p90.reduce((s,v)=>s+v,0)/p90.length:null;
    p.volatile=new Set(p90.map(v=>v.toFixed(2))).size>=4;
    return p;
  });
}

/* ================= ROUTING ================= */
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const [view,a,b]=h.split("::");
  if(view==="s") return renderSupplier(a);
  if(view==="i") return renderInvoice(a,b);
  if(view==="p") return renderProduct(a,b);
  if(view==="cfg") return renderConfig();
  renderHome();
}
window.addEventListener("hashchange",route);
function go(hash){ location.hash=hash; }
function crumb(t){ document.getElementById("crumb").textContent=t||""; }

/* ================= VIEWS ================= */
function renderHome(){
  crumb("");
  const bySupplier={};
  const activeInv=INV.filter(r=>supActive(r.supplier));
  activeInv.forEach(r=>{
    const s=bySupplier[r.supplier]||(bySupplier[r.supplier]={total:0,n:0,last:null,d30:0});
    s.total+=r.total; s.n++;
    if(!s.last||r.date>s.last)s.last=r.date;
    if(r.date>=Date.now()-30*864e5)s.d30+=r.total;
  });
  const suppliers=Object.entries(bySupplier).sort((a,b)=>b[1].total-a[1].total);
  const spendAll=activeInv.reduce((s,r)=>s+r.total,0);
  const spend30=activeInv.filter(r=>r.date>=Date.now()-30*864e5).reduce((s,r)=>s+r.total,0);
  const groups={};
  activeInv.filter(r=>r.date>=Date.now()-30*864e5).forEach(r=>{const g=supGroup(r.supplier);groups[g]=(groups[g]||0)+r.total;});
  const groupCards=Object.entries(groups).sort((a,b)=>b[1]-a[1]);
  const hiddenCount=Object.keys(CFG).filter(k=>CFG[k]&&!CFG[k].active).length;

  document.getElementById("app").innerHTML=`
    <div class="statgrid" style="margin-bottom:12px">
      <div class="stat"><div class="v">${money(spend30)}</div><div class="k">Spend, last 30d</div></div>
      <div class="stat"><div class="v">${suppliers.length}</div><div class="k">Suppliers</div></div>
      <div class="stat"><div class="v">${INV.length}</div><div class="k">Invoices captured</div></div>
      <div class="stat"><div class="v">${money(spendAll)}</div><div class="k">All-time captured</div></div>
    </div>
    <div class="card" style="padding:10px">
      <input type="search" id="psearch" placeholder="Search any product across all suppliers…">
      <div id="presults"></div>
    </div>
    ${groupCards.length>1?`<div class="card"><div class="label">Spend by group — last 30d</div>
      <table><tbody>${groupCards.map(([g,v])=>`<tr><td>${esc(g)}</td><td class="num"><b>${money(v)}</b></td></tr>`).join("")}</tbody></table>
    </div>`:""}
    <div class="card">
      <div class="label">Suppliers by spend</div>
      <table><thead><tr><th>Supplier</th><th class="num">Invoices</th><th class="num hide-sm">Last 30d</th><th class="num">Total</th><th class="num hide-sm">Last invoice</th></tr></thead>
      <tbody>${suppliers.map(([name,s])=>`
        <tr class="click" onclick="go('s::${encodeURIComponent(name)}')">
          <td><b>${esc(name)}</b>${supGroup(name)!=="Ungrouped"?` <span class="pill vol">${esc(supGroup(name))}</span>`:""}</td><td class="num">${s.n}</td>
          <td class="num hide-sm">${money(s.d30)}</td><td class="num">${money(s.total)}</td>
          <td class="num hide-sm">${s.last?s.last.toLocaleDateString("en-AU"):""}</td>
        </tr>`).join("")}</tbody></table>
      <div style="margin-top:10px;font-size:12px"><a style="cursor:pointer;color:var(--dim);text-decoration:underline" onclick="go('cfg')">⚙ supplier settings${hiddenCount?` (${hiddenCount} hidden)`:""}</a></div>
    </div>`;
  document.getElementById("psearch").addEventListener("input",e=>{
    const q=e.target.value.trim().toLowerCase();
    const box=document.getElementById("presults");
    if(q.length<2){box.innerHTML="";return;}
    const hits=productsFor(null).filter(p=>p.desc.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)).slice(0,15);
    box.innerHTML=hits.length?`<table style="margin-top:8px"><tbody>${hits.map(p=>`
      <tr class="click" onclick="go('p::${encodeURIComponent(p.supplier)}::${encodeURIComponent((p.code||p.desc)+"@@"+(p.unit||""))}')">
        <td>${esc(p.desc)} <span style="color:var(--dim)">${esc(p.supplier)}</span></td>
        <td class="num">${money(p.lastPrice)}</td>
        <td class="num">${p.change!=null?`<span class="${p.change>0?'up':'down'}">${pct(p.change)}</span>`:""}</td>
      </tr>`).join("")}</tbody></table>`:'<div style="padding:10px;color:var(--dim);font-size:13px">No products match.</div>';
  });
}

function renderConfig(){
  crumb("supplier settings");
  const names={};
  INV.forEach(r=>{names[r.supplier]=true;});
  Object.keys(CFG).forEach(k=>{ if(CFG[k].merge) return; });
  const rows=Object.keys(names).sort((a,b)=>a.localeCompare(b));
  const sheetUrl=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
  document.getElementById("app").innerHTML=`
    <a class="back" onclick="go('')">All suppliers</a>
    <div class="card">
      <div class="label">How supplier settings work</div>
      <div style="font-size:14px;line-height:1.55">
        Settings live in a <b>SupplierConfig</b> tab in the data spreadsheet with four columns:
        <b>supplier</b> (name exactly as shown below), <b>merge_into</b> (canonical name to fold this one into),
        <b>group</b> (e.g. COGS, Energy, Overheads, Equipment), and <b>active</b> ("no" hides the supplier from all views and totals).
        Add or edit rows there, then hit ↻ refresh here.
        <div style="margin-top:8px"><a href="${sheetUrl}" target="_blank" style="color:var(--red)">Open the spreadsheet ↗</a></div>
      </div>
    </div>
    <div class="card">
      <div class="label">Current suppliers (${rows.length}) — as resolved</div>
      <table><thead><tr><th>Supplier</th><th>Group</th><th class="num">Status</th></tr></thead>
      <tbody>${rows.map(n=>`<tr>
        <td>${esc(n)}</td>
        <td>${esc(supGroup(n))}</td>
        <td class="num">${supActive(n)?"active":'<span class="pill check">hidden</span>'}</td>
      </tr>`).join("")}</tbody></table>
      <div style="font-size:11px;color:var(--dim);margin-top:8px">Names already merged by merge_into don't appear here — they've been folded into their canonical supplier.</div>
    </div>`;
}

function renderSupplier(name){
  crumb(name);
  const inv=INV.filter(r=>r.supplier===name).sort((a,b)=>b.date-a.date);
  if(!inv.length) return renderHome();
  const months={};
  inv.forEach(r=>{const k=monthKey(r.date);const m=months[k]||(months[k]={total:0,gst:0,freight:0,n:0,credits:0});
    m.total+=r.total;m.gst+=r.gst;m.freight+=r.freight;m.n++;if(r.type==="credit_note")m.credits+=r.total;});
  const mkeys=Object.keys(months).sort().reverse().slice(0,12);
  const prods=productsFor(name).sort((a,b)=>(b.change||0)-(a.change||0));

  document.getElementById("app").innerHTML=`
    <a class="back" onclick="go('')">All suppliers</a>
    <div class="card"><div class="label">Monthly statement — ${esc(name)}</div>
      <table><thead><tr><th>Month</th><th class="num">Invoices</th><th class="num hide-sm">GST</th><th class="num hide-sm">Freight</th><th class="num hide-sm">Credits</th><th class="num">Total</th></tr></thead>
      <tbody>${mkeys.map(k=>{const m=months[k];return`<tr><td>${monthName(k)}</td><td class="num">${m.n}</td>
        <td class="num hide-sm">${money(m.gst)}</td><td class="num hide-sm">${money(m.freight)}</td>
        <td class="num hide-sm">${m.credits?money(m.credits):""}</td><td class="num"><b>${money(m.total)}</b></td></tr>`;}).join("")}</tbody></table>
      <div style="font-size:11px;color:var(--dim);margin-top:6px">Reconcile these totals against the supplier's own monthly statement — differences mean a missing invoice or a billing error.</div>
    </div>
    <div class="card"><div class="label">Products (${prods.length}) — sorted by latest price change</div>
      <table><thead><tr><th>Product</th><th class="num hide-sm">90d avg</th><th class="num">Last price</th><th class="num">Change</th></tr></thead>
      <tbody>${prods.map(p=>`
        <tr class="click" onclick="go('p::${encodeURIComponent(name)}::${encodeURIComponent((p.code||p.desc)+"@@"+(p.unit||""))}')">
          <td>${esc(p.desc)}${p.unit?` <span style="color:var(--dim);font-size:11px">(${esc(p.unit)})</span>`:""}${p.code?` <span style="color:var(--dim);font-family:var(--mono);font-size:11px">${esc(p.code)}</span>`:""}${p.volatile?' <span class="pill vol">volatile</span>':""}</td>
          <td class="num hide-sm">${p.avg90?money(p.avg90):""}</td>
          <td class="num">${money(p.lastPrice)}</td>
          <td class="num">${p.change!=null?`<span class="${p.change>0?'up':p.change<0?'down':''}">${pct(p.change)}</span>`:""}</td>
        </tr>`).join("")}</tbody></table>
    </div>
    <div class="card"><div class="label">Invoices (${inv.length})</div>
      <table><thead><tr><th>Date</th><th>Number</th><th class="hide-sm">Venue</th><th class="num">Total</th><th></th></tr></thead>
      <tbody>${inv.map(r=>`
        <tr class="click" onclick="go('i::${encodeURIComponent(name)}::${encodeURIComponent(r.number)}')">
          <td>${r.date.toLocaleDateString("en-AU")}</td><td class="num" style="text-align:left">${esc(r.number)}</td>
          <td class="hide-sm">${esc(r.venue)}</td><td class="num">${money(r.total)}</td>
          <td>${r.type==="credit_note"?'<span class="pill credit">credit</span>':""}${r.status==="CHECK"?' <span class="pill check">check</span>':""}</td>
        </tr>`).join("")}</tbody></table>
    </div>`;
}

function renderInvoice(supplier,number){
  crumb(supplier+" · "+number);
  const r=byNumber[norm(supplier)+"|"+norm(number)];
  if(!r) return renderSupplier(supplier);
  const lines=LINES.filter(l=>l.supplier===supplier&&l.number===number);
  document.getElementById("app").innerHTML=`
    <a class="back" onclick="go('s::${encodeURIComponent(supplier)}')">${esc(supplier)}</a>
    <div class="statgrid" style="margin-bottom:12px">
      <div class="stat"><div class="v">${money(r.total)}</div><div class="k">Total ${r.type==="credit_note"?"(credit)":""}</div></div>
      <div class="stat"><div class="v">${money(r.gst)}</div><div class="k">GST</div></div>
      <div class="stat"><div class="v">${money(r.freight)}</div><div class="k">Freight</div></div>
      <div class="stat"><div class="v" style="font-size:15px">${r.date.toLocaleDateString("en-AU")}</div><div class="k">${esc(r.venue)}</div></div>
    </div>
    <div class="card"><div class="label">Invoice ${esc(number)} — line items (${lines.length})${r.pdf?` &nbsp;·&nbsp; <a href="${esc(r.pdf)}" target="_blank" style="color:var(--red)">view original PDF ↗</a>`:""}</div>
      <table><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Unit $</th><th class="num">Total</th></tr></thead>
      <tbody>${lines.map(l=>`
        <tr class="click" onclick="go('p::${encodeURIComponent(supplier)}::${encodeURIComponent((l.code||l.desc)+"@@"+(l.unit||""))}')">
          <td>${esc(l.desc)}</td><td class="num">${l.qty} ${esc(l.unit)}</td>
          <td class="num">${money(l.price)}</td><td class="num">${money(l.total)}</td>
        </tr>`).join("")}</tbody></table>
    </div>`;
}

function renderProduct(supplier,id){
  const [pid,unit=""]=id.split("@@");
  const prods=productsFor(supplier);
  const matches=prods.filter(x=>(x.code&&norm(x.code)===norm(pid))||norm(x.desc)===norm(pid));
  const p=matches.find(x=>norm(x.unit||"")===norm(unit))||matches[0];
  if(!p) return renderSupplier(supplier);
  crumb(supplier+" · "+p.desc);
  const buys=p.buys;
  document.getElementById("app").innerHTML=`
    <a class="back" onclick="go('s::${encodeURIComponent(supplier)}')">${esc(supplier)}</a>
    <div class="statgrid" style="margin-bottom:12px">
      <div class="stat"><div class="v">${money(p.lastPrice)}</div><div class="k">Last price</div></div>
      <div class="stat"><div class="v">${p.avg90?money(p.avg90):"—"}</div><div class="k">90-day avg</div></div>
      <div class="stat"><div class="v">${money(Math.min(...buys.map(b=>b.price)))}</div><div class="k">Cheapest ever</div></div>
      <div class="stat"><div class="v">${money(Math.max(...buys.map(b=>b.price)))}</div><div class="k">Dearest ever</div></div>
    </div>
    <div class="card"><div class="label">${esc(p.desc)} — unit price history</div>${priceChart(buys)}</div>
    <div class="card"><div class="label">Purchases (${buys.length})</div>
      <table><thead><tr><th>Date</th><th class="hide-sm">Invoice</th><th class="hide-sm">Venue</th><th class="num">Qty</th><th class="num">Unit $</th></tr></thead>
      <tbody>${buys.slice().reverse().map(b=>`
        <tr class="click" onclick="go('i::${encodeURIComponent(supplier)}::${encodeURIComponent(b.number)}')">
          <td>${b.date.toLocaleDateString("en-AU")}</td><td class="hide-sm">${esc(b.number)}</td>
          <td class="hide-sm">${esc(b.venue)}</td><td class="num">${b.qty} ${esc(b.unit)}</td>
          <td class="num"><b>${money(b.price)}</b></td>
        </tr>`).join("")}</tbody></table>
    </div>`;
}

/* Simple dependency-free SVG line chart */
function priceChart(buys){
  if(buys.length<2) return '<div style="color:var(--dim);font-size:13px;padding:10px 0">Need at least two purchases to chart a trend.</div>';
  const W=760,H=220,P=42;
  const xs=buys.map(b=>b.date.getTime()), ys=buys.map(b=>b.price);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)*0.97,y1=Math.max(...ys)*1.03;
  const X=t=>P+(t-x0)/((x1-x0)||1)*(W-P-14);
  const Y=v=>H-24-(v-y0)/((y1-y0)||1)*(H-24-14);
  const pts=buys.map(b=>X(b.date.getTime())+","+Y(b.price)).join(" ");
  const ticks=[y0,(y0+y1)/2,y1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${ticks.map(t=>`<line x1="${P}" y1="${Y(t)}" x2="${W-14}" y2="${Y(t)}" stroke="#eee"/><text x="4" y="${Y(t)+3}">$${t.toFixed(2)}</text>`).join("")}
    <polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round"/>
    ${buys.map(b=>`<circle cx="${X(b.date.getTime())}" cy="${Y(b.price)}" r="3.5" fill="var(--red)"><title>${b.date.toLocaleDateString("en-AU")} — $${b.price.toFixed(2)}</title></circle>`).join("")}
    <text x="${P}" y="${H-6}">${buys[0].date.toLocaleDateString("en-AU")}</text>
    <text x="${W-14}" y="${H-6}" text-anchor="end">${buys[buys.length-1].date.toLocaleDateString("en-AU")}</text>
  </svg>`;
}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

loadAll();
</script>
