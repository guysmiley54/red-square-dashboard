<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Explorer</title>
<style>
  :root{
    --ink:#141414; --paper:#f7f6f3; --card:#fff; --line:#e4e2dc; --dim:#6b6862;
    --red:#c8102e; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .num,.v,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  header .dot{width:14px;height:14px;background:var(--red);border-radius:3px;flex:none}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .bld{font-size:11px;color:#8d8b86;font-family:ui-monospace,monospace}
  header .sp{margin-left:auto;display:flex;gap:8px}
  header button{background:#fff;color:var(--ink);border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
  #filters{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:52px;z-index:9}
  .chip{font-size:12px;font-weight:600;padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;user-select:none}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.nav{padding:7px 11px;font-family:ui-monospace,monospace}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .rangelbl{font-size:12px;color:var(--dim);font-family:ui-monospace,monospace;margin-left:2px}
  .wrap{max-width:1120px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .venuegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .vcard{border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}
  .vcard:hover{border-color:var(--ink)}
  .vcard.on{border-color:var(--ink);border-width:2px;padding:15px}
  .vcard .nm{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .vcard .v{font-size:25px;font-weight:700;margin-top:6px}
  .vcard .sub{font-size:11px;color:var(--dim);margin-top:3px}
  .vcard.tot{background:var(--ink);color:#fff;border-color:var(--ink);cursor:default}
  .vcard.tot .nm,.vcard.tot .sub{color:#b8b6b0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  tr.click{cursor:pointer}
  tr.click:hover td{background:#faf9f7}
  .num{text-align:right}
  .bar{height:8px;background:var(--red);border-radius:99px;min-width:2px}
  .barwrap{background:var(--line);border-radius:99px;overflow:hidden}
  input[type=search]{width:100%;font-size:15px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px}
  input[type=search]:focus{outline:none;border-color:var(--red)}
  .muted{color:var(--dim);font-size:12px}
  .note{background:#fff8e5;border:1px solid #f0dca8;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px}
  .chart{display:flex;align-items:flex-end;gap:3px;height:170px;padding-top:10px}
  .chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;cursor:pointer}
  .chart .col:hover .pair{opacity:.75}
  .chart .col.dim{opacity:.28}
  .chart .col.sel .lb{color:var(--ink);font-weight:700}
  .slotbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;background:#faf9f7;border:1px solid var(--line);border-radius:10px;font-size:13px}
  .slotbar .big{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
  .slotbar .vs{color:var(--dim);font-size:12px}
  .chart .pair{display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%}
  .chart .bx{flex:1;min-width:1px;background:var(--red);border-radius:3px 3px 0 0;min-height:1px}
  .chart .bx.prev{background:#d9d6cf}
  .chart .lb{font-size:9px;color:var(--dim);white-space:nowrap;font-family:ui-monospace,monospace;height:12px}
  /* Sortable table headers. The arrow only shows on the active column so the header row
     doesn't turn into a row of noise. */
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{color:var(--ink)}
  th.sorted{color:var(--ink)}
  th .ar{font-size:8px}
  /* Metrics strip under a chart. */
  .metrics{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .metric .k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .metric .val{font-size:19px;font-weight:700;margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .metric .sub{font-size:11px;color:var(--dim);margin-top:2px}
  .up{color:#1a7f37}.down{color:var(--red)}
  .legend{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);text-transform:none;letter-spacing:0;font-weight:400}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .loading{padding:60px 20px;text-align:center;color:var(--dim)}
  @media(max-width:700px){ .hide-sm{display:none} .wrap{padding:12px} }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>Sales Explorer</h1>
  <span class="bld" id="bld"></span>
  <div class="sp"><button onclick="load(true)">&#8635; refresh</button></div>
</header>
<div id="filters"></div>
<div class="wrap"><div id="app"><div class="loading">Loading sales feed&hellip;</div></div></div>

<script>
const SHEET_ID = "1QEUnzY43v3wVc6dP0oGPqgL_mvLRVGHnMYwtO3QMJY4"; // BG Sales Data
// Display order is deliberate: Cambridge, Luma, Glenorchy.
const VENUES = ["Red Square Cambridge","Luma Kitchen","Red Square Glenorchy"];
const VCOLOUR = {"Red Square Cambridge":"#c8102e","Luma Kitchen":"#2d6a6f","Red Square Glenorchy":"#c97a1a"};

// ImPOS category names differ per venue for what is the same thing: Glenorchy encodes
// product type AND service mode in one field (Food D/H), Cambridge and Luma split food by
// service but lump every drink into one Beverage bucket. Mapping both onto a shared pair
// of fields is what makes the venue columns comparable.
//
// "Dine In" and "Takeway Food" are read as FOOD because those venues bucket all drinks
// separately under Beverage. If that ever stops being true, fix it here.
// Keys are lowercased; anything not listed falls through to the raw name and is listed
// under the category table so it can be added rather than silently vanishing.
const CAT_MAP = {
  "beverage":      {type:"Beverage",  mode:"Not specified"},
  "beverage d/h":  {type:"Beverage",  mode:"Dine in"},
  "beverage t/a":  {type:"Beverage",  mode:"Takeaway"},
  "food d/h":      {type:"Food",      mode:"Dine in"},
  "dine in":       {type:"Food",      mode:"Dine in"},
  "food t/a":      {type:"Food",      mode:"Takeaway"},
  "takeway food":  {type:"Food",      mode:"Takeaway"},
  "takeaway food": {type:"Food",      mode:"Takeaway"},
  // Luma runs its own category names for the same things. They roll up to plain Food and
  // Beverage - the venue column already tells you it's Luma, so carrying LUMA in the
  // category as well just splits the totals for no gain.
  "luma food d/h":        {type:"Food",     mode:"Dine in"},
  "luma beverage dine in":{type:"Beverage", mode:"Dine in"},
  "sundries":      {type:"Sundries",  mode:"Not applicable"},
  // Glenorchy emits a handful of rows under a bare "ImPOS" category - system or test
  // entries rather than real sales. Kept visible rather than hidden.
  "impos":         {type:"Uncategorised", mode:"Not specified"},
  "no cat.":       {type:"Uncategorised", mode:"Not specified"}
};

let ROWS=[], HAS_TIME=false, UNMAPPED=[];
// period: day | week | month.  offset: 0 = current, -1 = previous, +1 = next.
// gran: minutes per bar on the single-day chart (60 or 15).
// compare: split the chart bars by venue.
// group: how categories are rolled up - type | mode | raw (raw = exactly as ImPOS sends).
// sort: which product column is driving the table, and which direction (1 asc, -1 desc).
// slot: the chart bar tapped, as {kind:"time"|"day", key}. Filters the tables below the
// chart but never the chart itself, so you keep the shape of the day while drilling in.
let F={period:"day", offset:0, venue:"", cat:"", q:"", gran:60, compare:false,
       group:"type", slot:null, sort:{k:"sales", d:-1}};
// What the last render actually put on screen, so the CSV exports match it exactly
// rather than recomputing the filters and risking drift.
let LAST={drill:[], items:[]};

const money=n=>(n<0?"-$":"$")+Math.abs(+n||0).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>(n<0?"-$":"$")+Math.round(Math.abs(+n||0)).toLocaleString("en-AU");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vShort=v=>String(v||"").replace("Red Square ","RS ").replace("Luma Kitchen","Luma");

function parseTs(v){
  if(v==null||v==="") return null;
  const s=String(v).trim();
  let m=s.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
  if(m) return new Date(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})[T ](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[, ]+(\d{1,2}):(\d{2}))?/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));
  const d=new Date(s); return isNaN(d)?null:d;
}
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtDay=k=>{const p=String(k).split("-");return p[2]+"/"+p[1]+"/"+p[0];};
const fmtShort=k=>{const p=String(k).split("-");return p[2]+"/"+p[1];};

// The visible window. Always anchored on TODAY and shifted by offset, so the app opens
// on the current day and the arrows step back through history. `back` shifts a further
// whole period earlier - back=1 is the equivalent previous day/week/month, which is what
// the comparison toggle draws against.
function windowFor(back){
  const off=F.offset-(back||0);
  const now=new Date(); now.setHours(0,0,0,0);
  if(F.period==="day"){
    const d=new Date(now); d.setDate(d.getDate()+off);
    return {from:dkey(d), to:dkey(d), label:fmtDay(dkey(d)), unit:"day"};
  }
  if(F.period==="week"){
    const a=new Date(now); a.setDate(a.getDate()-((a.getDay()+6)%7)+off*7); // Monday
    const b=new Date(a); b.setDate(b.getDate()+6);
    return {from:dkey(a), to:dkey(b),
      label:fmtShort(dkey(a))+" \u2013 "+fmtShort(dkey(b)), unit:"week"};
  }
  const a=new Date(now.getFullYear(), now.getMonth()+off, 1);
  const b=new Date(a.getFullYear(), a.getMonth()+1, 0);
  return {from:dkey(a), to:dkey(b),
    label:a.toLocaleDateString("en-AU",{month:"long",year:"numeric"}), unit:"month"};
}

function parseCsv(text){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","){row.push(cur);cur="";}
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n")i++; row.push(cur);rows.push(row);row=[];cur=""; }
    else cur+=ch;}
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}

async function load(force){
  document.getElementById("app").innerHTML='<div class="loading">Loading sales feed&hellip;</div>';
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&sheet=SalesFeed"+(force?("&_="+Date.now()):"");
  let text;
  try{ text=await (await fetch(url)).text(); }
  catch(e){
    document.getElementById("app").innerHTML='<div class="card"><b>Couldn\'t load the feed.</b><div class="muted" style="margin-top:6px">Check BG Sales Data is shared as "Anyone with the link can view".</div></div>';
    return;
  }
  const grid=parseCsv(text.trim());
  const head=(grid.shift()||[]).map(h=>h.trim().toLowerCase());
  const ix=n=>head.indexOf(n);
  ROWS=grid.map(r=>{
    const ts=parseTs(r[ix("timestamp")]);
    let day=String(r[ix("date")]||"").trim();
    if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(day)){ const p=day.split("/"); day=p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0"); }
    if(!day&&ts) day=dkey(ts);
    const cat=String(r[ix("category")]||"").trim();
    const m=CAT_MAP[cat.toLowerCase()];
    return { ts:ts, day:day,
      venue:String(r[ix("venue")]||"").trim(),
      category:cat,
      type:m?m.type:cat,          // unmapped falls back to the raw name, never dropped
      mode:m?m.mode:"Not specified",
      mapped:!!m,
      department:String(r[ix("department")]||"").trim(),
      item:String(r[ix("item")]||"").trim(),
      qty:+String(r[ix("qty")]||0).replace(/[^0-9.\-]/g,"")||0,
      sales:+String(r[ix("sales")]||0).replace(/[^0-9.\-]/g,"")||0 };
  }).filter(r=>r.item&&r.day);
  UNMAPPED=Array.from(new Set(ROWS.filter(r=>!r.mapped&&r.category).map(r=>r.category))).sort();
  HAS_TIME = ROWS.some(r=>r.ts && (r.ts.getHours()||r.ts.getMinutes()));
  document.getElementById("bld").textContent=ROWS.length.toLocaleString()+" rows";
  renderFilters(); render();
}

function renderFilters(){
  const w=windowFor();
  document.getElementById("filters").innerHTML=
    '<span class="chip nav" onclick="shift(-1)">&lsaquo;</span>'+
    ["day","week","month"].map(function(p){
      return '<span class="chip '+(F.period===p?"on":"")+'" onclick="setPeriod(\''+p+'\')">'+p[0].toUpperCase()+p.slice(1)+'</span>';
    }).join("")+
    '<span class="chip nav" onclick="shift(1)">&rsaquo;</span>'+
    '<span class="rangelbl">'+esc(w.label)+'</span>'+
    (F.offset!==0?'<span class="chip" onclick="setOffset(0)">Today</span>':"")+
    '<span class="sep"></span>'+
    '<span class="chip '+(F.venue===""?"on":"")+'" onclick="setVenue(\'\')">All venues</span>'+
    VENUES.map(function(v){
      return '<span class="chip '+(F.venue===v?"on":"")+'" onclick="setVenue(\''+v+'\')">'+esc(vShort(v))+'</span>';
    }).join("")+
    '<span class="sep"></span>'+
    '<span class="chip" onclick="exportRows()" title="Every feed row in the current view">\u2193 Rows CSV</span>'+
    '<span class="chip" onclick="exportItems()" title="One row per product, totalled">\u2193 Items CSV</span>';
}

/* ---- CSV export ---------------------------------------------------------------
 * Both exports honour everything currently on screen: date window, venue, category
 * grouping and drill-down, the tapped chart slot, and the product search box. What you
 * see is what you get - if the numbers on screen are filtered, so is the file.
 */
function csvCell(v){
  const s=String(v==null?"":v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvText(rows){
  return rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n");
}
function download(name,text){
  // The BOM makes Excel open UTF-8 correctly instead of mangling accented item names.
  const blob=new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}
// Filename carries the filters so exports don't pile up indistinguishably in Downloads.
function exportName(kind){
  const w=windowFor();
  let n="sales-"+kind+"-"+w.from+(w.from===w.to?"":"-to-"+w.to);
  if(F.venue) n+="-"+vShort(F.venue).toLowerCase().replace(/[^a-z0-9]+/g,"-");
  if(F.cat)   n+="-"+String(F.cat).toLowerCase().replace(/[^a-z0-9]+/g,"-");
  if(F.slot)  n+="-"+slotLabel().replace(/[^0-9a-zA-Z]+/g,"");
  return n+".csv";
}
function exportRows(){
  const rs=LAST.drill;
  if(!rs.length){ alert("Nothing to export in this view."); return; }
  const out=[["timestamp","date","venue","category","type","service","department","item","qty","sales"]];
  rs.slice().sort(function(a,b){
    return (a.ts&&b.ts?a.ts-b.ts:0) || a.venue.localeCompare(b.venue) || a.item.localeCompare(b.item);
  }).forEach(function(r){
    out.push([
      r.ts?fmtStamp(r.ts):"", r.day, r.venue, r.category, r.type, r.mode,
      r.department, r.item, r.qty, r.sales.toFixed(2)
    ]);
  });
  download(exportName("rows"),csvText(out));
}
// One row per product. This is the one to use for tidying up item names - it collapses
// every till entry into a single line per name, so near-duplicates sit next to each other.
function exportItems(){
  const items=LAST.items;
  if(!items.length){ alert("Nothing to export in this view."); return; }
  const head=["item","category","qty","revenue","avg_price"].concat(VENUES.map(function(v){return vShort(v)+" revenue";}));
  const out=[head];
  items.slice().sort(function(a,b){ return a.item.toLowerCase()<b.item.toLowerCase()?-1:1; })
    .forEach(function(i){
      out.push([i.item, i.cat, i.qty, i.sales.toFixed(2),
        (i.qty?i.sales/i.qty:0).toFixed(2)]
        .concat(VENUES.map(function(v){ return (i.v[v]||0).toFixed(2); })));
    });
  download(exportName("items"),csvText(out));
}
function fmtStamp(d){
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+
         p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
function setPeriod(p){ F.period=p; F.offset=0; F.slot=null; renderFilters(); render(); }
function shift(d){ F.offset+=d; F.slot=null; renderFilters(); render(); }
function setOffset(o){ F.offset=o; F.slot=null; renderFilters(); render(); }
function setVenue(v){ F.venue=v; renderFilters(); render(); }
function setCat(c){ F.cat=c; F.q=""; render(); }
function clearSel(){ F.venue=""; F.cat=""; F.slot=null; renderFilters(); render(); }
// Changing granularity moves the bucket boundaries, so an old selection would point at
// a slot that no longer exists.
function setGran(g){ F.gran=g; F.slot=null; render(); }
// Tap a bar to drill into that slot, tap it again to come back out.
function setSlot(kind,key){
  F.slot=(F.slot&&F.slot.kind===kind&&String(F.slot.key)===String(key))?null:{kind:kind,key:key};
  render();
}
function clearSlot(){ F.slot=null; render(); }
// Comparing venues only means something with every venue in view, so turning it on
// clears any single-venue filter rather than showing one lonely bar.
function toggleCompare(){ F.compare=!F.compare; if(F.compare) F.venue=""; renderFilters(); render(); }
function setGroup(g){ F.group=g; F.cat=""; render(); }
// Same column twice flips direction. A new column starts descending for numbers and
// ascending for text, which is what you almost always want on first click.
function setSort(k){
  if(F.sort.k===k) F.sort.d=-F.sort.d;
  else F.sort={k:k, d:(k==="item"||k==="cat")?1:-1};
  render();
}

// The category label a row rolls up to, under the current grouping.
function catVal(r){ return F.group==="raw"?r.category : F.group==="mode"?r.mode : r.type; }
const GROUP_LABEL={type:"Product type", mode:"Dine in / takeaway", raw:"As ImPOS sends it"};

// Does a row fall inside the selected chart bar? No selection means everything does.
function inSlot(r){
  if(!F.slot) return true;
  if(F.slot.kind==="day") return r.day===F.slot.key;
  if(!r.ts) return false;
  const m=r.ts.getHours()*60+r.ts.getMinutes();
  return Math.floor(m/F.gran)*F.gran===F.slot.key;
}
function slotLabel(){
  if(!F.slot) return "";
  return F.slot.kind==="day"?fmtDay(F.slot.key)
    :clock(F.slot.key)+"\u2013"+clock(F.slot.key+F.gran);
}

function inWin(r,w){ return r.day>=w.from && r.day<=w.to; }
function scopedIn(w){
  return ROWS.filter(function(r){
    return inWin(r,w)&&(!F.venue||r.venue===F.venue)&&(!F.cat||catVal(r)===F.cat);
  });
}
function inWindow(r){ return inWin(r,windowFor()); }
function scoped(){ return scopedIn(windowFor()); }

// Bucket revenue for the charts. gran is minutes-of-day (60, 15) or the string "day".
// Pass a venue to bucket only that venue's rows.
function bucket(rs,gran,venue){
  const m={};
  rs.forEach(function(r){
    if(!r.sales) return;
    if(venue&&r.venue!==venue) return;
    if(gran==="day"){ m[r.day]=(m[r.day]||0)+r.sales; return; }
    if(!r.ts) return;
    const mins=r.ts.getHours()*60+r.ts.getMinutes();
    const b=Math.floor(mins/gran)*gran;
    m[b]=(m[b]||0)+r.sales;
  });
  return m;
}
const clock=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const sum=o=>Object.keys(o).reduce(function(s,k){return s+o[k];},0);

// One metric tile. `sub` carries the secondary line.
function metric(k,val,sub,colour){
  return '<div class="metric"><div class="k">'+k+'</div>'+
    '<div class="val"'+(colour?' style="color:'+colour+'"':'')+'>'+val+'</div>'+
    (sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
}

function render(){
  const w=windowFor();
  const app=document.getElementById("app");
  const all=ROWS.filter(inWindow);   // window only - drives the venue cards
  const rows=scoped();               // window + venue + category - drives the chart
  const drill=rows.filter(inSlot);   // + the selected chart bar - drives the tables
  LAST.drill=drill;

  if(!all.length){
    app.innerHTML='<div class="card"><div class="label">'+esc(w.label)+'</div>'+
      '<p style="margin:6px 0 0">No sales recorded in this '+w.unit+'.</p>'+
      '<div class="muted" style="margin-top:8px">Use &lsaquo; &rsaquo; to move between '+w.unit+'s, or pick a wider period.</div></div>';
    return;
  }

  // ---- headline: one card per venue, in the fixed Cambridge / Luma / Glenorchy order
  const vTot={}; let grand=0;
  all.forEach(function(r){ vTot[r.venue]=(vTot[r.venue]||0)+r.sales; grand+=r.sales; });
  const venueCards=VENUES.map(function(v){
    const s=vTot[v]||0;
    return '<div class="vcard '+(F.venue===v?"on":"")+'" onclick="setVenue(\''+(F.venue===v?"":v)+'\')">'+
      '<div class="nm">'+esc(vShort(v))+'</div>'+
      '<div class="v">'+money0(s)+'</div>'+
      '<div class="sub">'+(grand?Math.round(s/grand*100):0)+'% of takings</div></div>';
  }).join("");

  const sel=drill.reduce(function(s,r){return s+r.sales;},0);
  const units=drill.reduce(function(s,r){return s+(r.sales>0?r.qty:0);},0);

  // ---- trend: time-of-day on a single day, day-by-day across a week or month.
  // With comparison on, each time slot gets one bar per venue in the fixed venue order,
  // so you can read who is busy when rather than just the combined shape.
  let chart="";
  const liveVenues=VENUES.filter(function(v){ return rows.some(function(r){return r.venue===v&&r.sales;}); });
  const series=F.compare?liveVenues:[null];        // null = one combined bar
  const colour=v=>v?VCOLOUR[v]:"var(--red)";
  const cmpChip='<span class="chip" style="padding:4px 10px;'+(F.compare?"background:var(--ink);color:#fff;border-color:var(--ink)":"")+'" '+
    'onclick="toggleCompare()">'+(F.compare?"\u2713 ":"")+'Compare venues</span>';
  const cmpLegend=F.compare
    ? '<span class="legend">'+liveVenues.map(function(v){
        return '<i style="background:'+VCOLOUR[v]+'"></i>'+esc(vShort(v));
      }).join(" ")+'</span>'
    : "";

  if(HAS_TIME && F.period==="day"){
    const g=F.gran;
    const bySeries=series.map(function(v){ return bucket(rows,g,v); });
    const keys=[].concat.apply([],bySeries.map(function(b){return Object.keys(b).map(Number);}));
    if(keys.length){
      const lo=Math.min.apply(null,keys), hi=Math.max.apply(null,keys);
      const max=Math.max.apply(null,[1].concat([].concat.apply([],bySeries.map(function(b){
        return Object.keys(b).map(function(k){return b[k];}); }))));
      let cols="";
      for(let b=lo;b<=hi;b+=g){
        // At 15 minutes there are too many bars to label every one, so only the top of
        // each hour gets a tick. The full range stays in the hover title either way.
        const lbl=(g===60)?String(b/60):(b%60===0?String(b/60):"");
        const tip=series.map(function(v,i){
          return (v?vShort(v)+" ":"")+money(bySeries[i][b]||0);
        }).join("  \u00b7  ");
        const on=F.slot&&F.slot.kind==="time"&&F.slot.key===b;
        const cls="col"+(F.slot&&F.slot.kind==="time"?(on?" sel":" dim"):"");
        cols+='<div class="'+cls+'" onclick="setSlot(\'time\','+b+')" title="'+clock(b)+'\u2013'+clock(b+g)+' \u2014 '+tip+'"><div class="pair">'+
          series.map(function(v,i){
            return '<div class="bx" style="height:'+Math.round((bySeries[i][b]||0)/max*140)+
                   'px;background:'+colour(v)+'"></div>';
          }).join("")+
          '</div><div class="lb">'+lbl+'</div></div>';
      }
      // Revenue per hour is measured across the trading span actually observed, not a
      // notional opening time - first slot with a sale to last, inclusive.
      const span=(hi-lo+g)/60;
      let mets;
      if(F.compare){
        mets=series.map(function(v,i){
          const t=sum(bySeries[i]);
          return metric(vShort(v),money0(t),money0(span?t/span:0)+"/hr",VCOLOUR[v]);
        }).join("")+metric("All venues",money0(sum(bucket(rows,g))),span.toFixed(1)+" hours trading");
      }else{
        const cur=bySeries[0], total=sum(cur);
        const bKeys=Object.keys(cur).map(Number);
        const peak=bKeys.length?bKeys.reduce(function(m,k){return cur[k]>cur[m]?k:m;},bKeys[0]):null;
        mets=metric("Revenue",money0(total),esc(w.label))+
          metric("Per hour",money0(span?total/span:0),span.toFixed(1)+" hours trading")+
          (peak!==null?metric("Busiest "+(g===60?"hour":"15 min"),clock(peak),money(cur[peak])):"")+
          metric("Per "+(g===60?"hour":"15 min")+" avg",money0(bKeys.length?total/((hi-lo)/g+1):0),
                 ((hi-lo)/g+1)+" slots");
      }
      chart='<div class="card"><div class="label">Sales by time of day'+
        '<span class="chip" style="padding:4px 10px;'+(g===60?"background:var(--ink);color:#fff;border-color:var(--ink)":"")+'" onclick="setGran(60)">Hourly</span>'+
        '<span class="chip" style="padding:4px 10px;'+(g===15?"background:var(--ink);color:#fff;border-color:var(--ink)":"")+'" onclick="setGran(15)">15 min</span>'+
        cmpChip+cmpLegend+'</div>'+
        '<div class="chart">'+cols+'</div>'+
        '<div class="metrics">'+mets+'</div></div>';
    }
  } else if(F.period!=="day"){
    const bySeries=series.map(function(v){ return bucket(rows,"day",v); });
    const days=Object.keys(bucket(rows,"day")).sort();
    if(days.length>1){
      const max=Math.max.apply(null,[1].concat([].concat.apply([],bySeries.map(function(b){
        return Object.keys(b).map(function(k){return b[k];}); }))));
      const cols=days.map(function(d){
        const tip=series.map(function(v,i){
          return (v?vShort(v)+" ":"")+money(bySeries[i][d]||0);
        }).join("  \u00b7  ");
        const on=F.slot&&F.slot.kind==="day"&&F.slot.key===d;
        const cls="col"+(F.slot&&F.slot.kind==="day"?(on?" sel":" dim"):"");
        return '<div class="'+cls+'" onclick="setSlot(\'day\',\''+d+'\')" title="'+fmtDay(d)+' \u2014 '+tip+'"><div class="pair">'+
          series.map(function(v,i){
            return '<div class="bx" style="height:'+Math.round((bySeries[i][d]||0)/max*140)+
                   'px;background:'+colour(v)+'"></div>';
          }).join("")+
          '</div><div class="lb">'+fmtShort(d)+'</div></div>';
      }).join("");
      let mets;
      if(F.compare){
        mets=series.map(function(v,i){
          const t=sum(bySeries[i]);
          return metric(vShort(v),money0(t),money0(t/days.length)+"/day",VCOLOUR[v]);
        }).join("")+metric("All venues",money0(sum(bucket(rows,"day"))),days.length+" trading days");
      }else{
        const cur=bySeries[0], total=sum(cur);
        const best=days.reduce(function(m,d){return cur[d]>cur[m]?d:m;},days[0]);
        mets=metric("Revenue",money0(total),esc(w.label))+
          metric("Per day",money0(total/days.length),days.length+" trading days")+
          metric("Best day",fmtShort(best),money(cur[best]));
      }
      chart='<div class="card"><div class="label">Sales by day'+cmpChip+cmpLegend+'</div>'+
        '<div class="chart">'+cols+'</div>'+
        '<div class="metrics">'+mets+'</div></div>';
    }
  }

  // Tapped-bar readout. Sits between the chart and its metrics so the number you asked
  // for by tapping is right under the bar you tapped.
  let slotBar="";
  if(F.slot){
    const st=drill.reduce(function(s,r){return s+r.sales;},0);
    const su=drill.reduce(function(s,r){return s+(r.sales>0?r.qty:0);},0);
    const byV=VENUES.map(function(v){
      const t=drill.reduce(function(s,r){return s+(r.venue===v?r.sales:0);},0);
      return t?'<span class="vs"><b style="color:'+VCOLOUR[v]+'">\u25a0</b> '+esc(vShort(v))+' '+money0(t)+'</span>':"";
    }).filter(Boolean).join("");
    const share=sum(bucket(rows,F.slot.kind==="day"?"day":F.gran));
    slotBar='<div class="slotbar"><b>'+esc(slotLabel())+'</b>'+
      '<span class="big">'+money(st)+'</span>'+
      '<span class="vs">'+su.toLocaleString()+' items \u00b7 '+
        (share?Math.round(st/share*100):0)+'% of the '+(F.slot.kind==="day"?"period":"day")+'</span>'+
      byV+
      '<span class="chip" style="padding:4px 10px;margin-left:auto" onclick="clearSlot()">clear</span></div>';
    chart=chart.replace('<div class="metrics">',slotBar+'<div class="metrics">');
  }

  // ---- categories, rolled up onto the shared mapping so the venue columns line up.
  // Venue columns appear when no single venue is selected, so the table doubles as a
  // side-by-side comparison. Rows drill into the products below.
  const showCols = !F.venue;
  const catMap={};
  ROWS.filter(function(r){return inWindow(r)&&(!F.venue||r.venue===F.venue)&&inSlot(r);}).forEach(function(r){
    if(!r.sales)return;
    const k=catVal(r);
    const c=catMap[k]||(catMap[k]={total:0,v:{}});
    c.total+=r.sales; c.v[r.venue]=(c.v[r.venue]||0)+r.sales;
  });
  const catRows=Object.keys(catMap).map(function(k){return [k,catMap[k]];}).sort(function(a,b){return b[1].total-a[1].total;});
  const catMax=catRows.length?catRows[0][1].total:1;
  const catTotal=catRows.reduce(function(s,e){return s+e[1].total;},0);

  const groupChips=["type","mode","raw"].map(function(g){
    return '<span class="chip" style="padding:4px 10px;'+(F.group===g?"background:var(--ink);color:#fff;border-color:var(--ink)":"")+
      '" onclick="setGroup(\''+g+'\')">'+GROUP_LABEL[g]+'</span>';
  }).join("");
  // If ImPOS starts sending a category the map doesn't know, say so rather than quietly
  // filing it under its own raw name and letting the venue columns drift apart again.
  const unmappedNote=(F.group!=="raw"&&UNMAPPED.length)
    ? '<div class="muted" style="margin-top:10px">Not in the category map, shown under their own names: <b>'+
      UNMAPPED.map(esc).join("</b>, <b>")+'</b>.</div>'
    : "";

  let catTable="";
  if(catRows.length){
    const head='<tr><th>'+esc(GROUP_LABEL[F.group])+'</th>'+
      (showCols?VENUES.map(function(v){return '<th class="num hide-sm">'+esc(vShort(v))+'</th>';}).join(""):'<th class="hide-sm"></th>')+
      '<th class="num">Total</th><th class="num" style="width:52px">%</th></tr>';
    const body=catRows.map(function(e){
      const c=e[0], o=e[1];
      const cells=showCols
        ? VENUES.map(function(v){return '<td class="num hide-sm">'+(o.v[v]?money0(o.v[v]):'<span style="color:var(--line)">\u2013</span>')+'</td>';}).join("")
        : '<td class="hide-sm"><div class="barwrap"><div class="bar" style="width:'+Math.round(o.total/catMax*100)+'%"></div></div></td>';
      return '<tr class="click" onclick="setCat('+JSON.stringify(F.cat===c?"":c).replace(/"/g,"&quot;")+')">'+
        '<td><b>'+esc(c)+'</b>'+(F.cat===c?' <span class="muted">(showing)</span>':'')+'</td>'+
        cells+'<td class="num"><b>'+money(o.total)+'</b></td>'+
        '<td class="num muted">'+(catTotal?Math.round(o.total/catTotal*100):0)+'%</td></tr>';
    }).join("");
    catTable='<div class="card"><div class="label">By category'+groupChips+
      (F.cat?'<span style="text-transform:none;letter-spacing:0;font-weight:400">drilled into <b style="color:var(--ink)">'+esc(F.cat)+'</b></span>'
            :'<span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">tap a row to drill in</span>')+
      '</div><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>'+unmappedNote+'</div>';
  }

  // ---- products, with the same per-venue comparison columns
  const itemMap={};
  drill.forEach(function(r){
    if(!r.sales&&!r.qty)return;
    const o=itemMap[r.item]||(itemMap[r.item]={item:r.item,cat:catVal(r),qty:0,sales:0,v:{}});
    o.qty+=r.qty; o.sales+=r.sales; o.v[r.venue]=(o.v[r.venue]||0)+r.sales;
  });
  let items=Object.keys(itemMap).map(function(k){return itemMap[k];})
    .filter(function(i){return i.sales>0;});
  const q=F.q.toLowerCase();
  if(q) items=items.filter(function(i){return i.item.toLowerCase().indexOf(q)!==-1||i.cat.toLowerCase().indexOf(q)!==-1;});

  // Sort by whichever header was last clicked. Venue columns use a "v:<venue>" key so
  // they sort on that venue's revenue for the product.
  function val(i,k){
    if(k==="item") return i.item.toLowerCase();
    if(k==="cat")  return i.cat.toLowerCase();
    if(k==="qty")  return i.qty;
    if(k==="avg")  return i.qty?i.sales/i.qty:0;
    if(k.indexOf("v:")===0) return i.v[k.slice(2)]||0;
    return i.sales;
  }
  items.sort(function(a,b){
    const x=val(a,F.sort.k), y=val(b,F.sort.k);
    return x<y?-F.sort.d : x>y?F.sort.d : 0;
  });
  LAST.items=items;

  const selNote=(F.venue||F.cat)
    ? '<div class="muted" style="margin-top:12px">Showing <b>'+(F.venue?esc(vShort(F.venue)):"all venues")+'</b>'+
      (F.cat?' \u00b7 <b>'+esc(F.cat)+'</b>':'')+' \u2014 '+money(sel)+' from '+units.toLocaleString()+' items.'+
      '<span class="chip" style="margin-left:8px;padding:4px 10px" onclick="clearSel()">clear</span></div>'
    : "";

  function sortTh(k,lbl,cls){
    const on=F.sort.k===k;
    return '<th class="'+(cls||"")+' sortable'+(on?" sorted":"")+'" onclick="setSort('+
      JSON.stringify(k).replace(/"/g,"&quot;")+')">'+esc(lbl)+
      (on?' <span class="ar">'+(F.sort.d<0?"\u25bc":"\u25b2")+'</span>':"")+'</th>';
  }
  const itemHead='<tr>'+sortTh("item","Product")+
    (F.cat?"":sortTh("cat","Category","hide-sm"))+
    (showCols?VENUES.map(function(v){return sortTh("v:"+v,vShort(v),"num hide-sm");}).join(""):"")+
    sortTh("qty","Qty","num")+sortTh("avg","Avg $","num hide-sm")+sortTh("sales","Revenue","num")+'</tr>';
  const itemBody=items.slice(0,200).map(function(i){
    return '<tr><td><b>'+esc(i.item)+'</b></td>'+
      (F.cat?"":'<td class="hide-sm muted">'+esc(i.cat)+'</td>')+
      (showCols?VENUES.map(function(v){return '<td class="num hide-sm">'+(i.v[v]?money0(i.v[v]):'<span style="color:var(--line)">\u2013</span>')+'</td>';}).join(""):"")+
      '<td class="num">'+i.qty.toLocaleString()+'</td>'+
      '<td class="num hide-sm">'+money(i.qty?i.sales/i.qty:0)+'</td>'+
      '<td class="num"><b>'+money(i.sales)+'</b></td></tr>';
  }).join("");

  app.innerHTML=
    (HAS_TIME?"":'<div class="note"><b>Hourly view is waiting on data.</b> Timestamps currently carry a date but no clock time, so sales can\'t be split by hour yet. It will appear automatically once the fixed processor has run.</div>')+
    '<div class="card"><div class="label">'+esc(w.label)+' \u2014 takings by venue</div>'+
      '<div class="venuegrid">'+venueCards+
        '<div class="vcard tot"><div class="nm">All venues</div><div class="v">'+money0(grand)+'</div>'+
        '<div class="sub">'+(F.period==="day"?"this day":"this "+w.unit)+'</div></div>'+
      '</div>'+selNote+'</div>'+
    chart+catTable+
    '<div class="card"><div class="label">Products ('+items.length+')'+(F.cat?' in '+esc(F.cat):'')+
      ' <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">tap a column to sort</span></div>'+
      '<input type="search" id="q" placeholder="Search products\u2026" value="'+esc(F.q)+'">'+
      (items.length?'<table><thead>'+itemHead+'</thead><tbody>'+itemBody+'</tbody></table>':'<div class="muted">No products match.</div>')+
      (items.length>200?'<div class="muted" style="margin-top:8px">Showing the top 200 of '+items.length+'. Search to narrow.</div>':'')+
    '</div>';

  const qb=document.getElementById("q");
  if(qb) qb.addEventListener("input",function(){
    F.q=qb.value; const p=qb.selectionStart; render();
    const nb=document.getElementById("q"); if(nb){ nb.focus(); nb.setSelectionRange(p,p); }
  });
}

load();
</script>
</body>
</html>
