<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Explorer</title>
<style>
  :root{
    --ink:#141414; --paper:#f7f6f3; --card:#fff; --line:#e4e2dc; --dim:#6b6862;
    --red:#c8102e; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .num,.v,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  header .dot{width:14px;height:14px;background:var(--red);border-radius:3px;flex:none}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .bld{font-size:11px;color:#8d8b86;font-family:ui-monospace,monospace}
  header .sp{margin-left:auto;display:flex;gap:8px}
  header button{background:#fff;color:var(--ink);border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
  #filters{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:52px;z-index:9}
  .chip{font-size:12px;font-weight:600;padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;user-select:none}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.nav{padding:7px 11px;font-family:ui-monospace,monospace}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .rangelbl{font-size:12px;color:var(--dim);font-family:ui-monospace,monospace;margin-left:2px}
  .wrap{max-width:1120px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .venuegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .vcard{border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}
  .vcard:hover{border-color:var(--ink)}
  .vcard.on{border-color:var(--ink);border-width:2px;padding:15px}
  .vcard .nm{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .vcard .v{font-size:25px;font-weight:700;margin-top:6px}
  .delta{font-size:12px;font-weight:700;margin-top:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .delta .vs{font-weight:400;opacity:.7;font-family:inherit}
  .delta.up{color:#1a7f37}
  .delta.down{color:var(--red)}
  .vcard.tot .delta.up{color:#6ee7a0}
  .vcard.tot .delta.down{color:#ff9aa8}
  .vcard.tot .delta.muted{color:#9a9891}
  .vcard .sub{font-size:11px;color:var(--dim);margin-top:3px}
  .vcard.tot{background:var(--ink);color:#fff;border-color:var(--ink);cursor:default}
  .vcard.tot .nm,.vcard.tot .sub{color:#b8b6b0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  tr.click{cursor:pointer}
  tr.click:hover td{background:#faf9f7}
  .num{text-align:right}
  .bar{height:8px;background:var(--red);border-radius:99px;min-width:2px}
  .barwrap{background:var(--line);border-radius:99px;overflow:hidden}
  input[type=search]{width:100%;font-size:15px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px}
  input[type=search]:focus{outline:none;border-color:var(--red)}
  .muted{color:var(--dim);font-size:12px}
  .note{background:#fff8e5;border:1px solid #f0dca8;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px}
  .chart{display:flex;align-items:flex-end;gap:3px;height:170px;padding-top:10px}
  .chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;cursor:pointer}
  .chart .col:hover .pair{opacity:.75}
  .chart .col.dim{opacity:.28}
  .chart .col.sel .lb{color:var(--ink);font-weight:700}
  tfoot tr.tot td{border-top:2px solid var(--ink);border-bottom:0;padding-top:10px}
  tr.selrow{background:#faf9f7}
  tr.selrow td{font-weight:700}
  td.free{color:#b8860b}
  .slotbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;background:#faf9f7;border:1px solid var(--line);border-radius:10px;font-size:13px}
  .slotbar .big{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
  .slotbar .vs{color:var(--dim);font-size:12px}
  .chart .pair{display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%}
  .chart .bx{flex:1;min-width:1px;background:var(--red);border-radius:3px 3px 0 0;min-height:1px}
  /* Labour sits behind the revenue bars, on its own scale - the two are different units,
     so the comparison is of shape, not height. */
  .chart .col{position:relative}
  .labbar{position:absolute;left:1px;right:1px;bottom:16px;background:#c9c6bf;border-radius:3px 3px 0 0;z-index:0}
  .chart .pair{position:relative;z-index:1}
  .chart .bx.prev{background:#d9d6cf}
  .chart .lb{font-size:9px;color:var(--dim);white-space:nowrap;font-family:ui-monospace,monospace;height:12px}
  /* Sortable table headers. The arrow only shows on the active column so the header row
     doesn't turn into a row of noise. */
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{color:var(--ink)}
  th.sorted{color:var(--ink)}
  th .ar{font-size:8px}
  /* Metrics strip under a chart. */
  .metrics{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .metric .k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .metric .val{font-size:19px;font-weight:700;margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .metric .sub{font-size:11px;color:var(--dim);margin-top:2px}
  .up{color:#1a7f37}.down{color:var(--red)}
  .legend{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);text-transform:none;letter-spacing:0;font-weight:400}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .loading{padding:60px 20px;text-align:center;color:var(--dim)}
  @media(max-width:700px){ .hide-sm{display:none} .wrap{padding:12px} }
  @media print{
    header,#filters,#reportpanel,.chip,#q{display:none !important}
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    /* Never break-inside:avoid a whole card - one taller than a page gets clipped to the
       first page rather than flowing. Keep small blocks intact and let tables run. */
    .card{border-color:#ccc;margin-bottom:10px;break-inside:auto}
    .metrics,.label,.chart,.venuegrid{break-inside:avoid;page-break-inside:avoid}
    thead{display:table-header-group}
    tfoot{display:table-footer-group}
    tr{break-inside:avoid;page-break-inside:avoid}
    .hide-sm{display:table-cell !important}
    /* Sections switched off in the report panel */
    .no-venues [data-sec="venues"],.no-chart [data-sec="chart"],.no-cats [data-sec="cats"],
    .no-products [data-sec="products"],.no-waste [data-sec="waste"]{display:none !important}
    @page{margin:14mm}
  }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>Sales Explorer</h1>
  <span class="bld" id="bld"></span>
  <div class="sp">
    <button onclick="togglePriv()" id="privbtn">&#128274; private</button>
    <button onclick="toggleReport()">&#9744; report</button>
    <button onclick="load(true)">&#8635; refresh</button>
  </div>
</header>
<div id="filters"></div>
<div class="wrap"><div id="app"><div class="loading">Loading sales feed&hellip;</div></div></div>

<script>
const SHEET_ID = "1QEUnzY43v3wVc6dP0oGPqgL_mvLRVGHnMYwtO3QMJY4"; // BG Sales Data
// Display order is deliberate: Cambridge, Luma, Glenorchy.
const VENUES = ["Red Square Cambridge","Luma Kitchen","Red Square Glenorchy"];
// Tab in the same spreadsheet holding the item name map. Missing tab = no mapping.
const ITEM_TAB = "ItemMap";
// Tab holding the analytics overrides: from / group / type / service. "from" is a
// DEPARTMENT name or an ITEM name, and item rows beat department rows. Nothing here
// changes the feed - it only changes how rows are grouped for analysis, so the SalesFeed
// tab always keeps exactly what ImPOS sent.
const OVER_TAB = "Overrides";
// Optional fallback: if matching by tab NAME fails (a stray space, a rename), put the tab's
// gid here and it will be used instead. Get it by clicking the tab and reading #gid=NNN
// off the end of the browser URL. Leave as "" to match by name.
const ITEM_GID = "";
const OVER_GID = "";
// Two groups are lanes rather than categories. Modifiers are real sales (an extra shot is
// revenue) so they stay in. Kitchen requests are NOT sales at all - staff ring them up to
// send a prep message to the kitchen printer - so they are pulled out of sales AND out of
// wastage, and reported separately.
const LANE_MODIFIER = "Modifiers";
// Perishable groups: a $0 line here is food in the bin. Elsewhere a $0 line usually is not
// - Coffee & Tea is dominated by the 100% Coffee Loyalty discount, which costs margin but
// is a deliberate give-away to a paying regular, not waste.
const PERISHABLE = ["Sandwiches","Cakes & Sweets","Hot Takeaway","Grab & Go"];
const LOYALTY_GROUP = "Coffee & Tea";
function isPerishable(g){ return PERISHABLE.indexOf(g)>-1; }
const LANE_KITCHEN  = "Kitchen requests";
const VCOLOUR = {"Red Square Cambridge":"#c8102e","Luma Kitchen":"#2d6a6f","Red Square Glenorchy":"#c97a1a"};

// ImPOS category names differ per venue for what is the same thing: Glenorchy encodes
// product type AND service mode in one field (Food D/H), Cambridge and Luma split food by
// service but lump every drink into one Beverage bucket. Mapping both onto a shared pair
// of fields is what makes the venue columns comparable.
//
// "Dine In" and "Takeway Food" are read as FOOD because those venues bucket all drinks
// separately under Beverage. If that ever stops being true, fix it here.
// Keys are lowercased; anything not listed falls through to the raw name and is listed
// under the category table so it can be added rather than silently vanishing.
const CAT_MAP = {
  "beverage":      {type:"Beverage",  mode:"Not specified"},
  "beverage d/h":  {type:"Beverage",  mode:"Dine in"},
  "beverage t/a":  {type:"Beverage",  mode:"Takeaway"},
  "food d/h":      {type:"Food",      mode:"Dine in"},
  "dine in":       {type:"Food",      mode:"Dine in"},
  "food t/a":      {type:"Food",      mode:"Takeaway"},
  "takeway food":  {type:"Food",      mode:"Takeaway"},
  "takeaway food": {type:"Food",      mode:"Takeaway"},
  // Luma runs its own category names for the same things. They roll up to plain Food and
  // Beverage - the venue column already tells you it's Luma, so carrying LUMA in the
  // category as well just splits the totals for no gain.
  "luma food d/h":        {type:"Food",     mode:"Dine in"},
  "luma beverage dine in":{type:"Beverage", mode:"Dine in"},
  "sundries":      {type:"Sundries",  mode:"Not applicable"},
  // Glenorchy emits a handful of rows under a bare "ImPOS" category - system or test
  // entries rather than real sales. Kept visible rather than hidden.
  "impos":         {type:"Uncategorised", mode:"Not specified"},
  "no cat.":       {type:"Uncategorised", mode:"Not specified"}
};

let ROWS=[], HAS_TIME=false, UNMAPPED=[];
let ITEM_MAP={}, ITEM_MAP_COUNT=0;
/* Deputy shifts, for the labour overlay. A shift is a start, an end and a total cost -
   Deputy does not cost minute by minute - so a 15-minute figure means spreading each
   shift evenly across the slots it covers. Good enough for "are we overstaffed at 2pm";
   it smooths a penalty-rate boundary, so it is not payroll. */
let SHIFTS=[], SHIFTS_OK=false;
// Deputy names venues its own way; fold them onto the sales feed's names.
const DEPUTY_VENUE={
  "red square cambridge":"Red Square Cambridge",
  "luma kitchen":"Luma Kitchen",
  "red square glenorchy":"Red Square Glenorchy"
};
let OVER_ITEM={}, OVER_DEPT={}, OVER_COUNT=0, KITCHEN_ROWS=0;
let ITEM_TAB_FOUND=false, OVER_TAB_FOUND=false, OVER_DIAG="";
// period: day | week | month.  offset: 0 = current, -1 = previous, +1 = next.
// gran: minutes per bar on the single-day chart (60 or 15).
// compare: split the chart bars by venue.
// group: how categories are rolled up - type | mode | raw (raw = exactly as ImPOS sends).
// sort: which product column is driving the table, and which direction (1 asc, -1 desc).
// slot: the chart bar tapped, as {kind:"time"|"day", key}. Filters the tables below the
// chart but never the chart itself, so you keep the shape of the day while drilling in.
// venues: [] means all. Multiple can be selected - Cambridge and Luma share a building,
// so their combined trade is a real number Adrian needs, not two numbers to add up.
// item: the product drilled into from the table.
// wasteOpen: the wastage card is collapsed by default - it matters weekly, not every time
// you open the page, and it was pushing the product search below the fold.
// pars: optional suggested-par columns on the products table.
// show: which sections go into a printed report.
let F={period:"day", offset:0, venues:[], cat:"", q:"", gran:60, compare:false, wsort:{k:"value",d:-1},
       wasteOpen:false, report:false,
       // Which optional product columns are on. Default is the short view Adrian asked
       // for: Product, Sold, per day, Revenue. Everything else is opt-in.
       cols:{perDay:true, par:false, free:false, avg:false},
       // On by default. Labour % against target is what this dashboard is for, and leaving
       // it behind a toggle meant the headline number was one click away from every view.
       labour:true,
       // Last date looked at, so a view change can return to it. Session-only.
       anchor:null,
       // Sections collapsed on screen. Wastage starts collapsed; the rest start open.
       hide:{venues:false, chart:false, cats:false, products:false},
       // Private mode: only the venues you have selected show their money. For handing a
       // screen or a printout to one venue's manager without exposing the others.
       priv:false,
       show:{venues:true, chart:true, cats:true, products:true, waste:true},
       group:"type", grp:"", slot:null, item:"", sort:{k:"sales", d:-1}};
// What the last render actually put on screen, so the CSV exports match it exactly
// rather than recomputing the filters and risking drift.
let LAST={drill:[], items:[]};

const money=n=>(n<0?"-$":"$")+Math.abs(+n||0).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>(n<0?"-$":"$")+Math.round(Math.abs(+n||0)).toLocaleString("en-AU");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vShort=v=>String(v||"").replace("Red Square ","RS ").replace("Luma Kitchen","Luma");

function parseTs(v){
  if(v==null||v==="") return null;
  const s=String(v).trim();
  let m=s.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
  if(m) return new Date(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})[T ](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[, ]+(\d{1,2}):(\d{2}))?/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));
  const d=new Date(s); return isNaN(d)?null:d;
}
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
/** "HH:MM" -> minutes since midnight, or null. */
function hhmm(v){
  const m=String(v||"").match(/^(\d{1,2}):(\d{2})/);
  return m?Number(m[1])*60+Number(m[2]):null;
}
/** A date cell that may be text or a Date, depending on how Sheets typed it. */
function dkeyOf(v){
  const s=String(v||"").trim();
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  const d=new Date(s);
  return isNaN(d)?"":dkey(d);
}
function num(v){ const n=Number(String(v==null?"":v).replace(/[$,\s]/g,"")); return isNaN(n)?0:n; }
const fmtDay=k=>{const p=String(k).split("-");return p[2]+"/"+p[1]+"/"+p[0];};
const fmtShort=k=>{const p=String(k).split("-");return p[2]+"/"+p[1];};

// The visible window. Always anchored on TODAY and shifted by offset, so the app opens
// on the current day and the arrows step back through history. `back` shifts a further
// whole period earlier - back=1 is the equivalent previous day/week/month, which is what
// the comparison toggle draws against.
function windowFor(back){
  const off=F.offset-(back||0);
  const now=new Date(); now.setHours(0,0,0,0);
  if(F.period==="day"){
    const d=new Date(now); d.setDate(d.getDate()+off);
    return {from:dkey(d), to:dkey(d), label:fmtDay(dkey(d)), unit:"day"};
  }
  if(F.period==="week"){
    const a=new Date(now); a.setDate(a.getDate()-((a.getDay()+6)%7)+off*7); // Monday
    const b=new Date(a); b.setDate(b.getDate()+6);
    return {from:dkey(a), to:dkey(b),
      label:fmtShort(dkey(a))+" \u2013 "+fmtShort(dkey(b)), unit:"week"};
  }
  const a=new Date(now.getFullYear(), now.getMonth()+off, 1);
  const b=new Date(a.getFullYear(), a.getMonth()+1, 0);
  return {from:dkey(a), to:dkey(b),
    label:a.toLocaleDateString("en-AU",{month:"long",year:"numeric"}), unit:"month"};
}

function parseCsv(text){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","){row.push(cur);cur="";}
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n")i++; row.push(cur);rows.push(row);row=[];cur=""; }
    else cur+=ch;}
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}

async function load(force){
  document.getElementById("app").innerHTML='<div class="loading">Loading sales feed&hellip;</div>';
  const bust=force?("&_="+Date.now()):"";
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&headers=1&sheet=SalesFeed"+bust;
  let text;
  try{ text=await (await fetch(url)).text(); }
  catch(e){
    document.getElementById("app").innerHTML='<div class="card"><b>Couldn\'t load the feed.</b><div class="muted" style="margin-top:6px">Check BG Sales Data is shared as "Anyone with the link can view".</div></div>';
    return;
  }

  // Item name map, from the ItemMap tab of the same spreadsheet: two columns, the POS name
  // and the name it should roll up to. Edited in Sheets, no code change needed. If the tab
  // is missing or unreadable the dashboard carries on with raw POS names - a missing map is
  // a tidiness problem, not a reason to show nothing.
  // Built into a local object and assigned at the end, so two overlapping loads (a refresh
  // mid-fetch) can't interleave into a half-built map or double-count.
  // Fetch a lookup tab by name, falling back to its gid. ALWAYS cache-busted: these tabs
  // get created and edited while the page is open, and a cached 404 from before the tab
  // existed is otherwise indistinguishable from a missing tab.
  async function fetchTab(name,gid){
    // headers=1 is essential: gviz otherwise GUESSES how many leading rows are headers,
    // and a tab whose first rows are all text (the department rows) gets dozens of them
    // folded into one mangled header row, silently losing the data.
    const base="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&headers=1&_="+Date.now();
    const tries=[base+"&sheet="+encodeURIComponent(name)];
    if(gid) tries.push(base+"&gid="+encodeURIComponent(gid));
    for(const u of tries){
      try{
        const res=await fetch(u);
        if(!res.ok) continue;
        const t=await res.text();
        // gviz answers a bad sheet name with an HTML error page, or a JS error callback.
        if(!t || t.trim().charAt(0)==="<" || t.indexOf("google.visualization.Query.setResponse")>-1) continue;
        return t;
      }catch(e){ /* try the next form */ }
    }
    return null;
  }

  const im={}; let imN=0; let imFound=false;
  try{
    const mTxt=await fetchTab(ITEM_TAB,ITEM_GID);
    if(mTxt){
      imFound=true;
      const mg=parseCsv(mTxt.trim());
      const mh=(mg.shift()||[]).map(h=>h.trim().toLowerCase());
      // Accept either the review file's column names or a plain two-column sheet.
      let fi=mh.indexOf("item_from"); if(fi<0) fi=mh.indexOf("from"); if(fi<0) fi=0;
      let ti=mh.indexOf("maps_to");   if(ti<0) ti=mh.indexOf("to");   if(ti<0) ti=1;
      mg.forEach(function(r){
        const a=String(r[fi]||"").trim(), b=String(r[ti]||"").trim();
        if(a&&b&&a!==b){ im[a.toLowerCase()]=b; imN++; }
      });
    }
  }catch(e){ /* no map tab - carry on with raw names */ }
  ITEM_MAP=im; ITEM_MAP_COUNT=imN; ITEM_TAB_FOUND=imFound;

  // Overrides tab. Same forgiving approach as ItemMap: missing or unreadable means the
  // dashboard falls back to what ImPOS sent rather than showing nothing.
  const oi={}, od={}; let oN=0; let oFound=false, oRows=0, oHead="";
  try{
    const oTxt=await fetchTab(OVER_TAB,OVER_GID);
    if(oTxt){
      oFound=true;
      const og=parseCsv(oTxt.trim());
      const oh=(og.shift()||[]).map(h=>h.trim().toLowerCase());
      // If a header still arrives mangled ("from beer & cider bread modifier ..."), the
      // real column name is its first word - so fall back to matching on that.
      const firstWord=oh.map(h=>h.split(/\s+/)[0]);
      const col=(...names)=>{
        for(const n of names){ const i=oh.indexOf(n); if(i>-1) return i; }
        for(const n of names){ const i=firstWord.indexOf(n); if(i>-1) return i; }
        return -1;
      };
      oHead=oh.join(", "); oRows=og.length;
      const ki=col("kind"), fi=col("from","item_from","name"), gi=col("group"),
            ti=col("type"), si=col("service");
      og.forEach(function(r){
        const from=String(r[fi]||"").trim();
        if(!from) return;
        const rule={};
        if(gi>-1 && String(r[gi]||"").trim()) rule.group=String(r[gi]).trim();
        if(ti>-1 && String(r[ti]||"").trim()) rule.type=String(r[ti]).trim();
        if(si>-1 && String(r[si]||"").trim()) rule.service=String(r[si]).trim();
        if(!Object.keys(rule).length) return;
        // The kind column is a convenience, not a requirement: if it's absent we can still
        // tell them apart because a department row's name matches a department in the feed.
        const kind=ki>-1?String(r[ki]||"").trim().toLowerCase():"";
        if(kind.indexOf("dep")===0) od[from.toLowerCase()]=rule;
        else if(kind.indexOf("item")===0) oi[from.toLowerCase()]=rule;
        else { od[from.toLowerCase()]=rule; oi[from.toLowerCase()]=rule; }
        oN++;
      });
    }
  }catch(e){ /* no overrides tab - use what ImPOS sent */ }
  OVER_ITEM=oi; OVER_DEPT=od; OVER_COUNT=oN; OVER_TAB_FOUND=oFound;
  OVER_DIAG=oFound?(oN?"":"tab found, "+oRows+" row(s) read but no usable from/group columns. Headers seen: "+oHead)
                  :"tab not reachable by name"+(OVER_GID?" or gid":"");
  if(OVER_DIAG) console.log("Overrides: "+OVER_DIAG);

  /* Labour. A missing tab is fine - the overlay simply stays unavailable. */
  /* Built into a LOCAL array and assigned at the end. Emptying the shared one and pushing
     into it lets two overlapping loads - a refresh mid-fetch - interleave and double every
     figure. Same trap as the item map. */
  const sh_=[]; let shOk_=false;
  try{
    const sTxt=await fetchTab("DeputyShifts");
    if(sTxt){
      const sg=parseCsv(sTxt.trim());
      const sh=(sg.shift()||[]).map(h=>String(h).trim().toLowerCase());
      const si=n=>sh.indexOf(n);
      sg.forEach(function(r){
        const day=dkeyOf(r[si("date")]);
        if(!day) return;
        const vRaw=String(r[si("venue")]||"").trim();
        sh_.push({
          day:day,
          venue:DEPUTY_VENUE[vRaw.toLowerCase()]||vRaw,
          kind:String(r[si("kind")]||"shift").trim(),
          area:String(r[si("area")]||"").trim(),
          who:String(r[si("employee")]||"").trim(),
          from:hhmm(r[si("start")]), to:hhmm(r[si("end")]),
          hours:num(r[si("hours")]), cost:num(r[si("cost")]),
          // Three states now, not two. "final" is what Deputy actually paid; "salary" is
          // derived from an annual salary; "pending" is an hourly shift not yet exported.
          // The first two are both real money and belong in Labour %; only "pending" is a
          // hole. "rate" is the contractual hourly rate for salaried staff - the payslip
          // figure, not cost/hours, which would wobble with the length of the day.
          costed:["final","salary"].indexOf(String(r[si("costed")]||"").trim())>-1,
          basis:String(r[si("costed")]||"").trim(),
          rate:num(r[si("rate")])
        });
      });
      shOk_=sh_.length>0;
    }
  }catch(e){ /* no labour data - the toggle stays off */ }
  SHIFTS=sh_; SHIFTS_OK=shOk_;

  const grid=parseCsv(text.trim());
  const head=(grid.shift()||[]).map(h=>h.trim().toLowerCase());
  const ix=n=>head.indexOf(n);
  ROWS=grid.map(r=>{
    const ts=parseTs(r[ix("timestamp")]);
    let day=String(r[ix("date")]||"").trim();
    if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(day)){ const p=day.split("/"); day=p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0"); }
    if(!day&&ts) day=dkey(ts);
    const cat=String(r[ix("category")]||"").trim();
    const m=CAT_MAP[cat.toLowerCase()];
    const rawItem=String(r[ix("item")]||"").trim();
    return { ts:ts, day:day,
      venue:String(r[ix("venue")]||"").trim(),
      category:cat,
      type:m?m.type:cat,          // unmapped falls back to the raw name, never dropped
      mode:m?m.mode:"Not specified",
      mapped:!!m,
      department:String(r[ix("department")]||"").trim(),
      itemRaw:rawItem,                                  // exactly what the POS sent
      item:ITEM_MAP[rawItem.toLowerCase()]||rawItem,    // what it rolls up to
      group:"", lane:"sales",
      qty:+String(r[ix("qty")]||0).replace(/[^0-9.\-]/g,"")||0,
      sales:+String(r[ix("sales")]||0).replace(/[^0-9.\-]/g,"")||0 };
  }).filter(r=>r.item&&r.day);

  // Apply the overrides. Department first, then item on top - so a department sets the
  // broad default and an item row corrects the ones staff filed wrong, which is the whole
  // point: ~1 in 3 POS assignments is wrong and nobody wants to fix it on site.
  KITCHEN_ROWS=0;
  ROWS.forEach(function(r){
    const d=OVER_DEPT[String(r.department).toLowerCase()];
    const i=OVER_ITEM[String(r.item).toLowerCase()];
    let over=false;
    [d,i].forEach(function(rule){
      if(!rule) return;
      if(rule.group){ r.group=rule.group; over=true; }
      if(rule.type){ r.type=rule.type; over=true; }
      if(rule.service){ r.mode=rule.service; over=true; }
    });
    r.over=over;
    r.lane = r.group===LANE_KITCHEN ? "kitchen" : (r.group===LANE_MODIFIER ? "modifier" : "sales");
    if(r.lane==="kitchen") KITCHEN_ROWS++;
  });
  UNMAPPED=Array.from(new Set(ROWS.filter(r=>!r.mapped&&r.category).map(r=>r.category))).sort();
  HAS_TIME = ROWS.some(r=>r.ts && (r.ts.getHours()||r.ts.getMinutes()));
  document.getElementById("bld").textContent=ROWS.length.toLocaleString()+" rows";
  renderFilters(); render();
}

    '<span class="sep"></span>'+

    VENUES.map(function(v){

/* ---- CSV export ---------------------------------------------------------------
 * Both exports honour everything currently on screen: date window, venue, category
 * grouping and drill-down, the tapped chart slot, and the product search box. What you
 * see is what you get - if the numbers on screen are filtered, so is the file.
 */
/**
 * Report builder. Defaults to whatever is on screen: a collapsed wastage card is off, an
