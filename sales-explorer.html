function csvCell(v){
  const s=String(v==null?"":v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvText(rows){
  return rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n");
}
function download(name,text){
  // The BOM makes Excel open UTF-8 correctly instead of mangling accented item names.
  const blob=new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}
// Filename carries the filters so exports don't pile up indistinguishably in Downloads.
function exportName(kind){
  const w=windowFor();
  let n="sales-"+kind+"-"+w.from+(w.from===w.to?"":"-to-"+w.to);
  if(F.venues.length) n+="-"+F.venues.map(vShort).join("-").toLowerCase().replace(/[^a-z0-9]+/g,"-");
  if(F.cat)   n+="-"+String(F.cat).toLowerCase().replace(/[^a-z0-9]+/g,"-");
  if(F.slot)  n+="-"+slotLabel().replace(/[^0-9a-zA-Z]+/g,"");
  return n+".csv";
}
function exportRows(){
  const rs=LAST.drill;
  if(!rs.length){ alert("Nothing to export in this view."); return; }
  const out=[["timestamp","date","venue","category","type","service","group","department","item","item_as_rung_up","qty","sales"]];
  rs.slice().sort(function(a,b){
    return (a.ts&&b.ts?a.ts-b.ts:0) || a.venue.localeCompare(b.venue) || a.item.localeCompare(b.item);
  }).forEach(function(r){
    out.push([
      r.ts?fmtStamp(r.ts):"", r.day, r.venue, r.category, r.type, r.mode,
      grpVal(r), r.department, r.item, r.itemRaw, r.qty, r.sales.toFixed(2)
    ]);
  });
  download(exportName("rows"),csvText(out));
}
// One row per product. This is the one to use for tidying up item names - it collapses
// every till entry into a single line per name, so near-duplicates sit next to each other.
function exportItems(){
  const items=LAST.items;
  if(!items.length){ alert("Nothing to export in this view."); return; }
  const head=["item","category","qty","revenue","avg_price","merged_from"].concat(VENUES.map(function(v){return vShort(v)+" revenue";}));
  const out=[head];
  items.slice().sort(function(a,b){ return a.item.toLowerCase()<b.item.toLowerCase()?-1:1; })
    .forEach(function(i){
      out.push([i.item, i.cat, i.qty, i.sales.toFixed(2),
        (i.qty?i.sales/i.qty:0).toFixed(2), Object.keys(i.src||{}).sort().join(" | ")]
        .concat(VENUES.map(function(v){ return (i.v[v]||0).toFixed(2); })));
    });
  download(exportName("items"),csvText(out));
}
function fmtStamp(d){
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+
         p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
/* Offsets from today for a yyyy-MM-dd, so a view change can land on the date you were
   already looking at. Local midnight both sides, so a DST boundary cannot drift the count. */
function dayOffsetOf(ymd){
  const now=new Date(); now.setHours(0,0,0,0);
  const t=new Date(ymd+"T00:00:00"); t.setHours(0,0,0,0);
  return Math.round((t-now)/864e5);
}
function weekOffsetOf(ymd){
  const mon=function(d){ const x=new Date(d); x.setHours(0,0,0,0);
    x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };            // Monday of that week
  return Math.round((mon(new Date(ymd+"T00:00:00"))-mon(new Date()))/(7*864e5));
}
function monthOffsetOf(ymd){
  const now=new Date(), t=new Date(ymd+"T00:00:00");
  return (t.getFullYear()-now.getFullYear())*12+(t.getMonth()-now.getMonth());
}

/* Switching view keeps the date you are on rather than snapping back to today. Drilling
   into Wednesday from the week chart and then wanting hourly detail is one thought, not
   two, and losing the date halfway through meant navigating back every time.

   Anchor order: the day bar selected; the day already being viewed; the last day looked at
   if still inside the window; today if IT is inside the window; else the window's last day
   - so stepping back six weeks and switching to Day lands in that week, not this one.
   F.anchor is what makes a round trip stable: day 21 Aug -> Week -> Day returns to the 21st.

   Session-only. F is rebuilt on load, so a refresh always opens on today in day view. */
function setPeriod(p){
  const w=windowFor(0);
  if(F.period==="day") F.anchor=w.from;                 // remember where you were

  let anchor;
  if(F.slot&&F.slot.kind==="day") anchor=F.slot.key;
  else if(F.period==="day")       anchor=w.from;
  else if(F.anchor&&F.anchor>=w.from&&F.anchor<=w.to) anchor=F.anchor;
  else{ const today=dkey(new Date()); anchor=(today>=w.from&&today<=w.to)?today:w.to; }
  F.anchor=anchor;

  F.period=p; F.slot=null;
  F.offset = (p==="day")  ? dayOffsetOf(anchor)
           : (p==="week") ? weekOffsetOf(anchor)
                          : monthOffsetOf(anchor);
  renderFilters(); render();
}
function shift(d){ F.offset+=d; F.slot=null; renderFilters(); render(); }
function setOffset(o){ F.offset=o; F.slot=null; renderFilters(); render(); }
// Toggles membership. Empty selection means every venue.
function setVenue(v){
  if(!v){ F.venues=[]; }
  else if(F.venues.indexOf(v)>-1){ F.venues=F.venues.filter(function(x){return x!==v;}); }
  else { F.venues=F.venues.concat([v]); }
  F.item=""; renderFilters(); render();
}
function venueOn(v){ return F.venues.indexOf(v)>-1; }
// The venues actually in play, in the fixed display order.
function activeVenues(){ return F.venues.length?VENUES.filter(venueOn):VENUES; }
function venueLabel(){
  return !F.venues.length?"all venues":F.venues.map(vShort).join(" + ");
}
function setItem(n){ F.item=(F.item===n?"":n); render(); }
function setCat(c){ F.cat=c; F.grp=""; F.item=""; F.q=""; render(); }
function clearSel(){ F.venues=[]; F.cat=""; F.grp=""; F.slot=null; F.item=""; renderFilters(); render(); }
// Changing granularity moves the bucket boundaries, so an old selection would point at
// a slot that no longer exists.
function setGran(g){ F.gran=g; F.slot=null; render(); }
function toggleLabour(){ F.labour=!F.labour; render(); }
function toggleWaste(){ F.wasteOpen=!F.wasteOpen; render(); }
function toggleCol(k){ F.cols[k]=!F.cols[k]; render(); }
function toggleHide(k){ F.hide[k]=!F.hide[k]; render(); }
function togglePriv(){ F.priv=!F.priv; render(); }
function toggleReport(){ F.report=!F.report; render(); }
function toggleSec(k){ F.show[k]=!F.show[k]; render(); }
function doPrint(){ F.report=false; render(); setTimeout(function(){ window.print(); },50); }
function setWSort(k){
  if(F.wsort.k===k) F.wsort.d=-F.wsort.d;
  else F.wsort={k:k,d:(k==="item"||k==="venue")?1:-1};
  render();
}
// Tap a bar to drill into that slot, tap it again to come back out.
function setSlot(kind,key){
  F.slot=(F.slot&&F.slot.kind===kind&&String(F.slot.key)===String(key))?null:{kind:kind,key:key};
  if(kind==="day"&&F.slot) F.anchor=key;                // so switching to Day lands here
  render();
}
function clearSlot(){ F.slot=null; render(); }
// Comparing venues only means something with every venue in view, so turning it on
// clears any single-venue filter rather than showing one lonely bar.
function toggleCompare(){ F.compare=!F.compare; renderFilters(); render(); }
function setGroup(g){ F.group=g; F.cat=""; F.grp=""; F.item=""; render(); }
// Second drill level: the group inside a product type.
function setGrp(g){ F.grp=(F.grp===g?"":g); F.item=""; render(); }
// Same column twice flips direction. A new column starts descending for numbers and
// ascending for text, which is what you almost always want on first click.
function setSort(k){
  if(F.sort.k===k) F.sort.d=-F.sort.d;
  else F.sort={k:k, d:(k==="item"||k==="cat")?1:-1};
  render();
}

// Raw mode shows exactly what ImPOS sent - categories, departments and item names all
// untouched. It is the reconciliation view, and reuses the existing chip rather than
// adding another control.
function isRaw(){ return F.group==="raw"; }
function itemOf(r){ return isRaw()?r.itemRaw:r.item; }
// The category label a row rolls up to, under the current grouping.
function catVal(r){ return isRaw()?r.category : F.group==="mode"?r.mode : r.type; }
// Second level. Falls back to the raw department when no override supplies a group, so a
// new department shows under its own name instead of vanishing.
function grpVal(r){ return isRaw()?r.department : (r.group||r.department||"Ungrouped"); }
const GROUP_LABEL={type:"Product type", mode:"Dine in / takeaway", raw:"As ImPOS sends it"};

// Does a row fall inside the selected chart bar? No selection means everything does.
function inSlot(r){
  if(!F.slot) return true;
  if(F.slot.kind==="day") return r.day===F.slot.key;
  if(!r.ts) return false;
  const m=r.ts.getHours()*60+r.ts.getMinutes();
  return Math.floor(m/F.gran)*F.gran===F.slot.key;
}
function slotLabel(){
  if(!F.slot) return "";
  return F.slot.kind==="day"?fmtDay(F.slot.key)
    :clock(F.slot.key)+"\u2013"+clock(F.slot.key+F.gran);
}

function inWin(r,w){ return r.day>=w.from && r.day<=w.to; }
// Kitchen requests are prep messages to the kitchen printer, not sales - they carry qty
// but never money. Left in, they would show up as wastage and inflate unit counts, which
// would then feed into par levels. Excluded everywhere except their own note.
function isSale(r){ return r.lane!=="kitchen"; }
function scopedIn(w){
  return ROWS.filter(function(r){
    return inWin(r,w)&&isSale(r)&&(!F.venues.length||venueOn(r.venue))&&
           (!F.cat||catVal(r)===F.cat)&&(!F.grp||grpVal(r)===F.grp);
  });
}
function inWindow(r){ return inWin(r,windowFor())&&isSale(r); }
function scoped(){ return scopedIn(windowFor()); }

// Bucket revenue for the charts. gran is minutes-of-day (60, 15) or the string "day".
// Pass a venue to bucket only that venue's rows.
function bucket(rs,gran,venue){
  const m={};
  rs.forEach(function(r){
    if(!r.sales) return;
    if(venue&&r.venue!==venue) return;
    if(gran==="day"){ m[r.day]=(m[r.day]||0)+r.sales; return; }
    if(!r.ts) return;
    const mins=r.ts.getHours()*60+r.ts.getMinutes();
    const b=Math.floor(mins/gran)*gran;
    m[b]=(m[b]||0)+r.sales;
  });
  return m;
}
const clock=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const sum=o=>Object.keys(o).reduce(function(s,k){return s+o[k];},0);

// One metric tile. `sub` carries the secondary line.
/** Show/hide chip for a section. Collapsed sections keep their heading so the page still
 *  reads as a whole and nothing silently disappears. */
function hideChip(k){
  return '<span class="chip" style="padding:4px 10px" onclick="toggleHide(&quot;'+k+'&quot;)">'+
    (F.hide[k]?"show":"hide")+'</span>';
}
/* ---------- labour ----------
 * Spread each shift's hours and cost evenly across the time slots it covers. Deputy costs
 * a whole shift, not a minute, so this is an even spread by construction - it smooths over
 * a penalty-rate boundary, which is fine for rostering and wrong for payroll.
 *
 * TRAINING (apprentice school time) is a real wage cost but the person is not on the
 * floor, so it never enters the time-of-day curve. It is reported separately.
 */
function labourFor(from,to,gran,slotKey){
  /* slotKey narrows everything to one bar. Without it the figures were the whole day even
     with a slot selected, so "3 people on" answered a question nobody asked.

     gran is minutes for the time-of-day chart, or the string "day" for the week/month
     chart - in which case buckets are dates and slotKey is a yyyy-MM-dd string. Labour was
     day-view only, which meant the one number this dashboard exists to produce was missing
     from exactly the views used to judge a week against target. */
  const byDay=(gran==="day");
  const slots={}, staff=[];
  const meta={hours:0,cost:0,costedCost:0,costedHours:0,pendingHours:0,training:0,staff:0,
              leave:0,salaryCost:0,byDay:byDay,
              slot:(slotKey==null?null:slotKey)};
  if(!SHIFTS_OK) return {slots:slots,meta:meta,staff:staff,ok:false};
  SHIFTS.forEach(function(sh){
    if(sh.day<from||sh.day>to) return;
    if(F.venues.length&&!venueOn(sh.venue)) return;
    if(F.day&&sh.day!==F.day) return;
    if(sh.kind==="training"||sh.kind==="leave"){
      /* Paid, but off the floor - never in the curve or the head count. Training is
         apprentice school time; leave is a holiday. Deputy prices most leave lines, so it
         is real wage cost that must stay in a period total. In day-bucket mode it can be
         attributed to its date; in time-of-day mode there is no honest slot for it. */
      if(byDay){
        if(slotKey==null||slotKey===sh.day){
          if(sh.kind==="training") meta.training+=sh.cost; else meta.leave+=sh.cost;
        }
      }else if(slotKey==null){
        if(sh.kind==="training") meta.training+=sh.cost; else meta.leave+=sh.cost;
      }
      return;
    }
    const span=(sh.from!=null&&sh.to!=null&&sh.to>sh.from)?sh.to-sh.from:0;

    // How much of this shift falls inside the selection?
    let share=1;
    if(slotKey!=null){
      if(byDay){
        // A day bucket takes the whole shift or none of it - no proportioning needed.
        if(sh.day!==slotKey) return;
      }else{
        if(!span) return;
        const mins=Math.min(slotKey+gran,sh.to)-Math.max(slotKey,sh.from);
        if(mins<=0) return;                     // not on during this slot
        share=mins/span;
      }
    }
    const hrs=sh.hours*share, cst=sh.cost*share;
    meta.hours+=hrs; meta.cost+=cst;
    if(sh.costed){
      meta.costedCost+=cst; meta.costedHours+=hrs;
      if(sh.basis==="salary") meta.salaryCost+=cst;
    }
    else meta.pendingHours+=hrs;
    staff.push({who:sh.who, area:sh.area, venue:sh.venue, day:sh.day,
                from:sh.from, to:sh.to, hours:hrs, cost:cst,
                fullHours:sh.hours, fullCost:sh.cost, costed:sh.costed,
                basis:sh.basis, rate:sh.rate, kind:sh.kind});

    if(byDay){
      const o=slots[sh.day]||(slots[sh.day]={hours:0,cost:0});
      o.hours+=sh.hours; o.cost+=sh.cost;
      return;
    }
    if(!span) return;
    for(let m=Math.floor(sh.from/gran)*gran;m<sh.to;m+=gran){
      // Only overlapping minutes count, so a shift starting 07:10 does not take a full
      // slot's worth of the 07:00 bucket.
      const mins=Math.min(m+gran,sh.to)-Math.max(m,sh.from);
      if(mins<=0) continue;
      const o=slots[m]||(slots[m]={hours:0,cost:0});
      o.hours+=sh.hours*(mins/span); o.cost+=sh.cost*(mins/span);
    }
  });
  meta.staff=Object.keys(staff.reduce(function(a,x){a[x.who]=1;return a;},{})).length;
  staff.sort(function(a,b){ return b.hours-a.hours; });
  return {slots:slots,meta:meta,staff:staff,ok:true};
}

/** Who was on, with their derived rate. Uncosted shifts are named, because "55 hours not
 *  costed" on a fully-approved day is a question, not a footnote. */
function labourTable(L){
  if(!L.staff.length) return "";
  const sel=L.meta.slot!=null;
  const pend=L.staff.filter(function(x){return !x.costed;});
  return '<table style="margin-top:12px"><thead><tr>'+
    '<th>Who</th><th class="hide-sm">Area</th><th>Shift</th>'+
    '<th class="num">Hours'+(sel?" here":"")+'</th>'+
    '<th class="num">Cost</th><th class="num">$/hr</th></tr></thead><tbody>'+
    L.staff.map(function(x){
      const rate=x.fullHours?x.fullCost/x.fullHours:0;
      return '<tr'+(x.costed?"":' style="background:#fdf8ec"')+'>'+
        '<td><b>'+esc(x.who||"(unnamed)")+'</b></td>'+
        '<td class="hide-sm muted">'+esc(x.area||"")+'</td>'+
        '<td class="muted">'+(x.from!=null?clock(x.from)+"\u2013"+clock(x.to):"?")+
          (sel?' <span class="muted">of '+x.fullHours.toFixed(1)+'h</span>':'')+'</td>'+
        '<td class="num">'+x.hours.toFixed(2)+'</td>'+
        '<td class="num">'+(x.costed?money(x.cost):'<span class="muted">pending</span>')+'</td>'+
        '<td class="num">'+(x.basis==="salary"&&x.rate
            // Salaried: the contractual rate from the payslip. Salary is allocated per DAY,
            // so cost/hours would read $38.46 on a 7.5h day and $33.94 on an 8.5h day for
            // someone paid a flat $37.955466.
            ? money(x.rate)+' <span class="muted">salary</span>'
            : (x.costed&&rate?money(rate):'<span class="muted">\u2013</span>'))+'</td></tr>';
    }).join("")+
    '</tbody></table>'+
    (pend.length?'<div class="note"><b>'+pend.length+' shift(s) with no cost yet:</b> '+
      pend.map(function(x){return esc(x.who)+" ("+x.fullHours.toFixed(1)+"h)";}).join(", ")+
      '.<br>Deputy fills cost in on payroll export, so these are hourly staff waiting on a '+
      'pay run. Salaried staff are costed from their annual salary and no longer appear '+
      'here. Their hours are right; only the dollars are pending.</div>':'');
}

function metric(k,val,sub,colour){
  return '<div class="metric"><div class="k">'+k+'</div>'+
    '<div class="val"'+(colour?' style="color:'+colour+'"':'')+'>'+val+'</div>'+
    (sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
}

/* ================= ANALYSIS =================
   Same shape as the supplier explorer's: key in localStorage, one card prepended to the
   app, Haiku by default. What differs is the context builder - purchasing is about prices
   over time; this is about labour against revenue, hour by hour.

   ONE HONEST LIMIT, stated up front so the output cannot mislead: the SalesFeed has NO
   operator column. Yellowfin's "Basic Item Sales Breakdown" is item-level, so there is no
   way to know who rang a sale up. What we CAN do is cross the sale's timestamp against
   DeputyShifts and say who was ROSTERED at that venue at that minute. That is a shortlist
   worth a conversation, not evidence, and the prompt is told to say so. */
const AI_MODEL = "claude-haiku-4-5";   // "claude-sonnet-4-6" for deeper takes, ~3x cost

function aiKey(){
  let k = localStorage.getItem("anthropic_key") || "";
  if(!k){
    k = prompt("Paste your Anthropic API key (sk-ant-...).\nStored only in this browser, never in the page or the sheet.") || "";
    k = k.trim();
    if(k) localStorage.setItem("anthropic_key", k);
  }
  return k;
}
function aiForgetKey(){ localStorage.removeItem("anthropic_key"); alert("API key removed from this browser."); }

/** Who was rostered at this venue at this moment. Not who served - that is unknowable here. */
function onAt(venue, day, mins){
  return SHIFTS.filter(function(sh){
    return sh.day===day && sh.venue===venue && sh.kind==="shift" &&
           sh.from!=null && sh.to!=null && mins>=sh.from && mins<sh.to;
  }).map(function(sh){ return sh.who; });
}

/** An "open" line: an item whose unit price moves around, which is what a $-open key or a
 *  manual override looks like in the feed. Detected from the data rather than a list of
 *  item names, so a new open key on a new till is caught without anyone maintaining a map. */
function openPriceItems(rows){
  const by={};
  rows.forEach(function(r){
    if(!(r.qty>0)||!(r.sales>0)) return;
    const k=itemOf(r);
    const o=by[k]||(by[k]={item:k,n:0,rev:0,prices:{},lines:[]});
    const unit=Math.round(r.sales/r.qty*100)/100;
    o.n++; o.rev+=r.sales; o.prices[unit]=(o.prices[unit]||0)+1;
    o.lines.push({venue:r.venue,day:r.day,ts:r.ts,unit:unit,qty:r.qty,sales:r.sales});
  });
  return Object.keys(by).map(function(k){ return by[k]; })
    .filter(function(o){
      const ps=Object.keys(o.prices).map(Number);
      if(o.n<3||ps.length<3) return false;             // a habit, not a one-off
      const lo=Math.min.apply(null,ps), hi=Math.max.apply(null,ps);
      return lo>0 && hi/lo>=1.5;                       // genuinely variable, not rounding
    })
    .sort(function(a,b){ return b.rev-a.rev; });
}

function salesContext(){
  const w=windowFor();
  const rows=scoped();
  const byDay=(F.period!=="day");
  const lab=labourFor(w.from,w.to,byDay?"day":F.gran);
  const revTot=rows.reduce(function(s,r){return s+r.sales;},0);
  const m=lab.ok?lab.meta:null;

  // --- labour against revenue, bucket by bucket. The wage-efficiency question itself.
  const revB=bucket(rows,byDay?"day":F.gran);
  const keys=Object.keys(lab.slots||{}).concat(Object.keys(revB))
    .filter(function(v,i,a){return a.indexOf(v)===i;})
    .sort(function(a,b){ return byDay?(a<b?-1:1):(+a)-(+b); });
  const slotRows=keys.map(function(k){
    const L=(lab.slots||{})[k]||{hours:0,cost:0}, rev=revB[k]||0;
    return {when:(byDay?k:clock(+k)),
            revenue:Math.round(rev),
            labourHours:Math.round(L.hours*10)/10,
            labourCost:Math.round(L.cost),
            labourPct:rev>0?Math.round(L.cost/rev*1000)/10:null,
            revPerLabourHour:L.hours>0?Math.round(rev/L.hours):null};
  });

  // --- wastage: $0 lines in perishable groups, which is food in the bin
  const wmap={};
  rows.forEach(function(r){
    if(!isPerishable(r.group)) return;
    const k=r.venue+"|"+itemOf(r);
    const o=wmap[k]||(wmap[k]={item:itemOf(r),venue:r.venue,group:r.group,sold:0,free:0,rev:0});
    if(r.sales>0){ o.sold+=r.qty; o.rev+=r.sales; } else { o.free+=r.qty; }
  });
  const waste=Object.keys(wmap).map(function(k){return wmap[k];})
    .filter(function(o){ return o.free>0; })
    .map(function(o){
      const tot=o.sold+o.free, unit=o.sold>0?o.rev/o.sold:0;
      return {item:o.item,venue:vShort(o.venue),group:o.group,
              sold:Math.round(o.sold),binned:Math.round(o.free),
              wastePct:tot?Math.round(o.free/tot*1000)/10:null,
              revenueForgone:Math.round(o.free*unit)};
    })
    .sort(function(a,b){ return b.revenueForgone-a.revenueForgone; }).slice(0,20);

  // --- items this period against the same window one period back
  function tally(rs){
    const t={};
    rs.forEach(function(r){
      if(!(r.sales>0)) return;
      const k=itemOf(r);
      const o=t[k]||(t[k]={item:k,qty:0,rev:0,group:r.group});
      o.qty+=r.qty; o.rev+=r.sales;
    });
    return t;
  }
  const now=tally(rows), prev=tally(scopedIn(windowFor(1)));
  const items=Object.keys(now).map(function(k){
    const a=now[k], b=prev[k];
    return {item:a.item,group:a.group,qty:Math.round(a.qty),revenue:Math.round(a.rev),
            avgPrice:a.qty?Math.round(a.rev/a.qty*100)/100:null,
            prevRevenue:b?Math.round(b.rev):0,
            changePct:(b&&b.rev>0)?Math.round((a.rev-b.rev)/b.rev*1000)/10:null};
  });
  const topSellers=items.slice().sort(function(a,b){return b.revenue-a.revenue;}).slice(0,15);
  const sliding=items.filter(function(i){ return i.changePct!=null&&i.changePct<=-25&&i.prevRevenue>=100; })
                     .sort(function(a,b){return a.changePct-b.changePct;}).slice(0,12);
  const tail=items.filter(function(i){ return i.revenue<Math.max(40,revTot*0.0015); })
                  .sort(function(a,b){return a.revenue-b.revenue;}).slice(0,12);

  // --- open-price lines, with who was on at the time
  const opens=openPriceItems(rows).slice(0,8).map(function(o){
    const ps=Object.keys(o.prices).map(Number).sort(function(a,b){return a-b;});
    const eg=o.lines.sort(function(a,b){return b.sales-a.sales;}).slice(0,6).map(function(l){
      const mins=l.ts?l.ts.getHours()*60+l.ts.getMinutes():null;
      return {day:l.day,venue:vShort(l.venue),time:mins!=null?clock(mins):null,
              unitPrice:l.unit,qty:l.qty,total:Math.round(l.sales*100)/100,
              rosteredAtThatMoment:mins!=null?onAt(l.venue,l.day,mins):[]};
    });
    return {item:o.item,lines:o.n,revenue:Math.round(o.rev),
            distinctPrices:ps.length,priceRange:[ps[0],ps[ps.length-1]],examples:eg};
  });

  return {title:(F.period==="day"?"Day":F.period==="week"?"Week":"Month")+" \u2014 "+w.label,
    data:{
      scope:"Venues: "+(F.venues.length?F.venues.join(", "):"all")+
            ". Period: "+w.label+" ("+w.from+" to "+w.to+")."+
            (F.cat?" Category filter: "+F.cat+".":"")+
            " Target is COGS + wages at 30% of revenue; labourPct here is wages/revenue only,"+
            " so food cost sits on top of it."+
            " IMPORTANT: the sales feed has NO operator field. rosteredAtThatMoment lists who"+
            " was ON SHIFT at that venue at that minute - a shortlist of who COULD have rung it"+
            " up, never proof of who did. Say so plainly if you name anyone.",
      headline:{revenue:Math.round(revTot),
        wageCost:m?Math.round(m.cost):null,
        ofWhichSalaried:m?Math.round(m.salaryCost):null,
        labourPct:(m&&revTot)?Math.round(m.costedCost/revTot*1000)/10:null,
        labourHours:m?Math.round(m.hours*10)/10:null,
        revenuePerLabourHour:(m&&m.hours)?Math.round(revTot/m.hours):null,
        hoursNotYetCosted:m?Math.round(m.pendingHours*10)/10:null,
        trainingCost:m?Math.round(m.training):null,
        leaveCost:m?Math.round(m.leave):null},
      labourVsRevenue:slotRows,
      wastage:waste,
      topSellers:topSellers,
      slidingItems:sliding,
      longTail:tail,
      openPriceLines:opens
    }};
}

async function analyseScreen(){
  const key=aiKey();
  if(!key) return;
  const btn=document.getElementById("aibtn");
  if(btn) btn.textContent="\u2728 Thinking\u2026";
  let card=document.getElementById("aicard");
  if(!card){
    card=document.createElement("div");
    card.id="aicard"; card.className="card";
    card.style.borderColor="var(--ink)";
    document.getElementById("app").prepend(card);
  }
  card.innerHTML='<div class="label">Analysis</div><div class="muted" style="font-size:13px">Reading the screen\u2026</div>';
  try{
    const ctx=salesContext();
    let payload=JSON.stringify(ctx.data);
    if(payload.length>90000) payload=payload.slice(0,90000);
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,
               "anthropic-version":"2023-06-01",
               "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:AI_MODEL,max_tokens:1800,messages:[{role:"user",content:
"You are analysing trading data for a Tasmanian hospitality group (Red Square Cafe Glenorchy & Cambridge, Luma Kitchen). The reader is the owner: direct, practical, Australian English, no fluff and no flattery.\n\nView: "+ctx.title+"\nData (JSON): "+payload+"\n\nCover these, in this order, and only where the data supports something worth saying:\n\n1. LABOUR EFFICIENCY. Work through labourVsRevenue bucket by bucket. Name the specific hours or days where wage cost is heavy against takings, and where it is lean. Say what to change - a start pushed later, a finish brought forward, an overlap trimmed - with the hours named. Quantify the weekly saving where you can.\n2. WASTAGE. Which items are being binned in volume and what it costs. Separate a real over-prep problem from a small number on a cheap item.\n3. TOP SELLERS and what to do with them: hold, promote, or reprice.\n4. POOR PERFORMERS. slidingItems are falling against last period; longTail is barely selling. Say which to cut, which to reprice, which to leave alone.\n5. OPEN PRICE LINES. openPriceLines are items rung up at inconsistent prices, usually an open key or a manual override. Flag anything that looks like a discounting habit or a control weakness. rosteredAtThatMoment is who was ON SHIFT, not who served - if you name people, say explicitly that it is only who was rostered and worth a conversation, not evidence.\n6. PROFITABILITY. Two or three concrete moves against the 30% COGS-plus-wages target.\n\nLead with the single most valuable finding. Short paragraphs and dash bullets, specific numbers throughout. Where the data is too thin to judge, say so rather than padding. No preamble, no closing summary. Under 600 words."}]})
    });
    const data=await resp.json();
    if(data.error) throw new Error(data.error.message||("API error "+resp.status));
    const text=(data.content||[]).filter(function(b){return b.type==="text";})
      .map(function(b){return b.text;}).join("\n");
    const htmlOut=esc(text)
      .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
      .replace(/^#+ *(.*)$/gm,"<b>$1</b>")
      .replace(/^[-*] (.*)$/gm,"&bull; $1")
      .replace(/\n/g,"<br>");
    card.innerHTML='<div class="label" style="display:flex;justify-content:space-between">'+
      '<span>Analysis \u2014 '+esc(ctx.title)+'</span>'+
      '<a style="cursor:pointer;text-transform:none;letter-spacing:0" '+
      "onclick=\"document.getElementById('aicard').remove()\">\u2715</a></div>"+
      '<div style="font-size:14px;line-height:1.6">'+htmlOut+'</div>';
  }catch(e){
    const bad=/401|auth|invalid|credit/i.test(String(e.message));
    card.innerHTML='<div class="label">Analysis</div><div class="err" style="font-size:13px">'+esc(e.message)+
      (bad?' \u2014 <a style="cursor:pointer;text-decoration:underline" onclick="aiForgetKey();analyseScreen()">re-enter API key</a>':"")+'</div>';
  }
  if(btn) btn.textContent="\u2728 Analyse";
}

function render(){
  const w=windowFor();
  const app=document.getElementById("app");
  const all=ROWS.filter(inWindow);   // window only - drives the venue cards
  const rows=scoped();               // window + venue + category - drives the chart
  const drill=rows.filter(inSlot);   // + the selected chart bar - drives the tables
  LAST.drill=drill;

  if(!all.length){
    app.innerHTML='<div class="card"><div class="label">'+esc(w.label)+'</div>'+
      '<p style="margin:6px 0 0">No sales recorded in this '+w.unit+'.</p>'+
      '<div class="muted" style="margin-top:8px">Use &lsaquo; &rsaquo; to move between '+w.unit+'s, or pick a wider period.</div></div>';
    return;
  }

  // ---- headline: one card per venue, in the fixed Cambridge / Luma / Glenorchy order
  const vTot={}; let grand=0;
  all.forEach(function(r){ vTot[r.venue]=(vTot[r.venue]||0)+r.sales; grand+=r.sales; });

  /* ---- same point last week.
     Comparing a part-finished day against a whole one is the classic way to make a good
     morning look like a disaster, so today is only ever compared with last week UP TO THE
     SAME CLOCK TIME. Completed days compare in full. The card shows the DIFFERENCE only -
     the previous total is not the interesting number. */
  const todayKey=dkey(new Date());
  const nowMins=(function(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); })();
  function minsOf(r){ return r.ts?r.ts.getHours()*60+r.ts.getMinutes():0; }
  function shiftKey(k,n){ const d=new Date(k+"T00:00:00"); d.setDate(d.getDate()+n); return dkey(d); }
  function shiftMonth(k,n){ const d=new Date(k+"T00:00:00"); d.setMonth(d.getMonth()+n); return dkey(d); }
  // Day and week both step back 7 days: the same weekday matters more than the calendar in
  // hospitality. A month steps back a calendar month - shifting a month window by 7 days
  // would overlap itself and compare nothing useful.
  const cmpMonthly=(F.period==="month");
  const back=function(k){ return cmpMonthly?shiftMonth(k,-1):shiftKey(k,-7); };
  const cmpLabel=cmpMonthly?"vs last month":"vs last week";
  // Sum a window per venue, cutting the live day off at the current clock time.
  function sumWindow(from,to,liveDay){
    const out={}; let tot=0;
    ROWS.forEach(function(r){
      if(!isSale(r)||r.day<from||r.day>to) return;
      if(liveDay&&r.day===liveDay&&minsOf(r)>nowMins) return;
      out[r.venue]=(out[r.venue]||0)+r.sales; tot+=r.sales;
    });
    out.__total=tot;
    return out;
  }
  const liveNow=(w.from<=todayKey&&todayKey<=w.to)?todayKey:"";
  const nowTot=sumWindow(w.from,w.to,liveNow);
  // The previous window must stop at the EQUIVALENT point, not run to the end of its own
  // period. On a Monday a week-to-date of one day was being measured against a full seven.
  const prevFrom=back(w.from);
  const prevTo=liveNow?back(liveNow):back(w.to);
  const prevTot=sumWindow(prevFrom,prevTo,liveNow?back(liveNow):"");
  const cmpReady=prevTot.__total>0;
  function deltaLine(v){
    if(!cmpReady) return "";
    const now=(v==="__total"?nowTot.__total:(nowTot[v]||0));
    const was=(v==="__total"?prevTot.__total:(prevTot[v]||0));
    if(!was) return '<div class="delta muted">no data last week</div>';
    const d=now-was;
    const cls=d>=0?"up":"down";
    return '<div class="delta '+cls+'" title="'+esc(cmpLabel)+' \u2014 '+
      esc(fmtDay(prevFrom))+(prevFrom===prevTo?"":" to "+esc(fmtDay(prevTo)))+
      (liveNow?", up to "+("0"+Math.floor(nowMins/60)).slice(-2)+":"+("0"+(nowMins%60)).slice(-2):"")+
      ", which was "+money0(was)+'">'+
      (d>=0?"+":"\u2212")+money0(Math.abs(d))+' <span class="vs">'+esc(cmpLabel)+'</span></div>';
  }
  // Private mode: when venues are selected, the others show nothing. For handing a screen
  // or a printout to one venue's manager without exposing the rest of the business.
  const privOn=F.priv&&F.venues.length>0;
  const shownTotal=privOn?VENUES.filter(venueOn).reduce(function(a,v){return a+(vTot[v]||0);},0):grand;
  const venueCards=VENUES.map(function(v){
    const s=vTot[v]||0;
    const hideIt=privOn&&!venueOn(v);
    return '<div class="vcard '+(venueOn(v)?"on":"")+'" onclick="setVenue(\''+v+'\')">'+
      '<div class="nm">'+esc(vShort(v))+'</div>'+
      '<div class="v">'+(hideIt?'<span class="muted">\u2013</span>':money0(s))+'</div>'+
      '<div class="sub">'+(hideIt?'hidden'
        :(grand?Math.round(s/(privOn?shownTotal:grand)*100):0)+'% of takings')+'</div>'+
      (hideIt?'':deltaLine(v))+'</div>';
  }).join("");

  const sel=drill.reduce(function(s,r){return s+r.sales;},0);
  const units=drill.reduce(function(s,r){return s+(r.sales>0?r.qty:0);},0);

  // ---- trend: time-of-day on a single day, day-by-day across a week or month.
  // With comparison on, each time slot gets one bar per venue in the fixed venue order,
  // so you can read who is busy when rather than just the combined shape.
  let chart="";
  const liveVenues=VENUES.filter(function(v){ return rows.some(function(r){return r.venue===v&&r.sales;}); });
  const series=F.compare?liveVenues:[null];        // null = one combined bar
  const colour=v=>v?VCOLOUR[v]:"var(--red)";
  const cmpChip='<span class="chip" style="padding:4px 10px;'+(F.compare?"background:var(--ink);color:#fff;border-color:var(--ink)":"")+'" '+
    'onclick="toggleCompare()">'+(F.compare?"\u2713 ":"")+'Compare venues</span>';
  const cmpLegend=F.compare
    ? '<span class="legend">'+liveVenues.map(function(v){
        return '<i style="background:'+VCOLOUR[v]+'"></i>'+esc(vShort(v));
      }).join(" ")+'</span>'
    : "";

  if(HAS_TIME && F.period==="day"){
    const g=F.gran;
    const bySeries=series.map(function(v){ return bucket(rows,g,v); });
    const keys=[].concat.apply([],bySeries.map(function(b){return Object.keys(b).map(Number);}));
    if(keys.length){
      const lo=Math.min.apply(null,keys), hi=Math.max.apply(null,keys);
      const max=Math.max.apply(null,[1].concat([].concat.apply([],bySeries.map(function(b){
        return Object.keys(b).map(function(k){return b[k];}); }))));
      // Labour overlay: a grey bar behind each revenue bar, scaled to its own maximum so
      // the SHAPES can be compared. Wage and revenue are different units - overlaying them
      // on one axis would be meaningless, so the point is where the curves diverge.
      const lab=F.labour?labourFor(w.from,w.to,g):null;
      const labMax=lab&&lab.ok?Math.max.apply(null,[0.01].concat(
        Object.keys(lab.slots).map(function(k){return lab.slots[k].hours;}))):1;
      let cols="";
      for(let b=lo;b<=hi;b+=g){
        // At 15 minutes there are too many bars to label every one, so only the top of
        // each hour gets a tick. The full range stays in the hover title either way.
        const lbl=(g===60)?String(b/60):(b%60===0?String(b/60):"");
        const tip=series.map(function(v,i){
          return (v?vShort(v)+" ":"")+money(bySeries[i][b]||0);
        }).join("  \u00b7  ");
        const on=F.slot&&F.slot.kind==="time"&&F.slot.key===b;
        const cls="col"+(F.slot&&F.slot.kind==="time"?(on?" sel":" dim"):"");
        const ls=lab&&lab.ok?(lab.slots[b]||{hours:0,cost:0}):null;
        const labTip=ls?"  \u00b7  "+ls.hours.toFixed(1)+"h labour"+
          (ls.cost?" ("+money(ls.cost)+")":""):"";
        cols+='<div class="'+cls+'" onclick="setSlot(\'time\','+b+')" title="'+clock(b)+'\u2013'+clock(b+g)+' \u2014 '+tip+labTip+'">'+
          (ls?'<div class="labbar" style="height:'+Math.round(ls.hours/labMax*140)+'px"></div>':"")+
          '<div class="pair">'+
          series.map(function(v,i){
            return '<div class="bx" style="height:'+Math.round((bySeries[i][b]||0)/max*140)+
                   'px;background:'+colour(v)+'"></div>';
          }).join("")+
          '</div><div class="lb">'+lbl+'</div></div>';
      }
      // Revenue per hour is measured across the trading span actually observed, not a
      // notional opening time - first slot with a sale to last, inclusive.
      const span=(hi-lo+g)/60;
      let mets;
      if(F.compare){
        mets=series.map(function(v,i){
          const t=sum(bySeries[i]);
          return metric(vShort(v),money0(t),money0(span?t/span:0)+"/hr",VCOLOUR[v]);
        }).join("")+metric("All venues",money0(sum(bucket(rows,g))),span.toFixed(1)+" hours trading");
      }else{
        const cur=bySeries[0], total=sum(cur);
        const bKeys=Object.keys(cur).map(Number);
        const peak=bKeys.length?bKeys.reduce(function(m,k){return cur[k]>cur[m]?k:m;},bKeys[0]):null;
        mets=metric("Revenue",money0(total),esc(w.label))+
          metric("Per hour",money0(span?total/span:0),span.toFixed(1)+" hours trading")+
          (peak!==null?metric("Busiest "+(g===60?"hour":"15 min"),clock(peak),money(cur[peak])):"")+
          metric("Per "+(g===60?"hour":"15 min")+" avg",money0(bKeys.length?total/((hi-lo)/g+1):0),
                 ((hi-lo)/g+1)+" slots");
      }
      // Labour figures live under the chart, not mixed into the revenue metrics.
      let labMets="";
      if(lab&&lab.ok){
        // With a bar selected, every labour figure is for THAT bar - hours, cost, who was
        // on. Reporting the whole day next to one hour's takings was the bug.
        const selKey=(F.slot&&F.slot.kind==="time")?F.slot.key:null;
        const L=(selKey==null)?lab:labourFor(w.from,w.to,g,selKey);
        const m=L.meta;
        const rev=(selKey==null)?sum(bucket(rows,g)):(bucket(rows,g)[selKey]||0);
        const pct=(m.costedCost&&rev)?(m.costedCost/rev*100):null;
        const scope=(selKey==null)?"":clock(selKey)+"\u2013"+clock(selKey+g);
        labMets = m.hours>0 ? (
          '<div class="metrics" style="margin-top:2px">'+
          metric("Labour hours",m.hours.toFixed(m.hours<10?2:1),
                 m.staff+" "+(m.staff===1?"person":"people")+" on"+(scope?" "+scope:""))+
          (m.cost?metric("Wage cost",money(m.cost),
            (m.salaryCost?"incl. "+money0(m.salaryCost)+" salaried \u00b7 ":"")+
            (m.pendingHours?m.pendingHours.toFixed(1)+"h not costed yet":"all costed")):"")+
          (pct!==null?metric("Labour %",pct.toFixed(1)+"%",
            (m.pendingHours?"of costed shifts only":"of takings")+(scope?" \u00b7 "+scope:"")):"")+
          metric("Revenue per hour",money0(m.hours?rev/m.hours:0),"per labour hour")+
          (m.training?metric("Training",money0(m.training),"paid, off the floor"):"")+
          (m.leave?metric("Leave",money0(m.leave),"paid, off the floor"):"")+
          '</div>'+labourTable(L)
        ) : '<div class="note">Nobody rostered'+(scope?" during "+scope:" in this window")+'.</div>';
      } else if(F.labour){
        labMets='<div class="note">'+(SHIFTS_OK?'No shifts in this window.'
          :'No <b>DeputyShifts</b> tab found \u2014 run processDeputy in the script.')+'</div>';
      }
      chart='<div class="card" data-sec="chart"><div class="label">Sales by time of day'+hideChip("chart")+
        '<span class="chip" style="padding:4px 10px;'+(g===60?"background:var(--ink);color:#fff;border-color:var(--ink)":"")+'" onclick="setGran(60)">Hourly</span>'+
        '<span class="chip" style="padding:4px 10px;'+(g===15?"background:var(--ink);color:#fff;border-color:var(--ink)":"")+'" onclick="setGran(15)">15 min</span>'+
        '<span class="chip" style="padding:4px 10px;'+(F.labour?"background:var(--ink);color:#fff;border-color:var(--ink)":"")+'" onclick="toggleLabour()">'+
          (F.labour?"\u2713 ":"")+'Labour</span>'+
        cmpChip+cmpLegend+
        (F.labour&&lab&&lab.ok?'<span class="legend"><i style="background:#c9c6bf"></i>labour hours</span>':"")+
        '</div>'+
        '<div class="chart">'+cols+'</div>'+
        '<div class="metrics">'+mets+'</div>'+labMets+'</div>';
    }
  } else if(F.period!=="day"){
    const bySeries=series.map(function(v){ return bucket(rows,"day",v); });
    const days=Object.keys(bucket(rows,"day")).sort();
    if(days.length>1){
      const max=Math.max.apply(null,[1].concat([].concat.apply([],bySeries.map(function(b){
        return Object.keys(b).map(function(k){return b[k];}); }))));
      // Labour, bucketed by DATE rather than time of day. Same grey-bar treatment as the
      // day view: scaled to its own maximum, because wage and revenue are different units
      // and the point is where the two shapes diverge.
      const lab=F.labour?labourFor(w.from,w.to,"day"):null;
      const labMax=lab&&lab.ok?Math.max.apply(null,[0.01].concat(
        Object.keys(lab.slots).map(function(k){return lab.slots[k].hours;}))):1;
      const cols=days.map(function(d){
        const tip=series.map(function(v,i){
          return (v?vShort(v)+" ":"")+money(bySeries[i][d]||0);
        }).join("  \u00b7  ");
        const on=F.slot&&F.slot.kind==="day"&&F.slot.key===d;
        const cls="col"+(F.slot&&F.slot.kind==="day"?(on?" sel":" dim"):"");
        const ls=lab&&lab.ok?(lab.slots[d]||{hours:0,cost:0}):null;
        const labTip=ls?"  \u00b7  "+ls.hours.toFixed(1)+"h labour"+
          (ls.cost?" ("+money(ls.cost)+")":""):"";
        return '<div class="'+cls+'" onclick="setSlot(\'day\',\''+d+'\')" title="'+fmtDay(d)+' \u2014 '+tip+labTip+'">'+
          (ls?'<div class="labbar" style="height:'+Math.round(ls.hours/labMax*140)+'px"></div>':"")+
          '<div class="pair">'+
          series.map(function(v,i){
            return '<div class="bx" style="height:'+Math.round((bySeries[i][d]||0)/max*140)+
                   'px;background:'+colour(v)+'"></div>';
          }).join("")+
          '</div><div class="lb">'+fmtShort(d)+'</div></div>';
      }).join("");
      let mets;
      if(F.compare){
        mets=series.map(function(v,i){
          const t=sum(bySeries[i]);
          return metric(vShort(v),money0(t),money0(t/days.length)+"/day",VCOLOUR[v]);
        }).join("")+metric("All venues",money0(sum(bucket(rows,"day"))),days.length+" trading days");
      }else{
        const cur=bySeries[0], total=sum(cur);
        const best=days.reduce(function(m,d){return cur[d]>cur[m]?d:m;},days[0]);
        mets=metric("Revenue",money0(total),esc(w.label))+
          metric("Per day",money0(total/days.length),days.length+" trading days")+
          metric("Best day",fmtShort(best),money(cur[best]));
      }
      /* Labour for the week or month, and for one day when a bar is selected. This is the
         number the dashboard exists to produce, and it was previously unavailable in the
         very views used to judge a period against the 30% target. */
      let labMets="";
      if(lab&&lab.ok){
        const selDay=(F.slot&&F.slot.kind==="day")?F.slot.key:null;
        const L=(selDay==null)?lab:labourFor(w.from,w.to,"day",selDay);
        const m=L.meta;
        const rev=(selDay==null)?sum(bucket(rows,"day")):(bucket(rows,"day")[selDay]||0);
        const pct=(m.costedCost&&rev)?(m.costedCost/rev*100):null;
        const scope=(selDay==null)?"":fmtDay(selDay);
        labMets = m.hours>0 ? (
          '<div class="metrics" style="margin-top:2px">'+
          metric("Labour hours",m.hours.toFixed(m.hours<10?2:1),
                 m.staff+" "+(m.staff===1?"person":"people")+(scope?" on "+scope:" on"))+
          (m.cost?metric("Wage cost",money(m.cost),
            (m.salaryCost?"incl. "+money0(m.salaryCost)+" salaried \u00b7 ":"")+
            (m.pendingHours?m.pendingHours.toFixed(1)+"h not costed yet":"all costed")):"")+
          (pct!==null?metric("Labour %",pct.toFixed(1)+"%",
            (m.pendingHours?"of costed shifts only":"of takings")+(scope?" \u00b7 "+scope:"")):"")+
          metric("Revenue per hour",money0(m.hours?rev/m.hours:0),"per labour hour")+
          (m.training?metric("Training",money0(m.training),"paid, off the floor"):"")+
          (m.leave?metric("Leave",money0(m.leave),"paid, off the floor"):"")+
          '</div>'+labourTable(L)
        ) : '<div class="note">Nobody rostered'+(scope?" on "+scope:" in this window")+'.</div>';
      } else if(F.labour){
        labMets='<div class="note">'+(SHIFTS_OK?'No shifts in this window.'
          :'No <b>DeputyShifts</b> tab found \u2014 run processDeputy in the script.')+'</div>';
      }
      chart='<div class="card" data-sec="chart"><div class="label">Sales by day'+hideChip("chart")+
        '<span class="chip" style="padding:4px 10px;'+(F.labour?"background:var(--ink);color:#fff;border-color:var(--ink)":"")+'" onclick="toggleLabour()">'+
          (F.labour?"\u2713 ":"")+'Labour</span>'+
        cmpChip+cmpLegend+
        (F.labour&&lab&&lab.ok?'<span class="legend"><i style="background:#c9c6bf"></i>labour hours</span>':"")+
        '</div>'+
        '<div class="chart">'+cols+'</div>'+
        '<div class="metrics">'+mets+'</div>'+labMets+'</div>';
    }
  }

  /* ---- wastage: $0 lines in perishable groups, which is food in the bin.
     Built from `drill` so it follows the same window, venue, category and slot filters as
     everything else on the page. */
  const wmap={};
  drill.forEach(function(r){
    if(!isPerishable(r.group)) return;
    const k=r.venue+"|"+itemOf(r);
    const o=wmap[k]||(wmap[k]={item:itemOf(r),venue:r.venue,group:r.group,sold:0,free:0,rev:0});
    if(r.sales>0){ o.sold+=r.qty; o.rev+=r.sales; } else { o.free+=r.qty; }
  });
  let wlist=Object.keys(wmap).map(function(k){
    const o=wmap[k];
    o.price=o.sold?o.rev/o.sold:0;
    o.value=o.free*o.price;            // what it would have sold for
    o.pct=(o.sold+o.free)?o.free/(o.sold+o.free)*100:0;
    return o;
  }).filter(function(o){return o.free>0;});
  const wNever=wlist.filter(function(o){return o.sold===0;});
  wlist=wlist.filter(function(o){return o.sold>0;});
  const wUnits=wlist.reduce(function(a,o){return a+o.free;},0);
  const wValue=wlist.reduce(function(a,o){return a+o.value;},0);
  const wSold=wlist.reduce(function(a,o){return a+o.sold;},0);
  /* Coffee loyalty sits alongside, never inside - it is a cost, but it is not waste.
     A $0 line only counts as a give-away if the SAME item also sells for money somewhere
     in this window. Glenorchy files its milk, sugar and strength modifiers under
     "Coffee / Tea" rather than a modifier department, so without this test they land in
     Coffee & Tea and get counted as free coffees - 1,469 of 1,478 units in one week.
     Nothing that is never charged for is a give-away; it is a modifier. */
  const paidCoffee={};
  drill.forEach(function(r){
    if(r.group===LOYALTY_GROUP&&r.sales>0) paidCoffee[itemOf(r).toLowerCase()]=1;
  });
  let loyU=0, loyV=0, loyModi=0;
  drill.forEach(function(r){
    if(r.group!==LOYALTY_GROUP||r.sales>0||r.lane!=="sales") return;
    if(paidCoffee[itemOf(r).toLowerCase()]) loyU+=r.qty;
    else loyModi+=r.qty;      // milk, sugar, strength - not a give-away
  });
  const coffeePrice=(function(){
    let q=0,v=0;
    drill.forEach(function(r){ if(r.group===LOYALTY_GROUP&&r.sales>0){ q+=r.qty; v+=r.sales; } });
    return q?v/q:0;
  })();
  loyV=loyU*coffeePrice;

  let wasteCard="";
  if(wlist.length){
    const wsorted=wlist.slice().sort(function(a,b){
      const k=F.wsort.k; let x=a[k],y=b[k];
      if(typeof x==="string"){x=x.toLowerCase();y=String(y).toLowerCase();}
      return x<y?-F.wsort.d:x>y?F.wsort.d:0;
    });
    const wth=function(k,lbl,cls){
      const on=F.wsort.k===k;
      return '<th class="'+(cls||"")+' sortable'+(on?" sorted":"")+'" onclick="setWSort('+
        JSON.stringify(k).replace(/"/g,"&quot;")+')">'+esc(lbl)+
        (on?' <span class="ar">'+(F.wsort.d<0?"\u25bc":"\u25b2")+'</span>':"")+'</th>';
    };
    // Collapsed by default: it matters weekly, not on every page load, and expanded it was
    // pushing the product search below the fold.
    const wRate=(wSold+wUnits)?Math.round(wUnits/(wSold+wUnits)*100):0;
    const wHead='<div class="label">Wastage'+
      '<span class="chip" style="padding:4px 10px" onclick="toggleWaste()">'+
        (F.wasteOpen?"hide":"show")+'</span>'+
      '<span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">'+
      (F.wasteOpen?'perishable groups only \u00b7 tap a column to sort'
        :wUnits.toLocaleString()+' units \u00b7 '+money0(wValue)+' \u00b7 '+wRate+'% of what was made')+
      '</span></div>';
    if(!F.wasteOpen){ wasteCard='<div class="card" data-sec="waste">'+wHead+'</div>'; }
    else{
    wasteCard='<div class="card" data-sec="waste">'+wHead+
      '<div class="metrics" style="border-top:0;padding-top:0;margin-top:0;margin-bottom:14px">'+
        metric("Thrown away",wUnits.toLocaleString()+" units",money0(wValue)+" at menu price","var(--amber)")+
        metric("Waste rate",((wSold+wUnits)?Math.round(wUnits/(wSold+wUnits)*100):0)+"%",
               "of everything made in these groups")+
        (loyU?metric("Coffee loyalty",loyU.toLocaleString()+" cups",money0(loyV)+" \u2014 given, not wasted"):"")+
      '</div>'+
      '<table><thead><tr>'+
        wth("item","Product")+wth("venue","Venue","hide-sm")+
        wth("sold","Sold","num")+wth("free","Wasted","num")+
        wth("pct","Waste %","num")+wth("value","Value","num")+
      '</tr></thead><tbody>'+
      wsorted.slice(0,80).map(function(o){
        return '<tr><td><b>'+esc(o.item)+'</b></td>'+
          '<td class="hide-sm muted">'+esc(vShort(o.venue))+'</td>'+
          '<td class="num">'+o.sold+'</td>'+
          '<td class="num free">'+o.free+'</td>'+
          '<td class="num'+(o.pct>=30?' free':'')+'">'+Math.round(o.pct)+'%</td>'+
          '<td class="num"><b>'+money(o.value)+'</b></td></tr>';
      }).join("")+
      '</tbody><tfoot><tr class="tot"><td>'+wsorted.length+' products</td><td class="hide-sm"></td>'+
      '<td class="num">'+wSold+'</td><td class="num">'+wUnits+'</td>'+
      '<td class="num">'+((wSold+wUnits)?Math.round(wUnits/(wSold+wUnits)*100):0)+'%</td>'+
      '<td class="num">'+money(wValue)+'</td></tr></tfoot></table>'+
      (wNever.length?'<div class="note"><b>'+wNever.length+' item(s) excluded \u2014 never sold at any '+
        'price in this window,</b> so there is no rate or value to compute: '+
        wNever.slice(0,10).map(function(o){return esc(o.item)+' ('+o.free+')';}).join(", ")+
        (wNever.length>10?' and '+(wNever.length-10)+' more':'')+'.<br>'+
        'These are nearly always sandwich-builder options or components sitting in a product group '+
        'by mistake \u2014 give them an item row in the Overrides tab pointing at Modifiers and they '+
        'will stop appearing here.</div>':'')+
      '<div class="note">A $0 line in Sandwiches, Cakes &amp; Sweets, Hot Takeaway or Grab &amp; Go is '+
      'food that went in the bin. Coffee &amp; Tea is kept out because its $0 lines are mostly the 100% '+
      'loyalty discount \u2014 a cost, but a deliberate one. Value is what the wasted units would have '+
      'sold for at their own average price.<br>'+
      (loyModi?'A further <b>'+loyModi.toLocaleString()+'</b> $0 drink line(s) are milk, sugar and '+
        'strength modifiers rather than give-aways \u2014 they never sell for money, so they are '+
        'left out of both figures. An Overrides row pointing them at Modifiers would remove '+
        'them from this group entirely.<br>':'')+
      '<b>Waste % is the number to sort on, not units.</b> Three croissants binned from seven made is a '+
      'bigger problem than twenty potato cakes from four hundred.</div></div>';
    }
  }

  // Tapped-bar readout. Sits between the chart and its metrics so the number you asked
  // for by tapping is right under the bar you tapped.
  let slotBar="";
  if(F.slot){
    const st=drill.reduce(function(s,r){return s+r.sales;},0);
    const su=drill.reduce(function(s,r){return s+(r.sales>0?r.qty:0);},0);
    const byV=VENUES.map(function(v){
      const t=drill.reduce(function(s,r){return s+(r.venue===v?r.sales:0);},0);
      return t?'<span class="vs"><b style="color:'+VCOLOUR[v]+'">\u25a0</b> '+esc(vShort(v))+' '+money0(t)+'</span>':"";
    }).filter(Boolean).join("");
    const share=sum(bucket(rows,F.slot.kind==="day"?"day":F.gran));
    slotBar='<div class="slotbar"><b>'+esc(slotLabel())+'</b>'+
      '<span class="big">'+money(st)+'</span>'+
      '<span class="vs">'+su.toLocaleString()+' items \u00b7 '+
        (share?Math.round(st/share*100):0)+'% of the '+(F.slot.kind==="day"?"period":"day")+'</span>'+
      byV+
      '<span class="chip" style="padding:4px 10px;margin-left:auto" onclick="clearSlot()">clear</span></div>';
    chart=chart.replace('<div class="metrics">',slotBar+'<div class="metrics">');
  }

  // ---- categories, rolled up onto the shared mapping so the venue columns line up.
  // Venue columns appear when no single venue is selected, so the table doubles as a
  // side-by-side comparison. Rows drill into the products below.
  // Columns are worth showing whenever more than one venue is in play - with Cambridge and
  // Luma both selected you want to see the split as well as the combined total.
  const COLS = activeVenues();
  const showCols = COLS.length>1;
  // Level 2 kicks in once you have drilled into a product type: the same table, but now
  // showing the groups inside it. Only for the "type" grouping - mode and raw are flat.
  const lvl2 = (F.group==="type" && F.cat);
  const keyOf = lvl2 ? grpVal : catVal;
  const catMap={};
  ROWS.filter(function(r){
    return inWindow(r)&&(!F.venues.length||venueOn(r.venue))&&inSlot(r)&&
           (!lvl2||catVal(r)===F.cat);
  }).forEach(function(r){
    if(!r.sales)return;
    const k=keyOf(r);
    const c=catMap[k]||(catMap[k]={total:0,v:{}});
    c.total+=r.sales; c.v[r.venue]=(c.v[r.venue]||0)+r.sales;
  });
  const catRows=Object.keys(catMap).map(function(k){return [k,catMap[k]];}).sort(function(a,b){return b[1].total-a[1].total;});
  const catMax=catRows.length?catRows[0][1].total:1;
  const catTotal=catRows.reduce(function(s,e){return s+e[1].total;},0);

  const drillOn = lvl2 ? F.grp : F.cat;
  const groupChips=["type","mode","raw"].map(function(g){
    return '<span class="chip" style="padding:4px 10px;'+(F.group===g?"background:var(--ink);color:#fff;border-color:var(--ink)":"")+
      '" onclick="setGroup(\''+g+'\')">'+GROUP_LABEL[g]+'</span>';
  }).join("");
  // If ImPOS starts sending a category the map doesn't know, say so rather than quietly
  // filing it under its own raw name and letting the venue columns drift apart again.
  const unmappedNote=(F.group!=="raw"&&UNMAPPED.length)
    ? '<div class="muted" style="margin-top:10px">Not in the category map, shown under their own names: <b>'+
      UNMAPPED.map(esc).join("</b>, <b>")+'</b>.</div>'
    : "";

  let catTable="";
  if(catRows.length){
    const head='<tr><th>'+esc(lvl2?"Group in "+F.cat:GROUP_LABEL[F.group])+'</th>'+
      (showCols?COLS.map(function(v){return '<th class="num hide-sm">'+esc(vShort(v))+'</th>';}).join(""):'<th class="hide-sm"></th>')+
      '<th class="num">Total</th><th class="num" style="width:52px">%</th></tr>';
    const body=catRows.map(function(e){
      const c=e[0], o=e[1];
      const cells=showCols
        ? COLS.map(function(v){return '<td class="num hide-sm">'+(o.v[v]?money0(o.v[v]):'<span style="color:var(--line)">\u2013</span>')+'</td>';}).join("")
        : '<td class="hide-sm"><div class="barwrap"><div class="bar" style="width:'+Math.round(o.total/catMax*100)+'%"></div></div></td>';
      const fn=lvl2?"setGrp":"setCat";
      return '<tr class="click" onclick="'+fn+'('+JSON.stringify(drillOn===c?"":c).replace(/"/g,"&quot;")+')">'+
        '<td><b>'+esc(c)+'</b>'+(drillOn===c?' <span class="muted">(showing)</span>':'')+'</td>'+
        cells+'<td class="num"><b>'+money(o.total)+'</b></td>'+
        '<td class="num muted">'+(catTotal?Math.round(o.total/catTotal*100):0)+'%</td></tr>';
    }).join("");
    // Breadcrumb, so two levels deep never leaves you unsure where you are.
    const crumb = (F.cat||F.grp)
      ? '<span style="text-transform:none;letter-spacing:0;font-weight:400">'+
        '<a href="#" onclick="setCat(\'\');return false" style="color:var(--dim);text-decoration:none">All</a>'+
        (F.cat?' \u203a <a href="#" onclick="setGrp(\'\');return false" style="color:'+(F.grp?"var(--dim)":"var(--ink)")+';text-decoration:none"><b>'+esc(F.cat)+'</b></a>':'')+
        (F.grp?' \u203a <b style="color:var(--ink)">'+esc(F.grp)+'</b>':'')+'</span>'
      : '<span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">tap a row to drill in</span>';
    catTable='<div class="card" data-sec="cats"><div class="label">By category'+hideChip("cats")+groupChips+crumb+
      '</div><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>'+unmappedNote+'</div>';
  }

  // ---- products, with the same per-venue comparison columns
  const itemMap={};
  drill.forEach(function(r){
    if(!r.sales&&!r.qty)return;
    const nm=itemOf(r);
    const o=itemMap[nm]||(itemMap[nm]={item:nm,cat:grpVal(r),grp:r.group,qty:0,sales:0,free:0,v:{},src:{}});
    if(!isRaw()&&r.itemRaw&&r.itemRaw!==r.item) o.src[r.itemRaw]=1;
    // A $0 line is wastage or a loyalty-card freebie, not a sale. It must not count
    // towards units sold or the average price: these numbers are headed for a par-level
    // generator, and inflating sold counts with wastage would raise par levels and cause
    // more wastage. Tracked separately so it stays visible.
    if(r.sales>0){ o.qty+=r.qty; o.sales+=r.sales; o.v[r.venue]=(o.v[r.venue]||0)+r.sales; }
    else { o.free+=r.qty; }
  });
  let items=Object.keys(itemMap).map(function(k){return itemMap[k];})
    .filter(function(i){return i.sales>0;});
  const q=F.q.toLowerCase();
  if(q) items=items.filter(function(i){return i.item.toLowerCase().indexOf(q)!==-1||i.cat.toLowerCase().indexOf(q)!==-1;});

  // Waste rate must exist BEFORE the sort - computing it afterwards meant sorting on the
  // column compared undefined against undefined and nothing moved.
  items.forEach(function(i){ i.wastePct=(i.qty+i.free)?i.free/(i.qty+i.free)*100:0; });
  // Suggested par: average sold per day plus 1.65 x sqrt(average), which covers the normal
  // day-to-day swing about 95% of the time. Trading days are the days that actually had
  // sales in this window, so a quiet Monday does not drag every average down.
  const tradingDays=(function(){
    const d={}; rows.forEach(function(r){ if(r.sales>0) d[r.day]=1; });
    return Math.max(Object.keys(d).length,1);
  })();
  items.forEach(function(i){
    i.perDay=i.qty/tradingDays;
    i.par=i.perDay>0?Math.ceil(i.perDay+1.65*Math.sqrt(i.perDay)):0;
  });

  // Sort by whichever header was last clicked. Venue columns use a "v:<venue>" key so
  // they sort on that venue's revenue for the product.
  function val(i,k){
    if(k==="item") return i.item.toLowerCase();
    if(k==="cat")  return i.cat.toLowerCase();
    if(k==="qty")  return i.qty;
    if(k==="free") return i.free;
    if(k==="wastePct") return i.wastePct;
    if(k==="perDay") return i.perDay;
    if(k==="par")    return i.par;
    if(k==="avg")  return i.qty?i.sales/i.qty:0;
    if(k.indexOf("v:")===0) return i.v[k.slice(2)]||0;
    return i.sales;
  }
  items.sort(function(a,b){
    const x=val(a,F.sort.k), y=val(b,F.sort.k);
    return x<y?-F.sort.d : x>y?F.sort.d : 0;
  });
  LAST.items=items;
  // Only show the column when there is something in it, so a clean day stays clean.
  const anyFree=items.some(function(i){return i.free>0;});
  // A $0 line means different things in different groups, so the column names itself from
  // what is actually on screen. Calling loyalty coffees "wasted" would be wrong, and
  // calling binned sandwiches "free" buries the point.
  const freeGroups={};
  items.forEach(function(i){ if(i.free>0) freeGroups[i.grp||""]=1; });
  const gk=Object.keys(freeGroups);
  const allPerish=gk.length>0&&gk.every(isPerishable);
  const allLoyal=gk.length>0&&gk.every(function(g){return g===LOYALTY_GROUP;});
  const FREE_LBL=allPerish?"Wasted":allLoyal?"Given":"Free";
  const PCT_LBL=allPerish?"Waste %":allLoyal?"Given %":"Free %";
  const FREE_TIP=allPerish?"$0 lines in perishable groups - food that went in the bin"
    :allLoyal?"$0 lines in Coffee & Tea - almost all the 100% loyalty discount, given away rather than wasted"
    :"$0 lines. Mixed groups here: perishables are wastage, Coffee & Tea is mostly loyalty. "+
     "Drill into one group to see it named.";

  const selNote=(F.venues.length||F.cat)
    ? '<div class="muted" style="margin-top:12px">Showing <b>'+esc(venueLabel())+'</b>'+
      (F.cat?' \u00b7 <b>'+esc(F.cat)+'</b>':'')+' \u2014 '+money(sel)+' from '+units.toLocaleString()+' items.'+
      '<span class="chip" style="margin-left:8px;padding:4px 10px" onclick="clearSel()">clear</span></div>'
    : "";

  function sortTh(k,lbl,cls,tip){
    const on=F.sort.k===k;
    return '<th class="'+(cls||"")+' sortable'+(on?" sorted":"")+'"'+
      (tip?' title="'+esc(tip)+'"':'')+' onclick="setSort('+
      JSON.stringify(k).replace(/"/g,"&quot;")+')">'+esc(lbl)+
      (on?' <span class="ar">'+(F.sort.d<0?"\u25bc":"\u25b2")+'</span>':"")+'</th>';
  }
  // Optional columns, declared once so the chips and the table can never disagree.
  // Free and its rate share a switch: a count without its rate is the misleading half.
  const COLOPT=[
    ["perDay","Per day","Units sold per day, across the days that actually had sales."],
    ["par","Suggested par","Average sold per day + 1.65 x sqrt(average) - covers the usual "+
      "swing about 95% of the time. A starting point, not an instruction: an item that regularly "+
      "sells out has understated sales and will come out too low."],
    ["free",FREE_LBL+" + rate",FREE_TIP],
    ["avg","Avg $","Revenue divided by units sold. Excludes $0 lines, so it is a real average price."]
  ];
  const colOn=function(k){ return !!F.cols[k] && (k!=="free"||anyFree); };
  const colChips=COLOPT.map(function(c){
    return '<span class="chip" style="padding:4px 10px;'+
      (colOn(c[0])?"background:var(--ink);color:#fff;border-color:var(--ink)":"")+
      '" title="'+esc(c[2])+'" onclick="toggleCol(&quot;'+c[0]+'&quot;)">'+
      (colOn(c[0])?"\u2713 ":"")+esc(c[1])+'</span>';
  }).join("");

  const itemHead='<tr>'+sortTh("item","Product")+
    (F.cat?"":sortTh("cat","Category","hide-sm"))+
    (showCols?COLS.map(function(v){return sortTh("v:"+v,vShort(v),"num hide-sm");}).join(""):"")+
    sortTh("qty","Sold","num")+
    (colOn("perDay")?sortTh("perDay","Per day","num"):"")+
    (colOn("par")?sortTh("par","Par","num",COLOPT[1][2]):"")+
    (colOn("free")?sortTh("free",FREE_LBL,"num hide-sm",FREE_TIP)+
                   sortTh("wastePct",PCT_LBL,"num hide-sm",FREE_TIP):"")+
    (colOn("avg")?sortTh("avg","Avg $","num hide-sm"):"")+
    sortTh("sales","Revenue","num")+'</tr>';
  const itemBody=items.slice(0,200).map(function(i){
    return '<tr class="click'+(F.item===i.item?" selrow":"")+'" onclick="setItem('+
      JSON.stringify(i.item).replace(/"/g,"&quot;")+')"><td><b>'+esc(i.item)+'</b></td>'+
      (F.cat?"":'<td class="hide-sm muted">'+esc(i.cat)+'</td>')+
      (showCols?COLS.map(function(v){return '<td class="num hide-sm">'+(i.v[v]?money0(i.v[v]):'<span style="color:var(--line)">\u2013</span>')+'</td>';}).join(""):"")+
      '<td class="num">'+i.qty.toLocaleString()+'</td>'+
      (colOn("perDay")?'<td class="num muted">'+i.perDay.toFixed(1)+'</td>':"")+
      (colOn("par")?'<td class="num"><b>'+(i.par||"\u2013")+'</b></td>':"")+
      (colOn("free")?'<td class="num hide-sm'+(i.free?(isPerishable(i.grp)?' free':' muted'):' muted')+'"'+
          (i.free?' title="'+esc(isPerishable(i.grp)?"binned":
            (i.grp===LOYALTY_GROUP?"given away (loyalty)":"$0 line"))+'"':'')+'>'+
          (i.free||"\u2013")+'</td>'+
        '<td class="num hide-sm'+(i.free&&isPerishable(i.grp)&&i.wastePct>=30?' free':' muted')+'">'+
        (i.free?Math.round(i.wastePct)+"%":"\u2013")+'</td>':"")+
      (colOn("avg")?'<td class="num hide-sm">'+money(i.qty?i.sales/i.qty:0)+'</td>':"")+
      '<td class="num"><b>'+money(i.sales)+'</b></td></tr>';
  }).join("");

  // Totals row. Covers EVERY filtered product, not just the 200 rendered, and the average
  // is revenue over units - a weighted average, not the mean of the per-item averages,
  // which would let a single $22 salad outweigh 600 coffees.
  const tSold=items.reduce(function(a,i){return a+i.qty;},0);
  const tRev =items.reduce(function(a,i){return a+i.sales;},0);
  const tFree=items.reduce(function(a,i){return a+i.free;},0);
  const itemFoot=items.length?'<tr class="tot">'+
    '<td><b>'+items.length.toLocaleString()+' product'+(items.length===1?'':'s')+'</b>'+
      (items.length>200?' <span class="muted">(top 200 listed)</span>':'')+'</td>'+
    (F.cat?"":'<td class="hide-sm"></td>')+
    (showCols?COLS.map(function(v){
      const t=items.reduce(function(a,i){return a+(i.v[v]||0);},0);
      return '<td class="num hide-sm"><b>'+(t?money0(t):'<span style="color:var(--line)">\u2013</span>')+'</b></td>';
    }).join(""):"")+
    '<td class="num"><b>'+tSold.toLocaleString()+'</b></td>'+
    (colOn("perDay")?'<td class="num"></td>':"")+
    (colOn("par")?'<td class="num"></td>':"")+
    (colOn("free")?'<td class="num hide-sm'+(tFree&&allPerish?' free':'')+'"><b>'+(tFree||"\u2013")+'</b></td>'+
      '<td class="num hide-sm"><b>'+(tFree?Math.round(tFree/(tSold+tFree)*100)+"%":"\u2013")+'</b></td>':"")+
    (colOn("avg")?'<td class="num hide-sm"><b>'+money(tSold?tRev/tSold:0)+'</b></td>':"")+
    '<td class="num"><b>'+money(tRev)+'</b></td></tr>':"";

  // ---- product drill-down. Ignores the tapped chart slot deliberately: you clicked the
  // product to see its whole shape across the window, not the slot you were already in.
  let itemCard="";
  if(F.item){
    const ir=rows.filter(function(r){return itemOf(r)===F.item;});
    const paid=ir.filter(function(r){return r.sales>0;});
    const sold=paid.reduce(function(a,r){return a+r.qty;},0);
    const revd=paid.reduce(function(a,r){return a+r.sales;},0);
    const freed=ir.reduce(function(a,r){return a+(r.sales>0?0:r.qty);},0);

    // Units per day, not dollars - this is the number that will drive par levels.
    const byDay={};
    paid.forEach(function(r){ byDay[r.day]=(byDay[r.day]||0)+r.qty; });
    const days=Object.keys(byDay).sort();
    let dayChart="";
    if(days.length>1){
      const mx=Math.max.apply(null,days.map(function(d){return byDay[d];}));
      dayChart='<div class="label" style="margin-top:16px">Units per day</div><div class="chart" style="height:120px">'+
        days.map(function(d){
          return '<div class="col" title="'+fmtDay(d)+' \u2014 '+byDay[d]+' sold"><div class="pair">'+
            '<div class="bx" style="height:'+Math.round(byDay[d]/mx*95)+'px"></div></div>'+
            '<div class="lb">'+fmtShort(d)+'</div></div>';
        }).join("")+'</div>'+
        '<div class="muted" style="margin-top:6px">Busiest '+fmtDay(days.reduce(function(m,d){return byDay[d]>byDay[m]?d:m;},days[0]))+
        ' \u00b7 average '+(sold/days.length).toFixed(1)+' a day across '+days.length+' days</div>';
    }

    // Time of day, pooled across every day in the window - answers "when does this sell",
    // which is the useful question for prep timing even over a month.
    let timeChart="";
    if(HAS_TIME){
      const g=F.gran, byB={};
      paid.forEach(function(r){
        if(!r.ts) return;
        const b=Math.floor((r.ts.getHours()*60+r.ts.getMinutes())/g)*g;
        byB[b]=(byB[b]||0)+r.qty;
      });
      const bk=Object.keys(byB).map(Number);
      if(bk.length){
        const lo=Math.min.apply(null,bk), hi=Math.max.apply(null,bk);
        const mx=Math.max.apply(null,bk.map(function(k){return byB[k];}));
        let cols="";
        for(let b=lo;b<=hi;b+=g){
          const v=byB[b]||0;
          cols+='<div class="col" title="'+clock(b)+'\u2013'+clock(b+g)+' \u2014 '+v+' sold"><div class="pair">'+
            '<div class="bx" style="height:'+Math.round(v/mx*95)+'px"></div></div>'+
            '<div class="lb">'+((g===60||b%60===0)?String(b/60):"")+'</div></div>';
        }
        const pk=bk.reduce(function(m,k){return byB[k]>byB[m]?k:m;},bk[0]);
        timeChart='<div class="label" style="margin-top:16px">Units by time of day'+
          (days.length>1?' <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">pooled across '+days.length+' days</span>':"")+
          '</div><div class="chart" style="height:120px">'+cols+'</div>'+
          '<div class="muted" style="margin-top:6px">Peak '+clock(pk)+'\u2013'+clock(pk+g)+' with '+byB[pk]+' sold</div>';
      }
    }

    const vSplit=activeVenues().map(function(v){
      const q=paid.reduce(function(a,r){return a+(r.venue===v?r.qty:0);},0);
      return q?metric(vShort(v),q.toLocaleString(),"sold",VCOLOUR[v]):"";
    }).filter(Boolean).join("");

    itemCard='<div class="card"><div class="label">'+esc(F.item)+
      '<span class="chip" style="padding:4px 10px" onclick="setItem(\'\')">close</span></div>'+
      '<div class="metrics" style="border-top:0;padding-top:0;margin-top:4px">'+
        metric("Sold",sold.toLocaleString(),esc(w.label))+
        metric("Revenue",money0(revd),money(sold?revd/sold:0)+" average")+
        (freed?metric("Free",freed.toLocaleString(),"wastage or comped, excluded above"):"")+
        vSplit+
      '</div>'+dayChart+timeChart+'</div>';
  }

  // Kitchen requests are excluded from every number above. Said out loud rather than
  // silently dropped, because "why is that item missing" is a worse question than a note.
  const kitchenNote = KITCHEN_ROWS
    ? '<div class="muted" style="margin-top:-4px;margin-bottom:14px">'+KITCHEN_ROWS+
      ' kitchen prep request'+(KITCHEN_ROWS===1?'':'s')+' excluded from sales and wastage'+
      ' <span style="opacity:.7">(rung up to message the kitchen, never a sale)</span></div>'
    : "";

  // Classes drive which sections print; the screen is unaffected.
  app.className=Object.keys(F.show).filter(function(k){return !F.show[k];})
    .map(function(k){return "no-"+k;}).join(" ");
  app.innerHTML= reportPanel()+
    (HAS_TIME?"":'<div class="note"><b>Hourly view is waiting on data.</b> Timestamps currently carry a date but no clock time, so sales can\'t be split by hour yet. It will appear automatically once the fixed processor has run.</div>')+
    '<div class="card" data-sec="venues"><div class="label">'+esc(w.label)+' \u2014 takings by venue'+
      hideChip("venues")+
      (privOn?'<span class="legend" style="color:var(--red)">private \u00b7 other venues hidden</span>':'')+
      '</div>'+
      (F.hide.venues?'':
      '<div class="venuegrid">'+venueCards+
        '<div class="vcard tot"><div class="nm">'+(privOn?esc(F.venues.map(vShort).join(" + ")):"All venues")+'</div>'+
        '<div class="v">'+money0(shownTotal)+'</div>'+
        '<div class="sub">'+(F.period==="day"?"this day":"this "+w.unit)+'</div>'+
        (privOn?"":deltaLine("__total"))+'</div>'+
      '</div>'+selNote)+'</div>'+
    (F.hide.chart?'<div class="card" data-sec="chart"><div class="label">Sales chart'+hideChip("chart")+'</div></div>':chart)+
    (F.hide.cats?'<div class="card" data-sec="cats"><div class="label">By category'+hideChip("cats")+'</div></div>':catTable)+
    itemCard+kitchenNote+
    '<div class="card" data-sec="products"><div class="label">Products ('+items.length+')'+(F.cat?' in '+esc(F.cat):'')+
      '<span class="chip" style="padding:4px 10px;'+(F.cols.par?"background:var(--ink);color:#fff;border-color:var(--ink)":"")+
      hideChip("products")+colChips+
      ' <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">tap a column to sort, a row to drill in'+
        (isRaw()?' \u00b7 showing raw POS names and departments'
          :(ITEM_MAP_COUNT?' \u00b7 '+ITEM_MAP_COUNT+' name'+(ITEM_MAP_COUNT===1?'':'s')+' merged'
                          :' \u00b7 no '+ITEM_TAB+' tab found')+
           (OVER_COUNT?' \u00b7 '+OVER_COUNT+' override'+(OVER_COUNT===1?'':'s')+' applied'
                      :' \u00b7 <b style="color:var(--red)">overrides not applied</b> \u2014 '+esc(OVER_DIAG)))+'</span></div>'+
      (F.hide.products?'':'<input type="search" id="q" placeholder="Search products\u2026" value="'+esc(F.q)+'">')+
      (F.hide.products?'':
        (items.length?'<table><thead>'+itemHead+'</thead><tbody>'+itemBody+'</tbody>'+
        '<tfoot>'+itemFoot+'</tfoot></table>':'<div class="muted">No products match.</div>'))+
      (!F.hide.products&&items.length>200?'<div class="muted" style="margin-top:8px">Showing the top 200 of '+items.length+'. Search to narrow.</div>':'')+
    '</div>'+
    wasteCard;

  const qb=document.getElementById("q");
  if(qb) qb.addEventListener("input",function(){
    F.q=qb.value; const p=qb.selectionStart; render();
    const nb=document.getElementById("q"); if(nb){ nb.focus(); nb.setSelectionRange(p,p); }
  });
}

load();
</script>
</body>
</html>
