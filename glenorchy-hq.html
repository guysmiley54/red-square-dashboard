<style>

<script>
/* =====================================================================================
   GLENORCHY HQ — the Glenorchy build of Cambridge Central (order-builder.html)

   ONE VENUE, ONE LEDGER. Red Square Glenorchy is the accounting entity and the only
   delivery tag, so the store switch Cambridge Central carries in its header is gone. The
   TAGS machinery is left in place with a single entry rather than ripped out, so the two
   files stay diffable; anything that renders a store picker checks TAGS.length first.

   Same sheets, same Orders.gs endpoint. The Orders, Favourites and OrderTargets tabs carry
   a venue column, so Glenorchy's rows sit beside Cambridge's. SupplierSettings and
   CategoryOverrides have no venue column and are SHARED with Cambridge Central — hiding a
   supplier or fixing a category here does it there too, by design.

   TURNED-OFF ITEMS ARE NOT SHARED. Cambridge Central keeps its "off" flags in the hidden
   column of CategoryOverrides; this dashboard ignores that column and keeps its own in the
   ItemVisibility tab, scope "glenorchy". A product Cambridge never orders (Naan, PFD) stays
   orderable here, and turning something off here leaves Cambridge alone. Categories in
   CategoryOverrides are still shared.

   Drafts are kept under their own localStorage key (ghq_drafts). Both dashboards live on
   the same GitHub Pages origin, so a shared key would have let a Cambridge draft count
   against Glenorchy's countdown.

   COGS ONLY. Rent, energy, waste, repairs and the other overheads are dropped at load, so
   they cannot reach a catalogue, a report, a group total or the countdown.

   Reads over gviz; writes through the Orders.gs web app, which is also where every global
   setting lives — rep emails, supplier visibility, category overrides and favourites are
   the same for everyone opening the link.

   The page is PUBLIC. No credential belongs in it.
   ===================================================================================== */
const BUILD_ID="ghq-v14-1256"; console.log("Glenorchy HQ "+BUILD_ID);
{const e=document.getElementById("buildtag"); if(e) e.textContent=BUILD_ID;}

const SHEET_ID       = "1bICxitr-CyU7VF8TLKIZgw7gV2WTKur9AptfmskQNK4"; // BG Ops Data
const SALES_SHEET_ID = "1QEUnzY43v3wVc6dP0oGPqgL_mvLRVGHnMYwtO3QMJY4"; // BG Sales Data
const SALES_CUTOVER  = "2026-08-03";
const WEBAPP_URL     = "https://script.google.com/macros/s/AKfycbz4LRNzbabVhkQ2PT0v2IxSPboDpyBNcW2PCpjqVb6knLicd9_0V4bXE_2ltMKikzxQmg/exec";

/* Glenorchy only. Cambridge and Luma are a separate business, filtered out at the first
   read of every row. */
const LEDGER_VENUES = ["Red Square Glenorchy"];
const ENTITY = "Red Square Glenorchy";

/* One delivery tag. */
const TAGS = [
  { key:"glenorchy", name:"Red Square Glenorchy", short:"Glenorchy", addr:"3/2 Howard Road, Glenorchy TAS 7010" }
];

const TARGET_COGS_PCT = 30;
const COMPANY_BLOCK = ["B & G Fitness Pty Ltd","Red Square Cafe Glenorchy","accounts@redsquarecafe.com.au"];
const ACCOUNTS_EMAIL = "accounts@redsquarecafe.com.au";
const VIS_SCOPE = "glenorchy";   // this dashboard's rows in ItemVisibility
const CAT_DAYS=180, RATE_DAYS=90, DOW_WEEKS=6, MATCH_DAYS=14;

/* Fill Usual. Conservative by instruction: average quantity per order, rounded DOWN, with
   anything averaging under 0.45 left at zero. The two rules compound — under a strict floor
   an item averaging 0.45 to 0.99 also lands on zero. That is the conservative reading of
   "strictly round down"; FILL_MIN is the one knob to change if items bought most weeks
   should come back as 1. */
const FILL_FLOOR_CUTOFF = 0.45;
const FILL_MIN = 0;

/* ================= STATE ================= */
let INV=[],LINES=[],CFG={},PMERGE={},ORDERS=[],SSET={},FAVS=[],COVER={},HIDDEN={},SALES=[],LOAD_WARN=[];
let SALES_OK=false;
let TAG=TAGS[0], WEEK_OFF=0, SUPPLIER="", CATFILT="", SEARCH="", HIDE_PORTAL=true;
let SHOW_HIDDEN=false, PICKED={};      // PICKED: item_key -> true, for bulk category edits
/* Typing re-renders the page, which destroys the search box and rebuilds it — so focus and
   the caret have to be carried across by hand or the field goes dead after every keystroke
   and has to be clicked again. */
let SEARCH_FOCUS=false, SEARCH_CARET=0;
let GSEARCH="", GFOCUS=false, GCARET=0, GCAT_FILT="", GSORT={col:"freq",dir:-1};
/* Every supplier's catalogue, built once per store and reused. Deriving twenty catalogues
   on each keystroke of a search box is the difference between instant and unusable. */
let GCAT=null, GCAT_FOR=null;
function globalCatalogue(){
  if(GCAT&&GCAT_FOR===TAG.name) return GCAT;
  const out=[];
  supplierList().forEach(s=>{
    if(!s.visible) return;
    deriveCatalogue(LINES,s.name,new Date()).forEach(p=>out.push(p));
  });
  GCAT=out; GCAT_FOR=TAG.name;
  return out;
}
function clearCatalogueCache(){ GCAT=null; GCAT_FOR=null; }
let HOME_INV=null;                     // supplier whose invoices are open on the order list
let SORT={col:"name",dir:1};
/* The reading range for the front page and Reports — Supplier Explorer's control, which is
   the one that has proved practical: Week / Month / Quarter / All time, stepped with ‹ ›, or
   any two dates. Independent of WEEK_OFF, which is the ORDERING week on the Order tab. */
let RANGE={kind:"week",off:0,from:null,to:null};
let DRAFTS={}, LOCAL_ORDERS=[];

/* ================= HELPERS ================= */
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const money=v=>(v==null||v==="")?"":"$"+Number(v).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=v=>"$"+Math.round(Number(v)||0).toLocaleString("en-AU");
const pct1=v=>(Math.round(v*10)/10)+"%";
const fmtD=d=>d?d.toLocaleDateString("en-AU"):"";
const fmtISO=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const mid=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const weekStart=d=>{const x=mid(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num_=v=>+String(v||"").replace(/[^0-9.\-]/g,"")||0;
const tagByName=n=>TAGS.find(t=>t.name===n)||TAGS[0];
/* Next weekday. Saturday and Sunday are skipped; suppliers who do deliver on a Saturday
   can have the date changed on the order. */
function nextBusinessDay(from){
  let d=addD(mid(from||new Date()),1);
  while(d.getDay()===0||d.getDay()===6) d=addD(d,1);
  return d;
}
const vShort=v=>String(v||"").replace("Red Square ","RS ").replace("Luma Kitchen","Luma");

/* Same as gvizDate but keeps the clock. Both tabs carry real timestamps — Invoices.scanned
   is when the invoice email was captured, Orders.logged_at is when the order was placed —
   and reconciliation is wrong without them. */
function gvizDateTime(v){
  if(v instanceof Date) return v;
  const s=String(v||"").trim();
  let m=/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?/.exec(s);
  if(m) return new Date(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(s);
  if(m) return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0));
  m=/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(s);
  if(m) return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
  return gvizDate(v);
}
function gvizDate(v){
  if(v instanceof Date) return v;
  const s=String(v||"").trim();
  let m=/Date\((\d+),(\d+),(\d+)/.exec(s); if(m) return new Date(+m[1],+m[2],+m[3]);
  m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  return null;
}

const UNIT_ALIAS={each:"ea",ea:"ea",unit:"ea",units:"ea",pack:"ea",carton:"ctn",cartons:"ctn",ctn:"ctn",ct:"ctn",cs:"ctn",case:"ctn",box:"box",bx:"box",pkt:"pkt",packet:"pkt",pk:"pkt",sleeve:"slv",slv:"slv",bottle:"btl",btl:"btl",kg:"kg",g:"g",l:"l",ltr:"l",litre:"l",tray:"tray",bag:"bag",tub:"tub",doz:"doz",dozen:"doz"};
const unitNorm=u=>{const n=norm(u);return UNIT_ALIAS[n]||n;};

/* ================= ITEM NAME NORMALISATION =================
   Suppliers spell the same product a dozen ways across a year of invoices: word order
   flips ("Sliced cheese" / "Cheese, Sliced"), plurals wander, and typos stick ("cherry
   tomatos"). Left alone, each variant becomes its own catalogue line with its own price
   history, which is how a product ends up looking like it has never been bought before.

   Three passes, each deliberately conservative, because a WRONG merge is worse than a
   missed one — it silently averages two different products' prices:
     1. strip punctuation and case, drop pure noise words;
     2. singularise tokens, guarding the endings that aren't plurals (-ss, -us, -is);
     3. sort the tokens, so word order stops mattering.
   Sizes and pack counts are KEPT as tokens: "Milk 2L" and "Milk 1L" must never merge.
   A near-miss pass then folds single-character typos together, but only within one
   supplier, one unit, and only for long tokens. */
const NOISE=new Set(["the","and","a","of","w","with","approx","abt","per","x"]);
function singular(t){
  if(t.length<=3) return t;
  /* -ss, -us and -is are endings, not plurals: "glass", "citrus", "basis". -as is NOT on
     that list — "bananas", "pizzas", "peas" and "sultanas" are ordinary plurals, and
     guarding -as kept every one of them out of its category. The short words that guard
     was really protecting ("gas") are already covered by the length check above. */
  if(/(ss|us|is)$/.test(t)) return t;
  if(/ies$/.test(t)) return t.slice(0,-3)+"y";
  if(/(oes|ches|shes|sses|xes)$/.test(t)) return t.slice(0,-2);
  if(/s$/.test(t) && t.length>3) return t.slice(0,-1);   // "cups"->"cup", "oats"->"oat"
  return t;
}
function nameKey(desc){
  const toks=String(desc||"").toLowerCase()
    .replace(/[^a-z0-9. ]+/g," ")
    .split(/\s+/).filter(Boolean)
    .filter(t=>!NOISE.has(t))
    .map(singular)
    .filter(Boolean);
  if(!toks.length) return norm(desc);
  return toks.sort().join(" ");
}
/* Levenshtein, capped: anything past the cap is "too different" and we stop counting. */
function lev(a,b,cap){
  if(Math.abs(a.length-b.length)>cap) return cap+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i]; let best=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<best) best=cur[j];
    }
    if(best>cap) return cap+1;
    prev=cur;
  }
  return prev[b.length];
}
/* Folds near-identical keys together inside one supplier+unit bucket. The longest-standing
   spelling wins (most invoice lines), so the name on screen is the one staff recognise. */
function fuzzyFold(keys){
  const map={}, sorted=keys.slice().sort((a,b)=>b.n-a.n||a.key.localeCompare(b.key));
  const canon=[];
  sorted.forEach(k=>{
    const hit=canon.find(c=>c.bucket===k.bucket && k.key.length>=6 && c.key.length>=6
                            && lev(c.key,k.key,1)<=1);
    map[k.key]= hit ? hit.key : k.key;
    if(!hit) canon.push(k);
  });
  return map;
}

/* ================= CATEGORISATION =================
   Invoice rows carry a category the extractor guessed at invoice level ("Food"), which is
   too coarse to order from — a chef wants Produce separate from Dairy. These rules tag the
   LINE, from its description, first match wins. Order matters: the specific beats the
   general, so "coffee beans" is Coffee before "bean" could make it Produce.
   Anything unmatched keeps the invoice's own category rather than being forced somewhere
   wrong, and shows as Uncategorised so the gap is visible instead of silently misfiled. */
/* Matched against the SINGULARISED description, not the raw one: "Cherry Tomatoes" has to
   hit the same rule as "cherry tomato", and a list spelling out every plural would rot the
   first time a supplier wrote "Tomatos". Word order is preserved here (it is not in
   nameKey) so multi-word rules like "rinse aid" and "roll towel" still match. */
function catText(desc){
  return " "+String(desc||"").toLowerCase().replace(/[^a-z0-9]+/g," ").split(/\s+/)
           .filter(Boolean).map(singular).join(" ")+" ";
}

/* ================= CATEGORY ENGINE =================
   Three layers, most specific first:
     1. a manual override saved to the sheet against the product — always wins;
     2. a supplier profile: its own rules, plus an ALLOW LIST of the categories that
        supplier is capable of selling;
     3. the global keyword rules.

   The allow list is the part that earns its keep. Keywords alone cannot work across
   suppliers who sell different worlds of product, because the same word means different
   things: at OnePac "lemon" is Jasol Lemon Bleach, "salad" is a salad bowl and "roll" is a
   roll towel — all three were reading as food on live data. Constraining a packaging house
   to packaging and cleaning categories fixes every one at a stroke, without a keyword list
   that would have to grow forever. */
const CATEGORIES = ["Produce","Meat","Seafood","Dairy / Cold Storage","Frozen","Bakery","Dry Goods",
  "Beverage","Coffee","Hot Containers","Cold Containers","Packaging","Cleaning & Chemicals","Uncategorised"];
const FOOD_CATS = ["Produce","Meat","Seafood","Dairy / Cold Storage","Frozen","Bakery","Dry Goods","Beverage","Coffee"];
const PACK_CATS = ["Hot Containers","Cold Containers","Packaging","Cleaning & Chemicals"];

const CLEANING_RE = /\b(jasol|detergent|sanitis\w*|sanitiz\w*|degreas\w*|bleach|cleaner|chemical|glove|dishwash\w*|rinse|soap|scourer|bin liner|garbage bag|mop|wipe|wiper|methylated|spirit|sterakleen|firedog|spot aid|tecwash|unox|glaze|descaler|oven cleaner|hand towel|roll towel|paper towel)\b/;
/* Hot before cold: a "single wall" or "CPLA" cup is a hot cup, though "cup" alone is not. */
const HOT_RE  = /\b(hot cup|hot lid|cpla|single wall|double wall|coffee cup|pizza|burger box|foil container|catering box|catering tray|snack box|greaseproof|grease proof|grease resistant|paper bag|carry bag|pie|chip cup)\b/;
const COLD_RE = /\b(cold cup|cold lid|dome lid|salad bowl|pet|pet bowl|pet lid|pla cold|clam shell|clamshell|tumbler|rectangular|round container|round lid|sauce container|smoothie|sundae|deli)\b/;
const PACK_RE = /\b(cup|lid|napkin|serviette|container|box|bag|tray|straw|cutlery|knife|fork|spoon|teaspoon|film|foil|takeaway|carton|liner|docket|register roll|copy paper|tape)\b/;

/* Frozen is a place, not a food type, so it is asked first: a chef ordering wants to know
   what comes out of the freezer, whatever it is made of. That means frozen chicken reads as
   Frozen rather than Meat, and ice cream as Frozen rather than Dairy.

   It only fires on an EXPLICIT signal — the word frozen, FRZ, IQF, or ice cream and its
   relatives. On the live data that is 21 products, every one certainly frozen. Another ~69
   are frozen in reality but say so nowhere in their name (McCain chips, hash browns, dim
   sims), and guessing by product type would sweep in Onepac's sandwich wedge CONTAINERS.
   Those are for the bulk tool: local knowledge, set once, kept for everyone. */
const FROZEN_RE = /\b(frozen|froz|frz|iqf|ice cream|icecream|gelato|sorbet)\b/;

const CATEGORY_RULES=[
  ["Cleaning & Chemicals", CLEANING_RE],
  ["Frozen", FROZEN_RE],
  ["Coffee",   /\b(coffee bean|espresso|arabica|robusta|single origin)\b/],
  ["Dairy / Cold Storage", /\b(milk|cream|cheese|cheer|parma blend|butter|egg|yogh?urt|mozzarella|parmesan|parmigiano|grana|pecorino|feta|fetta|gorgonzola|burrata|haloumi|ricotta|mascarpone|creme fraiche|custard)\b/],
  ["Seafood",  /\b(salmon|prawn|fish|squid|calamari|octopus|mussel|oyster|scallop|barramundi|tuna|anchov\w*)\b/],
  /* "Chipolatas - Sage & Parsley" was reading as Produce: the herbs are named and the meat
     is not. Sausages come in shapes rather than species, so the shapes are listed too. */
  ["Meat",     /\b(beef|chicken|pork|lamb|bacon|rasher|ham|salami\w*|prosciutto|chorizo|sausage|chipolata|bratwurst|frankfurt\w*|cheerio|saveloy|mince|steak|rump|brisket|turkey|duck|pancetta|wing ding|nugget|schnitzel|kransky|meatball)\b/],
  ["Bakery",   /\b(bread|bread roll|dinner roll|bun|sourdough|baguette|ciabatta|brioche|croissant|muffin|pastry|focaccia|bagel|tortilla|pita|waffle|pancake|crumpet|scone|donut|doughnut)\b/],
  /* Sauces and oils before produce: "Tomato Sauce Heinz" and "Oil Veg / Olive Blend" were
     both landing in Produce on live data. */
  ["Dry Goods",/\b(sauce|topping|syrup|sweetener|drinking chocolate|marmalade|soft serve|oil|vinegar|mirin|cooking wine|flour|semolina|yeast|sugar|rice|pasta|salt|pepper|spice|anise|cinnamon|clove|cumin|paprika|turmeric|sesame|bay leaf|tamarind|puree|stock|tin|canned|chickpea|lentil|noodle|honey|jam|mayonnaise|mustard|oat|cereal|nut|cashew|walnut|almond|pistachio|seed|olive|chip|fry|fries|wedge|hash brown|crouton|savoiardi|polenta|couscous|quinoa|dim sim|dimsum|spring roll|samosa)\b/],
  ["Produce",  /\b(tomato|lettuce|cos|mesclun|roquette|rocket|onion|shallot|leek|potato|carrot|spinach|cucumber|capsicum|mushroom|avocado|lemon|lime|orange|apple|pear|banana|berry|grape|melon|honeydew|rockmelon|watermelon|peach|nectarine|plum|mango|pineapple|kiwi|herb|basil|parsley|coriander|mint|thyme|rosemary|dill|chive|garlic|ginger|chilli|chilly|broccoli|cauliflower|zucchini|eggplant|pumpkin|cabbage|wombok|wom bok|celery|kale|asparagus|bean|pea|corn|radish|beetroot|parsnip|swede|turnip|sprout|salad|coleslaw|slaw|fruit|veg)\b/],
  /* No bare "beer" or "wine": in a kitchen catalogue those words are far more often "beer
     battered chips" and "beef red wine pie" than a drink. Verified on the live data — adding
     them moved both into Beverage. */
  ["Beverage", /\b(juice|soft drink|cola|lemonade|soda|kombucha|cider|cordial|tea|chai|earl grey|english breakfast|chamomile|red bull|energy drink|tonic)\b/],
  ["Hot Containers",  HOT_RE],
  ["Cold Containers", COLD_RE],
  ["Packaging", PACK_RE]
];

/* Both profiles written against the live catalogue, 14 Sep 2026. */
const SUPPLIER_PROFILES=[
  { match:/onepac|tas.?isle/i,
    /* A packaging and chemicals house — nothing it sells is food, so the food rules are off
       and anything unmatched is Packaging rather than Uncategorised. */
    rules:[["Cleaning & Chemicals",CLEANING_RE],["Hot Containers",HOT_RE],["Cold Containers",COLD_RE]],
    allow:PACK_CATS, fallback:"Packaging" },
  { match:/doppio/i,
    /* A coffee roaster that also broadlines meat, dairy and dry goods, so no allow list —
       just the roaster vocabulary, which is blend and bean names rather than the word
       "coffee". Without it "Woolloomooloo Blend" read as Beverage and "Decaf Beans" as
       Produce, because "bean" is a vegetable everywhere else. Cleaning runs first so
       "Espresso Machine Cleaner" doesn't become Coffee. */
    rules:[["Cleaning & Chemicals",CLEANING_RE],
           ["Coffee",/\b(blend|bean|roast|roasted|decaf|single origin|toby)\b/]] },
  { match:/fresh cut/i,
    /* Fruit, veg and cold goods. "Cheer Tasty 96 Slices" is sliced cheese, not a cake slice,
       and was reading as Bakery. Packaging categories are off so "Pineapple Pieces BOX"
       cannot be claimed by the word "box". */
    rules:[["Dairy / Cold Storage",/\b(cheer|cheese|butter|yogh?urt|slice|milk|cream)\b/]],
    allow:FOOD_CATS }
];
const profileFor=supplier=>SUPPLIER_PROFILES.find(p=>p.match.test(String(supplier||"")))||null;

function categorise(supplier,desc,fallback,key){
  if(key&&COVER[key]) return COVER[key];
  const prof=profileFor(supplier), t=catText(desc);
  if(prof&&prof.rules) for(const [cat,re] of prof.rules) if(re.test(t)) return cat;
  for(const [cat,re] of CATEGORY_RULES){
    if(!re.test(t)) continue;
    if(prof&&prof.allow&&prof.allow.indexOf(cat)===-1) continue;
    return cat;
  }
  if(prof&&prof.fallback) return prof.fallback;
  /* No fallback to the invoice's own category. It is set per INVOICE, not per line, so on a
     broadline supplier it labels everything unmatched with whatever that delivery was filed
     under — at Doppio that put coffee blends and caramel topping in "Beverage" and Earl Grey
     in "Coffee". A confident wrong answer is worse than an honest blank: Uncategorised is
     visible, filterable, and fixable in bulk. */
  return "Uncategorised";
}

function prodKey(supplier,code,desc,unit){
  const hasCode=!!norm(code), sk=norm(supplier);
  let id=hasCode?norm(code):nameKey(desc);
  const g=PMERGE[sk+"|"+norm(code)]||PMERGE[sk+"|"+norm(desc)]||PMERGE[sk+"|"+nameKey(desc)]||PMERGE[sk+"|"+id];
  if(g) id="grp:"+norm(g);
  const unitPart=(hasCode||g)?"":unitNorm(unit||"");
  return sk+"|"+id+"|"+unitPart;
}

/* COGS is an exclusion list, so a category the extractor invents lands IN cost of goods and
   shows up rather than vanishing. Everything on it is dropped from the data at load. */
const NON_COGS=new Set(["cleaning","equipment","repairs","maintenance","repairs & maintenance",
  "utilities","energy","overheads","admin","insurance","rent","subscriptions","freight",
  "waste","waste management","misc","other"]);
const supGroup=n=>{const c=CFG[norm(n)];return (c&&c.group)||"Ungrouped";};
const supActive=n=>{const c=CFG[norm(n)];return c?c.active:true;};
const rowGroup=r=>{const g=supGroup(r.supplier);return g!=="Ungrouped"?g:(r.category||"Ungrouped");};
const isCogs=r=>!NON_COGS.has(String(rowGroup(r)||"").trim().toLowerCase());

/* Rep email, cc and note are shared facts about the supplier. ORDERING is this dashboard's
   own (Adrian, 18 Sep): here (on the Order tab), portal (spend everywhere, no ordering here —
   they insist on their own platform), off (spend everywhere, no ordering here). Spend is
   visible in every state; the moment a supplier vanished from the front page the header
   total would stop adding up to the table. visible and portal_only are derived so the
   ordering code keeps reading the names it always did. */
function sset(name){
  const s=SSET[norm(name)]||{};
  const ordering=s.ordering||"here";
  return { rep_email:s.rep_email||"", ordering, orderHere:ordering==="here",
           visible:ordering!=="off", portal_only:ordering==="portal",
           cc:s.cc||"", note:s.note||"" };
}

/* ================= FETCH ================= */
/* gviz answers a missing tab with the FIRST sheet's data, HTTP 200, no error. The header
   signature is the only guard, and a tab with no signature declared gets none — so an
   undeclared name throws rather than quietly returning invoices. */
const TAB_COLUMNS={
  "Invoices":["invoice_number","invoice_date","total"],
  "InvoiceLines":["invoice_number","description","line_total"],
  "SupplierConfig":["supplier","merge_into"],
  "ProductMerge":["supplier","match","into"],
  "ManualPurchases":["date","shop","venue","amount"],
  "Orders":["order_id","supplier","venue","order_date"],
  "OrderLines":["order_id","description","qty"],
  "SupplierSettings":["supplier","rep_email"],
  "Favourites":["fav_id","fav_name","venue"],
  "FavouriteLines":["fav_id","item_key","qty"],
  "CategoryOverrides":["item_key","category"],
  /* Created by Orders.gs on the first "turn off" from this dashboard. Until then gviz hands
     back the first sheet instead, the signature check rejects it, and the load treats that as
     "nothing turned off". */
  "ItemVisibility":["item_key","scope","hidden"],
  /* Same story: created by Orders.gs on the first supplier turned off from this dashboard. */
  "SupplierVisibility":["supplier","scope","visible"],   // "ordering" arrived later and sits last; read when present
  "Sales":["date","venue","sales"]
};
async function fetchTab(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const res=await fetch(url), txt=await res.text();
  if(!res.ok||/^\s*</.test(txt)||/"status"\s*:\s*"error"/.test(txt)) throw new Error("tab '"+name+"' not found or not shared");
  const rows=parseCsv(txt);
  if(!rows.length) return [];
  const cols=rows[0].map(c=>String(c||"").toLowerCase().trim());
  const need=TAB_COLUMNS[name];
  if(!need) throw new Error("fetchTab('"+name+"'): no column signature declared in TAB_COLUMNS");
  const missing=need.filter(c=>cols.indexOf(c)===-1);
  if(missing.length) throw new Error("tab '"+name+"' did not answer with its own columns (missing: "+missing.join(", ")+")");
  return rows.slice(1).map(r=>{const o={};cols.forEach((c,i)=>{o[c]=r[i]!==undefined?r[i]:null;});return o;});
}
/* Income before the ImPOS feed. BG Ops Data's Sales tab holds weekly totals per venue, week
   ENDING Sunday, back to April 2023 — which is why every panel read zero before 3 Aug 2026.
   Each week is spread evenly over its seven days: exact for a weekly total, and it only
   smooths the day-of-week shape, which nothing pre-cutover depends on. The tab runs to
   16 Aug and so OVERLAPS the feed by two weeks — it is cut hard at the cutover or those
   weeks count twice. */
async function fetchWeeklySales(cut){
  const rows=await fetchTab("Sales");
  const out=[];
  rows.forEach(r=>{
    const wkEnd=gvizDate(r.date), venue=String(r.venue||"").trim(), total=num_(r.sales);
    if(!wkEnd||!total||LEDGER_VENUES.indexOf(venue)===-1) return;
    for(let i=6;i>=0;i--){
      const d=addD(wkEnd,-i);
      if(cut&&d>=cut) continue;
      out.push({date:d,venue,sales:total/7,weekly:true});
    }
  });
  return out;
}
async function fetchSalesDaily(){
  const q="select B, C, sum(H) group by B, C label B 'date', C 'venue', sum(H) 'sales'";
  const url=`https://docs.google.com/spreadsheets/d/${SALES_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=SalesFeed&tq=${encodeURIComponent(q)}`;
  const res=await fetch(url), txt=await res.text();
  if(!res.ok||/^\s*</.test(txt)||/"status"\s*:\s*"error"/.test(txt)) throw new Error("sales feed not readable");
  const rows=parseCsv(txt);
  if(rows.length<2) return [];
  return rows.slice(1).map(r=>({date:gvizDate(r[0]),venue:String(r[1]||"").trim(),sales:num_(r[2])}))
                      .filter(r=>r.date&&LEDGER_VENUES.indexOf(r.venue)>=0);
}
function parseCsv(text){
  const rows=[];let row=[],field="",inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=ch; }
    else{
      if(ch==='"') inQ=true;
      else if(ch===","){row.push(field);field="";}
      else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n")i++; row.push(field);field="";
        if(row.length>1||row[0]!=="") rows.push(row); row=[]; }
      else field+=ch;
    }
  }
  if(field!==""||row.length){row.push(field); if(row.length>1||row[0]!=="") rows.push(row);}
  return rows;
}

/* ================= LOAD ================= */
async function loadAll(){
  const app=document.getElementById("app");
  app.innerHTML='<div id="status">Loading data…</div>';
  LOAD_WARN=[];
  try{
    const warn=l=>e=>{LOAD_WARN.push(l+": "+e.message);return [];};
    const [inv,lines,cfgRows,pmRows,manRows,ordRows,ordLineRows,setRows,favRows,favLineRows,covRows,feed,weekly,visRows,supVisRows]=await Promise.all([
      fetchTab("Invoices"),
      fetchTab("InvoiceLines"),
      fetchTab("SupplierConfig").catch(warn("SupplierConfig")),
      fetchTab("ProductMerge").catch(()=>[]),
      fetchTab("ManualPurchases").catch(warn("ManualPurchases")),
      fetchTab("Orders").catch(()=>[]),
      fetchTab("OrderLines").catch(()=>[]),
      fetchTab("SupplierSettings").catch(()=>[]),
      fetchTab("Favourites").catch(()=>[]),
      fetchTab("FavouriteLines").catch(()=>[]),
      fetchTab("CategoryOverrides").catch(()=>[]),
      fetchSalesDaily().catch(warn("sales feed")),
      fetchWeeklySales(gvizDate(SALES_CUTOVER)).catch(warn("weekly Sales tab")),
      fetchTab("ItemVisibility").catch(()=>[]),
      fetchTab("SupplierVisibility").catch(()=>[])
    ]);

    CFG={};
    cfgRows.forEach(r=>{const k=norm(r.supplier);if(!k)return;
      CFG[k]={merge:String(r.merge_into||"").trim(),group:String(r.group||"").trim(),
              active:String(r.active||"").trim().toLowerCase()!=="no"};});
    const applyCfg=n=>{let x=n,seen={};while(true){const c=CFG[norm(x)];
      if(c&&c.merge&&!seen[norm(c.merge)]){seen[norm(x)]=true;x=c.merge;}else break;}return x;};

    /* Glenorchy is dropped here, at the first filter every row passes through. Nothing
       downstream can reintroduce it. */
    INV=inv.map(r=>({venue:r.venue||"",supplier:r.supplier||"",number:String(r.invoice_number||""),
      date:gvizDate(r.invoice_date)||gvizDate(r.scanned),subtotal:num_(r.subtotal),gst:num_(r.gst),
      total:num_(r.total),freight:num_(r.freight),category:r.category||"",type:r.type||"invoice",src:r.source||"",
      scannedAt:gvizDateTime(r.scanned)}))
      .filter(r=>r.supplier&&r.date&&r.type!=="superseded"&&LEDGER_VENUES.indexOf(r.venue)>=0);

    const variants={};
    INV.forEach(r=>{const k=norm(r.supplier);(variants[k]=variants[k]||{})[r.supplier]=(variants[k][r.supplier]||0)+1;});
    const canon={};
    Object.entries(variants).forEach(([k,v])=>{canon[k]=Object.entries(v).sort((a,b)=>b[1]-a[1])[0][0];});
    INV.forEach(r=>{r.supplier=applyCfg(canon[norm(r.supplier)]||r.supplier);});

    manRows.forEach(r=>{
      const amt=num_(r.amount),d=gvizDate(r.date),shop=String(r.shop||"").trim(),v=r.venue||"";
      if(!amt||!d||!shop||LEDGER_VENUES.indexOf(v)===-1) return;
      INV.push({venue:v,supplier:shop,number:"",date:d,subtotal:amt,gst:0,total:amt,
                category:(r.category||"").trim()||"Food",type:"manual",src:""});
    });

    /* COGS only, by instruction. Dropping rent, energy, waste and repairs HERE rather than
       filtering in each view means no total, group, catalogue or countdown can pick them up
       later by accident. */
    const beforeCogs=INV.length;
    INV=INV.filter(isCogs);
    console.log("COGS filter kept "+INV.length+" of "+beforeCogs+" invoice rows");

    COVER={}; HIDDEN={};
    covRows.forEach(r=>{
      const k=String(r.item_key||"").trim(); if(!k) return;
      const c=String(r.category||"").trim();
      if(c) COVER[k]=c;
      /* The hidden column here is Cambridge Central's. Deliberately not read. */
    });
    visRows.forEach(r=>{
      const k=String(r.item_key||"").trim();
      if(!k||String(r.scope||"").trim().toLowerCase()!==VIS_SCOPE) return;
      if(String(r.hidden||"").trim().toLowerCase()==="yes") HIDDEN[k]=true;
    });

    const byNumber={};
    INV.forEach(r=>byNumber[norm(r.supplier)+"|"+norm(r.number)]=r);
    PMERGE={};
    const unwrap=v=>String(v==null?"":v).replace(/^="?|"?$/g,"").trim();
    pmRows.forEach(r=>{const s=unwrap(r.supplier),m=unwrap(r.match),i=unwrap(r.into);
      if(s&&m&&i) PMERGE[norm(s)+"|"+norm(m)]=i;});

    LINES=lines.map(r=>{
      const cs=applyCfg(canon[norm(r.supplier)]||r.supplier||"");
      const iv=byNumber[norm(cs)+"|"+norm(String(r.invoice_number||""))];
      return {number:String(r.invoice_number||""),supplier:cs,venue:r.venue||"",
              code:String(r.item_code||""),desc:r.description||"",qty:num_(r.qty),unit:r.unit||"",
              price:num_(r.unit_price),total:num_(r.line_total),date:iv?iv.date:null,
              invCategory:iv?iv.category:""};
    }).filter(r=>r.supplier&&r.date&&LEDGER_VENUES.indexOf(r.venue)>=0);

    /* A line whose invoice is gone (dropped by the COGS filter) goes with it. */
    const keptInv={};
    INV.forEach(r=>keptInv[norm(r.supplier)+"|"+norm(r.number)]=true);
    LINES=LINES.filter(l=>keptInv[norm(l.supplier)+"|"+norm(l.number)]);

    applyFuzzyFold();
    LINES.forEach(l=>{ l.key=prodKey(l.supplier,l.code,l.desc,l.unit);
                       l.cat=categorise(l.supplier,l.desc,l.invCategory,l.key); });

    /* Rep email, portal-only, cc and note are facts about the supplier and stay shared with
       Cambridge Central. VISIBLE IS NOT: the SupplierSettings column is Cambridge's list and is
       deliberately not read. This dashboard's list is the SupplierVisibility tab, scope
       glenorchy, a row per supplier turned off here (Adrian, 18 Sep 2026 — "the lists should
       be independent, it is overall cleaner"). */
    /* SupplierSettings.visible and .portal_only are Cambridge Central's and are deliberately
       not read. Ordering here comes only from SupplierVisibility, scope glenorchy. */
    SSET={};
    setRows.forEach(r=>{const k=norm(r.supplier);if(!k)return;
      SSET[k]={rep_email:String(r.rep_email||"").trim(), ordering:"here",
               cc:String(r.cc||"").trim(), note:String(r.note||"").trim()};});
    supVisRows.forEach(r=>{
      const k=norm(r.supplier); if(!k||String(r.scope||"").trim().toLowerCase()!==VIS_SCOPE) return;
      const o=String(r.ordering||"").trim().toLowerCase()||(String(r.visible||"").trim().toLowerCase()==="no"?"off":"here");
      if(o==="portal"||o==="off") SSET[k]=Object.assign({},SSET[k]||{},{ordering:o});
    });

    const favLines={};
    favLineRows.forEach(r=>{const id=String(r.fav_id||"").trim();if(!id)return;
      (favLines[id]=favLines[id]||[]).push({key:String(r.item_key||""),desc:String(r.description||""),
        unit:String(r.unit||""),qty:num_(r.qty),supplier:String(r.supplier||"")});});
    FAVS=favRows.map(r=>({id:String(r.fav_id||"").trim(),name:String(r.fav_name||"").trim(),
      venue:String(r.venue||"").trim(),supplier:String(r.supplier||"").trim(),
      by:String(r.created_by||"").trim(),lines:favLines[String(r.fav_id||"").trim()]||[]}))
      .filter(f=>f.id&&f.name);   // scoped to a store at render time, by f.venue

    ORDERS=parseOrders(ordRows,ordLineRows);
    const cut=gvizDate(SALES_CUTOVER);
    SALES=weekly.concat(feed.filter(f=>!cut||f.date>=cut));
    SALES_OK=SALES.length>0;
    if(!feed.length) LOAD_WARN.push("the POS sales feed returned nothing, so income from "+SALES_CUTOVER+" is missing");
    if(!weekly.length) LOAD_WARN.push("the Sales tab returned nothing, so income before "+SALES_CUTOVER+" is missing");

/* Buckets are per supplier and unit, so a fold can never reach across either. */
function applyFuzzyFold(){
  const buckets={};
  LINES.forEach(l=>{
    if(norm(l.code)) return;                        // coded items need no name matching
    const b=norm(l.supplier)+"|"+unitNorm(l.unit||"");
    const k=nameKey(l.desc);
    const m=(buckets[b]=buckets[b]||{});
    (m[k]=m[k]||{key:k,bucket:b,n:0,desc:l.desc}).n++;
  });
  const fold={};
  Object.values(buckets).forEach(m=>{
    const map=fuzzyFold(Object.values(m));
    Object.entries(map).forEach(([from,to])=>{ if(from!==to) fold[Object.values(m)[0].bucket+"|"+from]=to; });
  });
  LINES.forEach(l=>{
    if(norm(l.code)) return;
    const b=norm(l.supplier)+"|"+unitNorm(l.unit||"");
    const to=fold[b+"|"+nameKey(l.desc)];
    if(to) l.foldTo=to;
  });
}
/* OrderLines has been written since the first version but never read back. Reading it is
   what makes a past order repeatable: every order placed here already holds exactly what
   was on it. The stored line has no product key — it has the code, description and unit the
   order was built from, and prodKey() is deterministic, so the key rebuilds from those and
   matches the catalogue without a schema change. */
function parseOrders(rows,lineRows){
  const lines={};
  (lineRows||[]).forEach(r=>{
    const id=String(r.order_id||"").trim(); if(!id) return;
    const qty=num_(r.qty); if(!(qty>0)) return;
    (lines[id]=lines[id]||[]).push({code:String(r.item_code||""),desc:String(r.description||""),
      unit:String(r.unit||""),qty,price:num_(r.unit_price)});
  });
  const byId={};
  rows.forEach(r=>{
    const id=String(r.order_id||"").trim(); if(!id) return;
    const venue=String(r.venue||"").trim();
    if(LEDGER_VENUES.indexOf(venue)===-1) return;
    const d=gvizDate(r.order_date), logged=gvizDate(r.logged_at)||d;
    const prev=byId[id];
    const action=String(r.action||"place").trim().toLowerCase();
    const rec={id,action,supplier:String(r.supplier||"").trim(),
      venue,date:d,total:num_(r.total),subtotal:num_(r.subtotal),gst:num_(r.gst),
      channel:String(r.channel||"").trim(),by:String(r.placed_by||"").trim(),logged,
      loggedAt:gvizDateTime(r.logged_at),
      delivery:gvizDate(r.delivery_date)||null};
    /* A manual match row carries the invoice number in its note; every other field on it may
       be blank, so it is layered onto the place row rather than replacing it. */
    if(action==="match"){ rec.matchedTo=String(r.note||"").trim(); delete rec.total; delete rec.subtotal; delete rec.gst; delete rec.delivery; }
    if(action==="sent"){ delete rec.action; }               // a send row is not a status change
    const keep=Object.fromEntries(Object.entries(rec).filter(([k,v])=>v!==undefined&&v!==null&&!(k==="delivery"&&!v)));
    if(!prev||(logged&&prev.logged&&logged>=prev.logged)||!prev.logged) byId[id]=Object.assign({},prev||{},keep);
  });
  Object.values(byId).forEach(o=>{ o.lines=lines[o.id]||[]; });
  const all=Object.values(byId).filter(o=>o.date&&o.supplier);
  /* Deleting is append-only: a "cancel" row is added and the last row wins, so the order
     leaves every total and list while the history stays in the sheet. Counting them means
     the Placed screen can say where they went rather than silently losing rows. */
  CANCELLED=all.filter(o=>o.action==="cancel").length;
  return all.filter(o=>o.action!=="cancel");
}

/* ================= INCOME, SPEND, COUNTDOWN =================
   One ledger, one venue. */
const currentWeek=today=>{const s=addD(weekStart(today||new Date()),WEEK_OFF*7);
  const e=addD(s,6);e.setHours(23,59,59,999);return {start:s,end:e,kind:"week"};};
/* Catch-up: off on every load, so it is reached for, never left on. One state for the front
   page and the Order tab, so the envelope is the same number wherever it is read. */
let CATCHUP=false;
function toggleCatchup(){ CATCHUP=!CATCHUP; renderFilters(); route(); }
const weekLabel=wk=>fmtD(wk.start)+" – "+fmtD(wk.end)+(WEEK_OFF===0?" (this week)":WEEK_OFF===-1?" (last week)":"");
function dailySales(rows){
  const m={};
  (rows||[]).forEach(r=>{ if(!r.date) return; const k=fmtISO(r.date); m[k]=(m[k]||0)+(r.sales||0); });
  return m;
}
/* A day with no feed rows is no data, not zero takings — a closed day would otherwise
   drag that weekday's average down every week. */
function dowProfile(map,wkStart,weeks){
  const acc=Array.from({length:7},()=>({s:0,n:0}));
  for(let w=1;w<=weeks;w++) for(let d=0;d<7;d++){
    const v=map[fmtISO(addD(wkStart,-7*w+d))];
    if(v===undefined) continue;
    acc[d].s+=v; acc[d].n++;

  return acc.map(a=>a.n?a.s/a.n:0);

/* Any period: a week, a month, a quarter, two dates. Days already gone count what they took;
   today takes the larger of what it has taken and what a normal today takes; days to come
   take their weekday's usual. A period entirely in the past is therefore actual = forecast,
   and a month in progress is month-to-date plus a normal remainder. profile is indexed by
   weekday (0 = Monday), so the period may start on any day. */
function forecastPeriod(map,period,today,profile){
  const t=mid(today||new Date()); let actual=0,forecast=0; const days=[];
  for(let dt=mid(period.start); +dt<=+period.end; dt=addD(dt,1)){
    const iso=fmtISO(dt),a=map[iso]||0,dow=(dt.getDay()+6)%7;
    const isToday=+dt===+t,past=+dt<+t;
    const used=past?a:(isToday?Math.max(a,profile[dow]||0):(profile[dow]||0));
    actual+=a; forecast+=used;
    days.push({iso,dow,actual:a,used,past,isToday,est:!past&&!(isToday&&a>=(profile[dow]||0))});
  }

}
const forecastWeek=forecastPeriod;
/* Every supplier counts, portal-only included: hiding a supplier from the ordering screen
   must never hide their money. Non-COGS never reaches here — it was dropped at load. */
function capturedSpend(inv,wk){
  let cogs=0,n=0;
  (inv||[]).forEach(r=>{
    if(!r.date||r.date<wk.start||r.date>wk.end||!supActive(r.supplier)) return;
    cogs+=r.total; n++;
  });
  return {cogs,n};
}
/* RECONCILIATION. A placed order holds its slot in the budget until its invoice lands;
   when it does, the order stops counting and the invoice counts instead. Get this wrong in
   one direction and a delivery is charged twice; in the other, money vanishes.

   Three ways an order closes, in order of authority:
     1. someone matched it to an invoice by hand (a "match" row naming the invoice);
     2. someone marked it received;
     3. the tool found the invoice itself.

   Auto-matching anchors on the DELIVERY date, since that is what the supplier dates the
   invoice, and falls back to the order date when none was given. Within a window of a day
   before to MATCH_DAYS after, it takes the invoice from that supplier whose total is
   CLOSEST to the order's, and accepts only if the two agree within a third. The old rule
   accepted any later invoice regardless of amount, which let a $2,000 delivery close a
   $200 order and left the $2,000 uncounted. Anything that fails the amount test stays open
   and is shown with its nearest candidate, so a human can match it in two clicks.

   One invoice settles one order, oldest first. Manual matches are honoured before the
   automatic pass so a hand-matched invoice can never also close a second order. Orders not
   placed through this tool have no row here at all: their invoices simply count as spend,
   which is correct and needs nothing. */
const MATCH_TOL=0.35;
function reconcile(orders,inv,wk,today){
  const now=mid(today||new Date());
  const inWeek=(orders||[]).filter(o=>o.date&&o.date>=wk.start&&o.date<=wk.end).sort((a,b)=>a.date-b.date);
  const pool=(inv||[]).filter(r=>r.date&&r.type!=="manual").map(r=>({r,used:false}));
  const byNum=n=>pool.find(p=>norm(p.r.number)===norm(n)&&!p.used);
  const closed=[], open=[];
  // 1. manual matches first, so their invoices are off the table
  inWeek.forEach(o=>{
    if(!o.matchedTo) return;
    const p=byNum(o.matchedTo);
    if(p) p.used=true;
    closed.push({o,inv:p?p.r:null,how:"matched by hand"});
  });
  inWeek.forEach(o=>{
    if(o.matchedTo) return;
    if(o.action==="receive"){ closed.push({o,inv:null,how:"marked received"}); return; }
    const anchor=+mid(o.delivery||o.date);
    if((+now-anchor)/864e5>MATCH_DAYS){ closed.push({o,inv:null,how:"expired after "+MATCH_DAYS+" days"}); return; }
    let best=null, bestDiff=Infinity, nearestAny=null, nearestDiff=Infinity;
    pool.forEach(p=>{
      if(p.used||norm(p.r.supplier)!==norm(o.supplier)) return;
      const gap=(+mid(p.r.date)-anchor)/864e5;
      if(gap<-1||gap>MATCH_DAYS) return;

         still the most useful thing to show a human, who can match it by hand if they know
         better. */
      const d0=Math.abs(p.r.total-o.total);
      if(d0<nearestDiff){ nearestAny=p.r; nearestDiff=d0; }
      /* An invoice captured BEFORE the order was placed cannot be that order's, whatever the
         dates say. Both tabs carry the clock: Invoices.scanned is when the email landed,
         Orders.logged_at when the order was made. This caught a real one — a genuine $900.48
         Doppio invoice scanned 14 Sep 17:53 was closing an $831.30 order placed 15 Sep 11:15,
         because both carried the invoice date 15 Sep and the amounts were 8% apart.
         Not all orders go through this tool, so unrelated invoices are the normal case, not
         the exception, and date-only matching is not enough to tell them apart. */
      if(p.r.scannedAt&&o.loggedAt&&p.r.scannedAt<o.loggedAt) return;
      if(d0<bestDiff){ best=p; bestDiff=d0; }

/* Kept for the countdown and the tests: just the orders still holding a slot. */
function openOrders(orders,inv,wk,today){ return reconcile(orders,inv,wk,today).open; }
function gstRate(supplier){
  let sub=0,gst=0; const since=Date.now()-CAT_DAYS*864e5;
  INV.forEach(r=>{ if(norm(r.supplier)!==norm(supplier)||r.type==="manual") return;
    if(!r.date||+r.date<since||!(r.subtotal>0)) return; sub+=r.subtotal; gst+=r.gst; });
  if(!(sub>0)) return 0.1;
  const r=gst/sub;
  return r<0.005?0:Math.min(0.1,Math.round(r*1000)/1000);

/* The countdown for ANY period. The weekday profile is always the most recent DOW_WEEKS

   progress it is the freshest read on what the remaining days will take.

   Drafts only count while the period is live: a draft sitting in the browser belongs to the
   order about to be placed, not to last month. Open orders count whenever their date falls
   in the period, since an order still awaiting its invoice is money that period has spent.

   A finished period's "left to spend" is budget minus actual, which is the running tally —
   a heavy week after a quiet weekend shows here as the amount to claw back next period. */
/* FORECAST ONLY IN WEEK MODE (Adrian, 17 Sep). The countdown — income forecast, 30%

   needs a short horizon. Over a month "left to spend $8k" is true and useless, and
   forecasting spend to fix it would presume the decision instead of informing it. So a
   live week is a countdown; anything else is the books to date, no forecast anywhere, and
   the fourth tile is the TALLY: 30% of income to date minus spend to date. Negative is the

  const profile=countdown?dowProfile(map,weekStart(t),DOW_WEEKS):Array(7).fill(0);
  const sales=forecastPeriod(map,period,now,profile);

  const open=openOrders(ORDERS.concat(LOCAL_ORDERS),INV,period,now);

  const used=cap.cogs+committed+drafted;
  /* Catch-up: the calendar month's tally up to the day before this week, folded into this

     those earlier weeks count as their spend, exactly as they do inside a week. */

    const from=new Date(period.start.getFullYear(),period.start.getMonth(),1), to=endOfDay(addD(period.start,-1));

      catchup={from,to,income:inc,spend:sp,tally:inc*TARGET_COGS_PCT/100-sp};
    } else catchup={from,to,income:0,spend:0,tally:0};

    allowed,tally:allowed-(cap.cogs+committed),

/* Ordering routes: the ordering week, stepped with WEEK_OFF. */
function weekModel(today){
  const wk=currentWeek(today);
  wk.short=WEEK_OFF===0?"this week":WEEK_OFF===-1?"last week":fmtD(wk.start)+" – "+fmtD(wk.end);
  return periodModel(wk,today,{catchup:CATCHUP});

/* Reading routes: whatever the range bar says. */
function rangeModel(today){ return periodModel(reportRange(),today,{catchup:CATCHUP}); }

/* ================= CATALOGUE ================= */
/* No master product list exists in the platform. What you buy IS the catalogue, derived
   from the invoice lines, so it needs no upkeep and prices follow the invoices. Charges are
   not stock and are stripped. */
/* Ordering data is scoped to the active tag (only one here). venue:null crosses every
   ledger venue, which for Glenorchy HQ is the same thing — kept so the code matches
   Cambridge Central line for line. */
/* Charges are not stock. "admin\s*fee" only ever caught the literal phrase, so "Admin
   service fee", "Distribution Fee" and "Min Order Charge" all stayed in the catalogue —
   and Fill Usual duly ordered twenty-two admin fees. Checked against all 2,030 distinct
   descriptions in the data: this removes exactly six lines, every one a real charge.
   Shared by the catalogue and the Reports top-10s, so both agree on what a product is. */
const FEE=/deliver|freight|fuel|levy|surcharge|cdl|container\s*deposit|rounding|\bfees?\b|\bcharges?\b|\bcartage\b|\bmin(imum)?\.?\s*order\b/i;
function deriveCatalogue(lines,supplier,now,opts){
  opts=opts||{};
  const venue=opts.venue===undefined?TAG.name:opts.venue;
  const listDays=opts.listDays||CAT_DAYS, rateDays=opts.rateDays||RATE_DAYS;
  const t=+(now||new Date()),listFrom=t-listDays*864e5,rateFrom=t-rateDays*864e5;
  const map={};
  (lines||[]).forEach(l=>{
    if(supplier&&l.supplier!==supplier) return;
    if(venue&&l.venue!==venue) return;
    if(!(l.price>0)||!(l.qty>0)||!l.date) return;
    if(FEE.test(l.desc)) return;
    if(+l.date<listFrom) return;
    const k=l.key||prodKey(l.supplier,l.code,l.desc,l.unit);
    const p=map[k]||(map[k]={key:k,supplier:l.supplier,code:l.code,desc:l.desc,unit:l.unit,buys:[]});
    p.desc=l.desc; p.unit=l.unit; p.buys.push(l);
  });
  return Object.values(map).map(p=>{
    p.buys.sort((a,b)=>a.date-b.date);
    const recent=p.buys.filter(b=>+b.date>=rateFrom), base=recent.length?recent:p.buys;
    const qty=base.reduce((s,b)=>s+b.qty,0);
    const orders=new Set(base.map(b=>norm(b.number))).size||1;
    const span=Math.max(7,(+base[base.length-1].date-+base[0].date)/864e5+1);
    p.last=p.buys[p.buys.length-1];
    p.price=p.last.price; p.lastQty=p.last.qty; p.lastDate=p.last.date;
    p.qtyTotal=p.buys.reduce((s,b)=>s+b.qty,0);
    p.spendTotal=p.buys.reduce((s,b)=>s+b.total,0);
    p.avgPerOrder=qty/orders; p.avgQtyWk=qty/(span/7); p.ordersPerWk=orders/(span/7);
    p.daysSince=Math.round((t-+p.last.date)/864e5);
    p.stale=+p.last.date<rateFrom;
    p.variants=[...new Set(p.buys.map(b=>b.desc))];
    /* Category from ALL the merged spellings, not just the newest one. p.desc is whichever
       variant was bought most recently, so a product whose supplier alternates between
       "Cheese Slices" and "Cheer Tasty 96" would change category every time a different
       spelling came in last — which is exactly the shuffling that made the catalogue hard to
       order from. Tally the variants, take the most common real answer, break ties
       alphabetically so the result is stable run to run. */
    p.cat=stableCat(p);
    p.hidden=!!HIDDEN[p.key];
    p.prevPrice=null;
    for(let i=p.buys.length-2;i>=0;i--){ if(p.buys[i].price!==p.price){p.prevPrice=p.buys[i].price;break;} }
    p.change=p.prevPrice?(p.price-p.prevPrice)/p.prevPrice*100:null;
    /* WHEN the price last moved, not just by how much. A 4% rise last week and one from
       March were rendering identically, and only one of them is worth acting on. Walk back
       to the first delivery at the current price: that is the day it changed. */
    let si=p.buys.length-1;
    while(si>0&&p.buys[si-1].price===p.price) si--;
    p.priceSince=p.buys[si].date;
    p.priceAgeDays=Math.round((t-+p.priceSince)/864e5);
    p.priceFresh=p.change!=null&&p.priceAgeDays<=30;
    const ps=p.buys.filter(b=>+b.date>=t-90*864e5).map(b=>b.price);
    p.lo90=ps.length?Math.min(...ps):p.price;
    p.hi90=ps.length?Math.max(...ps):p.price;
    p.moves90=(()=>{let n=0;const r=p.buys.filter(b=>+b.date>=t-90*864e5);
      for(let i=1;i<r.length;i++) if(r[i].price!==r[i-1].price) n++; return n;})();

    p.fillQty = p.avgPerOrder<FILL_FLOOR_CUTOFF ? 0 : Math.max(FILL_MIN,Math.floor(p.avgPerOrder));

  });
}
function stableCat(p){
  if(COVER[p.key]) return COVER[p.key];

  return best?best[0]:categorise(p.supplier,p.desc,p.buys[0].invCategory,p.key);

/* ---- "Usual week": the benchmark a week's spend is read against. Supplier Explorer's rule,
   the one that has proved practical: a window shorter than four weeks is NOT divided by its
   own span — a fortnightly supplier would read as double in the week they delivered and
   vanish the next. Take the real spend over the AVG_WEEKS complete weeks before `before`
   and divide by AVG_WEEKS. Weeks with no delivery count as zero weeks, because a supplier you
   buy from fortnightly really does average half as much. `before` is a week start, so the

const AVG_WEEKS=4;
function usualWeek(before,keyOf){
  const end=mid(before), start=addD(end,-7*AVG_WEEKS), m={};
  INV.forEach(r=>{ if(!r.date||r.date<start||r.date>=end||!supActive(r.supplier)) return;

  const WEEKS_BACK=6;

    if(venue&&r.venue!==venue) return;
    const s=m[r.supplier]||(m[r.supplier]={name:r.supplier,spend:0,week:0,n:0,last:null,priorToDate:[]});
    s.spend+=r.total; s.n++;

    for(let w=1;w<=WEEKS_BACK;w++){ if(+addD(wk.start,-7*w)>=from){ sum+=s.priorToDate[w]||0; seen++; } }
    s.usualToDate=seen?sum/seen:null;
    s.vsUsual=(s.usualToDate!=null&&s.usualToDate>0)?(s.week-s.usualToDate)/s.usualToDate*100:null;
    s.daysSince=Math.round((t-+s.last)/864e5);
    s.lines=LINES.some(l=>l.supplier===s.name&&(!venue||l.venue===venue));
    s.ordering=cfg.ordering; s.visible=cfg.visible; s.portal=cfg.portal_only; s.rep=cfg.rep_email;
    s.orderable=cfg.orderHere&&s.lines;
    return s;
  }).sort((a,b)=>b.avgWk-a.avgWk);
}
const orderableSuppliers=()=>supplierList().filter(s=>s.orderable);
function supplierEmail(name){
  const cfg=sset(name);
  if(cfg.rep_email) return cfg.rep_email;
  const tally={};
  INV.filter(r=>r.supplier===name).forEach(r=>{
    (String(r.src||"").match(/[\w.+-]+@[\w.-]+\.\w+/g)||[]).forEach(e=>{
      e=e.toLowerCase();
      if(/redsquarecafe|beckitt|bgfitness|lumakitchen/.test(e)) return;
      const w=/sent-via|noreply|no-reply|donotreply|notifications?@|mailer|bounce/.test(e)?1:10;
      tally[e]=(tally[e]||0)+w;
    });
  });
  const best=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  return best?best[0]:"";
}

/* ================= DRAFTS ================= */
const DRAFT_KEY="ghq_drafts";
function loadDrafts(){ try{DRAFTS=JSON.parse(localStorage.getItem(DRAFT_KEY)||"{}")||{};}catch(e){DRAFTS={};} }
function saveDrafts(){ try{localStorage.setItem(DRAFT_KEY,JSON.stringify(DRAFTS));}catch(e){} }
const draftId=(supplier,venue)=>(venue||TAG.name)+"::"+supplier;
function draft(supplier,venue){
  const id=draftId(supplier,venue);
  const d=DRAFTS[id]||(DRAFTS[id]={supplier,tag:venue||TAG.name,qty:{},note:""});
  if(!d.delivery||gvizDate(d.delivery)<mid(new Date())) d.delivery=fmtISO(nextBusinessDay());
  return d;
}
function setDelivery(v){ const d=draft(SUPPLIER); if(gvizDate(v)) d.delivery=v; saveDrafts(); route(); }
function setQty(supplier,key,n,venue){
  const d=draft(supplier,venue);
  /* Two decimals, not whole units: plenty of lines are priced per kg and a last quantity of
     1.5kg must come back as 1.5, not 2. */
  n=Math.max(0,Math.round((Number(n)||0)*100)/100);
  if(n) d.qty[key]=n; else delete d.qty[key];
  saveDrafts();
}
function draftLines(supplier,venue){
  const d=DRAFTS[draftId(supplier,venue)]; if(!d) return [];
  const by={}; deriveCatalogue(LINES,supplier,new Date(),{venue:venue||TAG.name}).forEach(p=>by[p.key]=p);
  return Object.keys(d.qty).map(k=>{
    const p=by[k]; if(!p) return null;
    return {key:k,code:p.code,desc:p.desc,unit:p.unit,qty:d.qty[k],price:p.price,total:d.qty[k]*p.price,cat:p.cat};
  }).filter(Boolean);
}
function orderTotals(supplier,venue){
  const lines=draftLines(supplier,venue),rate=gstRate(supplier);
  const sub=lines.reduce((s,l)=>s+l.total,0);
  return {lines,sub,gst:sub*rate,total:sub+sub*rate,rate};
}
/* Every open draft counts against the countdown. */
function allDraftTotal(){
  let t=0;
  Object.values(DRAFTS).forEach(d=>{ if(d&&d.supplier) t+=orderTotals(d.supplier,d.tag).total; });
  return t;
}

/* Find a product without knowing who sells it — the question you have standing in the
   coolroom. Searches every supplier at once, which is the point: the same thing often comes
   from two of them at two prices, and that is worth seeing side by side. */
/* chips:false is the front page — a plain search box, Supplier Explorer style. The category
   chips stay on the Order tab, where browsing a category is how you find what to add. A chip
   picked over there is ignored here rather than silently narrowing a box that shows no chip. */
function productSearchCard(opts){
  const chips=!(opts&&opts.chips===false);
  const q=GSEARCH.trim().toLowerCase();
  const all=globalCatalogue();
  /* Counts come from the text match alone, so each chip shows what it would give you rather
     than what is left after the chip already applied — a filter that reads "Dairy (0)" is
     more use than one that silently hides itself. */
  const textHit=p=>!q||q.length<2||p.desc.toLowerCase().includes(q)||String(p.code).toLowerCase().includes(q);
  const pool=all.filter(textHit);
  const counts={};
  pool.forEach(p=>{counts[p.cat]=(counts[p.cat]||0)+1;});
  const cats=Object.keys(counts).sort();
  /* A category on its own is a valid search: "show me everything in Frozen". */
  const catFilt=chips?GCAT_FILT:"";
  const browsing=!!catFilt&&q.length<2;
  let rows=[];
  if(q.length>=2||browsing){
    rows=sortGlobal(pool.filter(p=>!catFilt||p.cat===catFilt));
  }
  const shown=rows.slice(0,40);
  return `<div class="card">
    <div class="label">Find a product — every supplier</div>
    <input type="search" id="gsearch" placeholder="Search all products…" value="${esc(GSEARCH)}">

/* Every column sorts. The default is most-often-bought first, which is the order you want
   before you have expressed a preference. */
function sortGlobal(rows){
  const d=GSORT.dir;
  const by={ name:(a,b)=>a.desc.localeCompare(b.desc),
             supplier:(a,b)=>a.supplier.localeCompare(b.supplier)||a.desc.localeCompare(b.desc),
             cat:(a,b)=>a.cat.localeCompare(b.cat)||a.desc.localeCompare(b.desc),
             price:(a,b)=>a.price-b.price,
             qty90:(a,b)=>qty90(a)-qty90(b),
             last:(a,b)=>(+a.lastDate)-(+b.lastDate),
             freq:(a,b)=>a.ordersPerWk-b.ordersPerWk||b.desc.localeCompare(a.desc) };
  return rows.slice().sort((a,b)=>d*(by[GSORT.col]||by.freq)(a,b));

/* The flag reads: which way, by how much, and how long ago. A move inside 30 days is filled
   in so it stands out from an old one that happens to be the last change on record; a price
   that has moved two or more times in 90 days is called out separately, because a supplier

function priceFlag(p){

  const up=p.change>0, pct=Math.abs(Math.round(p.change*10)/10);

           :p.priceAgeDays<70?Math.round(p.priceAgeDays/7)+"w ago":Math.round(p.priceAgeDays/30)+"mo ago";
  const style=p.priceFresh
    ? `background:${up?"var(--red)":"var(--green)"};color:#fff;padding:1px 5px;border-radius:99px`
    : `color:var(--${up?"red":"green"})`;
  return `<br><span style="font-size:11px;font-weight:600;${style}"
      title="was ${money(p.prevPrice)} until ${fmtD(p.priceSince)} · 90-day range ${money(p.lo90)}–${money(p.hi90)}">${up?"▲":"▼"} ${pct}%</span>

}

/* What a USUAL order from this supplier is worth: the median of their recent delivery
   totals. Median, not mean, so one quarterly bulk drop doesn't licence a four-figure fill. */
function usualOrderValue(supplier,venue){
  const since=Date.now()-CAT_DAYS*864e5;
  const totals=INV.filter(r=>r.supplier===supplier&&(!venue||r.venue===venue)
                            &&r.type!=="manual"&&r.date&&+r.date>=since&&r.total>0)
                  .map(r=>r.total).sort((a,b)=>a-b);
  if(!totals.length) return 0;
  const m=Math.floor(totals.length/2);
  return totals.length%2 ? totals[m] : (totals[m-1]+totals[m])/2;
}
/* Fill Usual. Two things were wrong with the first version, and the screenshot showed both.
   The cap was the week's REMAINING budget, clamped at zero — so the moment the week was
   already over target the cap became 0, and `budgetLeft>0` then meant "no limit" rather than
   "no room". It filled hardest exactly when it should have filled least.

   The deeper error was the cap itself: a whole week's budget belongs to every supplier
   together, so handing it to one of them was never right. The real bound is this supplier's
   own usual delivery — filling every line at its 90-day average produces a week of stock in
   one order, which is not what anyone means by "my usual". The week's remaining budget still
   applies as a second, tighter ceiling when there is one. */
function fillUsualPlan(cat,cap,rate){
  const picked=[],skipped=[]; let total=0;
  /* cap is a hard ceiling, always. A cap of zero means there is no room, so nothing fills —
     it must never be read as "unlimited", which is precisely how the old guard failed. */
  cat.filter(p=>!p.stale&&p.fillQty>0)
     .sort((a,b)=>b.ordersPerWk-a.ordersPerWk)
     .forEach(p=>{
       const cost=p.fillQty*p.price*(1+(rate||0));
       if(cap<=0||total+cost>cap){ skipped.push(p); return; }
       picked.push(p); total+=cost;
     });
  return {picked,skipped,total,cap};
}
function fillUsual(){
  const m=weekModel(), cat=deriveCatalogue(LINES,SUPPLIER,new Date());
  const usual=usualOrderValue(SUPPLIER,TAG.name);
  /* No delivery history to learn from: fall back to whatever the week has left, and if the
     week has nothing left, fill nothing rather than everything. */
  let cap = usual>0 ? usual : Math.max(0,m.remaining);
  let reason = usual>0 ? "your usual "+money0(usual)+" order from them" : "the week's remaining budget";
  if(m.remaining>0&&m.remaining<cap){ cap=m.remaining; reason="the week's remaining "+money0(m.remaining); }
  const plan=fillUsualPlan(cat,cap,gstRate(SUPPLIER));
  plan.picked.forEach(p=>setQty(SUPPLIER,p.key,p.fillQty));
  route();
  const zeroed=cat.filter(p=>!p.stale&&p.fillQty===0).length;
  let msg=`Filled ${plan.picked.length} item(s), ${money0(plan.total)} — capped at ${reason}.`;
  if(plan.skipped.length) msg+=` ${plan.skipped.length} item(s) left off.`;
  else if(zeroed) msg+=` ${zeroed} below the ${FILL_FLOOR_CUTOFF} cutoff left at zero.`;
  toast(msg);
}

/* ================= REPORTS ================= */
const endOfDay=d=>{const e=new Date(d);e.setHours(23,59,59,999);return e;};
function reportRange(){
  const now=mid(new Date()), o=RANGE.off||0;
  if(RANGE.kind==="custom"&&RANGE.from&&RANGE.to){
    const a=gvizDate(RANGE.from), b=gvizDate(RANGE.to);
    if(a&&b&&a<=b) return {start:mid(a),end:endOfDay(b),label:fmtD(a)+" – "+fmtD(b),short:fmtD(a)+" – "+fmtD(b),kind:"custom"};
  }
  if(RANGE.kind==="all"){
    const first=INV.reduce((m,r)=>(r.date&&(!m||r.date<m))?r.date:m,null)||now;
    return {start:mid(first),end:endOfDay(now),label:"all captured data",short:"all time",kind:"all"};
  }
  if(RANGE.kind==="month"){
    const a=new Date(now.getFullYear(),now.getMonth()+o,1), b=new Date(a.getFullYear(),a.getMonth()+1,0);
    const lbl=a.toLocaleDateString("en-AU",{month:"long",year:"numeric"});
    return {start:a,end:endOfDay(b),label:lbl,short:lbl,kind:"month"};
  }
  if(RANGE.kind==="quarter"){
    const q=Math.floor(now.getMonth()/3)+o;
    const a=new Date(now.getFullYear(),q*3,1), b=new Date(a.getFullYear(),a.getMonth()+3,0);
    const lbl="Q"+(a.getMonth()/3+1)+" "+a.getFullYear();
    return {start:a,end:endOfDay(b),label:lbl,short:lbl,kind:"quarter"};
  }
  const a=addD(weekStart(now),7*o), b=addD(a,6);
  return {start:a,end:endOfDay(b),label:fmtD(a)+" – "+fmtD(b)+(o===0?" (this week)":o===-1?" (last week)":""),
          short:o===0?"this week":o===-1?"last week":fmtD(a)+" – "+fmtD(b),kind:"week"};
}
function spendRows(range){
  const bySup={},byGrp={};
  INV.forEach(r=>{
    if(!r.date||r.date<range.start||r.date>range.end||!supActive(r.supplier)) return;
    const g=rowGroup(r);
    (bySup[r.supplier]=bySup[r.supplier]||{name:r.supplier,spend:0,n:0,group:g,last:null}).spend+=r.total;
    bySup[r.supplier].n++;
    if(!bySup[r.supplier].last||r.date>bySup[r.supplier].last) bySup[r.supplier].last=r.date;
    (byGrp[g]=byGrp[g]||{name:g,spend:0,n:0}).spend+=r.total; byGrp[g].n++;
  });
  const weeks=Math.max(1,(range.end-range.start)/864e5/7);
  /* Under four weeks the range's own per-week rate is noise (see usualWeek); the column
     becomes the benchmark from before the range, and the arrow says how this range sits
     against it. Four weeks or more, the range's own average is a fair number and stands. */
  const short=weeks<AVG_WEEKS;
  const uS=short?usualWeek(range.start,r=>r.supplier):{}, uG=short?usualWeek(range.start,rowGroup):{};
  const fin=u=>o=>{ o.perWk=o.spend/weeks; o.avgWk=short?(u[o.name]||0):o.perWk;
    o.trend=short&&o.avgWk>0?(o.perWk-o.avgWk)/o.avgWk:null; return o; };
  return {sup:Object.values(bySup).map(fin(uS)).sort((a,b)=>b.spend-a.spend),
          grp:Object.values(byGrp).map(fin(uG)).sort((a,b)=>b.spend-a.spend), weeks, short};
}
/* Lives in the sticky #filters strip on every reading route, so the range is one control
   and every card under it agrees. */
function rangeBar(){

  return `<span class="chip sm" style="cursor:default;background:#f7f6f3">Books: ${esc(ENTITY)}</span>
    <span style="color:var(--line)">|</span>
    ${step?`<span class="chip sm" onclick="shiftRange(-1)" title="Previous period">‹</span>`:""}
    ${chip("week","Week")}${chip("month","Month")}${chip("quarter","Quarter")}${chip("all","All time")}
    ${step?`<span class="chip sm" onclick="shiftRange(1)" title="Next period" ${RANGE.kind!=="custom"&&o>=0?'style="opacity:.35"':""}>›</span>`:""}
    <input type="date" id="rfrom" value="${fmtISO(r.start)}" onchange="applyRangeDates()">

    <input type="date" id="rto" value="${fmtISO(mid(r.end))}" onchange="applyRangeDates()">

function catchupChip(show){

  renderFilters(); route();
}

const trendMark=o=>o.trend==null?"":o.trend>0.1?' <span class="up">▲</span>':o.trend<-0.1?' <span class="down">▼</span>':' <span style="color:var(--dim)">–</span>';
/* Product-level reading of the range. Supplier and group totals are the front page. */

/* ================= REPORTS: TOP 10s =================
   The ordering screens answer "what does X cost today". These answer "where did the money
   go" and "what did we actually sell" for the range on the chips above, which is a different
   question and belongs with the other spend reports.

   Products come from invoice lines (what you buy IS the catalogue — no master list exists),
   grouped by the same key the ordering screens use, charges stripped by the same FEE test,
   inactive suppliers excluded the same way spendRows does it. Line totals, not invoice
   totals, so the column will not add up to "Suppliers by spend" — fees and GST live there. */
let REP_SOLD_BY="sales", REP_CREEP_DIR="up";
function setSoldBy(k){ REP_SOLD_BY=k; route(); }
function setCreepDir(k){ REP_CREEP_DIR=k; route(); }

/* "Usual" for a product over the range (Adrian, 21 Sep): its rate over the AVG_WEEKS complete
   weeks before the range, scaled to the range's length — and PRO-RATED while the range is
   still running, because a Tuesday measured against a whole usual week reads ▼ on everything.
   Same window the supplier table's Usual/wk uses, so the two agree. */
function rangeScale(range){
  const days=Math.round((+mid(range.end)-+mid(range.start))/864e5)+1, t=mid(new Date());
  const elapsed=+t<+mid(range.start)?0:+t>+mid(range.end)?days:Math.round((+t-+mid(range.start))/864e5)+1;
  return {days,weeks:days/7,elapsed,live:elapsed<days,frac:days?elapsed/days:1};
}
/* more than usual = ▲. For spend that is the red one; for sales it is the green one. */
function usualMark(actual,usual,kind){
  if(!(usual>0)) return "";
  const up=actual>usual*1.1, down=actual<usual*0.9;
  if(!up&&!down) return ' <span style="color:var(--dim)">–</span>';
  const good=(kind==="sales"||kind==="money")?up:down;
  const fmt=kind==="money"?money0(usual):String(Math.round(usual*10)/10);
  return ` <span class="${good?"down":"up"}" title="usual ${fmt}">${up?"▲":"▼"}</span>`;
}
const usualNote=sc=>`▲▼ compares with the product's <b>usual</b> — its rate over the ${AVG_WEEKS} full weeks before the range,
  scaled to ${sc.weeks===1?"a week":wksLabel(sc.weeks)}${sc.live?` and pro-rated to the ${sc.elapsed} of ${sc.days} days so far`:""};
  more or less than 10% off it earns an arrow, hover for the figure, nothing where the product was not seen before.`;
function rangeProducts(range){
  const map={}, sc=rangeScale(range), uFrom=addD(mid(range.start),-7*AVG_WEEKS);
  LINES.forEach(l=>{
    if(!l.date||!(l.price>0)||!(l.qty>0)||FEE.test(l.desc)||!supActive(l.supplier)) return;
    if(l.date>range.end) return;
    const k=l.key||prodKey(l.supplier,l.code,l.desc,l.unit);
    const p=map[k]||(map[k]={key:k,supplier:l.supplier,desc:l.desc,unit:l.unit,cat:l.cat||"",before:[],inRange:[]});
    if(l.date<range.start) p.before.push(l);
    else { p.inRange.push(l); p.desc=l.desc; p.unit=l.unit; }
  });
  return Object.values(map).filter(p=>p.inRange.length).map(p=>{
    p.inRange.sort((a,b)=>a.date-b.date); p.before.sort((a,b)=>a.date-b.date);
    p.qty=p.inRange.reduce((s,b)=>s+b.qty,0);
    p.spend=p.inRange.reduce((s,b)=>s+b.total,0);
    p.price=p.inRange[p.inRange.length-1].price;
    /* Baseline is the last price paid BEFORE the range — "what were we paying". With nothing
       bought before it, the first price inside the range stands in, so a rise mid-range still
       shows and a steady price reads as no change rather than as a phantom rise. */
    const b0=p.before.length?p.before[p.before.length-1]:p.inRange[0];
    p.base=b0.price; p.baseDate=b0.date; p.baseFromBefore=!!p.before.length;
    p.change=p.base?(p.price-p.base)/p.base*100:null;
    /* Extra paid: every delivery in the range priced against the baseline. Negative = saved. */
    p.extra=p.inRange.reduce((s,b)=>s+b.qty*(b.price-p.base),0);
    p.usualWk=p.before.filter(b=>b.date>=uFrom).reduce((s,b)=>s+b.qty,0)/AVG_WEEKS;
    p.usualQty=p.usualWk*sc.weeks*(sc.live?sc.frac:1);
    return p;
  });
}
function creepChip(p){
  if(p.change==null||Math.abs(p.change)<0.05) return `<span style="color:var(--dim)">—</span>`;
  const up=p.change>0;
  return `<span class="${up?"up":"down"}" title="was ${money(p.base)} ${p.baseFromBefore?"before this range ("+fmtD(p.baseDate)+")":"at the start of the range"}">${up?"▲":"▼"} ${Math.abs(Math.round(p.change*10)/10)}%</span>`;
}
const signed=v=>(v<0?"\u2212":"")+money(Math.abs(v));
const qtyFmt=(q,u)=>`${Math.round(q*100)/100}${u?` <span style="color:var(--dim);font-size:11px">${esc(u)}</span>`:""}`;

        <td><b>${esc(p.desc)}</b></td>

        <td class="num">${qtyFmt(p.qty,p.unit)}${usualMark(p.qty,p.usualQty,"spend")}</td>

        delivery and fees stripped, so this will not match the supplier totals to the cent. Price is the latest paid
        in the range; the arrow compares it with what you were paying before the range. ${usualNote(sc)} Tap a row for the history.</div>`
      :`<div class="note">No product lines dated in ${esc(range.label)}.</div>`}</div>`;

/* The item feed for a range, shared by the sold and wastage cards. One status, one fetch:
   loadSalesWeek is idempotent while busy, so both cards asking on the same render costs one
   request. `prior` is the AVG_WEEKS complete weeks before the range, for "usual", fetched
   second so the range itself always lands first. */
function feedFor(range){
  const feedStart=gvizDate(SALES_CUTOVER);
  const days=Math.round((+mid(range.end)-+mid(range.start))/864e5)+1;
  if(feedStart&&range.end<feedStart) return {status:"pre",feedStart};
  if(days>SALES_MAX_DAYS) return {status:"wide",days};
  const start=feedStart&&range.start<feedStart?feedStart:range.start;
  const w={start,end:range.end}, k=sdKey(w);
  if(!SD[k]){ loadSalesWeek(w); return {status:"loading",start}; }
  if(SD_ERR&&!SD[k].length) return {status:"err"};
  const out={status:"ok",rows:SD[k],start,w,k,prior:null};
  let ps=addD(mid(range.start),-7*AVG_WEEKS); if(feedStart&&ps<feedStart) ps=feedStart;
  const pe=endOfDay(addD(mid(range.start),-1));
  if(+ps<+pe){
    const pw={start:ps,end:pe}, pk=sdKey(pw);
    if(!SD[pk]) loadSalesWeek(pw);
    else out.prior={rows:sdSales(SD[pk]),days:Math.round((+mid(pe)-+mid(ps))/864e5)+1};
    out.priorPending=!SD[pk];
  }
  return out;
}
function feedNote(f,head,range){
  if(f.status==="pre") return `<div class="card">${head}<div class="note">Item-level sales only exist from ${fmtD(f.feedStart)} and this range
      ends before that. Weekly totals are all the platform kept until then.</div></div>`;
  if(f.status==="wide") return `<div class="card">${head}<div class="note">That range is ${f.days} days. The item feed is 108,000 rows, so anything
      past ${SALES_MAX_DAYS} days is a download, not a report — Week, Month or Quarter shows the list.</div></div>`;
  if(f.status==="loading") return `<div class="card">${head}<div class="note">Loading the item-level feed for ${esc(range.label)}…</div></div>`;
  if(f.status==="err") return `<div class="card">${head}<div class="err">Couldn't read the feed: ${esc(SD_ERR)}</div></div>`;
  return "";
}

function repSoldCard(range){
  const head=`<div class="label">Top 10 sold — in range
    <span style="float:right;display:flex;gap:5px">
      <span class="chip sm ${REP_SOLD_BY==="sales"?"on":""}" onclick="setSoldBy('sales')">by revenue</span>
      <span class="chip sm ${REP_SOLD_BY==="qty"?"on":""}" onclick="setSoldBy('qty')">by units</span></span></div>`;
  const f=feedFor(range); if(f.status!=="ok") return feedNote(f,head,range);
  const sc=rangeScale(range), byQty=REP_SOLD_BY==="qty";
  /* Paid units only. A $0 line is a loyalty coffee or a binned sandwich — counting it as sold
     would inflate anything these numbers go on to feed. Kitchen requests are not sales. */
  const rows=sdSales(f.rows).filter(r=>r.sales>0), m={}, tradingDays={};
  rows.forEach(r=>{ const o=m[r.item]||(m[r.item]={name:r.item,group:r.group||"",qty:0,sales:0,uq:0,us:0});
    o.qty+=r.qty; o.sales+=r.sales; tradingDays[fmtISO(r.ts)]=1; });
  /* Units/day over the days that actually traded in the range, so a Monday-morning week is
     not divided by seven. */
  const nDays=Math.max(1,Object.keys(tradingDays).length);
  if(f.prior){
    const pw=f.prior.days/7, mult=sc.weeks*(sc.live?sc.frac:1)/pw;
    f.prior.rows.forEach(r=>{ if(!(r.sales>0)||!m[r.item]) return; m[r.item].uq+=r.qty*mult; m[r.item].us+=r.sales*mult; });
  }
  const list=Object.values(m).sort((a,b)=>byQty?b.qty-a.qty:b.sales-a.sales);
  const rev=list.reduce((s,o)=>s+o.sales,0), units=list.reduce((s,o)=>s+o.qty,0);
  const top=list.slice(0,10);
  const mark=o=>{ if(f.priorPending) return ' <span style="color:var(--dim)">…</span>';
    return byQty?usualMark(o.qty,o.uq,"sales"):usualMark(o.sales,o.us,"money"); };
  return `<div class="card">${head}
    ${top.length?`<table><thead><tr><th>Product</th><th class="hide-sm">Category</th><th class="num">${byQty?"Units":"Revenue"}</th>
      <th class="num hide-sm">${byQty?"Revenue":"Units"}</th><th class="num" title="units over the ${nDays} trading day(s) in the range">Units/day</th><th class="num">%</th></tr></thead>
      <tbody>${top.map(o=>`<tr><td><b>${esc(o.name)}</b></td>
        <td class="hide-sm">${o.group?`<span class="pill">${esc(o.group)}</span>`:""}</td>
        <td class="num"><b>${byQty?Math.round(o.qty*100)/100:money(o.sales)}</b>${mark(o)}</td>
        <td class="num hide-sm">${byQty?money(o.sales):Math.round(o.qty*100)/100}</td>
        <td class="num">${Math.round(o.qty/nDays*10)/10}</td>
        <td class="num" style="color:var(--dim)">${byQty?(units?pct1(o.qty/units*100):""):(rev?pct1(o.sales/rev*100):"")}</td></tr>`).join("")}</tbody></table>
      <div class="note">${list.length} products · ${money(rev)} paid sales${f.start>range.start?` from ${fmtD(f.start)} (the feed starts there)`:""}.
        Paid units only — $0 lines (loyalty coffees, wastage) and kitchen requests are excluded.
        % is share of ${byQty?"units":"revenue"} across every product in the range. Units/day is over the ${nDays}
        trading day(s) in the range. ${usualNote(sc)}</div>`
      :`<div class="note">No paid item sales in ${esc(range.label)}.</div>`}</div>`;
}

/* Wastage for the range, always by % wasted (Adrian, 21 Sep). Same definition as the Sales
   tab's card — a $0 line in a perishable group, for an item that also sold for money. */
function repWasteCard(range){

    <table><thead><tr><th>Product</th><th class="hide-sm">Group</th><th class="num">Binned</th>

    <tbody>${top.map(o=>`<tr><td><b>${esc(o.name)}</b></td>

      <tr style="border-top:2px solid var(--line)"><td><b>Total</b></td><td class="hide-sm"></td>

    <div class="note">${list.length>top.length?`Worst ${top.length} of ${list.length}. `:""}Perishable groups only:
      ${PERISHABLE.join(", ")}. Valued at that item's own average selling price in the range. Red at 25% or more.</div></div>`;
}

function repCreepCard(range,prods){
  const moved=prods.filter(p=>p.change!=null&&Math.abs(p.extra)>=0.005);
  const ups=moved.filter(p=>p.extra>0).sort((a,b)=>b.extra-a.extra);
  const downs=moved.filter(p=>p.extra<0).sort((a,b)=>a.extra-b.extra);
  const upTot=ups.reduce((s,p)=>s+p.extra,0), downTot=downs.reduce((s,p)=>s+p.extra,0);
  const list=(REP_CREEP_DIR==="up"?ups:downs).slice(0,10);
  const head=`<div class="label">Price creep — what price moves cost in range
    <span style="float:right;display:flex;gap:5px">
      <span class="chip sm ${REP_CREEP_DIR==="up"?"on":""}" onclick="setCreepDir('up')">rises (${ups.length})</span>
      <span class="chip sm ${REP_CREEP_DIR==="down"?"on":""}" onclick="setCreepDir('down')">falls (${downs.length})</span></span></div>`;
  if(!moved.length)
    return `<div class="card">${head}<div class="note">Nothing bought in ${esc(range.label)} is priced differently from
      what you were paying before it.</div></div>`;
  return `<div class="card">${head}
    <div style="font-size:13px;margin-bottom:8px">Rises cost <b class="up">${money(upTot)}</b> ·
      falls saved <b class="down">${money(-downTot)}</b> · net <b>${signed(upTot+downTot)}</b>${upTot+downTot<0?" saved":" extra"} in ${esc(range.label)}</div>
    ${list.length?`<table><thead><tr><th>Product</th><th class="hide-sm">Supplier</th><th class="num hide-sm">Was → now</th>
      <th class="num">Change</th><th class="num hide-sm">Qty</th><th class="num">${REP_CREEP_DIR==="up"?"Extra paid":"Saved"}</th></tr></thead>
      <tbody>${list.map(p=>`<tr class="click" onclick="go('rprod::${encodeURIComponent(p.key)}')">

      Where nothing was bought before the range, the first price inside it is the baseline. Sorted by dollars, not

/* ================= SUPPLIER DRILL =================
   The Supplier Explorer supplier page (Adrian, 18 Sep): a statement, the products bought,
   the invoices — every one of them for the range in the bar above, Week by default. The
   180-day catalogue this used to show belongs to ordering and still drives the builder.

   Statement rows are WHOLE weeks or months, whichever the toggle says, covering the range —
   built from the range's periods first and then filled completely, so a Week range shows
   that week, a Month range under the Week toggle shows the four or five weeks it touches,
   and nothing from outside the range appears. Reconcile these against the supplier's own
   statement; a difference is a missing invoice or a billing error. */
let STMT_PERIOD="week", SUPP_PROD_SORT={key:"change",dir:-1};
function setStmt(v){ STMT_PERIOD=v; route(); }
function sortSuppProds(k){ if(SUPP_PROD_SORT.key===k) SUPP_PROD_SORT.dir*=-1; else SUPP_PROD_SORT={key:k,dir:k==="name"||k==="cat"?1:-1}; route(); }

  const keys=new Set(); for(let d=mid(range.start); +d<=+range.end; d=addD(d,1)) keys.add(pKey(d));
  const per={};
  INV.forEach(r=>{ if(r.supplier!==name||!r.date) return; const k=pKey(r.date); if(!keys.has(k)) return;
    const m=per[k]||(per[k]={n:0,sub:0,gst:0,freight:0,credits:0,total:0});
    m.n++; m.sub+=r.subtotal; m.gst+=r.gst; m.freight+=r.freight||0; m.total+=r.total; if(r.type==="credit_note") m.credits+=r.total; });
  const mkeys=Object.keys(per).sort().reverse().slice(0,wk?16:12);

    ${email?`<div style="font-size:12px;margin-bottom:8px;color:var(--dim)">Contact: <a href="mailto:${esc(email)}" style="color:var(--red)">${esc(email)}</a></div>`:""}
