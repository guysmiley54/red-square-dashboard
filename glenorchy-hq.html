      <tbody>${mkeys.map(k=>{const m=per[k];return `<tr><td>${pName(k)}</td><td class="num">${m.n}</td>
        <td class="num hide-sm">${money(m.sub)}</td><td class="num hide-sm">${money(m.gst)}</td>${anyFreight?`<td class="num hide-sm">${money(m.freight)}</td>`:""}
        <td class="num hide-sm">${m.credits?money(m.credits):""}</td><td class="num"><b>${money(m.total)}</b></td></tr>`;}).join("")}
        <tr style="border-top:2px solid var(--ink)"><td><b>Total shown</b></td><td class="num"></td><td class="num hide-sm"></td>
        <td class="num hide-sm"></td>${anyFreight?'<td class="num hide-sm"></td>':""}<td class="num hide-sm"></td><td class="num"><b>${money(tot)}</b></td></tr>

/* Unit price history: the movement over time, not just the latest figure. */
function renderPriceHistory(key){
  const m=rangeModel();
  const sup=(LINES.find(l=>l.key===key)||{}).supplier;
  const p=sup?deriveCatalogue(LINES,sup,new Date(),{venue:null}).find(x=>x.key===key):null;
  if(!p){ document.getElementById("app").innerHTML=`<a class="back" onclick="go('')">All suppliers</a>
    <div class="card"><div class="note">That product isn't in the last ${CAT_DAYS} days of buying.</div></div>`; return; }
  const buys=p.buys.slice().reverse();
  const prices=p.buys.map(b=>b.price), lo=Math.min(...prices), hi=Math.max(...prices);
  const first=p.buys[0], move=first.price?((p.price-first.price)/first.price*100):0;
  /* The last 90 days, which is the window the ordering suggestions use, so the chart and
     the "usual" quantity are talking about the same period. */
  const from90=Date.now()-90*864e5;
  const b90=p.buys.filter(b=>+b.date>=from90);
  const qty90=b90.reduce((t,b)=>t+b.qty,0);
  const spend90=b90.reduce((t,b)=>t+b.total,0);
  const wkspan=Math.max(1,(Date.now()-Math.max(from90,+p.buys[0].date))/864e5/7);
  /* Both series on one axis pair: price as a line against the left scale, quantity as bars
     against its own. Plotted on TIME, not on buy number — evenly spaced points would hide
     the gaps, and the gaps are the ordering pattern. */
  const w=560,h=110,pad=8,base=h-16;
  const t0=Math.max(from90,+p.buys[0].date), t1=Date.now();
  const xs=d=>pad+((+d-t0)/Math.max(1,t1-t0))*(w-2*pad);
  const ys=v=>hi===lo?base/2:pad+(1-(v-lo)/(hi-lo))*(base-2*pad);
  const qmax=Math.max(...b90.map(b=>b.qty),1);
  const path=b90.map((b,i)=>(i?"L":"M")+xs(b.date).toFixed(1)+" "+ys(b.price).toFixed(1)).join(" ");
  document.getElementById("app").innerHTML=`${summaryBar(m)}
    <a class="back" onclick="go('rsup::'+encodeURIComponent('${esc(p.supplier)}'))">${esc(p.supplier)} products</a>
    <div class="card">
      <div class="label">Unit price history</div>
      <div style="font-size:16px;font-weight:700">${esc(p.desc)}</div>
      <div style="font-size:12px;color:var(--dim);margin-bottom:10px">${esc(p.supplier)} · ${esc(p.cat)} ·
        ${esc(p.unit||"")} ${p.code?"· "+esc(p.code):""}</div>
      <div style="font-size:13px;margin-bottom:8px">Now <b>${money(p.price)}</b> · range ${money(lo)}–${money(hi)} ·
        <span class="${move>0?"up":move<0?"down":""}">${move>0?"+":""}${Math.round(move*10)/10}% since ${fmtD(first.date)}</span>
        · bought ${p.buys.length}×
        ${p.variants.length>1?`<br><span style="color:var(--dim)">Merged names: ${esc(p.variants.join(" / "))}</span>`:""}</div>
      <div class="grid2" style="gap:8px;margin-bottom:8px">
        <div class="tile" style="padding:9px 12px">
          <div class="k">Bought — last 90 days</div>
          <div class="v" style="font-size:20px">${Math.round(qty90*100)/100} ${esc(p.unit||"")}</div>
          <div class="sub">${b90.length} delivery(s) · ${Math.round(qty90/wkspan*100)/100} ${esc(p.unit||"")} a week</div>
        </div>
        <div class="tile" style="padding:9px 12px">
          <div class="k">Spent — last 90 days</div>
          <div class="v" style="font-size:20px">${money0(spend90)}</div>
          <div class="sub">${qty90?money(spend90/qty90):"—"} average per ${esc(p.unit||"unit")}</div>
        </div>
      </div>
      ${b90.length?`<svg class="spark" style="height:110px" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        ${b90.map(b=>{const bh=(b.qty/qmax)*(base-pad*2);
          return `<rect x="${(xs(b.date)-3).toFixed(1)}" y="${(base-bh).toFixed(1)}" width="6" height="${bh.toFixed(1)}" fill="#dcdcd8"/>`;}).join("")}
        <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2"/>
        ${b90.map(b=>`<circle cx="${xs(b.date).toFixed(1)}" cy="${ys(b.price).toFixed(1)}" r="2.5" fill="var(--red)"/>`).join("")}
        <line x1="${pad}" y1="${base}" x2="${w-pad}" y2="${base}" stroke="var(--line)"/>
      </svg>
      <div class="legend" style="margin-bottom:10px">
        <span style="color:var(--dim)"><span style="display:inline-block;width:9px;height:9px;background:#dcdcd8;border-radius:2px;margin-right:4px"></span>quantity per delivery</span>
        <span style="color:var(--dim)"><span style="display:inline-block;width:9px;height:9px;background:var(--ink);border-radius:2px;margin-right:4px"></span>unit price</span>
        <span style="color:var(--dim)">${fmtD(new Date(t0))} → today, spaced by date</span>
      </div>`:`<div class="note">Nothing bought in the last 90 days.</div>`}
      <table><thead><tr><th>Date</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Change</th><th class="num">Line</th><th class="hide-sm">Invoice</th></tr></thead>
      <tbody>${buys.map((b,i)=>{
        const prev=buys[i+1];
        const ch=prev&&prev.price!==b.price?((b.price-prev.price)/prev.price*100):null;
        return `<tr><td>${fmtD(b.date)}</td><td class="num">${b.qty}</td><td class="num">${money(b.price)}</td>
          <td class="num">${ch!=null?`<span class="${ch>0?"up":"down"}">${ch>0?"+":""}${Math.round(ch*10)/10}%</span>`:"—"}</td>
          <td class="num">${money(b.total)}</td>
          <td class="hide-sm" style="font-family:var(--mono);font-size:11px">${esc(b.number)}</td></tr>`;}).join("")}</tbody></table>
    </div>`;
}

/* ================= SALES DETAIL =================
   The item-level feed is 108,000 rows and 12 MB. Pulling it on every page load would make
   ordering — the thing this app is for — wait on a report nobody had asked for. So it is
   fetched only when the Sales tab is opened, only for the week on screen, and cached per
   week. gviz does the date filtering: `where B >= date '...'`, with the DATE LITERAL form,
   because column B types as a date and a plain string comparison silently matches nothing
   (verified against the live sheet — the bare-string version returns a header and no rows).

   Two small lookup tabs come with it. Overrides carries the group each item really belongs
   to, because roughly one POS assignment in three is wrong and nobody is going to fix them
   on site; ItemMap folds POS spellings together. Both are optional — without them the page
   still works, it just reports what ImPOS said. */
const SALES_SHEET=SALES_SHEET_ID;
let SD={}, SD_OVER=null, SD_ITEM=null, SD_BUSY=false, SD_ERR="";
const LANE_KITCHEN="Kitchen requests", LANE_MODIFIER="Modifiers";
const PERISHABLE=["Sandwiches","Cakes & Sweets","Hot Takeaway","Grab & Go"];
const LOYALTY_GROUP="Coffee & Tea";
const CAT_MAP={
  "beverage":{type:"Beverage"},"beverage d/h":{type:"Beverage"},"beverage t/a":{type:"Beverage"},
  "food d/h":{type:"Food"},"dine in":{type:"Food"},"food t/a":{type:"Food"},
  "takeway food":{type:"Food"},"takeaway food":{type:"Food"},
  "luma food d/h":{type:"Food"},"luma beverage dine in":{type:"Beverage"},
  "sundries":{type:"Sundries"},"impos":{type:"Uncategorised"},"no cat.":{type:"Uncategorised"}
};
async function sdTab(name){
  const u=`https://docs.google.com/spreadsheets/d/${SALES_SHEET}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
  try{
    const t=await (await fetch(u)).text();
    if(!t||t.trim()[0]==="<"||/"status"\s*:\s*"error"/.test(t)) return null;
    return parseCsv(t);
  }catch(e){ return null; }
}
async function sdLookups(){
  if(SD_OVER&&SD_ITEM) return;
  SD_OVER={dept:{},item:{}}; SD_ITEM={};
  const og=await sdTab("Overrides");
  if(og&&og.length>1){
    const h=og[0].map(x=>String(x).trim().toLowerCase());
    const ki=h.indexOf("kind"), fi=h.indexOf("from"), gi=h.indexOf("group");
    og.slice(1).forEach(r=>{
      const from=String(r[fi]||"").trim(), grp=gi>-1?String(r[gi]||"").trim():"";
      if(!from||!grp) return;
      const kind=ki>-1?String(r[ki]||"").trim().toLowerCase():"";
      if(kind.indexOf("dep")===0) SD_OVER.dept[from.toLowerCase()]=grp;
      else if(kind.indexOf("item")===0) SD_OVER.item[from.toLowerCase()]=grp;
      else { SD_OVER.dept[from.toLowerCase()]=grp; SD_OVER.item[from.toLowerCase()]=grp; }
    });
  }
  const ig=await sdTab("ItemMap");
  if(ig&&ig.length>1){
    const h=ig[0].map(x=>String(x).trim().toLowerCase());
    let fi=h.indexOf("item_from"); if(fi<0) fi=0;
    let ti=h.indexOf("maps_to");   if(ti<0) ti=1;
    ig.slice(1).forEach(r=>{
      const a=String(r[fi]||"").trim(), b=String(r[ti]||"").trim();
      if(a&&b&&a!==b) SD_ITEM[a.toLowerCase()]=b;
    });
  }
}
const sdKey=wk=>fmtISO(wk.start)+"|"+fmtISO(wk.end);
async function loadSalesWeek(wk){
  const k=sdKey(wk);
  if(SD[k]||SD_BUSY) return;
  SD_BUSY=true; SD_ERR="";
  try{
    await sdLookups();
    const q=`select A,C,D,E,F,G,H where B >= date '${fmtISO(wk.start)}' and B <= date '${fmtISO(wk.end)}'`;
    const u=`https://docs.google.com/spreadsheets/d/${SALES_SHEET}/gviz/tq?tqx=out:csv&headers=1&sheet=SalesFeed&tq=${encodeURIComponent(q)}&_=${Date.now()}`;
    const txt=await (await fetch(u)).text();
    if(!txt||txt.trim()[0]==="<"||/"status"\s*:\s*"error"/.test(txt)) throw new Error("the sales feed refused that query");
    const g=parseCsv(txt);
    /* select A,C,D,E,F,G,H  ->  timestamp, venue, category, department, item, qty, sales */
    const rows=g.slice(1).map(r=>{
      const ts=gvizDateTime(r[0]);
      const dept=String(r[3]||"").trim(), rawItem=String(r[4]||"").trim();
      const item=SD_ITEM[rawItem.toLowerCase()]||rawItem;
      /* Department sets the broad group, the item row corrects it: the item-level fixes
         exist precisely to override departments staff filed wrong. */
      const grp=SD_OVER.item[item.toLowerCase()]||SD_OVER.dept[dept.toLowerCase()]||"";
      const cat=String(r[2]||"").trim();
      return { ts, venue:String(r[1]||"").trim(), category:cat, department:dept, item,
               group:grp||(CAT_MAP[cat.toLowerCase()]||{}).type||cat||"Uncategorised",
               qty:num_(r[5]), sales:num_(r[6]) };
    }).filter(r=>r.ts&&r.item&&LEDGER_VENUES.indexOf(r.venue)>=0);
    SD[k]=rows;
  }catch(e){ SD_ERR=e.message; SD[k]=[]; }
  SD_BUSY=false;
  route();
}

/* ================= SALES VIEW =================
   Laid out like the sales explorer, because that is the shape people already read. Two
   differences, both deliberate: Glenorchy never appears (it is not this entity), and the
   hourly chart is never split by venue — a combined trading curve is the question being
   asked, and two interleaved series answer a different one.

   Time of day only means anything for ONE DAY. A week of hours averaged together hides the
   Saturday that behaves nothing like the Tuesday, so the day picker drives the whole tab
   and the chart disappears on the week view rather than quietly showing a blend. */
let SALES_DAY=null, SALES_PERIOD="week", SALES_SORT={col:"sales",dir:-1}, SALES_Q="", SALES_QF=false;
/* Products follow the header store toggle — the one place on the Sales tab that does. The
   rest of the tab is combined by instruction; the product list is where "what did WE sell"
   is a per-kitchen question. "both" is offered as a local override and resets whenever the
   header toggle is used, so the toggle always wins when someone reaches for it. */
let SALES_PROD_VENUE=null, SALES_FROM=null, SALES_TO=null, SALES_GROUP=[];
const salesProdVenue=()=>SALES_PROD_VENUE===null?TAG.name:SALES_PROD_VENUE;
function setProdVenue(v){ SALES_PROD_VENUE=v; route(); }
/* Store chips on the products and wastage cards. One tag means nothing to switch, so the
   chips (and the "Both" option) are not rendered at all. */
function venueChips(cur){
  if(TAGS.length<2) return "";
  return `<span style="float:right;display:flex;gap:5px">
        ${TAGS.map(t=>`<span class="chip sm ${cur===t.name?"on":""}" onclick="setProdVenue('${esc(t.name)}')">${esc(t.short)}</span>`).join("")}
        <span class="chip sm ${cur==="both"?"on":""}" onclick="setProdVenue('both')">Both</span></span>`;
}
const sdSales=rows=>rows.filter(r=>r.group!==LANE_KITCHEN);
function wHead(col,label,cls){
  const on=WASTE_SORT.col===col;
  return `<th class="s ${cls||""} ${on?"act":""}" onclick="setWasteSort('${col}')">${label}${on?(WASTE_SORT.dir>0?" ▲":" ▼"):""}</th>`;
}
const SALES_MAX_DAYS=100;   // a custom range wider than this is a download, not a report
function salesWindow(){
  if(!SALES_DAY) SALES_DAY=fmtISO(mid(new Date()));
  const d=gvizDate(SALES_DAY)||mid(new Date());
  if(SALES_PERIOD==="custom"&&SALES_FROM&&SALES_TO){
    const a=gvizDate(SALES_FROM), b=gvizDate(SALES_TO);
    if(a&&b&&a<=b){
      const e=new Date(b); e.setHours(23,59,59,999);
      const days=Math.round((+mid(b)-+mid(a))/864e5)+1;
      return {start:mid(a),end:e,label:fmtD(a)+" – "+fmtD(b),days,day:days===1,
              tooWide:days>SALES_MAX_DAYS};
    }
  }
  if(SALES_PERIOD==="month"){
    const s=new Date(d.getFullYear(),d.getMonth(),1);
    const e=new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59,999);
    return {start:s,end:e,label:s.toLocaleDateString("en-AU",{month:"long",year:"numeric"}),
            days:e.getDate(),day:false};
  }
  if(SALES_PERIOD==="week"){ const s=weekStart(d), e=addD(s,6); e.setHours(23,59,59,999);
    return {start:s,end:e,label:fmtD(s)+" – "+fmtD(e),days:7,day:false}; }
  const e=new Date(d); e.setHours(23,59,59,999);
  return {start:mid(d),end:e,label:fmtD(d),days:1,day:true};
}
function stepDay(n){
  const d=gvizDate(SALES_DAY)||mid(new Date());
  if(SALES_PERIOD==="month") SALES_DAY=fmtISO(new Date(d.getFullYear(),d.getMonth()+n,1));
  else SALES_DAY=fmtISO(addD(d,SALES_PERIOD==="week"?n*7:n));
  route();
}
function applySalesRange(){
  SALES_FROM=(document.getElementById("sfrom")||{}).value||null;
  SALES_TO=(document.getElementById("sto")||{}).value||null;
  route();
}
function setSalesPeriod(p){ SALES_PERIOD=p; route(); }
function setSalesDay(v){ if(gvizDate(v)) SALES_DAY=v; route(); }
function pickDay(k){ SALES_DAY=k; SALES_PERIOD="day"; route(); }

function renderSales(){
  const m=weekModel(), w=salesWindow(), k=sdKey(w);
  if(w.tooWide){
    document.getElementById("app").innerHTML=`${salesBar(w)}
      <div class="card"><div class="note">That range is ${w.days} days. The item feed is 108,000 rows, so
        anything past ${SALES_MAX_DAYS} days would pull more than the browser can hold — pick a shorter range,
        or use Month.</div></div>`;
    return;
  }
  if(!SD[k]){
    loadSalesWeek(w);
    document.getElementById("app").innerHTML=`${salesBar(w)}
      <div class="card"><div id="status">Loading the item-level feed…</div>
      <div class="note">Only the period on screen is fetched, and only when you open this tab — the whole
        feed is 108,000 rows.</div></div>`;
    return;
  }
  const all=SD[k], rows=sdSales(all), kitchen=all.length-rows.length;
  /* The item-level feed only exists from the cutover — before that the platform kept weekly
     totals per venue and nothing finer. Rather than showing an empty page for July, the
     headline falls back to those weekly figures (the same source the income tile uses on the
     ordering screens) and the breakdowns say plainly why they are empty. */
  const feedStart=gvizDate(SALES_CUTOVER);
  const preFeed=feedStart&&w.end<feedStart;
  const straddles=feedStart&&w.start<feedStart&&w.end>=feedStart;
  const weeklyRevenue=SALES.filter(r=>r.date>=w.start&&r.date<=w.end).reduce((t,r)=>t+r.sales,0);
  const revenue=preFeed?weeklyRevenue:rows.reduce((t,r)=>t+r.sales,0);
  /* Spend for the same window: invoices dated inside it, cost of goods only
     (INV already is). On a single day this is lumpy — a Monday delivery lands on Monday
     while Monday's sales are a seventh of the week — so the day view says so rather than
     letting one big drop read as a 200% COGS day. */
  const spend=INV.filter(r=>r.date&&r.date>=w.start&&r.date<=w.end&&supActive(r.supplier)).reduce((t,r)=>t+r.total,0);
  /* Weekly totals cover the whole window even when the item feed only covers part of it, so
     the headline and the COGS ratio both use them wherever the window crosses the cutover. */
  const headline=straddles?weeklyRevenue:revenue;
  const cogs=headline>0?spend/headline*100:null;
  const cogsCls=cogs===null?"":cogs<=TARGET_COGS_PCT-2?"good":cogs<=TARGET_COGS_PCT+2?"amber":"over";
  document.getElementById("app").innerHTML=`${warnBar()}${salesBar(w)}
    ${SD_ERR?`<div class="err">Couldn't read the feed: ${esc(SD_ERR)}</div>`:""}
    <div class="summary" style="grid-template-columns:2fr 1fr 1fr">
      <div class="tile" style="text-align:center;padding:16px 14px">
        <div class="k">Sales — ${esc(ENTITY)}</div>
        <div class="v" style="font-size:40px">${money0(headline)}</div>
        <div class="sub">${esc(w.label)} ·
          ${LEDGER_VENUES.map(v=>`${esc(vShort(v))} ${money0(rows.filter(r=>r.venue===v).reduce((t,r)=>t+r.sales,0))}`).join(" · ")}</div>
      </div>
      <div class="tile" style="text-align:center;padding:16px 14px">
        <div class="k">Spend — ${w.day?"this day":"this week"}</div>
        <div class="v" style="font-size:30px">${money0(spend)}</div>
        <div class="sub">invoices dated in the period</div>
      </div>
      <div class="tile ${cogsCls}" style="text-align:center;padding:16px 14px">
        <div class="k">COGS % vs ${TARGET_COGS_PCT}%</div>
        <div class="v" style="font-size:30px">${cogs===null?"—":pct1(cogs)}</div>
        <div class="sub">${cogs===null?"no income in the period":
          w.day?"single day — deliveries are lumpy, read the week instead":
          cogs<=TARGET_COGS_PCT?(TARGET_COGS_PCT-cogs).toFixed(1)+" points under target":(cogs-TARGET_COGS_PCT).toFixed(1)+" points over target"}</div>
      </div>
    </div>
    ${preFeed?`<div class="card"><div class="label">Item detail not available before ${fmtD(feedStart)}</div>
      <div class="note">The total above comes from the weekly figures the platform kept before then, which is what
        the income and COGS numbers on the ordering screens use. Hour, category, product and wastage breakdowns all
        need the item-level feed, and that only starts on ${fmtD(feedStart)} when the email processor began
        collecting it. Nothing is missing from the sheets — that detail was never captured.</div></div>`
     :`${straddles?`<div class="note" style="margin:-4px 2px 12px">This period starts before ${fmtD(feedStart)}, so the
        breakdowns below only cover from that date. The headline total covers the whole period.</div>`:""}
      ${w.day?sdHourCard(rows,w):sdDayCard(rows,w)}
      ${sdCatCard(rows,revenue)}`}
    ${kitchen?`<div class="note" style="margin:-4px 2px 12px">${kitchen} kitchen prep request(s) excluded from sales and wastage
      <span style="color:var(--dim)">(rung up to message the kitchen, never a sale)</span></div>`:""}
    ${preFeed?"":sdProdCard(rows,w)+sdWasteCard(rows)}`;
  const q=document.getElementById("psearch");
  if(q){
    q.addEventListener("input",e=>{ SALES_Q=e.target.value;
      clearTimeout(window.__pt); window.__pt=setTimeout(()=>{ SALES_QF=true; route(); },160); });
    if(SALES_QF){ q.focus(); try{ q.setSelectionRange(q.value.length,q.value.length); }catch(e){} SALES_QF=false; }
  }
}
function salesBar(w){
  return `<div class="card" style="padding:10px 14px;margin-bottom:12px">
    <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">

      <span class="chip sm ${SALES_PERIOD==="day"?"on":""}" onclick="setSalesPeriod('day')">Day</span>
      <span class="chip sm ${SALES_PERIOD==="week"?"on":""}" onclick="setSalesPeriod('week')">Week</span>

      <span class="chip sm ${SALES_PERIOD==="custom"?"on":""}" onclick="setSalesPeriod('custom')">Custom</span>
      ${SALES_PERIOD==="custom"?`
        <input type="date" id="sfrom" value="${esc(SALES_FROM||fmtISO(w.start))}" style="font-size:13px;padding:6px 8px">

/* The trading span is what was actually observed — first hour with a sale to last — not a
   notional opening time. Quoting "per hour" across a day that only traded ten of them
   would understate every hour by a third. */
function sdHourCard(rows,w){
  const hrs={};
  rows.forEach(r=>{ const h=r.ts.getHours(); hrs[h]=(hrs[h]||0)+r.sales; });
  const keys=Object.keys(hrs).map(Number).sort((a,b)=>a-b);
  if(!keys.length) return `<div class="card"><div class="label">Sales by time of day</div>
    <div class="note">No sales with a time on them for ${esc(w.label)}.</div></div>`;
  const lo=keys[0], hi=keys[keys.length-1];
  const max=Math.max(...keys.map(k=>hrs[k]),1);
  const total=keys.reduce((t,k)=>t+hrs[k],0);
  const peak=keys.reduce((mx,k)=>hrs[k]>hrs[mx]?k:mx,keys[0]);
  const span=hi-lo+1, slots=span;
  let cols="";
  for(let h=lo;h<=hi;h++){
    const v=hrs[h]||0;
    cols+=`<div class="col" title="${String(h).padStart(2,"0")}:00 — ${money(v)}">
      <div class="bx" style="height:${Math.round(v/max*140)}px"></div>
      <div class="lb">${h}</div></div>`;
  }
  const met=(k,v,sub)=>`<div class="metric"><div class="k">${k}</div><div class="val">${v}</div><div class="sub">${sub}</div></div>`;
  return `<div class="card">
    <div class="label">Sales by time of day <span class="pill">hourly</span></div>
    <div class="chart">${cols}</div>
    <div class="mets">
      ${met("Revenue",money0(total),esc(w.label))}
      ${met("Per hour",money0(total/span),span.toFixed(1)+" hours trading")}
      ${met("Busiest hour",String(peak).padStart(2,"0")+":00",money(hrs[peak]))}
      ${met("Per hour avg",money0(total/slots),slots+" slots")}
    </div></div>`;
}

/* The week (or any multi-day window) as one bar per day, the way the explorer draws it.
   Same axis logic as the hourly chart: revenue per day divides by the days that traded. */
function sdDayCard(rows,w){
  const days={};
  rows.forEach(r=>{ const k=fmtISO(r.ts); days[k]=(days[k]||0)+r.sales; });
  const keys=[]; for(let d=new Date(w.start);d<=w.end;d=addD(d,1)) keys.push(fmtISO(d));
  const traded=keys.filter(k=>days[k]>0);
  if(!traded.length) return `<div class="card"><div class="label">Sales by day</div>
    <div class="note">No sales for ${esc(w.label)}.</div></div>`;
  const max=Math.max(...traded.map(k=>days[k]),1);
  const total=traded.reduce((t,k)=>t+days[k],0);
  const best=traded.reduce((mx,k)=>days[k]>days[mx]?k:mx,traded[0]);
  const dm=k=>{const d=gvizDate(k);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");};
  const cols=keys.map(k=>`<div class="col" style="cursor:pointer" onclick="pickDay('${k}')" title="${dm(k)} — ${money(days[k]||0)} · click to open the day">
      <div class="bx" style="height:${Math.round((days[k]||0)/max*140)}px"></div>
      <div class="lb">${dm(k)}</div></div>`).join("");
  const met=(k,v,sub)=>`<div class="metric"><div class="k">${k}</div><div class="val">${v}</div><div class="sub">${sub}</div></div>`;
  return `<div class="card">
    <div class="label">Sales by day</div>
    <div class="chart">${cols}</div>
    <div class="mets">
      ${met("Revenue",money0(total),esc(w.label))}
      ${met("Per day",money0(total/traded.length),traded.length+" trading day"+(traded.length===1?"":"s"))}
      ${met("Best day",dm(best),money(days[best]))}
    </div></div>`;
}

/* Tap a category to drill in: products narrow to that type and the card says so. */
let SALES_CATDRILL="";
function drillCat(t){ SALES_CATDRILL = SALES_CATDRILL===t ? "" : t; SALES_GROUP=[]; route(); }
/* The product-level category — Coffee & Tea, Breakfast, Lunch — as opposed to the Food /
   Beverage rollup above it. Clicking one narrows the list to it, which is the question
   "what did we sell in Breakfast" rather than "what did we sell in Food". */
/* Multi-select: each pill toggles, so "Breakfast + Lunch" is one view rather than two
   separate looks. An empty selection means everything. */
function drillGroup(g){
  if(!g){ SALES_GROUP=[]; route(); return; }
  const i=SALES_GROUP.indexOf(g);
  if(i<0) SALES_GROUP=SALES_GROUP.concat([g]); else SALES_GROUP=SALES_GROUP.filter(x=>x!==g);
  SALES_CATDRILL="";
  route();
}
const prodType=r=>(CAT_MAP[r.category.toLowerCase()]||{}).type||r.group||"Uncategorised";
function sdCatCard(rows,revenue){
  const m={};
  rows.forEach(r=>{
    const t=prodType(r);
    const o=m[t]||(m[t]={name:t,total:0});
    o.total+=r.sales;
    o[r.venue]=(o[r.venue]||0)+r.sales;
  });
  const list=Object.values(m).sort((a,b)=>b.total-a.total);
  return `<div class="card"><div class="label">By category <span class="pill">product type</span>
      <span style="font-weight:400;color:var(--dim);text-transform:none;letter-spacing:0;margin-left:8px">tap a row to drill in</span></div>
    <table><thead><tr><th>Product type</th>
      ${LEDGER_VENUES.map(v=>`<th class="num hide-sm">${esc(vShort(v))}</th>`).join("")}
      <th class="num">Total</th><th class="num">%</th></tr></thead>
    <tbody>${list.map(o=>`<tr class="click ${SALES_CATDRILL===o.name?"picked":""}" onclick="drillCat('${esc(o.name)}')"><td><b>${esc(o.name)}</b></td>
      ${LEDGER_VENUES.map(v=>`<td class="num hide-sm">${o[v]?money0(o[v]):'<span style="color:var(--dim)">—</span>'}</td>`).join("")}
      <td class="num"><b>${money(o.total)}</b></td>
      <td class="num" style="color:var(--dim)">${revenue?Math.round(o.total/revenue*100)+"%":""}</td></tr>`).join("")}</tbody></table>
    <div class="note">Product type comes from the POS category mapping; anything unmapped keeps its own name rather
      than being folded away.</div></div>`;
}

function sdProdCard(rows,w){
  const m={};
  const pv=salesProdVenue();
  if(pv!=="both") rows=rows.filter(r=>r.venue===pv);
  if(SALES_CATDRILL) rows=rows.filter(r=>prodType(r)===SALES_CATDRILL);
  const rowsForGroups=rows;
  if(SALES_GROUP.length) rows=rows.filter(r=>SALES_GROUP.indexOf(r.group||"")>=0);
  /* Every group present before the group filter, so the chips don't vanish once you use one. */
  /* Built before the group filter, so choosing one doesn't make the others disappear. */
  const groups=[...new Set(rowsForGroups.map(r=>r.group).filter(Boolean))].sort();
  const cols=pv==="both"?LEDGER_VENUES:[pv];
  rows.forEach(r=>{
    const o=m[r.item]||(m[r.item]={name:r.item,group:r.group||"",sales:0,qty:0});
    o.sales+=r.sales; o.qty+=r.qty;
    o[r.venue]=(o[r.venue]||0)+r.sales;
  });
  let list=Object.values(m);
  const q=SALES_Q.trim().toLowerCase();
  if(q) list=list.filter(o=>o.name.toLowerCase().includes(q)||o.group.toLowerCase().includes(q));
  const d=SALES_SORT.dir;
  const by={ name:(a,b)=>a.name.localeCompare(b.name), cat:(a,b)=>a.group.localeCompare(b.group),
             qty:(a,b)=>a.qty-b.qty, sales:(a,b)=>a.sales-b.sales };
  list=list.slice().sort((a,b)=>d*(by[SALES_SORT.col]||by.sales)(a,b));
  const head=(c,l,cls)=>{const on=SALES_SORT.col===c;
    return `<th class="s ${cls||""} ${on?"act":""}" onclick="setSalesSort('${c}')">${l}${on?(d>0?" ▲":" ▼"):""}</th>`;};
  return `<div class="card"><div class="label">Products (${Object.keys(m).length})
      ${SALES_CATDRILL?`<span class="chip sm on" onclick="drillCat('${esc(SALES_CATDRILL)}')" style="margin-left:8px">${esc(SALES_CATDRILL)} ✕</span>`:""}
      ${SALES_GROUP.length?`<span class="chip sm on" onclick="drillGroup('')" style="margin-left:8px">${SALES_GROUP.length} categor${SALES_GROUP.length===1?"y":"ies"} ✕</span>`:""}
${venueChips(pv)}</div>
    <div style="font-size:12px;color:var(--dim);margin-bottom:8px">tap a column to sort ·
      ${Object.keys(SD_ITEM||{}).length} names merged · ${Object.keys((SD_OVER||{}).item||{}).length+Object.keys((SD_OVER||{}).dept||{}).length} overrides applied</div>
    <input type="search" id="psearch" placeholder="Search products…" value="${esc(SALES_Q)}">
    ${groups.length>1?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
      <span class="chip sm ${SALES_GROUP.length?"":"on"}" onclick="drillGroup('')">All categories</span>
      ${groups.map(g=>`<span class="chip sm ${SALES_GROUP.indexOf(g)>=0?"on":""}" onclick="drillGroup('${esc(g)}')">${esc(g)}</span>`).join("")}
    </div><div class="note" style="margin-top:4px">Pick as many as you like.</div>`:""}
    <table style="margin-top:8px"><thead><tr>${head("name","Product")}${head("cat","Category","hide-sm")}
      ${cols.length>1?cols.map(v=>`<th class="num hide-sm">${esc(vShort(v))}</th>`).join(""):""}
      ${head("qty","Sold","num")}<th class="num hide-sm">Per day</th>${head("sales","Revenue","num")}</tr></thead>
    <tbody>${list.slice(0,150).map(o=>`<tr>
      <td><b>${esc(o.name)}</b></td>
      <td class="hide-sm">${o.group?`<span class="pill" style="cursor:pointer" onclick="drillGroup('${esc(o.group)}')" title="Show only ${esc(o.group)}">${esc(o.group)}</span>`:""}</td>
      ${cols.length>1?cols.map(v=>`<td class="num hide-sm">${o[v]?money0(o[v]):'<span style="color:var(--dim)">—</span>'}</td>`).join(""):""}
      <td class="num">${Math.round(o.qty*100)/100}</td>
      <td class="num hide-sm" style="color:var(--dim)">${Math.round(o.qty/w.days*10)/10}</td>
      <td class="num"><b>${money(o.sales)}</b></td></tr>`).join("")}</tbody></table>
    ${list.length>150?`<div class="note">Showing 150 of ${list.length}.</div>`:""}</div>`;
}
function setSalesSort(c){
  if(SALES_SORT.col===c) SALES_SORT.dir*=-1;
  else SALES_SORT={col:c,dir:(c==="name"||c==="cat")?1:-1};
  route();
}

/* Wastage: a $0 line in a perishable group is food in the bin. Elsewhere a $0 line usually
   is not — Coffee & Tea is dominated by the loyalty give-away, which costs margin but went
   to a paying regular. And a $0 line only counts if the SAME item also sells for money in
   this window: something never charged for is a modifier, not a give-away. */
let WASTE_SORT={col:"value",dir:-1};
function setWasteSort(c){
  if(WASTE_SORT.col===c) WASTE_SORT.dir*=-1;
  else WASTE_SORT={col:c,dir:(c==="name"||c==="group")?1:-1};
  route();
}
function wasteRows(rows){
  const paid={};
  rows.forEach(r=>{ if(r.sales>0) paid[r.item.toLowerCase()]=1; });
  const m={};
  rows.forEach(r=>{
    if(PERISHABLE.indexOf(r.group)===-1) return;
    const o=m[r.item]||(m[r.item]={name:r.item,group:r.group,sold:0,free:0,rev:0});
    if(r.sales>0){ o.sold+=r.qty; o.rev+=r.sales; } else o.free+=r.qty;
  });
  const list=Object.values(m).filter(o=>o.free>0&&o.sold>0&&paid[o.name.toLowerCase()]);
  list.forEach(o=>{ o.price=o.rev/o.sold; o.value=o.free*o.price; o.pct=o.free/(o.sold+o.free)*100; });
  const units=list.reduce((t,o)=>t+o.free,0), value=list.reduce((t,o)=>t+o.value,0);
  const soldAll=list.reduce((t,o)=>t+o.sold,0);
  return {list,units,value,soldAll,pctAll:(soldAll+units)?units/(soldAll+units)*100:0};
}
function sdWasteCard(rows){
  /* Same store scope as the products list. */
  const wv=salesProdVenue();
  if(wv!=="both") rows=rows.filter(r=>r.venue===wv);
  const list=wasteRows(rows).list;
  const wd=WASTE_SORT.dir;
  const wby={ name:(a,b)=>a.name.localeCompare(b.name), group:(a,b)=>a.group.localeCompare(b.group)||a.name.localeCompare(b.name),
              free:(a,b)=>a.free-b.free, sold:(a,b)=>a.sold-b.sold, pct:(a,b)=>a.pct-b.pct, value:(a,b)=>a.value-b.value };
  list.sort((a,b)=>wd*(wby[WASTE_SORT.col]||wby.value)(a,b));
  if(!list.length) return `<div class="card"><div class="label">Wastage
${venueChips(wv)}</div>
    <div class="note">Nothing binned in ${PERISHABLE.join(", ")} at ${esc(wv)} for this
      period — or those items are not in a perishable group in the Overrides tab yet.</div></div>`;

${venueChips(wv)}</div>

function invoiceTable(supplier,venue,limit,range){

              <tbody>${lines.map(l=>`<tr><td>${esc(l.desc)}${l.code?` <span style="color:var(--dim);font-family:var(--mono);font-size:11px">${esc(l.code)}</span>`:""}</td>

/* Pick the invoice by hand. Offered: that supplier's invoices from a week before the order
   to today, unmatched, nearest in value first. */
function matchPicker(id){
  const o=ORDERS.concat(LOCAL_ORDERS).find(x=>x.id===id); if(!o) return;
  const used=new Set();
  reconcile(ORDERS.concat(LOCAL_ORDERS),INV,{start:addD(o.date,-60),end:addD(new Date(),1)},new Date())
    .closed.forEach(c=>{ if(c.inv) used.add(norm(c.inv.number)); });
  const cands=INV.filter(r=>r.supplier===o.supplier&&r.type!=="manual"&&r.number&&r.date>=addD(o.date,-7)&&!used.has(norm(r.number)))
                 .sort((a,b)=>Math.abs(a.total-o.total)-Math.abs(b.total-o.total)).slice(0,12);
  modal(`<div class="label">Match this order to an invoice</div>
    <div style="font-size:13px;margin-bottom:8px">${esc(o.supplier)} · ordered ${fmtD(o.date)} · ${money(o.total)}</div>
    ${cands.length?`<table><thead><tr><th>Date</th><th class="hide-sm">Invoice</th><th class="num">Total</th><th class="num">Diff</th><th></th></tr></thead>
      <tbody>${cands.map(r=>`<tr><td>${fmtD(r.date)}</td><td class="hide-sm" style="font-family:var(--mono);font-size:11px">${esc(r.number)}</td>
        <td class="num">${money(r.total)}</td><td class="num ${Math.abs(r.total-o.total)>o.total*MATCH_TOL?"up":""}">${money(r.total-o.total)}</td>
        <td class="num"><a class="chip sm" onclick="matchTo('${esc(o.id)}','${esc(r.number)}')">This one</a></td></tr>`).join("")}</tbody></table>`
      :`<div class="note">No unmatched invoices from ${esc(o.supplier)} since ${fmtD(addD(o.date,-7))}. It may not have arrived yet.</div>`}
    <div style="margin-top:12px"><a class="btn outline" onclick="closeModal()">Cancel</a></div>`);
}
async function matchTo(id,invoiceNumber){
  closeModal();
  const o=ORDERS.concat(LOCAL_ORDERS).find(x=>x.id===id); if(!o) return;
  try{ await post({action:"match",order_id:id,supplier:o.supplier,venue:o.venue,order_date:fmtISO(o.date),
                   note:invoiceNumber}); }
  catch(e){ if(e.message!=="no-webapp"){ alert(e.message); return; } }
  o.matchedTo=invoiceNumber;
  toast("Matched to invoice "+invoiceNumber+".");
  route();
}
/* Delete = a cancel row, not a removed row. The order leaves the budget, the lists and the
   reconciliation immediately; the sheet keeps the whole history, which matters when the
   thing being deleted is a real order somebody placed. */
async function deleteOrder(id){
  const o=ORDERS.concat(LOCAL_ORDERS).find(x=>x.id===id); if(!o) return;
  if(!confirm(`Delete the ${fmtD(o.date)} order to ${o.supplier} for ${money(o.total)}?\n\n`
             +`It stops counting against the week straight away. The record stays in the sheet.`)) return;
  try{ await post({action:"cancel",order_id:id,supplier:o.supplier,venue:o.venue,
                   order_date:fmtISO(o.date),subtotal:o.subtotal,gst:o.gst,total:o.total}); }
  catch(e){
    if(e.message!=="no-webapp"){ alert(e.message); return; }
    toast("Deleted in this browser only — WEBAPP_URL isn't set.");
  }
  ORDERS=ORDERS.filter(x=>x.id!==id);
  LOCAL_ORDERS=LOCAL_ORDERS.filter(x=>x.id!==id);
  CANCELLED++;
  OPEN_ORDER=null;
  toast("Order deleted.");
  route();
}
async function markReceived(id){
  const o=ORDERS.concat(LOCAL_ORDERS).find(x=>x.id===id); if(!o) return;
  try{ await post({action:"receive",order_id:id,supplier:o.supplier,venue:o.venue,order_date:fmtISO(o.date),
                   subtotal:o.subtotal,gst:o.gst,total:o.total}); }
  catch(e){ if(e.message!=="no-webapp"){ alert(e.message); return; } }
  o.action="receive";
  route();
}

/* Load a past order back into the cart. Prices come from the CURRENT catalogue, never from
   what was paid at the time — reordering at last quarter's price would quietly understate
   the cart against this week's budget. Items that have since left the catalogue are skipped
   and counted rather than invented. */
function reorder(id){
  const o=ORDERS.concat(LOCAL_ORDERS).find(x=>x.id===id);
  if(!o||!(o.lines||[]).length) return;
  const known={};
  deriveCatalogue(LINES,o.supplier,new Date(),{venue:o.venue}).forEach(p=>known[p.key]=p);
  let loaded=0, miss=0;
  o.lines.forEach(l=>{
    const key=prodKey(o.supplier,l.code,l.desc,l.unit);
    if(known[key]){ setQty(o.supplier,key,l.qty,o.venue); loaded++; } else miss++;
  });
  TAG=tagByName(o.venue); SUPPLIER=o.supplier;
  renderTagPicker(); renderFilters();
  location.hash="s::"+encodeURIComponent(o.supplier);
  route();
  toast(miss?`Loaded ${loaded} item(s) from ${fmtD(o.date)} — ${miss} no longer in the catalogue.`
            :`Loaded all ${loaded} item(s) from the ${fmtD(o.date)} order.`);
}

function saveFavPrompt(){

  document.getElementById("favok").onclick=()=>saveFav(document.getElementById("favname").value.trim(),t.lines,SUPPLIER);
}
/* Takes its lines explicitly: the prompt after a placed order runs once the draft has been
   cleared, so reading the draft here would save an empty favourite. */
async function saveFav(name,lines,supplier){
  if(!name||!lines||!lines.length) return;
  const fav={fav_id:"f"+Date.now().toString(36),fav_name:name,venue:TAG.name,supplier,
    lines:lines.map((l,i)=>({line_no:i+1,item_key:l.key,description:l.desc,unit:l.unit,qty:l.qty,supplier}))};
  closeModal();
  try{
    await post(Object.assign({action:"favourite"},fav));
    FAVS.push({id:fav.fav_id,name,venue:TAG.name,supplier,by:identity().user||"",
      lines:fav.lines.map(l=>({key:l.item_key,desc:l.description,unit:l.unit,qty:l.qty,supplier}))});
    toast("Favourite saved.");
  }catch(e){
    if(e.message==="no-webapp") toast("Can't save favourites until WEBAPP_URL is set.");
    else alert(e.message);
  }
  route();
}
function recallFav(id){
  const f=FAVS.find(x=>x.id===id); if(!f) return;
  const sup=f.supplier||SUPPLIER;
  const known={}; deriveCatalogue(LINES,sup,new Date(),{venue:f.venue}).forEach(p=>known[p.key]=p);
  let miss=0;
  f.lines.forEach(l=>{ if(known[l.key]) setQty(sup,l.key,l.qty,f.venue); else miss++; });
  SUPPLIER=sup; location.hash="s::"+encodeURIComponent(sup);
  route();
  toast(miss?`Loaded "${f.name}" — ${miss} item(s) no longer in the catalogue were skipped.`:`Loaded "${f.name}".`);
}
function renderFavs(){
  const m=weekModel();
  document.getElementById("app").innerHTML=`${warnBar()}${summaryBar(m)}${orderTabs("favs")}
    <div class="card"><div class="label">Saved favourites — ${esc(TAG.name)}</div>
      <table><thead><tr><th>Name</th><th class="hide-sm">Supplier</th><th class="num">Items</th><th class="num"></th></tr></thead>
      <tbody>${FAVS.filter(f=>f.venue===TAG.name).map(f=>`<tr><td><b>${esc(f.name)}</b>${f.by?`<br><span style="color:var(--dim);font-size:11px">${esc(f.by)}</span>`:""}</td>
        <td class="hide-sm">${esc(f.supplier||"—")}</td><td class="num">${f.lines.length}</td>
        <td class="num"><a class="chip sm" onclick="recallFav('${esc(f.id)}')">Load</a>
          <a class="chip sm" onclick="deleteFav('${esc(f.id)}')">Delete</a></td></tr>`).join("")}</tbody></table>
      ${FAVS.filter(f=>f.venue===TAG.name).length?"":'<div class="note">No favourites for this store yet. Build an order and choose <b>Save as favourite</b>.</div>'}
    </div>`;
}
async function deleteFav(id){
  const f=FAVS.find(x=>x.id===id); if(!f) return;
  if(!confirm(`Delete favourite "${f.name}"?`)) return;
  try{ await post({action:"favourite_delete",fav_id:id}); }
  catch(e){ if(e.message!=="no-webapp"){ alert(e.message); return; } }
  FAVS=FAVS.filter(x=>x.id!==id); route();
}

    <p>For <b>any other range</b> there is no forecast, just the books: what was spent, the <b>tally</b> against 30% of
      income (green is under, red is over — the amount to claw back next period), income, and the actual COGS %.</p>

    <h2>Front page — suppliers by spend</h2>
    <img src="help/front-page.png" alt="Suppliers by spend">
    <p>Every supplier we bought from in the range, biggest first. <b>Usual/wk</b> is what we normally spend on them
      per week (the four full weeks before); a red ▲ means this range is more than 10% over that, green ▼ under. Tap a
      column heading to sort, tap a supplier to open it.</p>

    <h2>Finding the wastage</h2>
    <ol>
      <li>Tap <b>Reports</b>.</li>
      <li>Check the range bar says the week you want — on a Monday, tap <b>‹</b> for last week.</li>
      <li>Scroll to <b>Wastage</b>.</li>
    </ol>
    <img src="help/reports-wastage.png" alt="The wastage card">
    <p>Worst first by % wasted, red at 25% or more. <b>Value</b> is what the binned items would have sold for, so it is
      what the bin actually cost. It counts a $0 sale in a perishable group (sandwiches, cakes, hot takeaway, grab &amp;
      go) for an item that also sold for money — a loyalty coffee is not wastage.</p>

    <h2>The rest of Reports</h2>
    <img src="help/reports-top10.png" alt="Top 10 purchased and sold">
    <p><b>Top 10 purchased</b>: what the money went on. The arrow after the quantity compares with what we usually buy
      of it (hover for the figure); the arrow after the price is a price change against what we were paying before
      the range. <b>Top 10 sold</b>: by revenue or by units, with units per trading day and the same arrow against the
      usual. <b>Price creep</b>, further down, is which price rises are actually costing money, in dollars — the top
      row is the phone call worth making.</p>

    <h2>A supplier's page</h2>
    <img src="help/supplier.png" alt="A supplier page">
    <p>Tap any supplier on the front page. A weekly or monthly statement to reconcile against theirs, every product we
      bought from them in the range with its price and any change, and the invoices themselves — tap one to see its
      lines. All for the range in the bar.</p>

    <h2>Questions</h2>
    <p>Anything confusing, or anything you want that is not here — tell Adrian. The page changes every week or so and
      the build number under the logo says which version you are on.</p>
  </div>`;
}

/* ================= ADMIN ================= */

    <a class="back" onclick="go('')">All suppliers</a>

      <tbody>${list.map(s=>{const c=sset(s.name);
        const chip=(v,l)=>`<span class="chip sm ${c.ordering===v?"on":""}" onclick="saveOrdering('${esc(s.name)}','${v}')">${l}</span>`;

        <td><b>${esc(s.name)}</b>${s.lines?"":' <span class="pill">no line items</span>'}</td>
        <td><input type="email" value="${esc(c.rep_email)}" placeholder="${esc(supplierEmail(s.name)||"none known")}"
             style="width:100%;font-size:12px;padding:6px 8px" onchange="saveSupplier('${esc(s.name)}','rep_email',this.value)"></td>
        <td class="num"><span style="display:inline-flex;gap:4px">${chip("here","Order here")}${chip("portal","Portal")}${chip("off","Off")}</span></td>
      </tr>`;}).join("")}</tbody></table>
      <div class="note">
        <b>Sales rep email</b> is who you order from, deliberately separate from the address invoices arrive from —
        the greyed placeholder is what the invoices suggest, and it's usually a no-reply robot. Shared with
        Cambridge Central: it is a fact about the supplier.<br>
        <b>Ordering</b> is <b>this dashboard's setting only</b>. <b>Order here</b>: on the Order tab with a Build order
        button. <b>Portal</b>: they insist on their own ordering platform — off the Order tab, the supplier page says so.
        <b>Off</b>: off the Order tab, nothing said. Spend, reports and the statement show every supplier in every state.
      </div>
    </div>
    <div class="card"><div class="label">Category overrides — ${overrides.length} set by hand</div>
      ${overrides.length?`<table><thead><tr><th>Product</th><th>Category</th></tr></thead>
        <tbody>${overrides.map(k=>{
          const l=LINES.find(x=>x.key===k);
          return `<tr><td>${esc(l?l.desc:k)}<br><span style="color:var(--dim);font-family:var(--mono);font-size:10px">${esc(k)}</span></td>
            <td><span class="pill">${esc(COVER[k])}</span></td></tr>`;}).join("")}</tbody></table>`
        :'<div class="note">None yet. Use the ✎ beside any category in a supplier catalogue to reassign a product for everyone.</div>'}
    </div>`;
}
async function saveSupplier(name,field,value){
  SSET[norm(name)]=Object.assign({},SSET[norm(name)]||{},{[field]:value});
  try{ await post({action:"supplier_setting",supplier:name,field,value}); toast("Saved for everyone."); }
  catch(e){ if(e.message==="no-webapp") toast("Not saved — WEBAPP_URL isn't set."); else alert(e.message); }
}
async function saveOrdering(name,value){
  if(["here","portal","off"].indexOf(value)<0) return;
  SSET[norm(name)]=Object.assign({},SSET[norm(name)]||{},{ordering:value});
  GCAT=null;   // the every-supplier catalogue excludes "off" suppliers, so it must rebuild
  route();
  try{ await post({action:"supplier_visibility",supplier:name,scope:VIS_SCOPE,ordering:value}); toast("Saved — Glenorchy HQ only."); }
  catch(e){ if(e.message==="no-webapp") toast("Not saved — WEBAPP_URL isn't set."); else alert(e.message); }
}

/* ================= DISPATCH ================= */
function orderText(supplier,opts){
  opts=opts||{};
  const t=orderTotals(supplier), d=draft(supplier), tag=tagByName(d.tag||TAG.name);
  const lines=t.lines.map(l=>`- ${l.qty} x ${l.unit||"ea"}  ${l.desc}${l.code?" ["+l.code+"]":""}`+(opts.prices?`   ${money(l.price)} ea`:""));
  const head=[`Order — ${tag.name}`,`Date: ${fmtD(new Date())}`,
              d.delivery?`Deliver on: ${fmtD(gvizDate(d.delivery))}`:"", `Deliver to: ${tag.addr}`].filter(Boolean);
  const tail=opts.prices?["",`Estimated ${money(t.sub)} + ${money(t.gst)} GST = ${money(t.total)}`]:[];
  return head.join("\n")+"\n\n"+lines.join("\n")+tail.join("\n");
}
function orderEmailBody(supplier){
  const d=draft(supplier);
  return `Hi,\n\nCould we please order the following for ${d.tag||TAG.name}:\n\n`
    + orderText(supplier,{prices:false}).split("\n\n").slice(1).join("\n\n")
    + `\n\nPlease confirm availability and delivery day.\n\nThanks,\n${identity().user||"Red Square"}\n`
    + COMPANY_BLOCK.join("\n");
}
function dispatch(how){
  const t=orderTotals(SUPPLIER);
  if(!t.lines.length){ alert("Nothing in this order yet."); return; }
  if(how==="copy") return copyText(orderText(SUPPLIER,{prices:false}));
  const to=(document.getElementById("repmail")||{}).value||supplierEmail(SUPPLIER);
  if(!to){ alert("No sales rep email for this supplier. Add one in Admin, or use Copy."); return; }
  const ccOn=(document.getElementById("cckitchen")||{}).checked;
  const cc=ccOn?(sset(SUPPLIER).cc||ACCOUNTS_EMAIL):"";
  const d=draft(SUPPLIER);
  const q=`subject=${encodeURIComponent(`Order — ${d.tag||TAG.name} — ${fmtD(new Date())}`)}&body=${encodeURIComponent(orderEmailBody(SUPPLIER))}`;
  location.href=`mailto:${encodeURIComponent(to)}?${cc?`cc=${encodeURIComponent(cc)}&`:""}${q}`;
}
function copyText(txt){
  const done=()=>toast("Copied — paste it into the portal or message.");
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>showCopyBox(txt));
  else showCopyBox(txt);
}
function showCopyBox(txt){
  modal(`<div class="label">Copy this order</div><textarea id="cpbox">${esc(txt)}</textarea>
    <div style="margin-top:10px"><a class="btn" onclick="closeModal()">Done</a></div>`);
  const el=document.getElementById("cpbox"); if(el){el.focus();el.select();}
}
function toast(msg){
  const el=document.createElement("div"); el.textContent=msg;
  el.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;z-index:50";
  document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
}
function modal(html){
  closeModal();
  const w=document.createElement("div"); w.className="modal"; w.id="obmodal";
  w.innerHTML=`<div class="box">${html}</div>`;
  w.addEventListener("click",e=>{if(e.target===w) closeModal();});
  document.body.appendChild(w);
}
function closeModal(){ const m=document.getElementById("obmodal"); if(m) m.remove(); }

/* ================= WRITE PATH ================= */
function identity(){ try{return JSON.parse(localStorage.getItem("ob_identity")||"{}")||{};}catch(e){return {};} }
function askIdentity(){
  const id=identity();
  if(id.user&&id.pin) return Promise.resolve(id);
  return new Promise(res=>{
    modal(`<div class="label">Who's using this?</div>
      <div style="display:grid;gap:8px">
        <input type="text" id="obname" placeholder="Your name" value="${esc(id.user||"")}">
        <input type="text" id="obpin" placeholder="Shared PIN" value="${esc(id.pin||"")}">
        <a class="btn" id="obok">Save</a></div>
      <div class="note">Your name goes on the order record. The PIN is shared and is a working record, not
        security — this page is public.</div>`);
    document.getElementById("obok").onclick=()=>{
      const user=document.getElementById("obname").value.trim(), pin=document.getElementById("obpin").value.trim();
      if(!user||!pin) return;
      try{localStorage.setItem("ob_identity",JSON.stringify({user,pin}));}catch(e){}
      closeModal(); res({user,pin});
    };
  });
}
async function post(payload){
  if(!WEBAPP_URL) throw new Error("no-webapp");
  const id=await askIdentity();
  let res;
  /* A string body sends as text/plain: a simple request with no CORS preflight, which an
     Apps Script web app cannot answer. */
  try{ res=await fetch(WEBAPP_URL,{method:"POST",body:JSON.stringify(Object.assign({pin:id.pin,user:id.user},payload)),redirect:"follow"}); }
  catch(e){ throw new Error("Couldn't reach the save endpoint. In Apps Script check Deploy → Manage deployments: access must be Anyone, and the /exec URL current. Nothing was saved."); }
  const txt=await res.text();
  let j; try{ j=JSON.parse(txt); }catch(e){ throw new Error("Unexpected reply from the web app (not JSON). Is the deployment set to 'Anyone'?"); }
  if(!j.ok) throw new Error(j.error||"save failed");
  return j;
}
function buildPayload(action){
  const t=orderTotals(SUPPLIER), d=draft(SUPPLIER);
  return {order_id:"o"+Date.now().toString(36),action,supplier:SUPPLIER,venue:d.tag||TAG.name,
    order_date:fmtISO(new Date()),delivery_date:d.delivery||"",subtotal:t.sub,gst:t.gst,total:t.total,
    channel:sset(SUPPLIER).portal_only?"portal":"email",
    lines:t.lines.map((l,i)=>({line_no:i+1,item_code:l.code,description:l.desc,unit:l.unit,
                               qty:l.qty,unit_price:l.price,line_total:l.total}))};
}
const localRecord=o=>({id:o.order_id,action:"place",supplier:o.supplier,venue:o.venue,date:mid(new Date()),loggedAt:new Date(),
  delivery:gvizDate(o.delivery_date)||null,lines:(o.lines||[]).map(l=>({code:l.item_code,desc:l.description,unit:l.unit,qty:l.qty,price:l.unit_price})),
  total:o.total,subtotal:o.subtotal,gst:o.gst,channel:o.channel,by:identity().user||"",logged:new Date()});
async function markPlaced(){
  const t=orderTotals(SUPPLIER);
  if(!t.lines.length){ alert("Nothing in this order yet."); return; }
  const order=buildPayload("place"), local=localRecord(order);
  const placedLines=t.lines, placedSupplier=SUPPLIER;
  /* Same stale key: this left the placed draft in place AND created a second entry under a
     bare supplier name, so a placed order counted against the budget twice. */
  const finish=msg=>{ LOCAL_ORDERS.push(local); DRAFTS[draftId(SUPPLIER,order.venue)]={supplier:SUPPLIER,tag:order.venue,qty:{},note:""};
                      saveDrafts(); toast(msg); offerFav(placedLines,placedSupplier); };
  try{ await post(order); finish("Order logged."); }
  catch(e){ if(e.message==="no-webapp") finish("Logged in this browser only — WEBAPP_URL isn't set.");
            else alert(e.message); }
}
/* Asked after the order is safely logged, never before — a prompt that blocks the order is
   a prompt people learn to dismiss. */
function offerFav(lines,supplier){
  modal(`<div class="label">Save this as a favourite?</div>
    <div style="font-size:13px;margin-bottom:8px">Give it a name and it can be reloaded as an editable order.</div>
    <input type="text" id="favname" placeholder="e.g. Monday Kitchen Run" style="width:100%">
    <div style="display:flex;gap:8px;margin-top:12px">
      <a class="btn" id="favok">Save favourite</a><a class="btn outline" onclick="closeModal();go('order')">No thanks</a></div>`);
  document.getElementById("favok").onclick=()=>{
    const n=document.getElementById("favname").value.trim(); if(!n) return;
    saveFav(n,lines,supplier);
  };
}
window.addEventListener("hashchange",route);
if(!window.__OB_NO_AUTOLOAD) loadAll();
