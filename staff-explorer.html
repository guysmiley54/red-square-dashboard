<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff &amp; Wastage Explorer</title>
<style>
  :root{
    --ink:#141414; --paper:#f7f6f3; --card:#fff; --line:#e4e2dc; --dim:#6b6862;
    --red:#c8102e; --amber:#c97a1a; --teal:#2d6a6f; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .num,.v,.val,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  header .dot{width:14px;height:14px;background:var(--amber);border-radius:3px;flex:none}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .bld{font-size:11px;color:#8d8b86;font-family:ui-monospace,monospace}
  header .sp{margin-left:auto;display:flex;gap:8px}
  header button{background:#fff;color:var(--ink);border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
  #filters{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:52px;z-index:9}
  .chip{font-size:12px;font-weight:600;padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;user-select:none}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.nav{padding:7px 11px;font-family:ui-monospace,monospace}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .rangelbl{font-size:12px;color:var(--dim);font-family:ui-monospace,monospace;margin-left:2px}
  .wrap{max-width:1120px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .metrics{display:flex;gap:22px;flex-wrap:wrap}
  .metric .k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .metric .val{font-size:24px;font-weight:700;margin-top:3px}
  .metric .sub{font-size:11px;color:var(--dim);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th.sortable{cursor:pointer;user-select:none}
  th.sorted{color:var(--ink)}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tfoot td{border-top:2px solid var(--ink);border-bottom:none;font-weight:700;padding-top:10px}
  .num{text-align:right}
  .bar{height:8px;background:var(--amber);border-radius:99px;min-width:2px}
  .barwrap{background:var(--line);border-radius:99px;overflow:hidden}
  .chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:10px}
  .chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
  .chart .pair{display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%}
  .chart .bx{flex:1;min-width:1px;background:var(--amber);border-radius:3px 3px 0 0;min-height:1px}
  .chart .lb{font-size:9px;color:var(--dim);white-space:nowrap;font-family:ui-monospace,monospace}
  .muted{color:var(--dim);font-size:12px}
  .note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5}
  .pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 8px;border-radius:99px;background:#f0eeea;color:var(--dim)}
  .pill.waste{background:#fbf0e2;color:var(--amber)}
  .pill.void{background:#fbe9ec;color:var(--red)}
  .legend{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);text-transform:none;letter-spacing:0;font-weight:400}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .loading{padding:60px 20px;text-align:center;color:var(--dim)}
  .chart .col.dim{opacity:.3}
  .chart .col.sel .lb{color:var(--ink);font-weight:700}
  tr.click{cursor:pointer}
  tr.selrow{background:#faf9f7}
  tr.selrow td{font-weight:700}
  tr.click:hover td{background:#faf9f7}
  /* denomination grid on the Cash view */
  .denoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:10px}
  .denom{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:6px 9px;background:#fff}
  .denom .dk{display:block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
  .denom .dv{font-size:18px;font-weight:700}
  .denom .ds{font-size:11px;color:var(--dim);margin-left:5px}
  .d-ok{border-left-color:var(--teal)}
  .d-low{border-left-color:var(--amber);background:#fdf6ec}
  .d-out{border-left-color:var(--red);background:#fbeeef}
  .d-none{border-left-color:var(--line);color:var(--dim)}
  .sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .site h3{margin:0 0 2px;font-size:15px}
  .site .big{font-size:28px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .site .sub{font-size:12px;color:var(--dim);margin-top:2px}
  .rep{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
  .rep h4{margin:0 0 6px;font-size:13px}
  .rep table{margin-top:4px}
  tr.total td{font-weight:700;border-top:2px solid var(--ink)}
  @media(max-width:700px){ .hide-sm{display:none} .wrap{padding:12px} }
  @media print{
    header,#filters,.chip{display:none !important}
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    /* Do NOT use break-inside:avoid on cards. A card taller than one page cannot avoid a
       break, and the browser clips it to the first page instead - which is why Discounts,
       Voids and People printed only their first box. Let long tables flow, keep only the
       small stuff intact, and repeat the header row on each page. */
    .card{border-color:#ccc;margin-bottom:10px}
    .metrics,.label,.chart{break-inside:avoid;page-break-inside:avoid}
    thead{display:table-header-group}
    tfoot{display:table-footer-group}
    tr{break-inside:avoid;page-break-inside:avoid}
    .hide-sm{display:table-cell !important}
    a{text-decoration:none;color:inherit}
    /* If a person or check is open, print only that card. */
    .focused > .card:not(.focus){display:none !important}
    @page{margin:14mm}
  }
</style>
</head>
<body>
<header>
  <div class="dot"></div><h1>Staff &amp; Wastage Explorer</h1>
  <span class="bld" id="bld"></span>
  <div class="sp">
    <button onclick="exportCsv()">&#8595; CSV</button>
    <button onclick="window.print()">&#8599; PDF</button>
    <button onclick="load(true)">&#8635; refresh</button>
  </div>
</header>
<div id="filters"></div>
<div class="wrap"><div id="app"><div class="loading">Loading staff reports&hellip;</div></div></div>
<script>
const SHEET_ID = "1QEUnzY43v3wVc6dP0oGPqgL_mvLRVGHnMYwtO3QMJY4"; // BG Sales Data

// The staff reports use ImPOS's own store names, which differ from the sales feed's.
// The staff reports and the sales feed use DIFFERENT names for the same venues. Both are
// folded to one short name here - without this the par view matched nothing and reported
// every wasted product as "never sold".
const VENUE = {
  // as the ImPOS staff reports name them
  "Red Square Cafe":"RS Cambridge", "Luma":"Luma", "Red Square Cafe Glenorchy":"RS Glenorchy",
  // as the Yellowfin sales feed names them
  "Red Square Cambridge":"RS Cambridge", "Luma Kitchen":"Luma", "Red Square Glenorchy":"RS Glenorchy"
};
const VENUES = ["RS Cambridge","Luma","RS Glenorchy"];
const VCOLOUR = {"RS Cambridge":"#c8102e","Luma":"#2d6a6f","RS Glenorchy":"#c97a1a"};
// Wastage is authorised end-of-day clearance, not a give-away. It dwarfs everything else,
// so it is always reported separately - mixing it in makes every other number invisible.
const WASTE = "Wastage";

// The same discount is configured more than once in ImPOS, so it splits across near-
// identical names. Fold them here rather than in the POS, which needs a config change and
// would break the history. Keys are lowercased; anything unlisted passes through as-is.
const DISCOUNT_MAP = {
  "coffee loyalty card":"Coffee Loyalty",
  "coffee loyalty program":"Coffee Loyalty",
  "coffee loyalty":"Coffee Loyalty",
  "staff meals":"Staff Meals",
  "staff meal":"Staff Meals",
  "staff discount":"Staff Discount",
  "wastage":"Wastage",
  "waste":"Wastage"
};
function discName(v){
  const raw=String(v||"").trim();
  return DISCOUNT_MAP[raw.toLowerCase()]||raw;
}

const TABS = {
  item:  {tab:"StaffItemDiscounts",  cols:["date","store","employee","station","item_no","discount_name","rate","amount"]},
  check: {tab:"StaffCheckDiscounts", cols:["date","store","employee","station","check_no","discount_name","rate","amount"]},
  voids: {tab:"StaffVoids",          cols:["date","store","void_reason","item","void_time","employee","check_no","qty","price_inc","notes"]},
  txn:   {tab:"Transactions",        cols:["date","store","check_no","time","item","refund","discount_item","discount_check","reversal","void"]}
};
let D = {item:[],check:[],voids:[],txn:[]}, MISSING = [];
// End-of-day reconciliation. RECON is one row per venue-day, RTILL one row per till.
// Both are written by processReconciliation in the Sales Feed Apps Script project.
let RECON = [], RTILL = [], RECON_OK = false;
const isReconView = v => v==="cash" || v==="daily";

// Denominations as the closing form captures them, in float-value order.
const DENOM_SPEC = [
  {k:"n50",label:"$50",mult:50},{k:"n20",label:"$20",mult:20},{k:"n10",label:"$10",mult:10},
  {k:"n5",label:"$5",mult:5},{k:"c2",label:"$2",mult:2},{k:"c1",label:"$1",mult:1},
  {k:"r2",label:"$2 roll",mult:50},{k:"r1",label:"$1 roll",mult:20},{k:"r50",label:"50c roll",mult:10},
  {k:"r20",label:"20c roll",mult:4},{k:"r10",label:"10c roll",mult:4},{k:"r5",label:"5c roll",mult:2}
];
// Par per denomination, per venue. Rolls have a real par - Adrian orders change to hold
// 10 rolls of each - so the roll tiles are judged against that. Notes and loose coins
// have no set par and are judged against the venue's own 90-day median count.
const CHANGE_PAR_ROLLS = 10;
const ROLL_KEYS = ["r2","r1","r50","r20","r10","r5"];
const rollPar = () => { const o={}; ROLL_KEYS.forEach(k=>o[k]=CHANGE_PAR_ROLLS); return o; };
const DENOM_PAR = { "RS Cambridge": rollPar(), "RS Glenorchy": rollPar() };
// Which denominations the bank supplies as rolls, with the label used in the order email.
const CHANGE_DENOMS = [
  {k:"r2",label:"$2",mult:50},{k:"r1",label:"$1",mult:20},{k:"r50",label:"50c",mult:10},
  {k:"r20",label:"20c",mult:4},{k:"r10",label:"10c",mult:4},{k:"r5",label:"5c",mult:2}
];
const NOTES = [50,20,10,5];
// The par-level view needs SALES as well as wastage, so it reads the sales feed too, and
// ItemMap so the two sides agree on what a product is called.
let FEED = [], ITEM_MAP = {}, FEED_OK = false;
const mapItem = n => ITEM_MAP[String(n||"").trim().toLowerCase()] || String(n||"").trim();
let F = {week:0, venues:[], view:"overview", day:"", check:null, person:null, discType:"", sort:{k:"amount",d:-1}};

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+(+n||0).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>"$"+Math.round(+n||0).toLocaleString("en-AU");
const vShort=s=>VENUE[s]||s;
function parseCsv(t){
  const out=[[]];let cur="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){ if(ch==='"'&&t[i+1]==='"'){cur+='"';i++;} else if(ch==='"'){q=false;} else cur+=ch; }
    else if(ch==='"')q=true;
    else if(ch===","){out[out.length-1].push(cur);cur="";}
    else if(ch==="\r"&&t[i+1]==="\n"){out[out.length-1].push(cur);cur="";out.push([]);i++;}
    else if(ch==="\n"){out[out.length-1].push(cur);cur="";out.push([]);}
    else cur+=ch;}
  out[out.length-1].push(cur);
  return out.filter(r=>r.length>1||r[0]!=="");
}
const num=v=>{const n=Number(String(v==null?"":v).replace(/[$,\s]/g,""));return isNaN(n)?0:n;};
function dkey(v){
  const s=String(v||"").trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
  const d=new Date(s);
  if(!isNaN(d)) return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
  return "";
}
const fmtDay=k=>{const [y,m,d]=k.split("-");return d+"/"+m;};
const dayName=k=>["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(k+"T00:00:00").getDay()];

/* ---------- loading ---------- */
/**
 * Column signature per tab. gviz DOES NOT ERROR on a sheet name that does not exist -
 * it returns HTTP 200 carrying the FIRST SHEET of the workbook. In BG Sales Data that
 * is SalesFeed, which is 13MB and would arrive dressed as whatever was asked for. The
 * only reliable guard is checking the returned header against the columns that tab is
 * supposed to have.
 *
 * A "does any expected column appear" test is NOT enough - several tabs here share a
 * `date` and a `venue` column, so a loose test passes the fallback straight through.
 * Every name listed must be present.
 *
 * A NEW fetchTab CALL GETS NO PROTECTION UNTIL ITS TAB IS ADDED HERE.
 */
const TAB_COLUMNS = {
  "StaffItemDiscounts":  ["date","store","employee","discount_name","amount"],
  "StaffCheckDiscounts": ["date","store","employee","check_no","discount_name","amount"],
  "StaffVoids":          ["date","store","void_reason","item","employee"],
  "Transactions":        ["date","store","check_no","time","item"],
  "ItemMap":             ["item_from","maps_to"],
  "SalesFeed":           ["timestamp","date","venue","category","item","qty","sales"],
  "Reconciliation":      ["date","venue","submitted_by","tills","impos_cash","actual_cash",
                          "cash_var","float_total","flags"],
  "ReconTills":          ["date","venue","pos","staff","impos_cash","actual_cash","variance"],
  "DeputyShifts":        ["date","venue","kind","employee","hours"],
  "StaffMap":            ["name_from","maps_to"]
};

async function fetchTab(name){
  // headers=1 is essential - gviz otherwise guesses how many leading rows are headers and
  // folds text rows into one mangled header, silently losing data.
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+
    "/gviz/tq?tqx=out:csv&headers=1&_="+Date.now()+"&sheet="+encodeURIComponent(name);
  try{
    const res=await fetch(url);
    if(!res.ok) return null;
    const t=await res.text();
    if(!t || t.trim().charAt(0)==="<" || t.indexOf("google.visualization.Query.setResponse")>-1) return null;
    const want=TAB_COLUMNS[name];
    if(want){
      const first=(t.split(/\r?\n/)[0]||"");
      const head=parseCsv(first)[0]||[];
      const got=head.map(h=>String(h).trim().toLowerCase());
      for(let i=0;i<want.length;i++){
        if(got.indexOf(want[i])<0){
          console.warn("fetchTab("+name+"): wrong tab - missing column '"+want[i]+
                       "'. gviz served another sheet. Ignoring.");
          return null;
        }
      }
    }
    return t;
  }catch(e){ return null; }
}
async function load(){
  document.getElementById("app").innerHTML='<div class="loading">Loading staff reports&hellip;</div>';
  MISSING=[];
  for(const key of Object.keys(TABS)){
    const spec=TABS[key];
    const txt=await fetchTab(spec.tab);
    if(!txt){ D[key]=[]; MISSING.push(spec.tab); continue; }
    const g=parseCsv(txt.trim());
    const head=(g.shift()||[]).map(h=>String(h).trim().toLowerCase());
    const ix=n=>head.indexOf(n);
    D[key]=g.map(r=>{
      const o={};
      spec.cols.forEach(c=>{ const i=ix(c); o[c]=i>-1?r[i]:""; });
      o.date=dkey(o.date);
      o.venue=vShort(String(o.store||"").trim());
      ["amount","qty","price_inc","refund","discount_item","discount_check","reversal","void"]
        .forEach(k=>{ if(k in o) o[k]=num(o[k]); });
      if("discount_name" in o){ o.discount_raw=o.discount_name; o.discount_name=discName(o.discount_name); }
      return o;
    }).filter(r=>r.date);
  }
  // ItemMap first - the feed rows are normalised through it as they load.
  ITEM_MAP={};
  const mapTxt=await fetchTab("ItemMap");
  if(mapTxt){
    const mg=parseCsv(mapTxt.trim());
    const mh=(mg.shift()||[]).map(h=>String(h).trim().toLowerCase());
    let fi=mh.indexOf("item_from"); if(fi<0) fi=0;
    let ti=mh.indexOf("maps_to");   if(ti<0) ti=1;
    mg.forEach(r=>{ const a=String(r[fi]||"").trim(), b=String(r[ti]||"").trim();
      if(a&&b&&a!==b) ITEM_MAP[a.toLowerCase()]=b; });
  }
  const feedTxt=await fetchTab("SalesFeed");
  FEED=[]; FEED_OK=!!feedTxt;
  if(feedTxt){
    const fg=parseCsv(feedTxt.trim());
    const fh=(fg.shift()||[]).map(h=>String(h).trim().toLowerCase());
    const fx=n=>fh.indexOf(n);
    fg.forEach(r=>{
      const sales=num(r[fx("sales")]), qty=num(r[fx("qty")]);
      if(qty<=0) return;
      FEED.push({date:dkey(r[fx("date")]), venue:vShort(String(r[fx("venue")]||"").trim()),
                 item:mapItem(r[fx("item")]), qty:qty, sales:sales});
    });
  }
  // ---- end-of-day reconciliation ----
  // Venue names here are the SALES FEED names, which vShort already folds.
  // Built into LOCALS and assigned at the end, never pushed into the live arrays.
  // load() can run twice over the top of itself - the refresh button calls it, and a
  // second click while the first is still awaiting gviz would otherwise interleave two
  // runs and double every row. The staff-report loader above is safe because it
  // ASSIGNS D[key]; this has to do the same.
  let recOut=[], tillOut=[], recOk=false;
  const recTxt=await fetchTab("Reconciliation");
  if(recTxt){
    recOk=true;
    const rg=parseCsv(recTxt.trim());
    const rh=(rg.shift()||[]).map(h=>String(h).trim().toLowerCase());
    const rx=n=>rh.indexOf(n);
    const cell=(r,n)=>rx(n)>-1?String(r[rx(n)]==null?"":r[rx(n)]).trim():"";
    rg.forEach(r=>{
      const d=dkey(r[rx("date")]); if(!d) return;
      const hasFloat=cell(r,"float_total")!=="";
      const den={};
      DENOM_SPEC.forEach(s=>{ den[s.k]=hasFloat?num(cell(r,s.k)):null; });
      recOut.push({
        date:d, venue:vShort(cell(r,"venue")),
        by:cell(r,"submitted_by"),
        tills:num(cell(r,"tills")),
        impos:num(cell(r,"impos_cash")), actual:num(cell(r,"actual_cash")),
        cash_var:num(cell(r,"cash_var")),
        eft:num(cell(r,"impos_eft")),
        doshii:cell(r,"doshii")!==""?num(cell(r,"doshii")):null,
        floatTotal:hasFloat?num(cell(r,"float_total")):null,
        floatVar:cell(r,"float_var")!==""?num(cell(r,"float_var")):null,
        denoms:den,
        flags:cell(r,"flags")
      });
    });
  }
  const rtTxt=await fetchTab("ReconTills");
  if(rtTxt){
    const tg=parseCsv(rtTxt.trim());
    const th_=(tg.shift()||[]).map(h=>String(h).trim().toLowerCase());
    const tx=n=>th_.indexOf(n);
    tg.forEach(r=>{
      const d=dkey(r[tx("date")]); if(!d) return;
      tillOut.push({
        date:d, venue:vShort(String(r[tx("venue")]||"").trim()),
        pos:String(r[tx("pos")]||"").trim(),
        staff:String(r[tx("staff")]||"").trim(),
        impos:num(r[tx("impos_cash")]), actual:num(r[tx("actual_cash")]),
        variance:num(r[tx("variance")]),
        flag:String(r[tx("flag")]||"").trim()
      });
    });
  }
  RECON=recOut; RTILL=tillOut; RECON_OK=recOk;

  // ---- Deputy names, for folding typed names onto real ones ----
  const dep={all:[],byVenue:{},byDay:{},days:{}};
  const depTxt=await fetchTab("DeputyShifts");
  if(depTxt){
    const dg=parseCsv(depTxt.trim());
    const dh=(dg.shift()||[]).map(h=>String(h).trim().toLowerCase());
    const dx=n=>dh.indexOf(n);
    const seenAll={}, seenV={}, seenD={};
    dg.forEach(r=>{
      const who=String(r[dx("employee")]||"").trim(); if(!who) return;
      const v=vShort(String(r[dx("venue")]||"").trim());
      const d=dkey(r[dx("date")]);
      const kind=String(r[dx("kind")]||"").trim().toLowerCase();
      if(!seenAll[who]){ seenAll[who]=1; dep.all.push(who); }
      const vk=v+"|"+who; if(!seenV[vk]){ seenV[vk]=1; (dep.byVenue[v]=dep.byVenue[v]||[]).push(who); }
      if(kind==="shift"&&d){ const dk=v+"|"+d+"|"+who;
        if(!seenD[dk]){ seenD[dk]=1; (dep.byDay[v+"|"+d]=dep.byDay[v+"|"+d]||[]).push(who);
          dep.days[who]=(dep.days[who]||0)+1; } }
    });
  }
  DEP=dep;
  const smap={};
  const smTxt=await fetchTab("StaffMap");
  if(smTxt){
    const sg=parseCsv(smTxt.trim());
    const sh=(sg.shift()||[]).map(h=>String(h).trim().toLowerCase());
    let fi=sh.indexOf("name_from"); if(fi<0) fi=0;
    let ti=sh.indexOf("maps_to");   if(ti<0) ti=1;
    sg.forEach(r=>{ const a=nameKey(r[fi]), b=String(r[ti]||"").trim(); if(a&&b) smap[a]=b; });
  }
  STAFF_MAP=smap;
  applyNames();

  const n=Object.keys(D).reduce((a,k)=>a+D[k].length,0);
  document.getElementById("bld").textContent=n.toLocaleString()+" rows";
  renderFilters(); render();
}

/* ---------- period ---------- */
// Reports arrive weekly (Mon-Sun), so the natural unit is a week. week 0 = the most recent
// week present in the data, not the current calendar week - the data can lag by days.
function allDates(){
  const s=new Set();
  Object.keys(D).forEach(k=>D[k].forEach(r=>s.add(r.date)));
  return Array.from(s).sort();
}
const iso=d=>d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
const shift=(k,n)=>{const d=new Date(k+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d);};
/**
 * 7-day blocks counted BACK from the latest date in the data - not calendar Mon-Sun.
 * The broadcast covers "the past 7 days" from whenever it runs, so it does not align to
 * ISO weeks: the first import ran Sunday and covered Sun-to-Sun. Bucketing by calendar
 * week split that one report across two windows and halved every total.
 */
/**
 * Which dates a week is counted back from depends on the view. The staff reports
 * broadcast on Sunday night and cover the week before; reconciliation lands every day.
 * Anchoring the recon views on the staff reports made "this week" a week stale on the
 * Cash tab, so those two views anchor on the reconciliation dates instead. The other
 * views are untouched - re-anchoring them would shift every historical week boundary.
 */
function anchorDates(){
  if(isReconView(F.view)){
    const s=new Set(); RECON.forEach(r=>s.add(r.date));
    if(s.size) return Array.from(s).sort();
  }
  return allDates();
}
function weekCount(){
  const all=anchorDates();
  if(!all.length) return 0;
  const first=new Date(all[0]+"T00:00:00"), last=new Date(all[all.length-1]+"T00:00:00");
  return Math.max(1, Math.ceil(((last-first)/86400000+1)/7));
}
function window_(){
  const all=anchorDates();
  if(!all.length) return null;
  const i=Math.min(Math.max(F.week,0),weekCount()-1);
  const to=shift(all[all.length-1], -7*i);
  const from=shift(to,-6);
  return {from:from,to:to,label:fmtDay(from)+" \u2013 "+fmtDay(to),index:i,count:weekCount()};
}
function venueOn(v){ return F.venues.indexOf(v)>-1; }
function activeVenues(){ return F.venues.length?VENUES.filter(venueOn):VENUES; }
function rows(key){
  const w=window_(); if(!w) return [];
  return D[key].filter(r=>r.date>=w.from&&r.date<=w.to&&
    (!F.venues.length||venueOn(r.venue))&&(!F.day||r.date===F.day));
}
function setWeek(d){ F.week=Math.min(Math.max(F.week+d,0),Math.max(weekCount()-1,0)); F.day=""; F.check=null; renderFilters(); render(); }
function setVenue(v){
  F.check=null;
  if(!v) F.venues=[];
  else if(venueOn(v)) F.venues=F.venues.filter(x=>x!==v);
  else F.venues=F.venues.concat([v]);
  renderFilters(); render();
}
// renderFilters() matters here: without it the view pills keep their old highlight and
// the page looks unresponsive even though the content changed.
function setView(v){
  // The two view families count weeks from different dates, so a week index carried
  // across the boundary would point at a different span. Reset it; keep it otherwise.
  if(isReconView(F.view)!==isReconView(v)) F.week=0;
  F.view=v; F.day=""; F.check=null; F.person=null; F.cashPerson=null; F.discType=""; renderFilters(); render(); }
function setOrderVenue(v){ F.orderVenue=v; F.orderAdj={}; render(); }
function adjOrder(k,d){ const o=computeOrder(F.orderVenue||orderVenueDefault()); if(!o) return;
  F.orderAdj=F.orderAdj||{}; const cur=o.rolls[k]||0; F.orderAdj[k]=Math.max(0,cur+d);
  // once any line is hand-set, every line is frozen at its current value so auto-rounding
  // cannot move the others underneath the edit
  CHANGE_DENOMS.forEach(s=>{ if(F.orderAdj[s.k]===undefined) F.orderAdj[s.k]=o.rolls[s.k]||0; });
  render(); }
function resetOrder(){ F.orderAdj={}; render(); }
async function copyOrder(){
  const t=document.getElementById("orderText"); if(!t) return;
  const btn=document.getElementById("copyBtn");
  try{ await navigator.clipboard.writeText(t.value); }
  catch(e){ t.focus(); t.select(); try{ document.execCommand("copy"); }catch(e2){} }
  if(btn){ const was=btn.textContent; btn.textContent="Copied \u2713"; setTimeout(()=>{ btn.textContent=was; },1500); }
}
function setCashPerson(v,e){ F.cashPerson=(F.cashPerson&&F.cashPerson.employee===e&&F.cashPerson.venue===v)?null:{venue:v,employee:e}; render(); }
function setPerson(v,e){ F.person=(F.person&&F.person.employee===e&&F.person.venue===v)?null:{venue:v,employee:e}; render(); }
function setDiscType(t){ F.discType=(F.discType===t?"":t); render(); }
function setDay(d){ F.day=(F.day===d?"":d); F.check=null; render(); }
function openCheck(v,d,c){ F.check={venue:v,date:d,check:c}; render();
  setTimeout(function(){ var e=document.getElementById("detail"); if(e) e.scrollIntoView({behavior:"smooth",block:"center"}); },30); }
function closeDetail(){ F.check=null; render(); }
function setSort(k){
  if(F.sort.k===k) F.sort.d=-F.sort.d;
  else F.sort={k:k,d:(k==="name"||k==="employee")?1:-1};
  render();
}

function renderFilters(){
  const w=window_();
  const el=document.getElementById("filters");
  el.innerHTML=
    '<span class="chip nav" onclick="setWeek(1)">&#8249;</span>'+
    '<span class="chip on">Week</span>'+
    '<span class="chip nav" onclick="setWeek(-1)">&#8250;</span>'+
    '<span class="rangelbl">'+(w?esc(w.label)+(w.index?"":" \u00b7 latest"):"no data")+'</span>'+
    '<span class="sep"></span>'+
    '<span class="chip '+(F.venues.length===0?"on":"")+'" onclick="setVenue(\'\')">All venues</span>'+
    VENUES.map(v=>'<span class="chip '+(venueOn(v)?"on":"")+'" onclick="setVenue(\''+v+'\')">'+esc(v)+'</span>').join("")+
    '<span class="sep"></span>'+
    ["overview","wastage","par","discounts","voids","people","cash","daily"].map(v=>
      '<span class="chip '+(F.view===v?"on":"")+'" onclick="setView(\''+v+'\')">'+
      (v==="par"?"Par levels":v.charAt(0).toUpperCase()+v.slice(1))+'</span>').join("");
}

/* ---------- shared bits ---------- */
function metric(k,v,sub,colour){
  return '<div class="metric"><div class="k">'+esc(k)+'</div>'+
    '<div class="val"'+(colour?' style="color:'+colour+'"':'')+'>'+v+'</div>'+
    (sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
}
function barChart(keys,vals,labels,titles){
  const mx=Math.max.apply(null,[1].concat(vals));
  return '<div class="chart">'+keys.map((k,i)=>
    '<div class="col" title="'+esc(titles[i])+'"><div class="pair">'+
    '<div class="bx" style="height:'+Math.round(vals[i]/mx*120)+'px"></div></div>'+
    '<div class="lb">'+esc(labels[i])+'</div></div>').join("")+'</div>';
}
function sortRows(list,key){
  const d=F.sort.d;
  return list.slice().sort((a,b)=>{
    let x=a[F.sort.k], y=b[F.sort.k];
    if(x===undefined){x=a[key];y=b[key];}
    if(typeof x==="string"){x=x.toLowerCase();y=String(y).toLowerCase();}
    return x<y?-d:x>y?d:0;
  });
}
function th(k,lbl,cls){
  const on=F.sort.k===k;
  return '<th class="'+(cls||"")+' sortable'+(on?" sorted":"")+'" onclick="setSort('+
    JSON.stringify(k).replace(/"/g,"&quot;")+')">'+esc(lbl)+(on?(F.sort.d<0?" \u25bc":" \u25b2"):"")+'</th>';
}
/** Split check discounts into wastage and everything else - they are different animals. */
function splitChecks(){
  const cs=rows("check");
  return {waste:cs.filter(r=>r.discount_name===WASTE), other:cs.filter(r=>r.discount_name!==WASTE)};
}
/** Items inside a discounted check, from the transaction log. Check numbers REPEAT across
 *  days, so the key must be store + date + check - never the check number alone. */
function checkItems(){
  const m={};
  D.txn.forEach(r=>{ (m[r.venue+"|"+r.date+"|"+r.check_no]=m[r.venue+"|"+r.date+"|"+r.check_no]||[]).push(r); });
  return m;
}

/**
 * Everything on one check: the transaction lines, plus whatever discount or void was
 * recorded against it. This is the "why" behind a number - a $240 clearance means nothing
 * until you can see it was 14 sandwiches and a tray of sausage rolls.
 */
function checkCard(){
  if(!F.check) return "";
  const {venue,date,check}=F.check;
  const key=venue+"|"+date+"|"+check;
  const lines=(checkItems()[key]||[]);
  const disc=D.check.filter(r=>r.venue===venue&&r.date===date&&r.check_no===check);
  const vds=D.voids.filter(r=>r.venue===venue&&r.date===date&&r.check_no===check);
  const time=lines.length?lines[0].time:"";
  let html='<div class="card focus" id="detail" style="border-color:var(--ink);border-width:2px">'+
    '<div class="label">Check '+esc(check)+
    '<span class="legend">'+esc(venue)+' \u00b7 '+fmtDay(date)+' '+dayName(date)+(time?" \u00b7 "+esc(time):"")+'</span>'+
    '<span class="chip" style="padding:4px 10px;margin-left:auto" onclick="closeDetail()">close</span></div>';
  if(disc.length||vds.length){
    html+='<div class="metrics" style="margin-bottom:14px">'+
      disc.map(d=>metric(d.discount_name||"Discount",money(d.amount),
        esc(d.employee)+" \u00b7 "+esc(d.rate), d.discount_name===WASTE?"var(--amber)":"")).join("")+
      (vds.length?metric("Voided",money(vds.reduce((a,r)=>a+r.price_inc,0)),
        vds.length+" line(s)","var(--red)"):"")+
      metric("Lines on check",String(lines.length),"from the transaction log")+
      '</div>';
  }
  if(!lines.length){
    html+='<div class="note">No transaction lines found for this check. The Transactions tab '+
      '(RR008) may not cover this date.</div></div>';
    return html;
  }
  const vset={}; vds.forEach(v=>vset[v.item]=(vset[v.item]||0)+1);
  html+='<table><thead><tr><th>Item</th><th class="num">Refund</th><th class="num">Item disc</th>'+
    '<th class="num">Check disc</th><th class="num">Void</th></tr></thead><tbody>'+
    lines.map(l=>'<tr><td>'+esc(l.item)+(vset[l.item]?' <span class="pill void">voided</span>':'')+'</td>'+
      '<td class="num">'+(l.refund?money(l.refund):'<span class="muted">\u2013</span>')+'</td>'+
      '<td class="num">'+(l.discount_item?money(l.discount_item):'<span class="muted">\u2013</span>')+'</td>'+
      '<td class="num">'+(l.discount_check?money(l.discount_check):'<span class="muted">\u2013</span>')+'</td>'+
      '<td class="num">'+(l.void?money(l.void):'<span class="muted">\u2013</span>')+'</td></tr>').join("")+
    '</tbody></table></div>';
  return html;
}

/* ---------- views ---------- */
function viewOverview(){
  const {waste,other}=splitChecks();
  const items=rows("item"), vs=rows("voids");
  const wTot=waste.reduce((a,r)=>a+r.amount,0);
  const oTot=other.reduce((a,r)=>a+r.amount,0)+items.reduce((a,r)=>a+r.amount,0);
  const vTot=vs.reduce((a,r)=>a+r.price_inc,0);
  const rTot=rows("txn").reduce((a,r)=>a+r.refund,0);
  const days=Array.from(new Set(rows("check").concat(items,vs).map(r=>r.date))).sort();

  let html='<div class="card"><div class="label">This week at a glance</div><div class="metrics">'+
    metric("Wastage",money0(wTot),waste.length+" clearance check"+(waste.length===1?"":"s"),"var(--amber)")+
    metric("Other discounts",money0(oTot),(other.length+items.length)+" discounts")+
    metric("Voids",money0(vTot),vs.length+" line"+(vs.length===1?"":"s"),"var(--red)")+
    metric("Refunds",money0(Math.abs(rTot)),"from the transaction log")+
    '</div>'+
    '<div class="note">Wastage is shown on its own because it is authorised end-of-day clearance and '+
    'dwarfs everything else. Rolled together, the numbers that need your attention disappear inside it.</div></div>';

  // wastage by venue
  const byV=VENUES.map(v=>waste.filter(r=>r.venue===v).reduce((a,r)=>a+r.amount,0));
  if(wTot>0){
    html+='<div class="card"><div class="label">Wastage by venue</div><table><tbody>'+
      VENUES.map((v,i)=>byV[i]?('<tr><td><b>'+esc(v)+'</b></td>'+
        '<td class="hide-sm"><div class="barwrap"><div class="bar" style="width:'+
          Math.round(byV[i]/Math.max.apply(null,byV)*100)+'%"></div></div></td>'+
        '<td class="num"><b>'+money(byV[i])+'</b></td>'+
        '<td class="num muted">'+Math.round(byV[i]/wTot*100)+'%</td></tr>'):"").join("")+
      '</tbody></table></div>';
  }
  // per day - bars are tappable, because "which day was that?" is the first question
  if(days.length){
    const wByDay=days.map(d=>waste.filter(r=>r.date===d).reduce((a,r)=>a+r.amount,0));
    const mx=Math.max.apply(null,[1].concat(wByDay));
    html+='<div class="card"><div class="label">Wastage by day'+
      (F.day?'<span class="chip" style="padding:4px 10px" onclick="setDay(\''+F.day+'\')">showing '+
        fmtDay(F.day)+' \u00b7 clear</span>':
        '<span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">tap a day to drill in</span>')+
      '</div><div class="chart">'+
      days.map((d,i)=>'<div class="col'+(F.day?(F.day===d?" sel":" dim"):"")+
        '" style="cursor:pointer" onclick="setDay(\''+d+'\')" title="'+fmtDay(d)+' '+dayName(d)+
        ' \u2014 '+money(wByDay[i])+'"><div class="pair"><div class="bx" style="height:'+
        Math.round(wByDay[i]/mx*120)+'px"></div></div><div class="lb">'+dayName(d)+'</div></div>').join("")+
      '</div></div>';
  }
  if(F.day) html+=dayDetail();
  return html;
}

/** Everything recorded on one day, once a bar is tapped. */
function dayDetail(){
  const waste=rows("check").filter(r=>r.discount_name===WASTE);
  const other=rows("check").filter(r=>r.discount_name!==WASTE).concat(rows("item"));
  const vs=rows("voids");
  const line=(label,list,valFn,clickable)=>list.length?
    ('<div class="card"><div class="label">'+label+' on '+fmtDay(F.day)+' '+dayName(F.day)+'</div>'+
     '<table><thead><tr><th>Venue</th><th>Who</th><th>What</th><th class="num">Value</th></tr></thead><tbody>'+
     list.map(r=>'<tr'+(clickable&&r.check_no?' class="click" onclick="openCheck(\''+r.venue+
        '\',\''+r.date+'\',\''+r.check_no+'\')"':'')+'>'+
       '<td>'+esc(r.venue)+'</td><td>'+esc(r.employee)+'</td>'+
       '<td>'+esc(r.discount_name||r.void_reason||r.item||"")+
         (clickable&&r.check_no?' <span class="muted">check '+esc(r.check_no)+'</span>':'')+'</td>'+
       '<td class="num"><b>'+money(valFn(r))+'</b></td></tr>').join("")+
     '</tbody></table></div>'):"";
  return line("Clearance checks",waste,r=>r.amount,true)+
         line("Discounts",other,r=>r.amount,true)+
         line("Voids",vs,r=>r.price_inc,true);
}

function viewWastage(){
  const {waste}=splitChecks();
  if(!waste.length) return '<div class="card">No wastage recorded in this week.</div>';
  const items=checkItems();
  // What is actually being binned. The transaction log gives the lines on each clearance
  // check; counting them is what turns "$1,468 wasted" into something a kitchen can act on.
  const tally={}; let matched=0, unmatched=0;
  waste.forEach(r=>{
    const list=items[r.venue+"|"+r.date+"|"+r.check_no];
    if(!list){ unmatched++; return; }
    matched++;
    list.forEach(x=>{
      const k=x.venue+"|"+x.item;
      (tally[k]=tally[k]||{venue:x.venue,name:x.item,n:0,days:new Set()});
      tally[k].n++; tally[k].days.add(x.date);
    });
  });
  const list=Object.keys(tally).map(k=>tally[k]);
  list.forEach(t=>t.dayCount=t.days.size);
  const sorted=sortRows(list.map(t=>({venue:t.venue,name:t.name,n:t.n,dayCount:t.dayCount,
    perDay:t.n/Math.max(t.days.size,1)})),"n");

  const wrows=waste.map(r=>{
    const l=items[r.venue+"|"+r.date+"|"+r.check_no];
    return {...r, lines:l?l.length:0};
  });
  let html='<div class="card"><div class="label">Clearance checks'+
    '<span class="legend">'+waste.length+' this week \u00b7 tap a row for the items</span></div>'+
    '<table><thead><tr>'+
    th("date","When")+th("venue","Venue")+th("employee","Who")+
    th("lines","Items","num")+th("amount","Value","num")+
    '</tr></thead><tbody>'+
    sortRows(wrows,"amount").map(r=>
      '<tr class="click" onclick="openCheck(\''+r.venue+'\',\''+r.date+'\',\''+r.check_no+'\')">'+
        '<td>'+fmtDay(r.date)+' <span class="muted">'+dayName(r.date)+'</span></td>'+
        '<td>'+esc(r.venue)+'</td><td>'+esc(r.employee)+'</td>'+
        '<td class="num">'+(r.lines||'<span class="muted">?</span>')+'</td>'+
        '<td class="num"><b>'+money(r.amount)+'</b></td></tr>').join("")+
    '</tbody></table>'+
    (unmatched?'<div class="note">'+unmatched+' check(s) could not be matched to the transaction log, '+
      'so their contents are unknown. Usually means RR008 did not cover that date.</div>':'')+
    '</div>';

  if(sorted.length){
    const totLines=sorted.reduce((a,t)=>a+t.n,0);
    html+='<div class="card"><div class="label">What is being binned'+
      '<span class="legend">from '+matched+' matched check(s)</span></div><table><thead><tr>'+
      th("name","Item")+th("venue","Venue","hide-sm")+
      th("n","Times binned","num")+th("dayCount","Days seen","num")+
      th("perDay","Avg per day","num hide-sm")+
      '</tr></thead><tbody>'+
      sorted.slice(0,60).map(t=>'<tr><td><b>'+esc(t.name)+'</b></td>'+
        '<td class="hide-sm">'+esc(t.venue)+'</td>'+
        '<td class="num">'+t.n+'</td>'+
        '<td class="num">'+t.dayCount+'</td>'+
        '<td class="num hide-sm">'+(t.n/Math.max(t.dayCount,1)).toFixed(1)+'</td></tr>').join("")+
      '</tbody><tfoot><tr><td>'+sorted.length+' products</td><td class="hide-sm"></td>'+
      '<td class="num">'+totLines+'</td><td class="num"></td><td class="num hide-sm"></td></tr></tfoot></table>'+
      '<div class="note"><b>&ldquo;Times binned&rdquo; counts appearances, not units.</b> One appearance means '+
      'the item was on a clearance check; RR008 records no quantity, so an entry could be one sausage roll '+
      'or six. <b>3 times binned across 3 days means it appeared once a day on three days</b> \u2014 the two '+
      'columns do not multiply. Avg per day is times binned divided by days seen.<br>'+
      'An item appearing on most days is a par level set too high, regardless of the quantity behind '+
      'each entry \u2014 that is what makes this list useful despite the missing numbers.</div></div>';
  }
  return html;
}

function viewDiscounts(){
  const {other}=splitChecks();
  const items=rows("item");
  const all=items.map(r=>({...r,level:"item"})).concat(other.map(r=>({...r,level:"check"})));
  if(!all.length) return '<div class="card">No discounts (other than wastage) in this week.</div>';
  const byType={};
  all.forEach(r=>{
    const k=r.discount_name||"(unnamed)";
    (byType[k]=byType[k]||{name:k,n:0,amount:0,level:new Set()});
    byType[k].n++; byType[k].amount+=r.amount; byType[k].level.add(r.level);
  });
  const types=sortRows(Object.keys(byType).map(k=>({name:k,n:byType[k].n,amount:byType[k].amount,
    level:Array.from(byType[k].level).join(" + ")})),"amount");

      '<td class="hide-sm muted">'+esc(t.level)+'</td>'+
      '<td class="num">'+t.n+'</td><td class="num"><b>'+money(t.amount)+'</b></td></tr>').join("")+
    '</tbody><tfoot><tr><td>'+types.length+' type(s)</td><td class="hide-sm"></td>'+
    '<td class="num">'+all.length+'</td><td class="num">'+money(tot)+'</td></tr></tfoot></table>'+
    '<div class="note">Near-identical names here usually mean the same discount configured more than '+

    '<div class="card"><div class="label">'+(F.discType?esc(F.discType):"Every discount")+
      '<span class="legend">'+(F.discType?
        '<span class="chip" style="padding:4px 10px" onclick="setDiscType(\'\')">show all</span>':

/**
 * Par levels. Sold comes from the sales feed, wasted from the clearance checks, and the
 * two are matched on the ItemMap-normalised name so "H&C Toastie (W)" and
 * "Ham & Cheese Toastie" are the same product on both sides.
 *
 * Suggested par uses the agreed formula: average + 1.65 x sqrt(average), i.e. cover the
 * day-to-day swing at about a 95% service level. sqrt is the theoretical MINIMUM spread
 * for count data, so this is a floor - with enough weeks it should use the real standard
 * deviation instead.
 */
function viewPar(){
  if(!FEED_OK) return '<div class="card"><b>The sales feed is not readable.</b>'+
    '<div class="note">This view needs the SalesFeed tab as well as the staff reports.</div></div>';
  const w=window_();
  const {waste}=splitChecks();
  if(!waste.length) return '<div class="card">No wastage in this week, so nothing to compare.</div>';
  const items=checkItems();

  // wasted: one line on a clearance check = one unit binned (RR008 carries no quantity)
  const wasted={};
  waste.forEach(r=>{
    (items[r.venue+"|"+r.date+"|"+r.check_no]||[]).forEach(x=>{
      const k=x.venue+"|"+mapItem(x.item);
      (wasted[k]=wasted[k]||{venue:x.venue,item:mapItem(x.item),n:0,days:{}});
      wasted[k].n++; wasted[k].days[x.date]=1;
    });
  });
  // sold: paid units only, same window and venues
  const sold={};
  FEED.forEach(r=>{
    if(r.date<w.from||r.date>w.to) return;
    if(F.venues.length&&!venueOn(r.venue)) return;
    if(F.day&&r.date!==F.day) return;
    if(r.sales<=0) return;
    const k=r.venue+"|"+r.item;
    (sold[k]=sold[k]||{qty:0,rev:0,days:{}});
    sold[k].qty+=r.qty; sold[k].rev+=r.sales; sold[k].days[r.date]=1;
  });
  const tradingDays=Object.keys(sold).reduce((a,k)=>Math.max(a,Object.keys(sold[k].days).length),0)||7;

  const list=Object.keys(wasted).map(k=>{
    const wd=wasted[k], sd=sold[k]||{qty:0,rev:0,days:{}};
    const soldPerDay=sd.qty/tradingDays;
    const wastePerDay=wd.n/tradingDays;
    const price=sd.qty?sd.rev/sd.qty:0;
    // Demand is what sold. Production is what was made. Par should cover demand plus a
    // buffer for its swing - not cover the wastage as well, which is the current mistake.
    const par=soldPerDay>0?Math.ceil(soldPerDay+1.65*Math.sqrt(soldPerDay)):Math.ceil(wastePerDay);
    const producing=Math.round(soldPerDay+wastePerDay);
    return {venue:wd.venue, name:wd.item, sold:sd.qty, wasted:wd.n,
            soldPerDay:soldPerDay, wastePerDay:wastePerDay, price:price,
            par:par, producing:producing,
            over:Math.max(0,producing-par),
            saving:Math.max(0,producing-par)*price*tradingDays,
            wasteValue:wd.n*price,
            daysBinned:Object.keys(wd.days).length};
  }).filter(r=>r.wasted>0);

  const tot=k=>list.reduce((a,r)=>a+r[k],0);
  const sorted=sortRows(list,"wasteValue");
  return '<div class="card"><div class="label">Par level suggestions'+
      '<span class="legend">'+tradingDays+' trading days in this window</span></div>'+
    '<div class="metrics">'+
      metric("Wasted value",money0(tot("wasteValue")),list.length+" products","var(--amber)")+
      metric("Units binned",String(tot("wasted")),"across the week")+
      metric("Weekly saving if par is met",money0(tot("saving")),"at current selling prices","#1a7f37")+
    '</div></div>'+
    '<div class="card"><div class="label">By product'+
      '<span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">tap a column to sort</span>'+
      '</div><table><thead><tr>'+
      th("name","Product")+th("venue","Venue","hide-sm")+
      th("sold","Sold (week)","num")+th("soldPerDay","Sold/day","num hide-sm")+
      th("wasted","Binned (week)","num")+th("daysBinned","Days seen","num hide-sm")+
      th("producing","Making/day","num")+th("par","Suggested par","num")+
      th("saving","Weekly saving","num")+
      '</tr></thead><tbody>'+
      sorted.map(r=>'<tr><td><b>'+esc(r.name)+'</b>'+
          (r.sold===0?' <span class="pill waste">never sold</span>':'')+'</td>'+
        '<td class="hide-sm muted">'+esc(r.venue)+'</td>'+
        '<td class="num">'+r.sold+'</td>'+
        '<td class="num hide-sm muted">'+r.soldPerDay.toFixed(1)+'</td>'+
        '<td class="num" style="color:var(--amber)">'+r.wasted+'</td>'+
        '<td class="num hide-sm muted">'+r.daysBinned+'</td>'+
        '<td class="num">'+r.producing+'</td>'+
        '<td class="num"><b>'+r.par+'</b></td>'+
        '<td class="num">'+(r.saving>0?money(r.saving):'<span class="muted">\u2013</span>')+'</td></tr>').join("")+
      '</tbody><tfoot><tr><td>'+sorted.length+' products</td><td class="hide-sm"></td>'+
      '<td class="num">'+tot("sold")+'</td><td class="num hide-sm"></td>'+
      '<td class="num">'+tot("wasted")+'</td><td class="num hide-sm"></td>'+
      '<td class="num"></td><td class="num"></td>'+
      '<td class="num">'+money(tot("saving"))+'</td></tr></tfoot></table>'+
      '<div class="note"><b>Suggested par = average sold per day + 1.65 &times; &radic;average</b>, which covers '+
      'the normal day-to-day swing about 95% of the time. "Making/day" is what you are currently producing '+
      '(sold + binned). Where the two differ, the gap is the over-production.<br>'+
      'Treat this as a starting point, not an instruction. An item that regularly sells out has understated '+
      'sales here, so its par will come out too low \u2014 and one week of data is not enough to trust any '+
      'single line. It also assumes a line on a clearance check is one unit, because the transaction log '+
      'carries no quantity \u2014 so &ldquo;Binned&rdquo; counts appearances on clearance checks, not units, '+
      'and every figure derived from it is a floor.</div></div>';
}

/**
 * One person, against their colleagues at the same venue.
 *
 * NOTE ON THE DENOMINATOR: none of the four weekly reports carries sales per employee, so
 * "discounts as a % of their own sales" cannot be computed here. MIR280 (All Items Sold by
 * Employees) has it - add that to the weekly broadcast and this becomes exact. Until then
 * the comparison is against the venue's per-person average, which is honest but blunter:
 * it does not adjust for how many shifts someone worked.
 */
function personCard(){
  if(!F.person) return "";
  const {venue,employee}=F.person;
  const {waste,other}=splitChecks();
  const items=rows("item"), vs=rows("voids");
  const mine=x=>x.venue===venue&&x.employee===employee;
  const atVenue=x=>x.venue===venue;

  const myW=waste.filter(mine), myD=other.filter(mine).concat(items.filter(mine)), myV=vs.filter(mine);
  const vW=waste.filter(atVenue), vD=other.filter(atVenue).concat(items.filter(atVenue)), vV=vs.filter(atVenue);
  const peers=new Set(); vW.concat(vD,vV).forEach(r=>peers.add(r.employee));
  const nPeers=Math.max(peers.size,1);
  const sum=(l,k)=>l.reduce((a,r)=>a+(r[k]||0),0);

  const cmp=(mineVal,venueVal,label,unit)=>{
    const avg=venueVal/nPeers;
    const pct=avg>0?Math.round((mineVal/avg-1)*100):0;
    const tone=Math.abs(pct)<25?"var(--dim)":(pct>0?"var(--red)":"#1a7f37");
    return metric(label,unit(mineVal),
      avg>0?('venue average '+unit(avg)+' \u00b7 <b style="color:'+tone+'">'+
        (pct>=0?"+":"")+pct+'%</b>'):"no comparison",
      Math.abs(pct)>=50?tone:"");
  };
  const days={}; myW.concat(myD,myV).forEach(r=>days[r.date]=1);
  const events=myW.concat(myD,myV).length;

  let html='<div class="card focus" id="person-detail" style="border-color:var(--ink);border-width:2px">'+
    '<div class="label">'+esc(employee)+
      '<span class="legend">'+esc(venue)+' \u00b7 '+events+' event(s) over '+
      Object.keys(days).length+' day(s) \u00b7 compared with '+nPeers+' people at this venue</span>'+
    '<span class="chip" style="padding:4px 10px;margin-left:auto" onclick="setPerson(\''+
      venue.replace(/'/g,"")+'\',\''+String(employee).replace(/'/g,"")+'\')">close</span></div>'+
    '<div class="metrics">'+
      cmp(sum(myD,"amount"), sum(vD,"amount"), "Discounts", money0)+
      cmp(sum(myV,"price_inc"), sum(vV,"price_inc"), "Voids", money0)+
      cmp(sum(myW,"amount"), sum(vW,"amount"), "Wastage", money0)+
      metric("Clearance checks", String(myW.length), myW.length?"they close":"they do not close")+
    '</div>'+
    '<div class="note">Compared against the average of everyone with activity at this venue this week. '+
    'That average is not shift-adjusted \u2014 someone on five shifts will out-total someone on two. '+
    '<b>To compare discounts against a person\u2019s own sales, MIR280 needs adding to the weekly '+
    'broadcast;</b> it is the only report with sales per employee.</div>';

  // Each event lists the items on its check inline, so you can see what a $240 clearance
  // actually was without leaving the person's report. The row still opens the full check.
  const ci=checkItems();
  const rowsFor=(label,list,valFn,kindFn)=>list.length?
    ('<div class="label" style="margin-top:16px">'+label+
     '<span class="legend">tap a row for the full check</span></div><table><thead><tr>'+
     '<th>When</th><th>What</th><th class="num">Items</th><th class="num">Value</th></tr></thead><tbody>'+
     list.slice().sort((a,b)=>valFn(b)-valFn(a)).map(r=>{
       const lines=r.check_no?(ci[r.venue+"|"+r.date+"|"+r.check_no]||[]):[];
       const names=lines.map(x=>x.item);
       const shown=names.slice(0,6).join(", ")+(names.length>6?" +"+(names.length-6)+" more":"");
       return '<tr'+(r.check_no?' class="click" onclick="openCheck(\''+r.venue+'\',\''+r.date+'\',\''+r.check_no+'\')"':'')+'>'+
       '<td>'+fmtDay(r.date)+' <span class="muted">'+dayName(r.date)+
         (r.void_time?" "+esc(r.void_time):"")+'</span></td>'+
       '<td>'+esc(kindFn(r))+
         (r.check_no?' <span class="muted">check '+esc(r.check_no)+'</span>':'')+
         (names.length?'<div class="muted" style="margin-top:3px">'+esc(shown)+'</div>':'')+'</td>'+
       '<td class="num muted">'+(names.length||'\u2013')+'</td>'+
       '<td class="num"><b>'+money(valFn(r))+'</b></td></tr>';
     }).join("")+
     '</tbody></table>'):"";
  html+=rowsFor("Their discounts",myD,r=>r.amount,r=>r.discount_name)+
        rowsFor("Their voids",myV,r=>r.price_inc,r=>r.item+" \u2014 "+r.void_reason)+
        rowsFor("Their clearance checks",myW,r=>r.amount,r=>r.discount_name);
  return html+'</div>';
}

/* ---------- staff name resolution ---------- */
/**
 * Staff type their own name into the closing form, so one person arrives as "fessa",
 * "FESSA", "Fessa and Chloe" or "razina chivers00". ImPOS staff reports carry whatever
 * was keyed into the POS. Deputy holds the real names. Everything is folded to the
 * Deputy name at load time, so one person is one row on People and Cash alike, and the
 * drill-downs keep working because they see the folded name too.
 *
 * Resolution order, first hit wins:
 *   1. StaffMap tab in BG Sales Data (name_from | maps_to). Hand-maintained and beats
 *      everything - the same idea as ItemMap and Overrides: a human correcting the
 *      source. Keys are matched case- and punctuation-insensitively.
 *   2. Someone rostered at THAT venue on THAT day in DeputyShifts whose name matches.
 *      The strongest signal there is: "D" on POS 1 at Glenorchy on the 17th can only
 *      be one of the three people on that day. DeputyShifts is a rolling window, so
 *      this reaches back a few weeks and no further.
 *   3. Anyone who has ever worked at that venue, then anyone in Deputy at all.
 *   4. Nothing. The typed name is kept (tidied) and counted in UNMAPPED, which the Cash
 *      view lists so StaffMap rows can be added for them.
 *
 * Matching is deliberately conservative: exact full name, exact first name, or a UNIQUE
 * first-name prefix of two or more letters. A single letter is tried only against the
 * day roster. Where two people fit, the clearly more established one wins (see
 * established()) and otherwise it is no match at all - a wrong name on a till-shortage
 * table is worse than a raw one.
 */
let DEP={all:[],byVenue:{},byDay:{},days:{}}, STAFF_MAP={}, NAME_CACHE={}, UNMAPPED={};
const nameKey=s=>String(s||"").toLowerCase().replace(/[0-9_]/g,"").replace(/[^a-z&\s]/g," ").replace(/\s+/g," ").trim();
const firstName=full=>nameKey(full).split(" ")[0]||"";
const capName=s=>s.replace(/(^|\s)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function splitNames(s){
  return nameKey(s).replace(/\band\b/g,"&").split(/\s*[&,\/+]\s*/).map(x=>x.trim()).filter(Boolean);
}
/**
 * When a typed name fits more than one person, prefer the established one.
 *
 * Adrian, 22 Sep 2026: new staff very rarely count tills - almost never. So the person
 * behind an ambiguous name is overwhelmingly the one with the longer record. Tenure is
 * read off DeputyShifts as distinct shift days in its window: the candidate has to have
 * at least ESTABLISHED_DAYS of them AND at least ESTABLISHED_RATIO times the runner-up's,
 * or it is still no match. Two comparably established people sharing a prefix is a
 * StaffMap row, not a guess.
 */
const ESTABLISHED_DAYS=8, ESTABLISHED_RATIO=3;
function established(hits){
  if(hits.length<2) return hits[0]||null;
  const s=hits.slice().sort((a,b)=>(DEP.days[b]||0)-(DEP.days[a]||0));
  const top=DEP.days[s[0]]||0, next=DEP.days[s[1]]||0;
  return (top>=ESTABLISHED_DAYS && top>=next*ESTABLISHED_RATIO) ? s[0] : null;
}
function matchIn(part,cands){
  if(!cands||!cands.length) return null;
  let hit=cands.filter(c=>nameKey(c)===part); if(hit.length) return hit.length===1?hit[0]:established(hit);
  hit=cands.filter(c=>firstName(c)===part); if(hit.length) return hit.length===1?hit[0]:established(hit);
  if(part.length>=2){ hit=cands.filter(c=>firstName(c).indexOf(part)===0); if(hit.length) return hit.length===1?hit[0]:established(hit); }
  return null;
}
function resolveOne(part,venue,date){
  if(STAFF_MAP[part]) return STAFF_MAP[part];
  const day=DEP.byDay[venue+"|"+date];
  if(day&&day.length){
    const m=matchIn(part,day); if(m) return m;
    if(part.length===1){ const h=day.filter(c=>firstName(c).charAt(0)===part); if(h.length) return h.length===1?h[0]:established(h); }
  }
  const m2=matchIn(part,DEP.byVenue[venue]); if(m2) return m2;
  return matchIn(part,DEP.all);
}
function realName(typed,venue,date){
  const raw=String(typed||"").trim(); if(!raw) return "";
  const whole=nameKey(raw);
  if(!whole) return raw;
  if(STAFF_MAP[whole]) return STAFF_MAP[whole];
  const k=venue+"|"+date+"|"+whole;
  if(NAME_CACHE[k]!==undefined) return NAME_CACHE[k];
  const out=splitNames(raw).map(p=>{
    const r=resolveOne(p,venue,date); if(r) return r;
    UNMAPPED[p]=(UNMAPPED[p]||0)+1; return capName(p);
  });
  const res=out.join(" & ")||raw;
  NAME_CACHE[k]=res; return res;
}
/** One pass over everything that carries a person's name. Raw values are kept. */
function applyNames(){
  NAME_CACHE={}; UNMAPPED={};
  Object.keys(D).forEach(k=>D[k].forEach(r=>{
    if(!("employee" in r)) return;
    if(r.employee_raw===undefined) r.employee_raw=r.employee;
    r.employee=realName(r.employee_raw,r.venue,r.date)||r.employee_raw;
  }));
  RTILL.forEach(t=>{ if(t.staff_raw===undefined) t.staff_raw=t.staff; t.staff=realName(t.staff_raw,t.venue,t.date); });
  RECON.forEach(r=>{ if(r.by_raw===undefined) r.by_raw=r.by; r.by=realName(r.by_raw,r.venue,r.date); });
}
function unmappedNote(){
  const list=Object.keys(UNMAPPED).sort((a,b)=>UNMAPPED[b]-UNMAPPED[a]);
  if(!list.length) return "";
  const shown=list.slice(0,12).map(n=>'<b>'+esc(capName(n))+'</b> ('+UNMAPPED[n]+')').join(", ");

/* ---------- reconciliation: shared ---------- */
function reconSites(){ return RECON.filter(r=>VENUES.indexOf(r.venue)>-1); }
function reconWeek(){
  const w=window_(); if(!w) return [];
  return reconSites().filter(r=>r.date>=w.from&&r.date<=w.to&&(!F.venues.length||venueOn(r.venue)));
}
function tillWeek(){
  const w=window_(); if(!w) return [];
  return RTILL.filter(r=>r.date>=w.from&&r.date<=w.to&&VENUES.indexOf(r.venue)>-1&&
    (!F.venues.length||venueOn(r.venue)));
}
function varColour(v){ return Math.abs(v)<0.005?"":(v<0?"var(--red)":"var(--teal)"); }
function signed(v){ return v<0?"-"+money(-v):(v>0?"+":"")+money(v); }
function noReconCard(){
  return '<div class="card"><b>No reconciliation data yet.</b><div class="note">'+
    'The <b>Reconciliation</b> and <b>ReconTills</b> tabs are written by '+
    '<b>processReconciliation</b> in the Sales Feed Apps Script project, on a 5pm daily '+
    'trigger. Run <b>reconBackfill()</b> once per venue to load the history.</div></div>';
}
function latestCounts(){
  const out={};
  reconSites().forEach(r=>{ if(r.floatTotal===null) return;
    if(!out[r.venue]||r.date>out[r.venue].date) out[r.venue]=r; });
  return out;
}
const median=a=>{ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y), h=s.length>>1;
  return s.length%2?s[h]:(s[h-1]+s[h])/2; };
function floatMedian(venue,n){
  const v=reconSites().filter(r=>r.venue===venue&&r.floatTotal!==null)
    .sort((a,b)=>a.date<b.date?-1:1).slice(-(n||90)).map(r=>r.floatTotal);
  return median(v);
}
/** Normal stock of each denomination at a venue: the hand-set par, else the 90-day median. */
function denomPar(venue){
  const recent=reconSites().filter(r=>r.venue===venue&&r.floatTotal!==null)
    .sort((a,b)=>a.date<b.date?-1:1).slice(-90);
  const par={}, hand=DENOM_PAR[venue]||{};
  DENOM_SPEC.forEach(s=>{
    if(hand[s.k]!==undefined) par[s.k]={v:hand[s.k],src:"par"};
    else par[s.k]={v:median(recent.map(r=>r.denoms[s.k]||0)),src:"median"};
  });
  return par;
}
function denomState(count,par){
  if(par===null||par===undefined) return "d-none";
  if(par<=0) return count>0?"d-ok":"d-none";
  const ratio=count/par;
  return ratio>=0.75?"d-ok":ratio>=0.4?"d-low":"d-out";
}
function denomGrid(r,par){
  return '<div class="denoms">'+DENOM_SPEC.map(s=>{
    const c=r.denoms[s.k]||0, p=par?par[s.k]:null;
    const st=denomState(c,p?p.v:null);
    const tip=p&&p.v!==null?(p.src==="par"?"par ":"usual ")+Math.round(p.v):"";
    return '<div class="denom '+st+'" title="'+esc(tip)+'"><span class="dk">'+esc(s.label)+'</span>'+
      '<span class="dv">'+c+'</span><span class="ds">'+money0(c*s.mult)+'</span></div>';
  }).join("")+'</div>';
}
function floatSummary(r){
  const med=floatMedian(r.venue,90);
  if(r.floatVar!==null){
    const off=Math.abs(r.floatVar)>50;
    return {text:r.floatVar===0?"on target":signed(r.floatVar)+" vs target", colour:off?"var(--red)":"var(--teal)"};
  }
  return {text:med!==null?"90-day median "+money0(med):"no target set", colour:""};
}

/* ---------- change order ---------- */
/**
 * The Friday change order to the bank, worked out from the latest count.
 *
 * Rule, from Adrian: hold CHANGE_PAR_ROLLS rolls of each denomination. The order for a
 * denomination is (par - rolls on hand) whole rolls, expressed in dollars the way the
 * bank reads it - "$2 - $250" is five $2 rolls. The order is paid for out of the float
 * in $50 notes, so its total is rounded UP to a multiple of $50 by adding rolls to
 * whichever denominations are furthest below par (every roll value is even, so this
 * always lands). Each line can be nudged by hand; a hand-set order is no longer
 * auto-rounded, and the tender is then made up in $50s, then $20s, $10s and $5s.
 */
function orderVenueDefault(){
  const l=latestCounts();
  return VENUES.filter(v=>l[v])[0]||"";
}
function computeOrder(venue){
  const r=latestCounts()[venue]; if(!r) return null;
  const par=denomPar(venue), adj=F.orderAdj||{}, manual=Object.keys(adj).length>0;
  const rolls={}, rounded=[];
  CHANGE_DENOMS.forEach(s=>{
    const have=r.denoms[s.k]||0, p=par[s.k]&&par[s.k].v!==null?par[s.k].v:CHANGE_PAR_ROLLS;
    rolls[s.k]=manual?(adj[s.k]||0):Math.max(0,Math.ceil(p-have));
  });
  const total=()=>CHANGE_DENOMS.reduce((a,s)=>a+rolls[s.k]*s.mult,0);
  if(!manual){
    let rem=(50-total()%50)%50, guard=0;
    while(rem>0&&guard++<40){
      // furthest below par, among rolls that fit inside the remainder
      const cands=CHANGE_DENOMS.filter(s=>s.mult<=rem).sort((a,b)=>{
        const ra=((r.denoms[a.k]||0)+rolls[a.k])/CHANGE_PAR_ROLLS, rb=((r.denoms[b.k]||0)+rolls[b.k])/CHANGE_PAR_ROLLS;
        return ra-rb || b.mult-a.mult; });
      if(!cands.length) break;
      rolls[cands[0].k]++; rem-=cands[0].mult; rounded.push(cands[0].label);
    }
  }
  const tot=total(), tender=[]; let left=tot;
  NOTES.forEach(n=>{ const q=Math.floor(left/n); if(q>0){ tender.push({note:n,qty:q}); left-=q*n; } });
  return {venue:venue,date:r.date,have:r.denoms,par:par,rolls:rolls,total:tot,tender:tender,
          unpayable:left,rounded:rounded,manual:manual};
}
function orderEmail(o){
  const lines=["Good morning,","","Can I please arrange the following change for collection this morning?","","Tendered:"];
  o.tender.forEach(t=>lines.push("$"+t.note+" - $"+(t.note*t.qty)));
  lines.push("Total: $"+o.total,"","Required:");
  CHANGE_DENOMS.forEach(s=>{ if(o.rolls[s.k]>0) lines.push(s.label+" - $"+(o.rolls[s.k]*s.mult)); });
  lines.push("Total: $"+o.total,"","Kind regards,","Adrian Beckitt","Managing Director, B & G Fitness Pty Ltd","Red Square Cafe | Luma Kitchen");
  return lines.join("\n");
}
function changeOrderCard(){
  const venue=F.orderVenue||orderVenueDefault(); if(!venue) return "";
  const o=computeOrder(venue); if(!o) return "";
  const cafes=VENUES.filter(v=>latestCounts()[v]);
  const chips=cafes.map(v=>'<span class="chip '+(v===venue?"on":"")+'" style="padding:4px 10px" onclick="setOrderVenue(\''+v+'\')">'+esc(v)+'</span>').join(" ");
  const rows=CHANGE_DENOMS.map(s=>{
    const have=o.have[s.k]||0, need=o.rolls[s.k], p=o.par[s.k]&&o.par[s.k].v!==null?o.par[s.k].v:CHANGE_PAR_ROLLS;
    return '<tr><td>'+esc(s.label)+' rolls</td><td class="num">'+have+'</td><td class="num muted">'+p+'</td>'+
      '<td class="num"><span class="chip nav" style="padding:1px 8px" onclick="adjOrder(\''+s.k+'\',-1)">−</span> '+
      '<b>'+need+'</b> <span class="chip nav" style="padding:1px 8px" onclick="adjOrder(\''+s.k+'\',1)">+</span></td>'+
      '<td class="num">'+(need?money0(need*s.mult):"–")+'</td></tr>';
  }).join("");
  const nothing=o.total===0;
  const tenderTxt=o.tender.map(t=>t.qty+' × $'+t.note).join(", ")||"–";
  return '<div class="card"><div class="label">Change order · from the '+fmtDay(o.date)+' count'+
    '<span class="legend">'+chips+'</span></div>'+
    '<div class="sites"><div>'+
    '<table><thead><tr><th>Denomination</th><th class="num">Have</th><th class="num">Par</th><th class="num">Order</th><th class="num">$</th></tr></thead><tbody>'+rows+
    '<tr class="total"><td>Total</td><td></td><td></td><td></td><td class="num">'+money0(o.total)+'</td></tr></tbody></table>'+
    '<div class="note">Tender from the float: <b>'+esc(tenderTxt)+'</b>.'+
    (o.rounded.length?' Rounded up to a multiple of $50 by adding a roll of '+esc(o.rounded.join(", "))+'.':'')+
    (o.manual?' Hand-adjusted – <span class="chip" style="padding:2px 8px" onclick="resetOrder()">back to par</span>':'')+
    (o.unpayable?' <b style="color:var(--red)">$'+o.unpayable+' cannot be tendered in notes – adjust a line.</b>':'')+
    '</div></div><div>'+
    (nothing?'<div class="note">Everything is at par. Nothing to order.</div>':
    '<textarea id="orderText" readonly style="width:100%;min-height:290px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical">'+
    esc(orderEmail(o))+'</textarea>'+
    '<div style="margin-top:8px"><span class="chip on" id="copyBtn" onclick="copyOrder()">Copy email</span> '+
    '<span class="muted" style="margin-left:8px">paste into Gmail</span></div>')+
    '</div></div></div>';
}

/**
 * The float and the per-till over/short.
 *
 * "Latest count" is the most recent day on file for each site, whatever week is selected -
 * it answers "is the float right now", which is the daily question. Everything below it
 * follows the selected week, which on this view is counted back from the reconciliation
 * dates (see anchorDates).
 *
 * A till flagged DECIMAL? is a keying slip, not money. The ingestion already leaves its
 * variance out of the day's cash_var and it is left out of every total here too - but it
 * is still shown, because it is a thing to go and fix.

function viewCash(){
  if(!RECON_OK) return noReconCard();

  const latest=latestCounts();

  }).join("");

  const latestCard='<div class="card"><div class="label">Latest count'+
    '<span class="legend"><i style="background:var(--teal)"></i>normal <i style="background:var(--amber)"></i>running low '+
    '<i style="background:var(--red)"></i>nearly out \u00b7 against each site’s usual stock of that coin</span></div>'+

    '</div>';

  const days=reconWeek(), tills=tillWeek();
  if(!days.length) return latestCard+changeOrderCard()+'<div class="card"><b>Nothing reconciled in this week.</b></div>';

  // float by day, the two cafes side by side
  const w=window_(); const dates=[];
  for(let d=w.from; d<=w.to; d=shift(d,1)) dates.push(d);
  const cafes=VENUES.filter(v=>reconSites().some(r=>r.venue===v&&r.floatTotal!==null)&&(!F.venues.length||venueOn(v)));
  const fl={}; days.forEach(r=>{ if(r.floatTotal!==null) fl[r.venue+"|"+r.date]=r; });
  const floatCard=cafes.length?'<div class="card"><div class="label">Float this week</div><table><thead><tr><th>Date</th>'+
    cafes.map(v=>'<th class="num">'+esc(v)+'</th>').join("")+'</tr></thead><tbody>'+
    dates.map(d=>'<tr><td>'+fmtDay(d)+' '+dayName(d)+'</td>'+cafes.map(v=>{
      const r=fl[v+"|"+d]; if(!r) return '<td class="num">–</td>';
      const fs=floatSummary(r);
      return '<td class="num" style="color:'+(r.floatVar!==null?fs.colour:"")+'">'+money0(r.floatTotal)+
        (r.flags.indexOf("FLOAT_OFF")>-1?' <b style="color:var(--red)">!</b>':'')+'</td>';
    }).join("")+'</tr>').join("")+'</tbody></table></div>':'';

  const real=tills.filter(t=>t.flag!=="DECIMAL?");
  const net=real.reduce((a,t)=>a+t.variance,0);
  const absSum=real.reduce((a,t)=>a+Math.abs(t.variance),0);
  const exact=real.filter(t=>Math.abs(t.variance)<0.005).length;
  const typos=tills.length-real.length;
  const flagged=days.filter(d=>d.flags).length;
  const metrics='<div class="metrics">'+
    metric("Net over / short",real.length?signed(net):"–",real.length+" tills counted",varColour(net))+
    metric("Counted exactly",real.length?Math.round(exact/real.length*100)+"%":"–",exact+" of "+real.length)+
    metric("Average miss",real.length?money(absSum/real.length):"–","per till, either way")+
    metric("Days flagged",String(flagged),typos?typos+" decimal slip"+(typos>1?"s":""):"of "+days.length+" days",flagged?"var(--amber)":"")+
    '</div>';

  const p={};
  real.forEach(t=>{
    const who=t.staff||"(not recorded)", k=t.venue+"|"+who;

  });
  const people=Object.keys(p).map(k=>{ const o=p[k]; o.avg=o.tills?o.abs/o.tills:0;
    o.acc=o.tills?Math.round(o.exact/o.tills*100):0; return o; });

      '<table><thead><tr>'+th("employee","Person")+th("venue","Venue","hide-sm")+
      th("tills","Tills","num")+th("acc","Exact","num")+th("net","Net","num")+th("avg","Avg miss","num")+th("worst","Worst","num")+
      '</tr></thead><tbody>'+
      sorted.map(r=>'<tr class="click'+(F.cashPerson&&F.cashPerson.employee===r.employee&&F.cashPerson.venue===r.venue?' sorted':'')+
        '" onclick="setCashPerson('+JSON.stringify(r.venue).replace(/"/g,"&quot;")+','+JSON.stringify(r.employee).replace(/"/g,"&quot;")+')">'+
        '<td>'+esc(r.employee)+'</td><td class="hide-sm">'+esc(r.venue)+'</td>'+
        '<td class="num">'+r.tills+'</td><td class="num">'+r.acc+'%</td>'+

        '<td class="num">'+money(r.avg)+'</td>'+
        '<td class="num" style="color:'+varColour(r.worst)+'">'+(r.worst?signed(r.worst):"–")+'</td></tr>').join("")+
      '</tbody></table>'+unmappedNote()+
      '<div class="note">Someone always a few cents out is counting honestly. Watch for exact every day, then a long way down. '+
      'Tills are only attributed to a person from 28 Nov 2021.</div></div>';
  }

  let drill="";
  if(F.cashPerson){
    const mine=tills.filter(t=>t.venue===F.cashPerson.venue&&(t.staff||"(not recorded)")===F.cashPerson.employee)
      .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.pos<b.pos?-1:1);
    if(mine.length){
      drill='<div class="card" id="detail"><div class="label">'+esc(F.cashPerson.employee)+' \u00b7 '+esc(F.cashPerson.venue)+

        '<table><thead><tr><th>Date</th><th>POS</th><th class="hide-sm">As typed</th><th class="num">Impos</th><th class="num">Counted</th><th class="num">Variance</th><th></th></tr></thead><tbody>'+
        mine.map(t=>'<tr><td>'+fmtDay(t.date)+' '+dayName(t.date)+'</td><td>POS '+esc(t.pos)+'</td>'+
          '<td class="hide-sm muted">'+esc(t.staff_raw||"")+'</td>'+
          '<td class="num">'+money(t.impos)+'</td><td class="num">'+money(t.actual)+'</td>'+
          '<td class="num" style="color:'+(t.flag==="DECIMAL?"?"":varColour(t.variance))+'">'+(t.flag==="DECIMAL?"?"–":signed(t.variance))+'</td>'+
          '<td>'+(t.flag?'<b>'+esc(t.flag)+'</b>':'')+'</td></tr>').join("")+
        '</tbody></table></div>';
    }
  }
  return latestCard+changeOrderCard()+floatCard+metrics+drill+peopleCard;
}

      vs.map(v=>{ const r=d.venues[v]; if(!r) return '<td class="num">–</td><td class="num hide-sm"></td>';
        return '<td class="num">'+money(r.actual)+'</td><td class="num hide-sm" style="color:'+varColour(r.cash_var)+'">'+(r.cash_var?signed(r.cash_var):"")+'</td>'; }).join("")+
      '<td class="num"><b>'+money(d.bank)+'</b></td>'+
      '<td class="num" style="color:'+varColour(d.vari)+'">'+(d.vari?signed(d.vari):"–")+'</td>'+
      '<td>'+(d.flags.length?'<b style="color:var(--amber)">'+esc(d.flags.join("; "))+'</b>':'')+'</td></tr>').join("")+
    '<tr class="total"><td>Week</td>'+vs.map(v=>{ const s=list.reduce((a,d)=>a+(d.venues[v]?d.venues[v].actual:0),0);
      const x=list.reduce((a,d)=>a+(d.venues[v]?d.venues[v].cash_var:0),0);
      return '<td class="num">'+money(s)+'</td><td class="num hide-sm" style="color:'+varColour(x)+'">'+(x?signed(x):"")+'</td>'; }).join("")+
    '<td class="num">'+money(T("bank"))+'</td><td class="num" style="color:'+varColour(T("vari"))+'">'+signed(T("vari"))+'</td><td></td></tr>'+
    '</tbody></table></div>';
  return report+table;
}

function render(){
  const app=document.getElementById("app");
  const w=window_();
  if(!w && isReconView(F.view)){ app.className=""; app.innerHTML=noReconCard(); return; }
  if(!w){
    app.innerHTML='<div class="card"><b>No staff report data yet.</b>'+
      '<div class="note">The reports broadcast at 9pm each Sunday and are imported by '+
      'processStaffReports on the Monday trigger.'+
      (MISSING.length?' Tabs not found: <b>'+MISSING.map(esc).join(", ")+'</b>.':'')+'</div></div>';
    return;
  }
  const body = F.view==="par" ? viewPar()
             : F.view==="wastage" ? viewWastage()
             : F.view==="discounts" ? viewDiscounts()
             : F.view==="voids" ? viewVoids()
             : F.view==="people" ? viewPeople()
             : F.view==="cash" ? viewCash()
             : F.view==="daily" ? viewDaily()
             : viewOverview();
  // With a person or a check open, printing should produce THAT report - not the whole
  // list with the detail buried at the top.
  app.className = (F.person||F.check) ? "focused" : "";
  // The header card describes the ImPOS staff reports. On the reconciliation views it is
  // wrong and in the way - the week already shows in the filter bar.
  app.innerHTML =
    checkCard()+ personCard()+
    (isReconView(F.view) ? '' :
    '<div class="card"><div class="label">'+esc(w.label)+
      (F.venues.length?' \u00b7 '+esc(F.venues.join(" + ")):'')+
      '<span class="legend">week '+(w.index+1)+' of '+w.count+'</span></div>'+
      '<div class="muted">Discount, void and transaction reports from ImPOS, imported weekly.</div></div>')+
    body +
    (MISSING.length?'<div class="card"><b>Some tabs are missing:</b> '+MISSING.map(esc).join(", ")+
      '<div class="note">They are created the first time processStaffReports runs with data.</div></div>':'');
}
/* ---------- export ---------- */
function csvCell(v){
  const s=String(v==null?"":v);
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
/** CSV of whatever the current view is showing, filters and drill-down included. */
function exportCsv(){
  const w=window_(); if(!w) return;
  const {waste,other}=splitChecks();
  let name="staff", head=[], body=[];
  if(F.view==="wastage"){
    const items=checkItems();
    name="wastage";
    head=["date","venue","employee","check_no","amount","item"];
    waste.forEach(r=>{
      const l=items[r.venue+"|"+r.date+"|"+r.check_no]||[];
      if(!l.length) body.push([r.date,r.venue,r.employee,r.check_no,r.amount.toFixed(2),""]);
      l.forEach(x=>body.push([r.date,r.venue,r.employee,r.check_no,r.amount.toFixed(2),x.item]));
    });
  } else if(F.view==="discounts"){
    name="discounts";
    head=["date","venue","employee","discount_name","level","check_no","amount"];
    rows("item").forEach(r=>body.push([r.date,r.venue,r.employee,r.discount_name,"item","",r.amount.toFixed(2)]));
    other.forEach(r=>body.push([r.date,r.venue,r.employee,r.discount_name,"check",r.check_no,r.amount.toFixed(2)]));
  } else if(F.view==="voids"){
    name="voids";
    head=["date","time","venue","employee","item","reason","check_no","qty","value","notes"];
    rows("voids").forEach(r=>body.push([r.date,r.void_time,r.venue,r.employee,r.item,
      r.void_reason,r.check_no,r.qty,r.price_inc.toFixed(2),r.notes]));
  } else if(F.view==="cash"){
    name="cash-tills";
    head=["date","venue","pos","staff","staff_as_typed","impos_cash","counted_cash","variance","flag"];
    tillWeek().forEach(t=>body.push([t.date,t.venue,t.pos,t.staff,t.staff_raw||"",t.impos.toFixed(2),
      t.actual.toFixed(2),t.variance.toFixed(2),t.flag]));
  } else if(F.view==="daily"){
    name="daily-reconciliation";
    head=["date","venue","submitted_by","tills","impos_cash","counted_cash","variance","impos_eft","doshii","float","flags"];
    reconWeek().forEach(r=>body.push([r.date,r.venue,r.by,r.tills,r.impos.toFixed(2),r.actual.toFixed(2),
      r.cash_var.toFixed(2),r.eft.toFixed(2),r.doshii===null?"":r.doshii.toFixed(2),
      r.floatTotal===null?"":r.floatTotal,r.flags]));
  } else if(F.view==="people"){
    name="people";
    head=["venue","employee","discounts","discount_count","voids","void_count","wastage","wastage_count"];
    const p={};
    const get=(v,e)=>{const k=v+"|"+e;return p[k]=p[k]||{venue:v,employee:e||"(unknown)",d:0,dn:0,v:0,vn:0,w:0,wn:0};};
    waste.forEach(r=>{const o=get(r.venue,r.employee);o.w+=r.amount;o.wn++;});
    other.forEach(r=>{const o=get(r.venue,r.employee);o.d+=r.amount;o.dn++;});
    rows("item").forEach(r=>{const o=get(r.venue,r.employee);o.d+=r.amount;o.dn++;});
    rows("voids").forEach(r=>{const o=get(r.venue,r.employee);o.v+=r.price_inc;o.vn++;});
    Object.keys(p).forEach(k=>{const o=p[k];
      body.push([o.venue,o.employee,o.d.toFixed(2),o.dn,o.v.toFixed(2),o.vn,o.w.toFixed(2),o.wn]);});
  } else if(F.view==="par"){
    name="par-levels";
    head=["venue","product","sold","binned","days_binned","making_per_day","suggested_par","weekly_saving"];
    // rebuild the same numbers the view shows
    const items=checkItems(), wasted={};
    waste.forEach(r=>{ (items[r.venue+"|"+r.date+"|"+r.check_no]||[]).forEach(x=>{
      const k=x.venue+"|"+mapItem(x.item);
      (wasted[k]=wasted[k]||{venue:x.venue,item:mapItem(x.item),n:0,days:{}});
      wasted[k].n++; wasted[k].days[x.date]=1; }); });
    const sold={};
    FEED.forEach(r=>{ if(r.date<w.from||r.date>w.to) return;
      if(F.venues.length&&!venueOn(r.venue)) return;
      if(F.day&&r.date!==F.day) return;
      if(r.sales<=0) return;
      const k=r.venue+"|"+r.item;
      (sold[k]=sold[k]||{qty:0,rev:0,days:{}});
      sold[k].qty+=r.qty; sold[k].rev+=r.sales; sold[k].days[r.date]=1; });
    const td=Object.keys(sold).reduce((a,k)=>Math.max(a,Object.keys(sold[k].days).length),0)||7;
    Object.keys(wasted).forEach(k=>{
      const wd=wasted[k], sd=sold[k]||{qty:0,rev:0,days:{}};
      const spd=sd.qty/td, wpd=wd.n/td, price=sd.qty?sd.rev/sd.qty:0;
      const par=spd>0?Math.ceil(spd+1.65*Math.sqrt(spd)):Math.ceil(wpd);
      const prod=Math.round(spd+wpd);
      body.push([wd.venue,wd.item,sd.qty,wd.n,Object.keys(wd.days).length,prod,par,
        (Math.max(0,prod-par)*price*td).toFixed(2)]);
    });
  } else {
    name="overview";
    head=["date","venue","kind","employee","detail","check_no","value"];
    waste.forEach(r=>body.push([r.date,r.venue,"wastage",r.employee,r.discount_name,r.check_no,r.amount.toFixed(2)]));
    other.forEach(r=>body.push([r.date,r.venue,"discount",r.employee,r.discount_name,r.check_no,r.amount.toFixed(2)]));
    rows("item").forEach(r=>body.push([r.date,r.venue,"discount",r.employee,r.discount_name,"",r.amount.toFixed(2)]));
    rows("voids").forEach(r=>body.push([r.date,r.venue,"void",r.employee,r.void_reason,r.check_no,r.price_inc.toFixed(2)]));
  }
  if(!body.length){ alert("Nothing to export in this view."); return; }
  const csv=[head].concat(body).map(r=>r.map(csvCell).join(",")).join("\r\n");
  const fn="staff-"+name+"-"+w.from+"-to-"+w.to+
    (F.venues.length?"-"+F.venues.join("-").toLowerCase().replace(/[^a-z0-9]+/g,"-"):"")+
    (F.day?"-"+F.day:"")+".csv";
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=fn;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

load();
</script>
